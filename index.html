/* ═══════════════════════════════════════════════════════════
   §9 TẬP TRUNG — hẹn giờ, chuông nhắc khi rời cửa sổ, hoa nở
   ═══════════════════════════════════════════════════════════ */
let focus = null;          // {target(s), elapsed(s), running, tick}
let focusMin = 20;
let audioCtx = null;
let lastChime = 0;

/* Vườn hoa: hoa nhỏ là số phiên tập trung đã hoàn thành — CHỈ TĂNG, không bao
   giờ bị trừ/biến mất. Hoa lớn / cỏ may mắn / cây là huy hiệu thưởng THÊM,
   tính (không lưu riêng) từ tổng hoa nhỏ theo mốc mỗi 5: cứ mỗi 5 hoa nhỏ có
   thêm 1 hoa lớn, mỗi 5 hoa lớn có thêm 1 cỏ may mắn, mỗi 5 cỏ may mắn có
   thêm 1 cây — tất cả cộng dồn song song, không bậc nào tiêu hao bậc dưới. */
function gardenKey(){ return 'soTuGarden_' + currentUser; }
let garden = { small:0, taskDays:[], taskV:2 };
const TASK_FLOWERS = 2;           // hoàn thành đủ 5 nhiệm vụ trong ngày = 2 hoa nhỏ
function gardenDerived(small){
  const big = Math.floor(small / 5);
  const luck = Math.floor(big / 5);
  const diamond = Math.floor(luck / 5);
  return { big, luck, diamond };
}
function loadGarden(){
  garden = { small:0, taskDays:[], taskV:2 };
  let migrated = false;
  try{
    const raw = localStorage.getItem(gardenKey());
    if(raw){
      const v = JSON.parse(raw);
      if(typeof v === 'number'){
        garden.small = v;                                            // bản rất cũ: số nguyên đơn
      }else if(v && typeof v === 'object'){
        // quy đổi mọi định dạng cũ (kể cả bản gộp-trừ trước đây) về tổng hoa
        // nhỏ tương đương, để không ai bị mất tiến độ khi đổi sang cách tính mới
        garden.small = (v.small||0) + 5*(v.big||0) + 25*(v.luck||0) + 125*(v.diamond||0);
        garden.taskDays = [...new Set(asArr(v.taskDays).filter(d => typeof d === 'string'))];
        if(v.taskV !== 2 && garden.taskDays.length){       // bản trước: hoa nhiệm vụ đếm riêng → đổi sang hoa nhỏ
          garden.small += TASK_FLOWERS * garden.taskDays.length; migrated = true;
        }
      }
    }
  }catch(e){}
  if(migrated) saveGarden();
}
function saveGarden(){
  try{ localStorage.setItem(gardenKey(), JSON.stringify(garden)); }catch(e){}
  if(cloudOn() && currentUser){
    cloudPut('users/' + currentUser + '/garden', garden).catch(()=>{});
  }
}
function gardenAddFlower(n = 1){
  const before = gardenDerived(garden.small);
  garden.small += n;
  const after = gardenDerived(garden.small);
  const merges = [];
  if(after.big > before.big) merges.push('mergeMsgBig');
  if(after.luck > before.luck) merges.push('mergeMsgLuck');
  if(after.diamond > before.diamond) merges.push('mergeMsgDiamond');
  saveGarden();
  return merges;
}
/* Hoàn thành đủ 5 nhiệm vụ → thêm TASK_FLOWERS hoa nhỏ vào cùng luống hoa với
   Tập trung. taskDays chỉ để khoá theo ngày (không cộng trùng khi tải lại/làm lại).
   Trả về danh sách thông báo ghép bậc, hoặc null nếu hôm nay đã được cộng. */
function gardenAddTaskFlower(day){
  if(!Array.isArray(garden.taskDays)) garden.taskDays = [];
  if(garden.taskDays.includes(day)) return null;
  garden.taskDays.push(day);
  return gardenAddFlower(TASK_FLOWERS);
}
/* Số giả-ngẫu-nhiên ổn định theo seed chuỗi — dùng để xáo trộn ô lưới và
   rung nhẹ (jitter) vị trí từng bông hoa, không đổi qua các lần render */
function seededRand(seed){
  let h = 0;
  for(const ch of String(seed)) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  h = (h ^ (h >>> 15)) >>> 0;
  return (h % 10000) / 10000;
}
function seededShuffle(arr, seedBase){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(seededRand(seedBase + '_' + i) * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
/* Luống chia thành lưới ô cố định — mỗi bông hoa chiếm 1 ô riêng (rung nhẹ vị
   trí trong ô) nên không bao giờ chồng lên nhau; thứ tự ô được xáo trộn theo
   người dùng để trông tự nhiên/ngẫu nhiên chứ không xếp hàng thẳng tắp */
const G_COLS = 4, G_ROWS = 3;   // 12 ô = tối đa 4 nhỏ + 4 lớn + 4 may mắn cùng lúc
function renderGarden(){
  const g = $('#garden'); if(!g) return;
  const { big, luck, diamond } = gardenDerived(garden.small);
  /* Hiện ĐỦ toàn bộ số hoa thật (không cắt bớt, không gộp "+N"). Luống chỉ
     có 12 ô cố định để rải đều — hoa thứ 13 trở đi sẽ quay lại dùng ô đã có
     hoa khác (chồng lên nhau là chấp nhận được) thay vì bị giấu bớt đi. */
  const specs = [
    ['small','i-flower', garden.small, '#C98A12', 21],
    ['big','i-flower-big', big, '#E5484D', 28],
    ['luck','i-clover', luck, '#13A35B', 25],
  ];
  const sprouts = [];
  specs.forEach(([key, icon, count, color, size]) => {
    for(let i = 0; i < count; i++) sprouts.push({ seed: currentUser + '_' + key + i, icon, color, size });
  });
  const cellOrder = seededShuffle(
    Array.from({ length: G_COLS * G_ROWS }, (_, i) => i), (currentUser || '') + '_gcells');
  const cellW = 92 / G_COLS, cellH = 76 / G_ROWS;
  let bedHtml = '';
  sprouts.forEach((sp, idx) => {
    const cell = cellOrder[idx % cellOrder.length];
    const col = cell % G_COLS, row = Math.floor(cell / G_COLS);
    const jx = 0.15 + seededRand(sp.seed + 'x') * 0.7;   // rung trong ô; khi ô bị dùng lại (>12 hoa)
    const jy = 0.15 + seededRand(sp.seed + 'y') * 0.7;   // độ rung khác nhau giúp các hoa không trùng khít
    const rot = (seededRand(sp.seed + 'r') * 30 - 15).toFixed(1);
    const left = (4 + col * cellW + cellW * jx).toFixed(1);
    const top = (10 + row * cellH + cellH * jy).toFixed(1);
    bedHtml += `<span class="g-sprout" style="left:${left}%;top:${top}%;transform:rotate(${rot}deg);color:${sp.color}">
      <svg class="ic" style="width:${sp.size}px;height:${sp.size}px"><use href="#${sp.icon}"/></svg></span>`;
  });
  const bed = sprouts.length
    ? `<div class="g-bed">${bedHtml}</div>`
    : `<div class="g-bed"><div class="g-bed-empty">${I('leaf')}<br>${t('gardenEmptyBed')}</div></div>`;
  const legend = `
    <div class="g-legend">
      <span class="g-legend-item"><svg class="ic" style="color:#C98A12"><use href="#i-flower"/></svg>${garden.small} ${t('gTier_small')}</span>
      <span class="g-legend-item"><svg class="ic" style="color:#E5484D"><use href="#i-flower-big"/></svg>${big} ${t('gTier_big')}</span>
      <span class="g-legend-item"><svg class="ic" style="color:#13A35B"><use href="#i-clover"/></svg>${luck} ${t('gTier_luck')}</span>
      <span class="g-legend-item special"><svg class="ic" style="color:#1E5EFF"><use href="#i-tree"/></svg>${diamond} ${t('gTier_diamond')}</span>
    </div>`;
  g.innerHTML = bed + legend;
}

/* Chuông nhỏ bằng Web Audio — không cần file âm thanh */
function chime(kind){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime;
    const notes = kind === 'done' ? [[660,0],[880,.16],[1100,.32]] : [[880,0],[660,.18]];
    for(const [f, dt] of notes){
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t0 + dt);
      g.gain.linearRampToValueAtTime(0.055, t0 + dt + .02);   // nhỏ nhẹ thôi
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + .4);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0 + dt); o.stop(t0 + dt + .45);
    }
  }catch(e){}
}

function confettiBurst(){
  const panel = document.querySelector('.focus-panel');
  if(!panel) return;
  const colors = ['var(--mint)','var(--peach)','var(--lav)','var(--sky)','var(--lemon)','var(--pink)'];
  for(let i = 0; i < 26; i++){
    const c = document.createElement('span');
    c.className = 'confetti';
    const sz = 7 + Math.random() * 7;
    c.style.cssText = `left:${5 + Math.random()*90}%;width:${sz}px;height:${sz}px;
      background:${colors[i % colors.length]};
      border-radius:${Math.random() < .5 ? '50%' : '3px'};
      animation-duration:${1.6 + Math.random()*1.6}s;
      animation-delay:${Math.random()*.7}s`;
    panel.appendChild(c);
    setTimeout(() => c.remove(), 4200);
  }
}

const fmtMMSS = sec => {
  const m = Math.floor(sec / 60), ss = sec % 60;
  return String(m).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
};

function setPlant(p){               // p: 0..1 — cây lớn dần, nở theo mốc
  const clip = $('#sfClipRect'), svg = $('#sfSvg');
  if(!clip || !svg) return;
  const h = Math.round(170 * Math.min(1, p / 0.8));   // thân vươn hết ở 80%
  clip.setAttribute('y', 258 - h);
  clip.setAttribute('height', h);
  svg.classList.toggle('h1', p >= 0.45 && p < 0.75);  // nụ
  svg.classList.toggle('h2', p >= 0.75 && p < 1);     // hé nở
  svg.classList.toggle('h3', p >= 1);                 // nở bung + đung đưa
}

function renderFocus(){
  const remain = focus ? Math.max(0, focus.target - focus.elapsed) : focusMin * 60;
  $('#focusTime').textContent = fmtMMSS(remain);
  $('#focusFill').style.width = focus ? Math.min(100, focus.elapsed / focus.target * 100) + '%' : '0%';
  $('#focusStart').style.display = focus && focus.running ? 'none' : '';
  $('#focusStart').innerHTML = focus && !focus.running
    ? I('play') + t('focusResume') : I('play') + t('focusStart');
  $('#focusPause').style.display = focus && focus.running ? '' : 'none';
  $('#focusStop').style.display = focus ? '' : 'none';
  $$('#durRow .dur-chip').forEach(c => c.disabled = !!focus);
  setPlant(focus ? focus.elapsed / focus.target : 0);
  renderFocusToday();
}
function renderFocusToday(){
  const el = $('#focusToday'); if(!el) return;
  if(!currentUser){ el.style.display = 'none'; return; }
  const m = Math.floor(focusTodaySec() / 60), ok = (tasks && tasks.t.focus.done) || focusTodaySec() >= focusGoalSec();
  el.style.display = '';
  el.classList.toggle('ok', ok);
  el.innerHTML = (ok ? I('check') : I('target')) + esc(ok ? t('focusTodayDone', m) : t('focusTodayLine', m, focusGoalMin()));
}

function focusTickStart(){
  clearInterval(focus.tick);
  focus.tick = setInterval(() => {
    focus.elapsed++;
    const before = focusTodaySec();
    if(!isAway()) focusLogTick();        // chỉ tính khi đang ở trong cửa sổ ứng dụng
    if(scOnFocusSecond(before)) return;  // vừa chạm mốc 25 phút → mời thử thách (đồng hồ đã đóng băng)
    setTitle();
    if(focus.elapsed >= focus.target){ focusDone(); return; }
    renderFocus();
  }, 1000);
}
function startFocus(){
  if(focus && !focus.running){ focus.running = true; focusTickStart(); renderFocus(); return; }
  focus = { target: focusMin * 60, elapsed: 0, running: true, tick: null };
  awayCount = 0;
  askNotifPermission();
  if(typeof scWarm === 'function') scWarm();              // nạp sẵn mô hình AI cho thử thách
  $('#focusSub').textContent = t('focusRunning');
  focusTickStart(); renderFocus();
}
function pauseFocus(){
  if(!focus) return;
  focus.running = false; clearInterval(focus.tick);
  stopAwayAlarm(false);
  $('#focusSub').textContent = t('focusPaused');
  renderFocus();
}
function stopFocus(silent){
  if(focus) clearInterval(focus.tick);
  if(focus) saveFocusLog(true);
  stopAwayAlarm(false);
  focus = null;
  setTitle();
  if(!silent) $('#focusSub').textContent = t('focusEndedEarly');
  renderFocus();
}
function focusDone(){
  clearInterval(focus.tick);
  saveFocusLog(true);
  stopAwayAlarm(false);
  focus.elapsed = focus.target; focus.running = false;
  renderFocus(); setPlant(1);
  setTitle();
  confettiBurst();
  chime('done');
  const merges = gardenAddFlower(); renderGarden();
  $('#focusSub').textContent = t('focusDoneSub', focusMin);
  toast(t('toastFocusDone', focusMin));
  merges.forEach((key, i) => setTimeout(() => toast(t(key)), 2400 * (i + 1)));
  focus = null;
  $$('#durRow .dur-chip').forEach(c => c.disabled = false);
  $('#focusStop').style.display = 'none';
  $('#focusStart').style.display = '';
  $('#focusStart').innerHTML = I('play') + t('focusStart');
  setTitle();
}

/* Cảnh báo khi rời cửa sổ: chuông reng LIÊN TỤC + cửa sổ thông báo
   (chuông dừng ngay khi quay lại; thông báo hệ thống cần người dùng
   cho phép — app sẽ hỏi quyền khi bấm Bắt đầu lần đầu) */
let awayT = null, awayCount = 0, awayNotif = null;

function askNotifPermission(){
  if(!('Notification' in window)) return;
  if(Notification.permission === 'default'){
    try{ Notification.requestPermission(); }catch(e){}
  }
}
function showAwayNotif(){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  try{
    if(awayNotif) awayNotif.close();
    awayNotif = new Notification(t('notifTitle'), {
      body: t('notifBody', focusMin),
      tag: 'soTuFocus', requireInteraction: true,
    });
    awayNotif.onclick = () => { try{ window.focus(); }catch(e){} awayNotif.close(); };
  }catch(e){}
}
function startAwayAlarm(){
  if(awayT) return;
  awayCount++;
  chime('warn');
  showAwayNotif();
  awayT = setInterval(() => chime('warn'), 2500);   // reng liên tục tới khi quay lại
}
function stopAwayAlarm(returned){
  if(awayT){ clearInterval(awayT); awayT = null; }
  if(awayNotif){ try{ awayNotif.close(); }catch(e){} awayNotif = null; }
  if(returned && focus){
    const bn = $('#awayBanner');
    $('#awayMsg').textContent = awayCount === 1 ? t('awayOnce') : t('awayMany', awayCount);
    bn.classList.add('show');
    setTimeout(() => bn.classList.remove('show'), 6000);
  }
}
function isAway(){ return document.hidden || !document.hasFocus(); }
document.addEventListener('visibilitychange', () => {
  if(!focus || !focus.running) return;
  if(document.hidden) startAwayAlarm(); else stopAwayAlarm(true);
});
window.addEventListener('blur', () => {
  if(focus && focus.running) setTimeout(() => { if(isAway()) startAwayAlarm(); }, 250);
});
window.addEventListener('focus', () => { if(awayT) stopAwayAlarm(true); });

/* Đếm ngược trên tiêu đề tab + chặn lỡ tay đóng trang giữa phiên */
function setTitle(){
  document.title = focus
    ? t('titleFocusing', fmtMMSS(Math.max(0, focus.target - focus.elapsed)))
    : t('appTitle');
}
window.addEventListener('beforeunload', e => {
  if(focus && focus.running){ e.preventDefault(); e.returnValue = ''; }
});

$('#durRow').addEventListener('click', e => {
  const c = e.target.closest('.dur-chip'); if(!c || focus) return;
  focusMin = +c.dataset.min;
  $$('#durRow .dur-chip').forEach(x => x.classList.toggle('on', x === c));
  $('#focusSub').textContent = t('focusDurChanged', focusMin);
  renderFocus();
});
$('#focusStart').addEventListener('click', startFocus);
$('#focusPause').addEventListener('click', pauseFocus);
$('#focusStop').addEventListener('click', () => stopFocus(false));

/* ═══════════════════════════════════════════════════════════
   §10 THỬ THÁCH THIÊNG (Sacred Challenge) + KHIÊN BẢO VỆ CHUỖI
   ═══════════════════════════════════════════════════════════
   • Mốc = mỗi 25 phút Focus TÍCH LUỸ trong ngày, đọc từ focusLog (cùng bộ đếm với nhiệm vụ
     Focus — không có bộ đếm riêng). Chỉ mời khi vượt mốc lúc đang Focus; id = ngày_phút nên
     mỗi mốc/ngày đúng một lần, kể cả tải lại trang hay đồng bộ nhiều máy.
   • Từ lúc mời tới khi xong, đồng hồ Focus đóng băng → thời gian làm không được cộng.
   • Hoàn thành đúng toàn bộ → 1 khiên, id khiên = 'sh_' + id thử thách → không thể nhận 2 lần.
   • Khiên bảo vệ "chuỗi đúng" ở Luyện gõ (chuỗi duy nhất của app): khi một câu sai làm mất
     chuỗi ≥ SHIELD_MIN, 1 khiên bị tiêu thụ thay cho chuỗi (mỗi câu chỉ xử lý 1 lần). */
const SC_STEP = 25 * 60, SHIELD_MIN = 3;
const CEFR = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
const SC_RANK = { offered: 1, generating: 1, error: 1, active: 2, skipped: 3, abandoned: 3, completed: 4 };
const SC_OPEN = ['offered', 'generating', 'error', 'active'];
let sacred = null, sacredSaveT = null;
let scCur = null, scSel = -1, scExitArm = false, scBusy = false, scView = '', scFb = null, scFirst = false;
const sacredKey = () => 'soTuSacred_' + currentUser;
const streakKey = () => 'soTuQuizStreak_' + currentUser;
const shieldsLeft = () => sacred ? sacred.shields.filter(x => !x.used).length : 0;
const cefrRank = w => w.cefr && w.cefr.lv ? CEFR.indexOf(w.cefr.lv) + 1 : 0;

function scNormCh(c){
  if(!SC_RANK[c.status]) c.status = 'offered';
  if(c.pz && typeof c.pz === 'object'){
    c.pz.parts = asArr(c.pz.parts).map(x => typeof x === 'string' ? x.replace(/[*`]+/g, '') : '');
    c.pz.blanks = asArr(c.pz.blanks).filter(b => b && typeof b.ans === 'string');
    c.pz.bank = asArr(c.pz.bank).filter(b => b && typeof b.t === 'string').map(b => ({ ...b, t: b.t.replace(/[*`]+/g, '').trim() }));
    c.pz.blanks.forEach(b => { b.ans = b.ans.replace(/[*`]+/g, '').trim(); });
    if(c.pz.parts.length !== c.pz.blanks.length + 1 || !c.pz.blanks.length) delete c.pz;
  }else delete c.pz;
  if(c.status === 'active' && !c.pz) c.status = 'offered';          // mất dữ liệu đoạn văn → soạn lại, không tính thắng/thua
  const n = c.pz ? c.pz.blanks.length : 0;
  c.slots = Array.from({ length: n }, (_, i) => Number.isInteger(asArr(c.slots)[i]) ? c.slots[i] : -1);
  c.res = Array.from({ length: n }, (_, i) => [0, 1, 2].includes(asArr(c.res)[i]) ? c.res[i] : 0);
  c.words = asArr(c.words);
  return c;
}
function sacredNorm(v){
  const s = { challenges: {}, shields: [], blessed: false, upd: 0 };
  if(v && typeof v === 'object'){
    if(v.challenges && typeof v.challenges === 'object')
      for(const [id, c] of Object.entries(v.challenges)) if(c && typeof c === 'object' && c.id === id) s.challenges[id] = scNormCh(c);
    s.shields = asArr(v.shields).filter(x => x && typeof x.id === 'string' && typeof x.ch === 'string');
    s.blessed = !!v.blessed; s.upd = +v.upd || 0;
  }
  return s;
}
/* Gộp bản trên máy + trên mây: trạng thái thử thách "tiến xa hơn" thắng; khiên gộp theo id,
   khiên đã dùng ở bất kỳ bản nào thì coi là đã dùng (không bao giờ "hồi sinh" khiên) */
function sacredMerge(a, b){
  const s = sacredNorm(a), o = sacredNorm(b);
  for(const [id, c] of Object.entries(o.challenges)){
    const m = s.challenges[id], rc = SC_RANK[c.status], rm = m ? SC_RANK[m.status] : 0;
    if(!m || rc > rm || (rc === rm && (c.upd || 0) > (m.upd || 0))) s.challenges[id] = c;
  }
  const byId = new Map(s.shields.map(x => [x.id, x]));
  o.shields.forEach(x => { const m = byId.get(x.id); if(!m || (x.used && !m.used)) byId.set(x.id, x); });
  s.shields = [...byId.values()].sort((x, y) => (x.at || 0) - (y.at || 0));
  s.blessed = s.blessed || o.blessed;
  return s;
}
function saveSacred(immediate){
  if(!currentUser || !sacred) return;
  sacred.upd = now();
  const snap = JSON.stringify(sacred);
  try{ localStorage.setItem(sacredKey(), snap); }catch(e){}
  if(!cloudOn()) return;
  clearTimeout(sacredSaveT);
  const user = currentUser, put = () => cloudPut('users/' + user + '/sacred', JSON.parse(snap)).catch(() => {});
  if(immediate) put(); else sacredSaveT = setTimeout(put, 2000);
}
async function loadSacred(){
  scCur = null; scBusy = false; $('#scOverlay').hidden = true; document.body.classList.remove('sc-open');
  let local = null, remote = null;
  try{ local = JSON.parse(localStorage.getItem(sacredKey()) || 'null'); }catch(e){}
  if(cloudOn()) try{ remote = await cloudGet('users/' + currentUser + '/sacred'); }catch(e){}
  sacred = sacredMerge(local, remote);
  Object.values(sacred.challenges).forEach(c => { if(c.status === 'completed') grantShield(c); });   // bù khiên nếu lỡ mất (idempotent)
  const cut = Date.now() - 60 * 86400000;                                      // dọn thử thách > 60 ngày (khiên giữ nguyên)
  Object.values(sacred.challenges).forEach(c => { if((c.at || 0) < cut && !SC_OPEN.includes(c.status)) delete sacred.challenges[c.id]; });
  try{ quizStreak = Math.max(0, parseInt(localStorage.getItem(streakKey()), 10) || 0); }catch(e){ quizStreak = 0; }
  saveSacred();
}
function grantShield(c){
  const id = 'sh_' + c.id;
  if(sacred.shields.some(x => x.id === id)) return false;
  sacred.shields.push({ id, ch: c.id, at: c.doneAt || now(), used: 0 });
  return true;
}
/* Tiêu thụ 1 khiên (cũ nhất) cho một sự kiện — cùng sự kiện xử lý lại sẽ không trừ thêm */
function sacredConsume(ev){
  if(!sacred || !shieldsLeft() || sacred.shields.some(x => x.ev === ev)) return false;
  const sh = sacred.shields.find(x => !x.used);
  sh.used = now(); sh.ev = ev;
  saveSacred(true);
  return true;
}
function renderShieldAura(chip, n){
  if(!chip) return;
  n = Math.max(0, n);
  chip.dataset.shield = Math.min(5, n);
  const b = chip.querySelector('.shield-n b'); if(b) b.textContent = n;
  chip.title = n ? t('shieldTitle', n) : '';
}

/* ── Mốc Focus → mời thử thách ── */
function scOnFocusSecond(before){
  if(!sacred || !currentUser) return false;
  const after = focusTodaySec(), k = Math.floor(after / SC_STEP);
  scPrepare((k + 1) * 25);                // soạn sẵn đoạn văn cho mốc kế tiếp ngay từ đầu chặng 25 phút (mỗi mốc chỉ soạn 1 lần)
  if(k < 1 || Math.floor(before / SC_STEP) >= k) return false;
  const day = todayKey(), id = day + '_' + (k * 25);
  if(sacred.challenges[id]) return false;                                      // mốc này hôm nay đã xử lý
  sacred.challenges[id] = { id, day, min: k * 25, status: 'offered', at: now(), upd: now(), slots: [], res: [], words: [] };
  saveSacred(true);
  scOpen(id);
  return true;
}
function scFreeze(){
  if(!focus || !focus.running) return;
  clearInterval(focus.tick); focus.running = false; focus.frozen = true;
  stopAwayAlarm(false); saveFocusLog(true);
  $('#focusSub').textContent = t('scPausedSub');
  setTitle(); renderFocus();
}
function scWarm(){ scLmReady().then(ok => { if(ok) scSession().then(x => { try{ x.destroy(); }catch(e){} }).catch(() => {}); }); }
function scResume(){
  if(!focus || !focus.frozen) return;
  focus.frozen = false; focus.running = true;
  $('#focusSub').textContent = t('focusRunning');
  focusTickStart(); renderFocus();
}
function scOpen(id){
  const c = sacred && sacred.challenges[id]; if(!c) return;
  scCur = id; scSel = -1; scExitArm = false; scView = ''; scFb = null;
  if(SC_OPEN.includes(c.status)) scFreeze();
  $('#scOverlay').hidden = false; document.body.classList.add('sc-open');
  if(c.status === 'offered') scPrepare(c.min);                             // soạn trong lúc người dùng đọc lời mời
  if(c.status === 'generating' && !scBusy) scGenerate(c, c.mode);          // tải lại giữa lúc đang soạn → soạn lại
  else scRender();
}
function scClose(resume){
  $('#scOverlay').hidden = true; document.body.classList.remove('sc-open');
  scCur = null;
  if(resume) scResume();
}
function scShowPending(){
  if(!sacred) return;
  const p = Object.values(sacred.challenges).filter(c => SC_OPEN.includes(c.status)).sort((a, b) => (a.at || 0) - (b.at || 0))[0];
  if(p) scOpen(p.id);
}

/* ── Độ khó: theo mốc Focus + năng lực thực tế (tỉ lệ đúng, mức CEFR đã nắm) ── */
function scAbility(){                    // mức CEFR cao nhất người dùng đã trả lời đúng ổn định
  let best = 0;
  words.forEach(w => { const r = cefrRank(w); if(r && w.stats.correct >= 2 && accuracy(w) >= .6) best = Math.max(best, r); });
  if(best) return best;
  const rs = words.map(cefrRank).filter(Boolean).sort((a, b) => a - b);   // chưa có lịch sử → trình độ của chính sổ từ (trung vị)
  return rs.length ? Math.max(3, rs[Math.floor(rs.length / 2)]) : 3;
}
function scPlan(min){
  const k = Math.max(1, Math.round(min / 25)), tier = k <= 2 ? 0 : k <= 5 ? 1 : 2;
  const seen = words.filter(w => w.stats.seen);
  const acc = seen.length >= 5 ? seen.reduce((a, w) => a + accuracy(w), 0) / seen.length : .7;   // ít dữ liệu → chưa điều chỉnh
  const blanks = [3, 5, 6][tier] + (acc >= .85 && tier < 2 ? 1 : 0) - (acc < .6 ? 1 : 0);
  return { tier, blanks: Math.max(2, blanks), distract: [1, 2, 3][tier], len: [[30, 45], [45, 70], [70, 100]][tier],
           cap: Math.min(6, scAbility() + (tier ? 1 : 0)) };
}
/* Chọn từ: CEFR cao (trong tầm năng lực) + hay sai/hay quên; tránh từ của 3 thử thách gần nhất */
function scPickWords(plan){
  const recent = new Set(Object.values(sacred.challenges).filter(c => c.words.length)
    .sort((a, b) => (b.at || 0) - (a.at || 0)).slice(0, 3).flatMap(c => c.words));
  const pool = words.filter(w => w.word && w.word.trim() && w.meaning && !hasPlaceholder(w) && w.word.trim().split(/\s+/).length <= 3);
  const score = w => {
    const r = cefrRank(w) || 3;                       // chưa phân loại: xếp như B1 (chỉ để sắp xếp, không lưu)
    let v = r * 10 - Math.max(0, r - plan.cap) * 14;
    v += (1 - accuracy(w)) * (w.stats.seen ? 14 : 3) + Math.min(10, (w.stats.lapses || 0) * 2.5);
    if(recent.has(w.id)) v -= 40;
    return v + Math.random() * 6;
  };
  const keys = new Set();
  const ranked = pool.map(w => [w, score(w)]).sort((a, b) => b[1] - a[1]).map(x => x[0])
    .filter(w => { const k = w.word.trim().toLowerCase(); return !keys.has(k) && keys.add(k); });
  const n = Math.min(plan.blanks, ranked.length), targets = ranked.slice(0, n);
  const poses = new Set(targets.map(w => (w.pos || '').toLowerCase()));
  const rest = ranked.slice(n), close = rest.filter(w => poses.has((w.pos || '').toLowerCase()));   // nhiễu cùng loại từ = khó đoán mò
  const distract = [...close, ...rest.filter(w => !close.includes(w))].slice(0, plan.distract);
  return { targets, distract, ranked, n };
}

/* ── Soạn đoạn văn ── */
const SC_SYS = 'Write one short, natural English paragraph for a vocabulary exercise. Use every target word once, with the given '
  + 'meaning, in context that makes the meaning clear. Reply with the paragraph only.';
/* Phiên AI gốc (đã nạp lời dặn) được giữ lại; mỗi lần soạn chỉ clone → không phải khởi động lại mô hình */
let scBaseP = null, scPre = null;
async function scSession(){
  if(!scBaseP){
    scBaseP = LanguageModel.create({ ...AI_LANG, initialPrompts: [{ role: 'system', content: SC_SYS }],
      monitor: m => m.addEventListener('downloadprogress', e => { const el = $('#scProg'); if(el) el.textContent = t('scGenDl', Math.round(e.loaded * 100)); }) });
    scBaseP.catch(() => { scBaseP = null; });
  }
  const b = await scBaseP;
  if(b.clone) return await b.clone();
  scBaseP = null; return b;
}
const scLmReady = () => aiStatus().then(st => !!(st && st.kind === 'lm' && st.avail === 'available'));
/* Soạn sẵn (chỉ giữ trong bộ nhớ, chỉ dùng khi người dùng nhận thử thách đúng mốc đó) */
function scPrepare(min){
  const key = todayKey() + '_' + min;
  if(!sacred || !words || scBusy || (scPre && scPre.key === key) || sacred.challenges[key] && sacred.challenges[key].status !== 'offered') return;
  const plan = scPlan(min), pick = scPickWords(plan);
  if(pick.targets.length < 2) return;
  scPre = { key, plan, pick, p: scLmReady().then(ok => ok ? scFromAi(pick, plan, 1) : null).catch(() => null) };
}
const scSameWord = (inner, word) => { const m = findTarget(inner, word)[0]; return !!m && m.index === 0 && m[0].length === inner.length; };
const scErr = (key, extra) => Object.assign(new Error(key), { key }, extra || {});
function scBank(blanks, distract){
  const seen = new Set(blanks.map(b => b.ans.toLowerCase()));
  const extra = distract.map(w => w.word.trim()).filter(x => !seen.has(x.toLowerCase()) && seen.add(x.toLowerCase()));
  const low = x => x[0] === x[0].toUpperCase() && x.slice(1) === x.slice(1).toLowerCase() ? x.toLowerCase() : x;
  return shuffle([...blanks.map(b => ({ t: low(b.ans) })), ...extra.map(x => ({ t: x }))]);
}
/* Bỏ mọi dấu định dạng AI hay chèn: [[ ]], **đậm**, *nghiêng*, __gạch__, `code`, tiêu đề # */
const scClean = t => String(t || '').replace(/\[\[|\]\]/g, '').replace(/[*`]+/g, '').replace(/__+/g, '').replace(/^#+\s*/gm, '')
  .replace(/[ \t]+/g, ' ').replace(/\s*\n\s*/g, ' ').trim();
/* Không phụ thuộc AI đánh dấu đúng: tìm từng từ mục tiêu (kể cả dạng chia) trong đoạn văn; từ xuất hiện
   ĐÚNG 1 lần mới thành chỗ trống (xuất hiện 2 lần sẽ lộ đáp án → để nguyên như chữ thường) */
function scParse(txt, targets, distract){
  const plain = scClean(txt);
  if(plain.split(' ').length < 12) return null;
  const hits = [];
  targets.forEach(w => { const ms = findTarget(plain, w.word); if(ms.length === 1) hits.push({ w, i: ms[0].index, s: ms[0][0] }); });
  hits.sort((a, b) => a.i - b.i);
  const keep = []; let end = -1;
  hits.forEach(h => { if(h.i >= end){ keep.push(h); end = h.i + h.s.length; } });
  if(keep.length < Math.max(2, Math.ceil(targets.length * .6))) return null;
  const parts = [], blanks = []; let pos = 0;
  keep.forEach(h => { parts.push(plain.slice(pos, h.i)); blanks.push({ ans: h.s, id: h.w.id }); pos = h.i + h.s.length; });
  parts.push(plain.slice(pos));
  return { parts, blanks, bank: scBank(blanks, distract), src: 'ai' };
}
async function scFromAi(pick, plan, tries){
  const style = ['simple', 'moderately complex', 'complex'][plan.tier];
  const q = `${plan.len[0]}-${plan.len[1]} words, ${style} sentences. Targets:\n`
    + pick.targets.map(w => `- ${w.word.trim()}${w.pos ? ` (${w.pos})` : ''}: ${w.meaning}`).join('\n');
  for(let attempt = 0; attempt < (tries || 2); attempt++){
    const ses = await scSession(), ac = new AbortController(), timer = setTimeout(() => ac.abort(), 60000);
    let raw = '';
    try{ raw = await ses.prompt(q, { signal: ac.signal }); }                   // văn bản thường: nhanh hơn ràng buộc JSON
    catch(e){ if(attempt + 1 >= (tries || 2)) throw e; }
    finally{ clearTimeout(timer); try{ ses.destroy(); }catch(e){} }
    const para = String(raw || '').split(/\n+/).map(x => x.replace(/^["“*#\s]+|["”*\s]+$/g, '')).sort((a, b) => b.length - a.length)[0] || '';
    const pz = scParse(para, pick.targets, pick.distract);
    if(pz) return pz;
  }
  return null;
}
/* Không có AI → người dùng có thể chọn ghép đoạn văn từ chính câu ví dụ trong sổ (dữ liệu thật) */
function scFromExamples(pick){
  const items = [];
  for(const w of pick.ranked){
    if(items.length >= pick.n) break;
    const sn = (w.sentence || '').trim(), m = sn && findTarget(sn, w.word)[0];
    if(m && findTarget(sn, w.word).length === 1) items.push({ w, sn, m });
  }
  if(items.length < 2) return null;
  const parts = [], blanks = [];
  let cur = '';
  items.forEach(({ w, sn, m }, i) => {
    cur += (i ? ' ' : '') + sn.slice(0, m.index); parts.push(cur);
    blanks.push({ ans: m[0], id: w.id }); cur = sn.slice(m.index + m[0].length);
  });
  parts.push(cur);
  const ids = new Set(items.map(x => x.w.id));
  return { parts, blanks, bank: scBank(blanks, pick.distract.filter(w => !ids.has(w.id))), src: 'ex' };
}
async function scGenerate(c, mode){
  if(scBusy) return;
  scBusy = true; c.status = 'generating'; c.mode = mode || 'ai'; c.err = ''; scFb = null;
  saveSacred(); if(scCur === c.id) scRender();
  try{
    const pre = c.mode === 'ai' && scPre && scPre.key === c.id ? scPre : null;   // đoạn văn đã soạn sẵn cho mốc này
    scPre = null;
    const plan = pre ? (c.plan = pre.plan) : c.plan || (c.plan = scPlan(c.min));
    const pick = pre ? pre.pick : scPickWords(plan);
    if(pick.targets.length < 2) throw scErr('scErrFew');
    let pz = null;
    if(c.mode === 'ex'){ pz = scFromExamples(pick); if(!pz) throw scErr('scErrExFew'); }
    else{
      if(pre) pz = await pre.p;
      if(!pz){
        const st = await aiStatus();
        if(!st || st.kind !== 'lm') throw scErr('scErrNoAi');
        pz = await scFromAi(pick, plan, pre ? 1 : 2);
      }
      if(!pz) throw scErr('scErrAi');
    }
    c.pz = pz; c.words = pz.blanks.map(b => b.id);
    c.slots = pz.blanks.map(() => -1); c.res = pz.blanks.map(() => 0); c.checks = 0;
    c.status = 'active'; c.startAt = now();
  }catch(e){
    c.status = 'error'; c.err = e.key || 'scErrAi';                          // không tự đánh dấu thắng/thua
  }finally{
    scBusy = false; c.upd = now(); saveSacred(true);
    if(scCur === c.id){ scView = ''; scRender(); }
  }
}

const scCh = () => sacred && sacred.challenges[scCur];
function scPlace(bi, si){
  const c = scCh(); if(!c || c.status !== 'active' || c.res[si] === 1) return;
  const prev = c.slots.indexOf(bi);
  if(prev >= 0){ if(c.res[prev] === 1) return; c.slots[prev] = -1; c.res[prev] = 0; }
  c.slots[si] = bi; c.res[si] = 0; scSel = -1; scFb = null; c.upd = now();
  saveSacred(); scRender();
  const nx = $('#scBody .sc-chip:not(.used)'); if(nx) nx.focus({ preventScroll: true });
}
function scCheck(){
  const c = scCh(); if(!c) return;
  if(c.slots.some(x => x < 0)){ scFb = ['bad', t('scFillAll')]; scRender(); return; }
  c.checks = (c.checks || 0) + 1;
  c.res = c.slots.map((bi, i) => c.pz.bank[bi].t.trim().toLowerCase() === c.pz.blanks[i].ans.trim().toLowerCase() ? 1 : 2);
  const bad = c.res.filter(x => x === 2).length;
  c.upd = now();
  if(!bad) return scComplete(c);
  scFb = ['bad', t('scWrongN', bad)];
  saveSacred(); scRender();
}
function scComplete(c){
  c.status = 'completed'; c.doneAt = now(); c.upd = now();

  }
}
$('#scBody').addEventListener('click', e => {
  const c = scCh(); if(!c) return;
  const a = e.target.closest('[data-sc]');
  if(a){
    const act = a.dataset.sc;
    if(act === 'accept'){ c.plan = c.plan || scPlan(c.min); scGenerate(c, 'ai'); }
    else if(act === 'retry') scGenerate(c, 'ai');
    else if(act === 'useEx') scGenerate(c, 'ex');
    else if(act === 'skip'){ c.status = 'skipped'; c.upd = now(); saveSacred(true); scClose(true); }
    else if(act === 'check') scCheck();
    else if(act === 'exit'){
      if(!scExitArm){ scExitArm = true; scRender(); setTimeout(() => { if(scExitArm){ scExitArm = false; if(scCh() && scCh().status === 'active') scRender(); } }, 4000); return; }
      scExitArm = false; c.status = 'abandoned'; c.upd = now(); saveSacred(true); scRender();
    }
    else if(act === 'back') scClose(true);
    return;
  }
  if(c.status !== 'active') return;
  const chip = e.target.closest('.sc-chip');
  if(chip){ const bi = +chip.dataset.bi; scSel = scSel === bi ? -1 : bi; scRender();
    const s = $(`#scBody .sc-chip[data-bi="${bi}"]`); if(s) s.focus({ preventScroll: true }); return; }
  const bl = e.target.closest('.sc-blank');
  if(bl){
    const si = +bl.dataset.si;
    if(c.res[si] === 1) return;
    if(scSel >= 0) scPlace(scSel, si);
    else if(c.slots[si] >= 0){ c.slots[si] = -1; c.res[si] = 0; scFb = null; saveSacred(); scRender(); }
  }
});
$('#scBody').addEventListener('dragstart', e => {
  const chip = e.target.closest('.sc-chip'); if(!chip) return;
  e.dataTransfer.setData('text/plain', chip.dataset.bi); e.dataTransfer.effectAllowed = 'move';
});
$('#scBody').addEventListener('dragover', e => {
  const bl = e.target.closest('.sc-blank:not(.ok)'); if(!bl) return;
  e.preventDefault(); bl.classList.add('drop');
});
$('#scBody').addEventListener('dragleave', e => { const bl = e.target.closest('.sc-blank'); if(bl) bl.classList.remove('drop'); });
$('#scBody').addEventListener('drop', e => {
  const bl = e.target.closest('.sc-blank:not(.ok)'); if(!bl) return;
  e.preventDefault();
  const bi = parseInt(e.dataTransfer.getData('text/plain'), 10);
  if(Number.isInteger(bi)) scPlace(bi, +bl.dataset.si);
});

/* ═══ Độ khó CEFR cho toàn bộ từ vựng ═══
   AI trên máy (Gemini Nano) phân loại theo NGHĨA người dùng đã lưu. Mỗi từ chỉ phân loại 1 lần
   (lưu w.cefr = { lv, conf, src, at } trong dữ liệu từ, đồng bộ cùng sổ) → không gọi lại mỗi lần
   mở app; bị gián đoạn thì lần sau tiếp tục từ những từ còn thiếu. Độ tin cậy < 0.5 → lv = ''
   + chk = 1 (cần xác minh) thay vì bịa ra một cấp độ chắc chắn. Không có AI → giữ nguyên dữ liệu. */
const CEFR_SYS = 'You are an expert on CEFR vocabulary levels as used in the English Vocabulary Profile and the Oxford 3000/5000. '
  + 'For each numbered English word or phrase you get the meaning (in Vietnamese) that the learner saved. Give the CEFR level '
  + '(A1, A2, B1, B2, C1 or C2) of THAT meaning and usage, judged by how common and essential it is for learners. Do not choose '
  + 'C1/C2 just because a word is long, rare-looking or academic. If you are not sure, give a confidence below 0.5 or level '
  + '"unknown". Reply with JSON only.';
const CEFR_SCHEMA = { type: 'object', required: ['items'], properties: { items: { type: 'array', items: { type: 'object',
  required: ['n', 'level', 'confidence'], properties: { n: { type: 'integer' }, level: { type: 'string', enum: [...CEFR, 'unknown'] },
  confidence: { type: 'number' } } } } } };
let cefrRun = null;
const cefrFailed = new Set();
const cefrTodo = () => words.filter(w => w.word && w.word.trim() && !w.cefr && !cefrFailed.has(w.id));
function cefrBadge(w){
  if(!w.cefr) return '';
  if(!w.cefr.lv) return `<span class="cefr cefr-q" title="${esc(t('cefrVerify'))}">?</span>`;
  return `<span class="cefr cefr-${w.cefr.lv}" title="${esc(t('cefrTip', w.cefr.lv, Math.round((w.cefr.conf || 0) * 100)))}">${w.cefr.lv}</span>`;
}
function cefrBtnSync(){
  const el = $('#cefrBtnTxt'); if(!el || !words) return;
  const done = words.filter(w => w.cefr).length;
  el.textContent = cefrRun ? t('cefrRun', done, words.length) : done >= words.length ? t('cefrAll', done) : t('cefrRun', done, words.length);
}
async function cefrInit(){
  const st = await aiStatus();
  const b = $('#btnCefr');
  if(b) b.hidden = !(st && st.kind === 'lm');
  cefrBtnSync();
  cefrClassify(false);
}
function cefrClassify(interactive){
  if(cefrRun) return cefrRun;
  if(!words || !cefrTodo().length){ if(interactive) toast(t('cefrDone', words ? words.filter(w => w.cefr && !w.cefr.lv).length : 0)); return Promise.resolve(); }
  cefrRun = (async () => {
    const st = await aiStatus();
    if(!st || st.kind !== 'lm'){ if(interactive) toast(t('cefrNoAi')); return; }
    if(st.avail !== 'available' && !interactive) return;                 // cần tải mô hình → chỉ khi người dùng bấm nút
    const user = currentUser;
    cefrBtnSync();
    for(;;){
      if(currentUser !== user) return;
      const batch = cefrTodo().slice(0, 10);
      if(!batch.length) break;
      const q = batch.map((w, i) => `${i + 1}. ${w.word.trim()}${w.pos ? ` (${w.pos})` : ''} — ${w.meaning || '?'}`
        + (w.sentence ? ` — e.g. "${w.sentence.slice(0, 160)}"` : '')).join('\n');
      let raw = '';
      try{
        const ses = await LanguageModel.create({ ...AI_LANG, initialPrompts: [{ role: 'system', content: CEFR_SYS }] });
        try{ raw = await ses.prompt(q, { responseConstraint: CEFR_SCHEMA }); } finally{ try{ ses.destroy(); }catch(e){} }
      }catch(e){ batch.forEach(w => cefrFailed.add(w.id)); continue; }      // lỗi → bỏ qua trong phiên này, lần sau thử lại
      const items = asArr((aiParseJson(raw) || {}).items);
      batch.forEach((w, i) => {
        const it = items.find(x => x && x.n === i + 1);
        if(!it){ cefrFailed.add(w.id); return; }
        const lv = CEFR.includes(it.level) ? it.level : '', conf = Math.max(0, Math.min(1, +it.confidence || 0));
        w.cefr = lv && conf >= .5 ? { lv, conf: +conf.toFixed(2), src: 'gemini-nano', at: now() }
                                  : { lv: '', guess: lv, conf: +conf.toFixed(2), src: 'gemini-nano', at: now(), chk: 1 };
      });
      save(); cefrBtnSync();
      if($('#tab-notes') && $('#tab-notes').classList.contains('active') && editingId == null) renderTable();
    }
    if(interactive) toast(t('cefrDone', words.filter(w => w.cefr && !w.cefr.lv).length));
  })().catch(() => {}).finally(() => { cefrRun = null; cefrBtnSync(); });
  return cefrRun;
}
$('#btnCefr').addEventListener('click', () => { cefrFailed.clear(); cefrClassify(true); });

/* ═══ Hiệu ứng khiên & thiên sứ (canvas phủ màn hình, gói gọn quanh thanh streak) ═══ */
const fxReduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const fxEase = k => 1 - Math.pow(1 - Math.min(1, Math.max(0, k)), 3);
function fxRun(dur, draw, done){
  const { cv, ctx, W, H } = fxCanvas(), t0 = performance.now();
  (function frame(nw){
    const e = nw - t0;
    ctx.clearRect(0, 0, W, H);
    if(e >= dur){ cv.remove(); if(done) done(); return; }
    ctx.save(); draw(ctx, e); ctx.restore();
    requestAnimationFrame(frame);
  })(t0);
}
function fxGlow(ctx, x, y, R, c, a){
  if(R <= 0 || a <= 0) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, R);
  g.addColorStop(0, `rgba(${c},${a})`); g.addColorStop(1, `rgba(${c},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.fill();
}
function fxRR(ctx, x, y, w, h, r){
  r = Math.min(r, h / 2, w / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function fxBox(chip, pad){
  const r = chip.getBoundingClientRect();
  return { cx: r.left + r.width / 2, cy: r.top + r.height / 2, x: r.left - pad, y: r.top - pad, w: r.width + pad * 2, h: r.height + pad * 2 };
}
function fxShards(B, n, sp, big){
  return Array.from({ length: n }, (_, i) => {
    const a = i / n * Math.PI * 2 + Math.random() * .25, v = sp * (.6 + Math.random() * .8), z = (big ? 6 : 4) + Math.random() * (big ? 8 : 6);
    return { x: B.cx + Math.cos(a) * B.w / 2, y: B.cy + Math.sin(a) * B.h / 2, vx: Math.cos(a) * v, vy: Math.sin(a) * v * .7 - .8,
             r: Math.random() * 6, vr: (Math.random() - .5) * .3, p: [[0, -z], [z * .8, z * .6], [-z * .7, z * .5]] };
  });
}
function fxShardsDraw(ctx, list, k, fill, stroke){
  list.forEach(q => {
    q.vy += .12; q.x += q.vx; q.y += q.vy; q.r += q.vr;
    ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.r); ctx.globalAlpha = Math.max(0, k);
    ctx.beginPath(); q.p.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath();
    ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = stroke; ctx.lineWidth = 1.2; ctx.stroke(); ctx.restore();
  });
}
function fxSparks(ctx, list, c){
  ctx.globalCompositeOperation = 'lighter';
  for(let i = list.length - 1; i >= 0; i--){
    const p = list[i]; p.l++; if(p.l > p.m){ list.splice(i, 1); continue; }
    p.x += p.vx; p.y += p.vy; p.vy += p.g || 0;
    fxGlow(ctx, p.x, p.y, p.r || 4, p.c || c, 1 - p.l / p.m);
  }
  ctx.globalCompositeOperation = 'source-over';
}
/* Lần đầu nhận khiên — "Bình minh": thanh streak chìm trong đêm sao, một vầng dương nhô lên sau thanh, dải sáng
   vàng quét qua xua tan bóng đêm, huy hiệu khiên sáng rực hạ xuống rồi tan thành lớp khiên kính bao quanh thanh,
   hào quang + sao 4 cánh lấp lánh. Gói gọn quanh thanh streak. */
function fxShieldDawn(chip, done){
  if(fxReduced()) return done && done();
  let B = fxBox(chip, 7), cb = done;
  const fire = () => { if(cb){ const f = cb; cb = null; f(); } };
  const rnd = (a, b) => a + Math.random() * (b - a);
  const stars = [...Array(14)].map(() => [rnd(.06, .94), rnd(.15, .85), rnd(.7, 1.5), rnd(0, 6)]);
  const twinkles = [...Array(6)].map((_, i) => [i / 6 * Math.PI * 2 + rnd(-.25, .25), rnd(3, 8), rnd(4, 6.5), rnd(0, 200)]);
  const sparks = [], S0 = 260, S1 = 760, CREST = 760, RING = 1050;
  const star4 = (ctx, x, y, R, a) => { ctx.fillStyle = `rgba(255,236,160,${a})`; ctx.beginPath();
    for(let i = 0; i < 8; i++){ const r2 = i % 2 ? R * .25 : R, an = i * Math.PI / 4 - Math.PI / 2; ctx.lineTo(x + Math.cos(an) * r2, y + Math.sin(an) * r2); }
    ctx.closePath(); ctx.fill(); };
  const shieldPath = (ctx, x, y, z) => { ctx.beginPath(); ctx.moveTo(x, y - z); ctx.lineTo(x + z * .85, y - z * .62); ctx.lineTo(x + z * .85, y + z * .05);
    ctx.quadraticCurveTo(x + z * .8, y + z * .78, x, y + z * 1.1); ctx.quadraticCurveTo(x - z * .8, y + z * .78, x - z * .85, y + z * .05);
    ctx.lineTo(x - z * .85, y - z * .62); ctx.closePath(); };
  fxRun(2000, (ctx, e) => {
    B = fxBox(chip, 7);
    const { cx, cy, x: x0, y: y0, w: cw, h: ch } = B;
    const night = fxEase(e / 220), sx = x0 - 24 + (cw + 48) * fxEase((e - S0) / (S1 - S0));
    // vầng dương nhô lên phía sau thanh
    const sun = fxEase((e - S0) / 500) * (1 - fxEase((e - 1450) / 500));
    if(sun > 0){ ctx.globalCompositeOperation = 'lighter';
      fxGlow(ctx, cx, cy + ch * .7 - 10 * sun, cw * .36, '255,200,90', .4 * sun);
      fxGlow(ctx, cx, cy + ch * .7 - 10 * sun, cw * .2, '255,240,190', .45 * sun);
      ctx.globalCompositeOperation = 'source-over'; }
    // màn đêm trên thanh — phần đã bị dải sáng quét qua thì tan biến
    ctx.save(); fxRR(ctx, x0, y0, cw, ch, ch / 2); ctx.clip();
    if(e < S1 + 60){
      ctx.save(); ctx.beginPath(); ctx.rect(e < S0 ? x0 - 30 : sx, y0 - 5, cw + 60, ch + 10); ctx.clip();
      const g = ctx.createLinearGradient(0, y0, 0, y0 + ch);
      g.addColorStop(0, `rgba(10,14,48,${.95 * night})`); g.addColorStop(1, `rgba(30,20,72,${.95 * night})`);
      ctx.fillStyle = g; ctx.fillRect(x0, y0, cw, ch);
      stars.forEach(([fx, fy, r2, ph]) => { ctx.fillStyle = `rgba(255,255,235,${night * (.55 + .45 * Math.sin(e / 110 + ph))})`;
        ctx.beginPath(); ctx.arc(x0 + cw * fx, y0 + ch * fy, r2, 0, 7); ctx.fill(); });
      ctx.restore();
    }
    if(e > S0 && e < S1 + 80){
      const g = ctx.createLinearGradient(sx - 46, 0, sx + 14, 0);
      g.addColorStop(0, 'rgba(255,200,60,0)'); g.addColorStop(.55, 'rgba(255,214,90,.9)'); g.addColorStop(.85, 'rgba(255,255,235,1)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(sx - 52, y0 + ch); ctx.lineTo(sx - 30, y0); ctx.lineTo(sx + 18, y0); ctx.lineTo(sx - 4, y0 + ch); ctx.closePath(); ctx.fill();
      for(let i = 0; i < 1; i++) sparks.push({ x: sx + (Math.random() - .5) * 14, y: y0 + Math.random() * ch, vx: (Math.random() - 1.2) * 1.4, vy: -.4 - Math.random() * 1.6, g: .03, l: 0, m: 28, r: 3.5 });
    }
    ctx.restore();
    if(e > S0 && e < S1 + 80){ ctx.globalCompositeOperation = 'lighter'; fxGlow(ctx, sx - 8, cy, 22, '255,210,90', .45); ctx.globalCompositeOperation = 'source-over'; }
    // huy hiệu khiên sáng rực hạ xuống, tan vào thanh
    const cr = e - CREST;
    if(cr > -250 && cr < 520){
      const k = fxEase((cr + 250) / 420), fade = 1 - fxEase((cr - 260) / 260), sy = cy - ch / 2 - 16 + 14 * fxEase(cr / 520);
      ctx.globalCompositeOperation = 'lighter'; fxGlow(ctx, cx, sy, 16, '255,226,140', .6 * k * fade); ctx.globalCompositeOperation = 'source-over';
      shieldPath(ctx, cx, sy, 7.5 * (.6 + .4 * k));
      const sg = ctx.createLinearGradient(0, sy - 8, 0, sy + 9); sg.addColorStop(0, `rgba(255,250,225,${k * fade})`); sg.addColorStop(1, `rgba(240,190,60,${k * fade})`);
      ctx.fillStyle = sg; ctx.fill(); ctx.strokeStyle = `rgba(154,107,0,${k * fade})`; ctx.lineWidth = 1.6; ctx.stroke();
    }
    // lớp khiên kính kết tinh quanh thanh + hào quang xoay
    const rk = fxEase((e - RING + 160) / 360), fa = 1 - fxEase((e - 1500) / 450);
    if(rk > 0){
      ctx.globalCompositeOperation = 'lighter';
      for(let i = 0; i < 10; i++){
        const an = i / 10 * Math.PI * 2 + e / 1500, L = (cw / 2 + 8) * rk;
        const gg = ctx.createLinearGradient(cx, cy, cx + Math.cos(an) * L, cy + Math.sin(an) * L * .55);
        gg.addColorStop(0, 'rgba(255,236,170,0)'); gg.addColorStop(.6, `rgba(255,236,170,${.26 * fa})`); gg.addColorStop(1, 'rgba(255,236,170,0)');
        ctx.fillStyle = gg; ctx.beginPath(); ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(an - .06) * L, cy + Math.sin(an - .06) * L * .55); ctx.lineTo(cx + Math.cos(an + .06) * L, cy + Math.sin(an + .06) * L * .55);
        ctx.closePath(); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
      const gr = 7 * (1 - rk);
      fxRR(ctx, x0 - gr, y0 - gr, cw + gr * 2, ch + gr * 2, ch / 2 + gr);
      ctx.fillStyle = `rgba(210,235,255,${.18 * rk * fa})`; ctx.fill();
      ctx.strokeStyle = `rgba(255,226,140,${fa})`; ctx.lineWidth = 2.5; ctx.shadowColor = '#FFD54A'; ctx.shadowBlur = 10; ctx.stroke(); ctx.shadowBlur = 0;
      if(rk >= 1) fire();
      const h = e - RING;
      twinkles.forEach(([an, dx, R, d]) => { const q = (h - d) / 420; if(q > 0 && q < 1)
        star4(ctx, cx + Math.cos(an) * (cw / 2 + dx), cy + Math.sin(an) * (ch / 2 + dx * .7), R * Math.sin(q * Math.PI), Math.sin(q * Math.PI)); });
      if(h > 0 && h < 300 && Math.random() < .35){ const an = Math.random() * 7;
        sparks.push({ x: cx + Math.cos(an) * cw / 2, y: cy + Math.sin(an) * ch / 2, vx: Math.cos(an) * .4, vy: -.4 - Math.random() * .6, l: 0, m: 30, r: 2.2 }); }
    }
    fxSparks(ctx, sparks, '255,215,110');
  }, fire);
}
/* Nhận thêm khiên: một vệt sáng chạy quanh viền khiên + sao lấp lánh — gọn, không che thanh streak */
function fxShieldUp(chip, done){
  if(fxReduced()) return done && done();
  let B = fxBox(chip, 7), cb = done;
  const sparks = [];
  fxRun(1000, (ctx, e) => {
    B = fxBox(chip, 7);
    const k = fxEase(e / 700), fa = 1 - fxEase((e - 700) / 300);
    fxRR(ctx, B.x, B.y, B.w, B.h, B.h / 2);
    ctx.strokeStyle = `rgba(150,205,255,${.5 * fa})`; ctx.lineWidth = 2; ctx.stroke();
    const per = 2 * (B.w - B.h) + Math.PI * B.h;
    ctx.setLineDash([per * .18, per]); ctx.lineDashOffset = -per * k;
    ctx.strokeStyle = `rgba(255,236,170,${fa})`; ctx.lineWidth = 3; ctx.shadowColor = '#FFD54A'; ctx.shadowBlur = 9; ctx.stroke();
    ctx.setLineDash([]); ctx.shadowBlur = 0;
    if(e < 700 && Math.random() < .3){ const a = Math.random() * 7;
      sparks.push({ x: B.cx + Math.cos(a) * B.w / 2, y: B.cy + Math.sin(a) * B.h / 2, vx: Math.cos(a) * .8, vy: Math.sin(a) * .8 - .3, l: 0, m: 24, r: 3 }); }
    fxSparks(ctx, sparks, '255,226,140');
    if(e > 380 && cb){ const f = cb; cb = null; f(); }
  }, () => { if(cb){ const f = cb; cb = null; f(); } });
}
/* Khiên chịu đòn — gợn sóng lục giác: điểm va chạm loé sáng trên mép khiên, một gợn sóng lan khắp mặt khiên kính
   làm lưới lục giác sáng lên theo đợt sóng, rồi vài mảnh lục giác nhỏ bong ra rơi xuống. Gọn trong viền khiên. */
function fxShieldCrack(chip, done){
  if(fxReduced()) return done && done();
  let B = fxBox(chip, 7), cb = done, frags = null;
  const fire = () => { if(cb){ const f = cb; cb = null; f(); } };
  const fx = .25 + Math.random() * .5, CHIP = 300, rnd = (a, b) => a + Math.random() * (b - a);
  const hex = (ctx, x, y, r) => { ctx.beginPath();
    for(let i = 0; i < 6; i++){ const a = Math.PI / 3 * i + Math.PI / 6; i ? ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r) : ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
    ctx.closePath(); };
  chip.classList.remove('sh-hit'); void chip.offsetWidth; chip.classList.add('sh-hit');
  setTimeout(() => chip.classList.remove('sh-hit'), 450);
  fxRun(1000, (ctx, e) => {
    if(!frags) B = fxBox(chip, 7);
    const ix = B.x + B.w * fx, iy = B.y + 1;
    const R = fxEase(e / 600) * B.w * .8, fa = 1 - fxEase((e - 300) / 500);
    ctx.save(); fxRR(ctx, B.x - 1, B.y - 1, B.w + 2, B.h + 2, B.h / 2 + 1); ctx.clip();
    const hr = 5.5, dx = hr * Math.sqrt(3), dy = hr * 1.5;
    for(let row = 0, y = B.y - hr; y < B.y + B.h + hr; row++, y += dy)
      for(let x = B.x - dx + (row % 2 ? dx / 2 : 0); x < B.x + B.w + dx; x += dx){
        const w = 1 - Math.min(1, Math.abs(Math.hypot(x - ix, (y - iy) * 1.5) - R) / 16);
        if(w <= 0) continue;
        hex(ctx, x, y, hr - .9);
        ctx.fillStyle = `rgba(150,205,255,${.45 * w * fa})`; ctx.fill();
        ctx.strokeStyle = `rgba(70,150,240,${w * fa})`; ctx.lineWidth = 1.4; ctx.stroke();
      }
    ctx.restore();
    fxRR(ctx, B.x, B.y, B.w, B.h, B.h / 2);
    ctx.strokeStyle = `rgba(150,205,255,${.85 * fa})`; ctx.lineWidth = 2; ctx.shadowColor = '#9CD0FF'; ctx.shadowBlur = 8; ctx.stroke(); ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'lighter';
    fxGlow(ctx, ix, iy, 14 + 10 * fxEase(e / 200), '255,120,140', .7 * (1 - fxEase(e / 280)));
    fxGlow(ctx, ix, iy, 9, '225,242,255', .9 * (1 - fxEase(e / 380)));
    ctx.globalCompositeOperation = 'source-over';
    if(e >= CHIP && !frags){
      fire();
      frags = [...Array(6)].map(() => ({ x: ix + rnd(-8, 8), y: iy + rnd(0, 4), vx: rnd(-1.3, 1.3), vy: rnd(-1.8, -.6), r: rnd(2.2, 3.6), a: rnd(0, 3), va: rnd(-.2, .2) }));
    }
    if(frags){
      const k = 1 - fxEase((e - CHIP) / 650);
      frags.forEach(f => { f.vy += .08; f.x += f.vx; f.y += f.vy; f.a += f.va;
        ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.a); hex(ctx, 0, 0, f.r);
        ctx.fillStyle = `rgba(200,232,255,${.75 * k})`; ctx.fill(); ctx.strokeStyle = `rgba(255,255,255,${k})`; ctx.lineWidth = 1; ctx.stroke(); ctx.restore(); });
    }
  }, fire);
}
/* Khiên cuối cùng — "Đêm nuốt chửng": vòng phù chú hắc ám xoay quanh thanh, những xúc tu bóng tối bò từ hai đầu
   vào, nuốt trọn thanh (một đôi mắt đỏ loé lên trong bóng tối), lớp khiên vỡ thành mảnh đen viền tím cùng tàn lửa
   tím–đỏ; rồi bóng tối tan đi, thanh streak hiện lại nguyên vẹn (chuỗi vẫn được giữ). */
function fxNightDevour(chip, done){
  if(fxReduced()) return done && done();
  let B = fxBox(chip, 7), cb = done, shards = null;
  const BREAK = 1000, sparks = [], smoke = [];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const tentacles = [...Array(6)].map((_, i) => ({ side: i % 2 ? 1 : -1, off: rnd(-.7, .7), ph: rnd(0, 6), w: rnd(2.2, 3.6), d: rnd(0, 160) }));
  const RUNES = [[[0,-4,0,4],[0,-4,3,-1]], [[-3,-4,3,4],[3,-4,-3,4]], [[0,-4,0,4],[-3,0,3,0]], [[-3,4,0,-4],[0,-4,3,4]],
                 [[-3,-4,-3,4],[-3,0,3,-4],[-3,0,3,4]], [[0,-4,0,4],[0,-1,3,-4],[0,-1,-3,-4]], [[-3,-3,3,-3],[0,-3,0,4],[-2,4,2,4]]];
  fxRun(2200, (ctx, e) => {
    if(!shards) B = fxBox(chip, 7);
    const { cx, cy, x: x0, y: y0, w: cw, h: ch } = B;
    const dark = fxEase(e / 380) * (1 - fxEase((e - 1250) / 800));
    // quầng tối bao quanh
    fxGlow(ctx, cx, cy, cw * .44, '14,6,26', .45 * dark);
    // vòng phù chú tím xoay quanh thanh
    const rn = fxEase(e / 350) * (1 - fxEase((e - 1100) / 500));
    if(rn > 0){
      ctx.save(); ctx.lineCap = 'round'; ctx.shadowColor = '#B026FF'; ctx.shadowBlur = 9;
      ctx.strokeStyle = `rgba(150,60,220,${.35 * rn})`; ctx.lineWidth = 1.2; ctx.setLineDash([3, 5]);
      ctx.beginPath(); ctx.ellipse(cx, cy, cw / 2 + 9, ch / 2 + 8, 0, 0, 7); ctx.stroke(); ctx.setLineDash([]);
      for(let i = 0; i < 12; i++){
        const an = i / 12 * Math.PI * 2 - e / 900, gx = cx + Math.cos(an) * (cw / 2 + 9), gy = cy + Math.sin(an) * (ch / 2 + 8);
        ctx.save(); ctx.translate(gx, gy); ctx.rotate(an + Math.PI / 2);
        ctx.strokeStyle = `rgba(${i % 3 ? '205,120,255' : '255,70,90'},${rn * (.6 + .4 * Math.sin(e / 90 + i))})`; ctx.lineWidth = 1.3; ctx.scale(.8, .8);
        ctx.beginPath(); RUNES[i % RUNES.length].forEach(([a, b, c2, d]) => { ctx.moveTo(a, b); ctx.lineTo(c2, d); }); ctx.stroke();
        ctx.restore();
      }
      ctx.restore();
    }
    // xúc tu bóng tối bò từ hai đầu vào giữa
    const tg = fxEase((e - 100) / 550) * (1 - fxEase((e - 1000) / 400));
    if(tg > 0){
      ctx.lineCap = 'round';
      tentacles.forEach(tn => {
        const k = Math.max(0, Math.min(1, tg * 1.15 - tn.d / 1000)); if(!k) return;
        const sx = cx + tn.side * (cw / 2 + 10), ex = cx + tn.side * (cw / 2 - cw * .55 * k);
        ctx.strokeStyle = `rgba(16,6,30,${.85 * tg})`; ctx.lineWidth = tn.w;
        ctx.beginPath();
        for(let i = 0; i <= 16; i++){
          const u = i / 16, x = sx + (ex - sx) * u, y = cy + tn.off * ch * .45 * (1 - u * .5) + Math.sin(u * 7 + e / 110 + tn.ph) * 3.5 * (1 - u * .4);
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        ctx.stroke();
      });
    }
    // lớp khiên còn lại: nhấp nháy, nhuốm tím trước khi vỡ
    if(e < BREAK){
      const fl = .55 + .45 * Math.sin(e / 35) * Math.sin(e / 13);
      fxRR(ctx, x0, y0, cw, ch, ch / 2);
      ctx.strokeStyle = `rgba(${Math.round(150 - 40 * fxEase(e / 700))},${Math.round(205 - 150 * fxEase(e / 700))},255,${.9 * fl})`;
      ctx.lineWidth = 2.5; ctx.shadowColor = '#8A3FFF'; ctx.shadowBlur = 10; ctx.stroke(); ctx.shadowBlur = 0;
    }
    // bóng tối nuốt trọn thanh + đôi mắt đỏ
    const sw = fxEase((e - 400) / 400) * (1 - fxEase((e - 1200) / 600));
    if(sw > 0){
      ctx.save(); fxRR(ctx, x0, y0, cw, ch, ch / 2); ctx.clip();
      ctx.fillStyle = `rgba(10,4,20,${.93 * sw})`; ctx.fillRect(x0, y0, cw, ch);
      for(let i = 0; i < 4; i++) fxGlow(ctx, x0 + cw * (.2 + .2 * i) + Math.sin(e / 180 + i) * 8, cy + Math.cos(e / 230 + i) * 4, 20, '80,20,120', .5 * sw);
      ctx.restore();
      const ey = (e - 620) / 360;
      if(ey > 0 && ey < 1){ const a = Math.sin(ey * Math.PI);
        ctx.globalCompositeOperation = 'lighter';
        [-1, 1].forEach(sd => { fxGlow(ctx, cx + sd * 9, cy - 2, 7, '255,40,60', .85 * a);
          ctx.fillStyle = `rgba(255,190,190,${a})`; ctx.beginPath(); ctx.ellipse(cx + sd * 9, cy - 2, 2.8, 1.2 * a + .3, sd * .25, 0, 7); ctx.fill(); });
        ctx.globalCompositeOperation = 'source-over'; }
    }
    if(e >= BREAK){
      if(cb){ const f = cb; cb = null; f(); shards = fxShards(B, 16, 2);
        for(let i = 0; i < 18; i++){ const an = Math.random() * 7, v = .8 + Math.random() * 2;
          sparks.push({ x: cx + Math.cos(an) * cw / 3, y: cy + Math.sin(an) * ch / 3, vx: Math.cos(an) * v, vy: Math.sin(an) * v * .7 - .4,
                        l: 0, m: 22 + Math.random() * 14, r: 2 + Math.random() * 1.5, c: Math.random() < .55 ? '190,90,255' : '255,60,80' }); }
        for(let i = 0; i < 6; i++){ const an = Math.random() * 7;
          smoke.push({ x: cx + Math.cos(an) * cw / 3, y: cy + Math.sin(an) * ch / 3, vx: Math.cos(an) * .6, vy: Math.sin(an) * .35 - .25, l: 0, m: 45 + Math.random() * 20 }); } }
      const t2 = e - BREAK;
      if(t2 < 240){ ctx.globalCompositeOperation = 'lighter'; fxGlow(ctx, cx, cy, 18 + t2 * .3, '170,80,255', .75 * (1 - t2 / 240)); ctx.globalCompositeOperation = 'source-over'; }
      fxShardsDraw(ctx, shards, 1 - fxEase(t2 / 800), 'rgba(16,8,30,.92)', 'rgba(190,110,255,.95)');
      for(let i = smoke.length - 1; i >= 0; i--){ const p = smoke[i]; p.l++; if(p.l > p.m){ smoke.splice(i, 1); continue; }
        p.x += p.vx; p.y += p.vy; fxGlow(ctx, p.x, p.y, 7 + p.l * .22, '20,8,36', .4 * (1 - p.l / p.m)); }
      fxSparks(ctx, sparks);
    }
  }, () => { if(cb){ const f = cb; cb = null; f(); } });
}

/* ═══════════════════════════════════════════════════════════
   TABS + NGÔN NGỮ + STATS
   ═══════════════════════════════════════════════════════════ */
function activateTab(btn){
  if(!btn) return;
  $$('.tab-btn').forEach(x=>x.classList.toggle('active', x===btn));
  $$('.tab-page').forEach(p=>p.classList.toggle('active', p.id==='tab-'+btn.dataset.tab));
  queueInfoLayout();
  const tab = btn.dataset.tab;
  if(tab==='quiz'){ fillQuizGroups(); startQuiz(); }
  if(tab==='flash'){ fcGroupFilter.fill(); startFc(); }
  if(tab==='notes'){ renderTable(); cefrClassify(false); }
  if(tab==='focus'){ renderFocus(); renderGarden(); }
  if(tab==='tasks') renderTasks(); else recAbort();
}
$$('.tab-btn').forEach(b=>b.addEventListener('click', ()=>activateTab(b)));


function refreshCurrentView(){
  const activeTab = $('.tab-btn.active'); if(!activeTab) return;
  const tab = activeTab.dataset.tab;
  if(tab==='notes') renderTable();
  else if(tab==='quiz'){ fillQuizGroups(); if(quiz) renderQuiz(); else startQuiz(); }
  else if(tab==='flash'){ fcGroupFilter.fill(); if(fc) renderFc(); else startFc(); }
  else if(tab==='tasks') renderTasks();
  else if(tab==='focus'){ renderFocus(); renderGarden(); }
}
function setLang(l){
  LANG = l;
  try{ localStorage.setItem('soTuLang_v1', l); }catch(e){}
  applyI18n();
  if($('#loginOverlay').style.display !== 'none' && currentLoginStep) currentLoginStep();
  else refreshCurrentView();
}
$('#langSwitch').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.lang === LANG) return;
  setLang(b.dataset.lang);
});

function renderStats(){
  const due = words.filter(w => w.stats.seen > 0 && w.stats.due <= now()).length;
  $('#stTotal').textContent = words.length;
  $('#stSaved').textContent = words.filter(w => w.saved).length;
  $('#stDue').textContent = due;
  const b = $('#dueBadge');
  b.style.display = due ? '' : 'none';
  b.textContent = due > 99 ? '99+' : due;
}

/* ════ ĐĂNG NHẬP ═══════════════════════════════════════════ */
const loginSteps = () => $('#loginSteps');
const avatarHtml = u => `<span class="user-avatar" style="background:${userColor(u)}">${esc(u[0]||'?')}</span>`;

async function renderPick(){
  currentLoginStep = renderPick;
  loginSteps().innerHTML = `<p class="login-sub">${t('loadingUsers')}</p>`;
  await loadUserList();
  await loadLastLogins();
  loginSteps().innerHTML = `
    <p class="login-sub">${t('pickUserSub')}</p>
    <div class="user-grid many">
      ${userList.map(u => `
        <div class="user-card" data-user="${esc(u)}">
          <button class="user-del" data-del="${esc(u)}" title="${t('deleteAccountTitle')}">${I('trash')}</button>
          ${avatarHtml(u)}${esc(u)}
          <span class="user-last">${lastLoginLabel(u)}</span>
        </div>`).join('')}
      <button class="user-card add" id="addUserBtn">
        <span class="user-avatar">${I('plus')}</span>${t('addPerson')}</button>
    </div>
    ${cloudOn() ? '' : infoCorner([t('loginNoteNoCloud')])}`;
  $$('#loginSteps .user-card[data-user]').forEach(card =>
    card.addEventListener('click', e => {
      if(e.target.closest('.user-del')) return;
      pickUser(card.dataset.user);
    }));
  $$('#loginSteps .user-del').forEach(btn =>
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const u = btn.dataset.del;
      const pw = prompt(t('deletePwPrompt', u));
      if(pw === null) return;                          // huỷ hộp thoại
      const h = await hashText(pw, DELETE_PW_SALT);
      if(h !== DELETE_PW_HASH){ toast(t('deletePwWrong')); return; }
      await deleteUserAccount(u);
      toast(t('toastAccountDeleted', u)); renderPick();
    }));
  $('#addUserBtn').addEventListener('click', renderAddUser);
}

function renderAddUser(){
  currentLoginStep = renderAddUser;
  loginSteps().innerHTML = `
    <p class="login-sub">${t('newUserSub')}</p>
    <div class="login-form">
      <div class="fg"><label>${t('newUserNameLbl')}</label>
        <input type="text" id="lgNewName" maxlength="12" placeholder="${esc(t('newUserNamePh'))}"></div>
      <p class="login-err" id="lgErr"></p>
      <div class="login-actions">
        <button class="login-back" id="lgBack">${t('backBtn')}</button>
        <button class="btn mint sm" id="lgAddGo">${I('plus')}${t('createUserBtn')}</button>
      </div>
    </div>`;
  $('#lgBack').addEventListener('click', renderPick);
  const go = async () => {
    const name = $('#lgNewName').value.trim();
    const err = $('#lgErr');
    if(!name){ err.textContent = t('errEnterName'); return; }
    if(/[.#$\[\]\/]/.test(name)){ err.textContent = t('errNameChars'); return; }
    if(userList.some(u => u.toLowerCase() === name.toLowerCase())){
      err.textContent = t('errNameTaken'); return; }
    userList.push(name);
    await saveUserList();
    pickUser(name);            // người mới → đi thẳng vào bước tạo mật khẩu
  };
  $('#lgAddGo').addEventListener('click', go);
  $('#lgNewName').addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
  $('#lgNewName').focus();
}

async function pickUser(u){
  currentUser = u;
  loginSteps().innerHTML = `<p class="login-sub">${t('checking')}</p>`;
  const rec = await getAuth(u);
  if(rec) renderLogin(rec); else renderSetup();
}

/* Lần đầu: tạo mật khẩu mới + câu hỏi đặc biệt */
function renderSetup(){
  currentLoginStep = renderSetup;
  loginSteps().innerHTML = `
    <div class="login-who">${avatarHtml(currentUser)}<div><b>${currentUser}</b>
      <p class="login-sub" style="margin:2px 0 0">${t('setupSub')}</p></div></div>
    <div class="login-form">
      <div class="fg"><label>${t('newPwLbl')}</label>
        <input type="password" id="lgPw1" autocomplete="new-password"></div>
      <div class="fg"><label>${t('newPw2Lbl')}</label>
        <input type="password" id="lgPw2" autocomplete="new-password"></div>
      <div class="fg"><label>${t('secQLbl')}</label>
        <input type="text" id="lgQ" placeholder="${esc(t('secQPh'))}"></div>
      <div class="fg"><label>${t('secALbl')}</label>
        <input type="text" id="lgA"></div>
      <p class="login-err" id="lgErr"></p>
      <div class="login-actions">
        <button class="login-back" id="lgBack">${t('backOtherUser')}</button>
        <button class="btn mint sm" id="lgCreate"><svg class="ic"><use href="#i-check"/></svg>${t('createAndEnter')}</button>
      </div>
    </div>`;
  $('#lgBack').addEventListener('click', renderPick);
  $('#lgCreate').addEventListener('click', doSetup);
  $('#lgA').addEventListener('keydown', e => { if(e.key === 'Enter') doSetup(); });
  $('#lgPw1').focus();
}

async function doSetup(){
  const pw1 = $('#lgPw1').value, pw2 = $('#lgPw2').value;
  const q = $('#lgQ').value.trim(), a = $('#lgA').value.trim();
  const err = $('#lgErr');
  if(pw1.length < 4)        { err.textContent = t('errPwLen'); return; }
  if(pw1 !== pw2)           { err.textContent = t('errPwMismatch'); return; }
  if(!q || !a)              { err.textContent = t('errFillSecQ'); return; }
  err.textContent = '';
  const salt = newSalt();
  const rec = {
    salt,
    pwHash: await hashText(pw1, salt),
    q,
    aHash: await hashText(a.toLowerCase(), salt),
  };
  await putAuth(currentUser, rec);
  enterApp();
}

/* Lần sau: nhập mật khẩu + quên mật khẩu */
function renderLogin(rec){
  currentLoginStep = () => renderLogin(rec);
  loginSteps().innerHTML = `
    <div class="login-who">${avatarHtml(currentUser)}<div><b>${currentUser}</b>
      <p class="login-sub" style="margin:2px 0 0">${t('loginSub')}</p></div></div>
    <div class="login-form">
      <div class="fg"><label>${t('pwLbl')}</label>
        <input type="password" id="lgPw" autocomplete="current-password"></div>
      <p class="login-err" id="lgErr"></p>
      <div class="login-actions">
        <button class="login-back" id="lgBack">${t('backOtherUser')}</button>
        <div>
          <button class="login-link" id="lgForgot">${t('forgotPw')}</button>
          <button class="btn sky sm" id="lgGo"><svg class="ic"><use href="#i-lock"/></svg>${t('loginBtn')}</button>
        </div>
      </div>
    </div>`;
  $('#lgBack').addEventListener('click', renderPick);
  $('#lgForgot').addEventListener('click', () => renderForgot(rec));
  const go = async () => {
    const h = await hashText($('#lgPw').value, rec.salt);
    if(h === rec.pwHash) enterApp();
    else $('#lgErr').textContent = t('errPwWrong');
  };
  $('#lgGo').addEventListener('click', go);
  $('#lgPw').addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
  $('#lgPw').focus();
}

/* Quên mật khẩu: trả lời câu hỏi đặc biệt → quay lại tạo mật khẩu mới */
function renderForgot(rec){
  currentLoginStep = () => renderForgot(rec);
  loginSteps().innerHTML = `
    <div class="login-who">${avatarHtml(currentUser)}<div><b>${currentUser}</b>
      <p class="login-sub" style="margin:2px 0 0">${t('forgotSub')}</p></div></div>
    <div class="login-form">
      <div class="fg"><label>${t('secQLbl')}</label>
        <input type="text" value="${rec.q.replace(/"/g,'&quot;')}" disabled style="background:var(--lemon)"></div>
      <div class="fg"><label>${t('secALbl')}</label>
        <input type="text" id="lgA"></div>
      <p class="login-err" id="lgErr"></p>
      <div class="login-actions">
        <button class="login-back" id="lgBack">${t('backBtn')}</button>
        <button class="btn peach sm" id="lgReset"><svg class="ic"><use href="#i-next"/></svg>${t('continueBtn')}</button>
      </div>
    </div>`;
  $('#lgBack').addEventListener('click', () => renderLogin(rec));
  const reset = async () => {
    const h = await hashText($('#lgA').value.trim().toLowerCase(), rec.salt);
    if(h !== rec.aHash){ $('#lgErr').textContent = t('errAnsWrong'); return; }
    await putAuth(currentUser, null);   // xoá mật khẩu cũ
    toast(t('toastVerified'));
    renderSetup();                       // quay lại cửa sổ tạo mật khẩu ban đầu
  };
  $('#lgReset').addEventListener('click', reset);
  $('#lgA').addEventListener('keydown', e => { if(e.key === 'Enter') reset(); });
  $('#lgA').focus();
}

/* Vào app sau khi đăng nhập */
async function enterApp(){
  loginSteps().innerHTML = `<p class="login-sub">${t('openingBook', currentUser)}</p>`;
  await loadUser();
  await loadTasks();
  await loadSacred();
  markLogin();
  $('#userName').textContent = currentUser;
  $('#loginOverlay').style.display = 'none';
  quiz = null; fc = null; quizGroupAll = true; quizGroupSet = new Set(); groupFilter.reset(); fcGroupFilter.reset(); wordSel.sel.clear(); resetLimitLog(); updateStreakUI(quizStreak); lastShownId = null;
  applyI18n();
  activateTab($('.tab-btn[data-tab="tasks"]'));
  $('#trFab').hidden = false; $('#lxFab').hidden = false;
  loadGarden();
  renderTable();
  renderStats();
  prefetchPhonetics();
  if(memoryOnly) toast(t('memoryOnlyWarn'));
  cefrInit();
  scShowPending();                       // thử thách còn dang dở (tải lại trang giữa chừng) → mở lại
}

/* Đổi người dùng */
$('#userChip').addEventListener('click', () => {
  stopFocus(true);                      // dừng phiên tập trung nếu đang chạy
  recAbort();
  if(words) cloudSaveWords(true);       // đẩy nốt thay đổi đang chờ
  if(tasks) saveTasks(true);
  saveFocusLog(true);
  closeHist(); trClose(); lxClose(); $('#trFab').hidden = true; $('#lxFab').hidden = true;
  currentUser = null; words = []; tasks = null; focusLog = {}; writeLog = [];
  updateTasksBadge(); updateHistBadge();
  renderTable(); renderStats();
  setSyncDot('');
  $('#loginOverlay').style.display = 'flex';
  renderPick();
});

/* Lỗi bất ngờ → hiện toast thay vì đứng im */
window.addEventListener('error', e => {
  try{ toast(t('errGeneric', e.message || '?')); }catch(x){}
});

/* ── Khởi động ───────────────────────────────────────────── */
console.log('Sổ Ngữ', APP_VERSION);
applyI18n();
renderPick();
</script>
