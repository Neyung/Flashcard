.tk-ctx-row{display:flex;gap:10px;align-items:flex-start;border:2px solid #23284A33;border-radius:12px;padding:10px 12px;background:#fff;
  font-size:14.5px;font-weight:600;line-height:2}
.tk-ctx-row.ok{border-color:var(--green);background:#F3FCF7}
.tk-ctx-row.bad{border-color:var(--red);background:#FFF4F7}
.tk-ctx-n{flex:none;width:24px;height:24px;margin-top:4px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;
  font:800 11px 'JetBrains Mono',monospace;background:var(--lemon)}
.tk-ctx-s{flex:1;min-width:0}
.tk-ctx-mark{flex:none;margin-top:5px}
.tk-ctx-mark.ok{color:var(--green)} .tk-ctx-mark.bad{color:var(--red)}
.tk-ctx-mark .ic{width:19px;height:19px;stroke-width:3}
.tk-slot{display:inline-flex;align-items:center;justify-content:center;min-width:92px;min-height:34px;vertical-align:middle;
  border:2.5px dashed var(--ink);border-radius:9px;background:#FFFEF6;padding:1px 3px;margin:0 3px;cursor:pointer}
.tk-slot.target{border-color:var(--blue);background:#EEF3FF}
.tk-slot.over{background:var(--sky);border-style:solid}
.tk-slot.filled{border-style:solid;background:transparent;border-color:transparent;min-width:0;padding:0}
.tk-slot.ok .tk-wchip{background:var(--mint)}
.tk-slot.bad .tk-wchip{background:var(--pink);animation:shake .35s}
.tk-slot-ph{color:var(--muted);font-weight:800;letter-spacing:2px}
.tk-ghost{color:var(--muted);font-weight:800;letter-spacing:2px}
.tk-score-chip{border:2px solid var(--ink);border-radius:999px;padding:7px 13px;font:800 13px 'JetBrains Mono',monospace;background:var(--lemon)}
/* Viết đoạn văn */
.tk-wr-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tk-wr-head .tk-note{margin:0}
.tk-tws{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tk-tw{display:inline-flex;flex-direction:column;border:2.5px solid var(--ink);border-radius:10px;padding:5px 11px;background:#fff;
  box-shadow:2px 2px 0 var(--ink);transition:background .2s}
.tk-tw .mono{font-weight:800;font-size:14px}
.tk-tw small{font-size:11px;font-weight:600;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-tw.used{background:var(--mint)}
.tk-tw.used .mono:after{content:" ✓";color:var(--green)}
.tk-wr-box{display:block;width:100%;min-height:190px;margin-top:10px;border:var(--bd);border-radius:12px;padding:14px;resize:vertical;
  font:600 15px/1.65 'JetBrains Mono',monospace;background:#fff;color:var(--ink);outline:none}
.tk-wr-box:focus{box-shadow:4px 4px 0 var(--ink)}
.tk-wr-box:disabled{background:var(--bg)}
.tk-wr-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0 4px;flex-wrap:wrap}
.tk-wr-foot .tk-note{margin:0}
.tk-wr-preview{border:2px dashed var(--ink);border-radius:12px;padding:12px 14px;font:600 14px/1.8 'JetBrains Mono',monospace;
  background:#FFFEF6;white-space:pre-wrap;word-break:break-word;margin-bottom:12px}
.ai-box{margin-top:14px;border:2.5px solid var(--ink);border-radius:14px;background:linear-gradient(135deg,#F3EEFF,#EAF7FF);
  padding:14px 16px;box-shadow:var(--shadow-sm)}
.ai-head{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px;margin-bottom:10px}
.ai-head .ic{width:18px;height:18px;color:#7B5CFF}
.ai-head .ai-badge{margin-left:auto;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.ai-text{border:2px solid var(--ink);border-radius:12px;padding:12px 14px;background:#fff;font:600 14px/1.8 'JetBrains Mono',monospace;
  white-space:pre-wrap;word-break:break-word}
.ai-text ins{text-decoration:none;background:#C9F2D9;border-radius:4px;padding:0 2px}
.ai-text del{color:#C2410C;opacity:.7;text-decoration-thickness:2px}
.ai-chs{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.ai-ch{border:2px solid var(--ink);border-radius:10px;background:#fff;padding:8px 11px;font-size:13px}
.ai-ch .mono{font-size:12.5px}
.ai-ch .ai-from{text-decoration:line-through;color:#C2410C}
.ai-ch .ai-to{color:#1E9E5A;font-weight:800}
.ai-ch .ai-why{display:block;margin-top:3px;color:var(--muted);font-weight:600;font-size:12.5px}
.ai-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.ai-foot .tk-note{margin:0}
.ai-prog{flex:1;min-width:140px;height:8px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;background:#fff}
.ai-prog span{display:block;height:100%;background:#7B5CFF;width:0}
.btn.ai-btn{background:#EFE9FF}
.ai-sum{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;padding:3px 12px;background:#fff;
  font-size:12.5px;font-weight:700;margin-bottom:10px}
.ai-sum.good{background:#C9F2D9}
.ai-ss{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ai-s{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:9px 12px}
.ai-s.ok{background:#F2FBF5;border-color:#1E9E5A}
.ai-s.bad{background:#FFF8F1;border-color:#E07A2E}
.ai-s-n{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:11.5px;font-weight:800;background:#fff}
.ai-s.ok .ai-s-n{background:#1E9E5A;color:#fff;border-color:#1E9E5A}
.ai-s.bad .ai-s-n{background:#FFE2C7}
.ai-s-n .ic{width:12px;height:12px;stroke-width:3.4}
.ai-s-b{flex:1;min-width:0}
.ai-s-t{font:600 13.5px/1.7 'JetBrains Mono',monospace;word-break:break-word}
.ai-s-hint{display:flex;gap:6px;align-items:flex-start;margin-top:5px;font-size:12.5px;font-weight:700;color:#A4520F}
.ai-s-hint .ic{flex:none;width:14px;height:14px;margin-top:2px}
.ai-s-ans{margin-top:8px;border-top:2px dashed #E0C3A6;padding-top:7px}
.ai-s-lbl{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#1E9E5A}
.ai-s-pat{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.ai-s-pat .ai-s-lbl{color:#4B32C3}
.ai-s-ans .ai-s-lbl{display:inline-flex;align-items:center;gap:4px}
.ai-s-ans .ai-s-lbl .ic{width:12px;height:12px}
.ai-s-exp{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:12px;font-weight:700;color:var(--muted)}
.ai-s-exp .tk-spin{width:12px;height:12px;border-width:2px}
.ai-live{margin-bottom:10px;opacity:.85}
.t-cohesion{--qc:#0F766E}
.ai-link{display:inline-flex;align-items:center;gap:4px;margin-left:8px;font-size:11px;font-weight:800;color:#2563EB;
  border:1.5px solid #2563EB;border-radius:99px;padding:0 8px;background:#EEF4FF}
.ai-link .ic{width:11px;height:11px}
.ai-full{margin-top:12px;border-top:2.5px dashed #7B5CFF66;padding-top:12px}
.ai-full-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ai-full-h .ai-s-lbl{color:#4B32C3}
.ai-full-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ai-applied{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:#1E9E5A}
.ai-applied .ic{width:14px;height:14px}
.ai-q{--qc:#E07A2E;background:color-mix(in srgb,var(--qc) 18%,#fff);border-bottom:3px solid var(--qc);border-radius:4px;padding:0 2px;color:inherit}
.ai-q sup{font:800 9.5px 'Manrope',sans-serif;color:#fff;background:var(--qc);border-radius:99px;padding:0 4px;margin-left:2px;vertical-align:super}
.t-word_order{--qc:#7B5CFF}.t-word_choice{--qc:#E07A2E}.t-word_form{--qc:#D9468F}.t-grammar{--qc:#DC2626}
.t-missing_word{--qc:#0E8F8F}.t-spelling{--qc:#C2410C}.t-extra_word{--qc:#8A6D1E}.t-literal{--qc:#2563EB}
.ai-iss{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.ai-is{display:flex;gap:8px;align-items:flex-start}
.ai-is-n{flex:none;width:19px;height:19px;border-radius:50%;background:var(--qc);color:#fff;display:grid;place-items:center;font-size:10.5px;font-weight:800;margin-top:1px}
.ai-is-type{display:inline-block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--qc);
  border:1.5px solid var(--qc);border-radius:6px;padding:0 6px;margin-right:6px}
.ai-is-q{font:700 12.5px 'JetBrains Mono',monospace}
.ai-is-q.nf{opacity:.7}
.ai-is-tip{display:flex;gap:5px;align-items:flex-start;margin-top:2px;font-size:13px;font-weight:700;color:var(--ink)}
.ai-is-tip .ic{flex:none;width:13px;height:13px;margin-top:3px;color:#C98A12}
.ai-s-mine{display:block;margin-top:4px;color:#A4520F}
.ai-s-pat code{font:800 12.5px 'JetBrains Mono',monospace;background:#EFE9FF;border:2px solid #7B5CFF;border-radius:8px;padding:2px 9px;color:#4B32C3}
.ai-s-edit{display:flex;gap:8px;align-items:flex-end;margin-top:9px}
.ai-in{flex:1;min-width:0;resize:vertical;border:2px solid var(--ink);border-radius:10px;padding:7px 10px;font:600 13.5px/1.55 'JetBrains Mono',monospace;
  background:#fff;color:var(--ink);outline:none}
.ai-in:focus{box-shadow:3px 3px 0 var(--ink)}
.ai-in:disabled{background:var(--bg)}
.ai-s-edit .btn{flex:none}
.ai-s-edit .tk-spin{width:13px;height:13px;border-width:2px;border-color:#ffffff66;border-top-color:#fff}
.ai-s-err{display:flex;gap:6px;align-items:flex-start;margin-top:6px;font-size:12.5px;font-weight:700;color:#C2410C}
.ai-s-err .ic{flex:none;width:14px;height:14px;margin-top:2px}
.ai-s-tries{margin-top:4px;font-size:11.5px;font-weight:700;color:var(--muted)}
.ai-s-old{font:600 12.5px/1.6 'JetBrains Mono',monospace;text-decoration:line-through;color:var(--muted)}
.ai-s-okmsg{display:flex;align-items:center;gap:5px;margin-top:4px;font-size:12px;font-weight:800;color:#1E9E5A}
.ai-s-okmsg .ic{width:13px;height:13px}
@media (max-width:640px){.ai-s-edit{flex-direction:column;align-items:stretch}}
.ai-s-act{display:flex;justify-content:flex-end;margin-top:6px}
.ai-s-better{font:700 13.5px/1.7 'JetBrains Mono',monospace;word-break:break-word;margin-top:2px}
.ai-s-better ins{text-decoration:none;background:#C9F2D9;border-radius:4px;padding:0 2px}
.ai-s-better del{color:#C2410C;opacity:.7;text-decoration-thickness:2px}
.tk-err{border-radius:4px;padding:0 2px;cursor:pointer;background:transparent;border-bottom:3px solid}
.tk-err.t-spelling{border-color:var(--red);background:#FFD9E8}
.tk-err.t-grammar{border-color:#F2711C;background:#FFE0C9}
.tk-err.t-usage{border-color:var(--blue);background:#CFE9FF}
.tk-errs{list-style:none;display:flex;flex-direction:column;gap:8px}
.tk-errli{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--ink);border-radius:12px;padding:10px 12px;background:#fff;font-size:13px}
.tk-errli[data-tk]{cursor:pointer}
.tk-errli[data-tk]:hover{background:#FFFBE8}
.tk-etype{flex:none;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;border:2px solid var(--ink);
  border-radius:999px;padding:3px 9px;margin-top:1px}
.tk-etype.t-spelling{background:var(--pink)} .tk-etype.t-grammar{background:var(--peach)} .tk-etype.t-usage{background:var(--sky)}
.tk-ewrong .mono{font-weight:800;text-decoration:line-through;text-decoration-color:var(--red)}
.tk-ewrong.missing .mono{text-decoration:none}
.tk-emsg{font-weight:600;margin-top:2px;line-height:1.45}
.tk-esug{display:flex;gap:6px;align-items:center;margin-top:4px;font-weight:800;color:var(--green)}
.tk-esug .ic{width:13px;height:13px;color:#C98A12}
/* Chuyển tiếp + hoàn thành */
.tk-review{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--mint)}
.tk-review > .ic{width:28px;height:28px;stroke-width:3;color:var(--green)}
.tk-review .tk-actions{margin:0 0 0 auto}
.tk-trans{text-align:center;padding:28px 22px}
.tk-trans-badge{width:72px;height:72px;margin:0 auto 12px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;
  box-shadow:var(--shadow-sm);animation:verdictPop .35s cubic-bezier(.34,1.56,.64,1)}
.tk-trans-badge .ic{width:36px;height:36px;stroke-width:3}
.tk-trans .tk-eyebrow{justify-content:center}
.tk-trans-next{display:flex;gap:12px;align-items:center;text-align:left;border:2.5px dashed var(--ink);border-radius:14px;
  padding:12px 14px;margin:18px auto 0;max-width:460px;background:#FFFEF6}
.tk-trans-next .tk-note{margin-top:2px}
.tk-done{position:relative;overflow:hidden;text-align:center;padding:30px 22px 24px}
.tk-done > *{position:relative}
.tk-done .tk-glow{position:absolute;left:50%;top:70px;width:260px;height:260px;margin-left:-130px;border-radius:50%;
  background:radial-gradient(circle,#FFF1B3 0%,#FFF1B300 70%);pointer-events:none}
.tk-done.anim .tk-glow{animation:tkGlow 3.2s ease-in-out 2}
@keyframes tkGlow{50%{transform:scale(1.18);opacity:.65}}
.tk-done .tk-sub{margin-bottom:16px}
.tk-petal{position:absolute;top:-24px;width:15px;height:11px;border:2px solid var(--ink);border-radius:80% 0 80% 0;
  pointer-events:none;opacity:0;animation:tkPetal linear forwards;z-index:0}
@keyframes tkPetal{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:1}
  100%{transform:translate(var(--dx),520px) rotate(380deg);opacity:0}}
.tk-daybadge{position:relative;display:inline-grid;place-items:center;width:58px;height:58px;flex:none}
.tk-daybadge.big{width:118px;height:118px;margin-bottom:6px}
.tk-daybadge-fl{position:absolute;inset:0;width:100%;height:100%;color:var(--ink);fill:var(--pink);stroke-width:1.1}
.tk-daybadge-d{position:relative;display:flex;flex-direction:column;align-items:center;line-height:1;background:var(--lemon);
  border:2px solid var(--ink);border-radius:50%;width:44%;height:44%;justify-content:center}
.tk-daybadge-d b{font:800 15px 'JetBrains Mono',monospace}
.tk-daybadge.big .tk-daybadge-d b{font-size:22px}
.tk-daybadge-d small{font-size:8px;font-weight:800;text-transform:uppercase}
.tk-daybadge.big .tk-daybadge-d small{font-size:10px}
.tk-done.anim .tk-daybadge{animation:tkBloom 1.1s cubic-bezier(.34,1.56,.64,1)}
@keyframes tkBloom{0%{transform:scale(.2) rotate(-40deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.tk-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:4px 0 16px}
.tk-stat{display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid var(--ink);border-radius:12px;padding:10px 6px;
  background:#fff;font-size:11px;font-weight:700;color:var(--muted);line-height:1.3}
.tk-stat b{font:800 15px 'JetBrains Mono',monospace;color:var(--ink)}
.tk-stat-ic .ic{width:18px;height:18px;color:var(--ink)}
/* Lịch sử bài viết */
.hist-modal{position:fixed;inset:0;z-index:300;background:#23284A73;display:flex;align-items:flex-start;justify-content:center;
  padding:40px 16px;overflow:auto}
.hist-modal[hidden]{display:none}
.hist-card{width:100%;max-width:720px;background:var(--paper);border:var(--bd);border-radius:18px;box-shadow:var(--shadow);
  padding:20px;animation:pop .2s ease}
.hist-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.hist-head h2{flex:1;font-size:20px;font-weight:800;letter-spacing:-.3px}
.hist-x{opacity:.8;padding:4px}
.hist-x .ic{width:22px;height:22px}
.hist-day{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:16px 0 8px}
.hist-item{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;cursor:pointer;color:var(--ink);font-family:'Manrope',sans-serif;
  border:2.5px solid var(--ink);border-radius:12px;background:#fff;box-shadow:var(--shadow-sm);padding:12px 14px;margin-bottom:10px;
  transition:transform .1s, box-shadow .1s}
.hist-item:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);background:#FFFBE8}
.hist-item-top{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:13.5px}
.hist-item-top .mono{font-size:12px;color:var(--muted)}
.hist-words{display:flex;flex-wrap:wrap;gap:5px}
.hist-w{font:700 12px 'JetBrains Mono',monospace;border:2px solid var(--ink);border-radius:7px;padding:1px 7px;background:var(--lav)}
.hist-snip{font-size:13px;font-weight:600;color:#23284ACC;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hist-meta{font-size:11.5px;font-weight:800;color:var(--muted)}
.hist-when{display:flex;align-items:center;gap:7px;margin-top:14px;font-weight:800;font-size:13px;color:var(--muted)}
.hist-sec{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:16px 0 8px}
.hist-sec + .tk-tws{margin-top:0}
.hist-text{border:2px dashed var(--ink);border-radius:12px;padding:12px 14px;background:#FFFEF6;font:600 14px/1.8 'JetBrains Mono',monospace;
  white-space:pre-wrap;word-break:break-word}
.hist-text mark{background:var(--lemon);border:1.5px solid var(--ink);border-radius:4px;padding:0 3px}
.hist-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hist-stats span{border:2px solid var(--ink);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:800;background:#fff}
.hist-ai-row{margin-top:12px}
.hist-ai-row:has(> [hidden]){display:none}
.ai-ctl{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.ai-ctl[hidden]{display:none}
.ai-lvl{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}
.ai-lvl button{border:0;background:transparent;padding:6px 11px;font:800 12px 'Manrope',sans-serif;color:var(--ink);cursor:pointer}
.ai-lvl button + button{border-left:2px solid var(--ink)}
.ai-lvl button.on{background:#7B5CFF;color:#fff}
.ai-lvl-tag{font-size:10.5px;font-weight:800;border:1.5px solid #7B5CFF;color:#4B32C3;border-radius:99px;padding:1px 8px;background:#fff}
.ai-lvl-tag.lv-deep{background:#7B5CFF;color:#fff}
.ai-via{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:11.5px;font-weight:700;color:var(--muted)}
.ai-via .ic{width:12px;height:12px}
.ai-s.skip{background:#F6F6F9;border-style:dashed}
.ai-err{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ai-err > span{flex:1;min-width:200px}
.ai-err-why{display:block;margin-top:3px;font-size:11.5px;font-weight:700;opacity:.8}
.ai-alt{margin-top:7px;border-left:3px solid #7B5CFF;padding-left:9px}
.ai-alt .ai-s-lbl{color:#4B32C3}
.ai-alt-t{font:600 13px/1.65 'JetBrains Mono',monospace;color:#23284ACC}
.hist-rw-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:20px 0 0}
.hist-rw-head .hist-sec{margin:0}
.hist-rw-st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--muted)}
.hist-rw-st .ic{width:14px;height:14px}
.hist-rw-st.saved{color:#1E9E5A}
.hist-rw{min-height:150px;margin-top:8px;font-size:14px}
.hist-rw-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:12px;font-weight:800;color:var(--muted)}
.hist-rw-tag{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;border:2px solid var(--ink);border-radius:999px;padding:1px 9px;
  font-size:11px;font-weight:800;background:var(--mint)}
.hist-rw-tag .ic{width:12px;height:12px}
@media (max-width:640px){.hist-modal{padding:12px 8px}.hist-card{padding:16px}}
/* Dịch nhanh */
.tr-fab{position:fixed;right:18px;bottom:18px;z-index:90;width:50px;height:50px;border-radius:50%;border:var(--bd);background:var(--sky);
  color:var(--ink);box-shadow:var(--shadow-sm);display:grid;place-items:center;cursor:pointer;padding:0;
  transition:transform .12s, box-shadow .12s}
.tr-fab:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.tr-fab.on{background:var(--ink);color:#fff}
.tr-fab[hidden]{display:none}
.tr-fab .ic{width:22px;height:22px}
.tr-panel{position:fixed;right:18px;bottom:80px;z-index:95;width:min(370px,calc(100vw - 24px));max-height:calc(100vh - 100px);overflow:auto;
  background:var(--paper);border:var(--bd);border-radius:16px;box-shadow:var(--shadow);padding:14px;animation:pop .18s ease}
.tr-panel[hidden]{display:none}
.tr-head{display:flex;align-items:center;gap:9px}
.tr-head b{font-size:15.5px;font-weight:800;flex:1}
.tr-logo{width:32px;height:32px;border:2.5px solid var(--ink);border-radius:9px;background:var(--sky);display:grid;place-items:center}
.tr-logo .ic{width:17px;height:17px}
.tr-dir{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;background:var(--lemon);
  padding:4px 10px;font:800 12px 'JetBrains Mono',monospace;cursor:pointer;color:var(--ink)}
.tr-dir .ic{width:14px;height:14px}
.tr-dir:hover{background:var(--ink);color:#fff}
.tr-x{padding:2px}
.tr-x .ic{width:19px;height:19px}
.tr-dir.auto:after{content:"auto";font:800 9px 'Manrope',sans-serif;text-transform:uppercase;background:var(--ink);color:#fff;border-radius:5px;padding:1px 4px}
.tr-head + .tr-in{margin-top:10px}
.tr-info .tk-info-wrap{margin-left:0;align-self:center}
.tr-info .tk-info{width:28px;height:28px;font-size:13px}
.tr-in{display:block;width:100%;resize:vertical;min-height:70px;border:2.5px solid var(--ink);border-radius:11px;padding:10px 12px;
  font:600 14.5px/1.5 'Manrope',sans-serif;background:#fff;color:var(--ink);outline:none}
.tr-in:focus{box-shadow:3px 3px 0 var(--blue)}
.tr-out{margin-top:10px;border:2.5px dashed var(--ink);border-radius:11px;background:#FFFEF6;padding:10px 12px;min-height:56px}
.tr-main-box{border:2.5px solid var(--ink);border-radius:10px;background:var(--lemon);padding:8px 11px;box-shadow:2px 2px 0 var(--ink)}
.tr-main-box.on{background:var(--mint)}
.tr-main{display:block;width:100%;text-align:left;border:none;background:none;padding:0;cursor:pointer;color:var(--ink);
  font:800 19px/1.4 'Manrope',sans-serif;word-break:break-word}
.tr-lbl{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#23284A99;margin-bottom:3px}
.tr-lbl .ic{width:12px;height:12px;fill:#FFC83D;color:var(--ink)}
.tr-lbl span{text-transform:none;letter-spacing:0}
.tr-legend{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--muted)}
.tr-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--sky);border:1.5px solid var(--ink)}
.tr-alt.common{font-weight:800;background:var(--sky);box-shadow:2px 2px 0 var(--ink)}
.tr-alt:not(.common){border-color:#23284A55;color:#23284ACC}
.tr-empty{font-size:12.5px;font-weight:600;color:var(--muted)}
.tr-alts{margin-top:11px;display:flex;flex-direction:column;gap:7px}
.tr-pos{font-size:11px;font-weight:800;color:var(--ink);margin-bottom:4px}
.tr-alt-row{display:flex;flex-wrap:wrap;gap:5px}
.tr-alt{border:2px solid var(--ink);border-radius:8px;background:#fff;padding:2px 9px;font:700 12.5px 'Manrope',sans-serif;cursor:pointer;color:var(--ink)}
.tr-alt:hover{background:var(--lemon)}
.tr-alt.on{background:var(--mint)}
.tr-actions{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.tr-ic{width:34px;height:34px;border:2px solid var(--ink);border-radius:10px;background:#fff;display:grid;place-items:center;cursor:pointer;
  color:var(--ink);padding:0}
.tr-ic:hover{background:var(--lemon)}
.tr-ic:disabled,.tr-actions .btn:disabled{opacity:.4;cursor:not-allowed}
.tr-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:9px;border-top:2px dashed #23284A33}
.tr-link{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--blue);text-decoration:none}
.tr-link .ic{width:13px;height:13px}
.tr-link:hover{text-decoration:underline}
/* Tra dạng từ & đồng/trái nghĩa — nút nổi ngay trên nút dịch */
.tr-fab.lx-fab{bottom:80px;background:var(--peach)}
.tr-fab.lx-fab.on{background:var(--ink)}
.lx-panel{bottom:142px;max-height:calc(100vh - 160px)}
.lx-tabs{display:flex;gap:6px;margin-top:10px}
.lx-tab{flex:1;border:2px solid var(--ink);border-radius:999px;background:#fff;padding:5px 8px;font:800 12px 'Manrope',sans-serif;cursor:pointer;color:var(--ink)}
.lx-tab.on{background:var(--ink);color:#fff}
.lx-sec[hidden]{display:none}
.lx-sec .tr-in{min-height:0;resize:none;margin-top:10px}
.lx-grp + .lx-grp{margin-top:10px}
.lx-grp .tr-pos small{font-weight:700;color:var(--muted)}
.lx-chip.self{background:var(--mint);font-weight:800;box-shadow:2px 2px 0 var(--ink)}
.lx-none{font-size:12px;font-weight:600;color:var(--muted)}
@media (max-width:760px){
  .tr-fab{right:14px;bottom:14px}
  .tr-fab.lx-fab{bottom:74px}
  .tr-panel{bottom:76px;right:10px;left:10px;width:auto}
  .lx-panel{bottom:136px}
}
/* Tab: huy hiệu tiến độ nhiệm vụ */
.tab-badge.done{background:var(--mint)}
/* Tập trung: số phút hợp lệ trong ngày */
.focus-today{display:inline-flex;align-items:center;gap:6px;margin-top:10px;border:2px solid var(--ink);border-radius:999px;
  padding:5px 12px;font-size:12.5px;font-weight:800;background:var(--lemon)}
.focus-today.ok{background:var(--mint)}
.focus-today .ic{width:14px;height:14px}
@media (max-width:640px){
  .tk-modes{grid-template-columns:1fr}
  .tk-stats{grid-template-columns:repeat(2,1fr)}
  .tk-card{gap:10px;padding:12px;flex-wrap:wrap}
  .tk-ico{width:38px;height:38px}
  .tk-body{flex-basis:calc(100% - 100px)}
  .tk-pill{margin-left:auto}
  .tk-card-focus .tk-body{flex-basis:calc(100% - 120px)}
  .tk-fdeco{right:-30px}
  .tk-pop{margin-left:0}
  .tk-stk{font-size:14px;padding:6px 11px}
  .tk-title{font-size:22px}
  .tk-count{padding:6px 10px}
  .tk-count .num{font-size:26px}
  .tk-step{width:30px;height:30px}
  .tk-step .ic{width:14px;height:14px}
  .tk-pr-word{font-size:27px}
  .tk-score{flex-direction:column;text-align:center}
  .tk-top .btn{order:2}
  .tk-steps{order:1;flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){
  .tk-petal,.tk-glow{display:none}
  .tk-card.selected:after,.tk-mic.rec,.tk-live:before,.tk-done.anim .tk-daybadge{animation:none}
}

<script>
/* ═══════════════════════════════════════════════════════════
   SỔ NGỮ — Flashcard học từ vựng & luyện viết
   MỤC LỤC:
     §1  Cấu hình & người dùng        §6  Tab Ghi chú (bảng, nhập/xuất)
     §2  Dữ liệu mặc định & parser    §7  Tab Luyện gõ
     §3  Lưu trữ máy + đám mây        §8  Tab Flashcard (trắc nghiệm)
     §4  Bộ lập lịch SRS              §9  Tab Tập trung (hẹn giờ + hoa)
     §5  Mức độ ghi nhớ & cloze       §10 Đăng nhập & khởi động
   - Dữ liệu lưu localStorage (fallback bộ nhớ) + nhập/xuất file note
   - Bộ lập lịch ưu tiên: tần suất tự điều chỉnh theo
     (1) từ có ⭐ lưu hay không, (2) độ chính xác, (3) thời gian
     trả lời, (4) khoảng cách ôn tập giãn dần để nhớ lâu (SRS)
   ═══════════════════════════════════════════════════════════ */

/* ── Người dùng & đồng bộ đám mây ────────────────────────────
   Để sổ tay theo người dùng trên MỌI thiết bị:
   1. Vào console.firebase.google.com → tạo project (miễn phí)
   2. Build → Realtime Database → Create (chọn chế độ test mode)
   3. Copy URL database (dạng https://ten-project-default-rtdb...firebasedatabase.app)
      và dán vào CLOUD_URL bên dưới (bỏ dấu / ở cuối nếu có).
   Để trống '' = chỉ lưu trên trình duyệt của từng máy.            */
const CLOUD_URL = 'https://flashcard-53fb0-default-rtdb.firebaseio.com';
const APP_VERSION = 'v4.0 · 14-10-2026';

const DEFAULT_USERS = ['Ni','Tom','Dinh'];
const USERS_KEY = 'soTuUsers_v1';
const PALETTE = ['var(--mint)','var(--sky)','var(--peach)','var(--lav)','var(--lemon)','var(--pink)'];
let userList = [...DEFAULT_USERS];
const userColor = u => PALETTE[Math.max(0, userList.indexOf(u)) % PALETTE.length];

async function loadUserList(){
  let list = null;
  if(cloudOn()){
    try{ const cl = await cloudGet('meta/users'); if(Array.isArray(cl) && cl.length) list = cl; }
    catch(e){}
  }
  if(!list){
    try{ const raw = localStorage.getItem(USERS_KEY); if(raw) list = JSON.parse(raw); }catch(e){}
  }
  userList = (Array.isArray(list) && list.length) ? list : [...DEFAULT_USERS];
  for(const d of DEFAULT_USERS) if(!userList.includes(d)) userList.push(d);
}
async function saveUserList(){
  try{ localStorage.setItem(USERS_KEY, JSON.stringify(userList)); }catch(e){}
  if(cloudOn()){
    try{ await cloudPut('meta/users', userList); }
    catch(e){ toast(t('cloudUsersErr')); }
  }
}

/* ── Mốc đăng nhập gần nhất của từng người ── */
const LASTLOGIN_KEY = 'soTuLastLogin_v1';
let lastLogins = {};                       // { Tên: timestamp(ms) }
async function loadLastLogins(){
  let map = {};
  try{ map = JSON.parse(localStorage.getItem(LASTLOGIN_KEY) || '{}'); }catch(e){}
  if(cloudOn()){
    try{
      const cl = await cloudGet('meta/lastLogin');
      if(cl && typeof cl === 'object') map = { ...map, ...cl };
    }catch(e){}
  }
  lastLogins = map;          // gán một lần — tránh hai lần gọi chồng nhau xoá dữ liệu của nhau
}
async function markLogin(){
  lastLogins[currentUser] = Date.now();
  try{ localStorage.setItem(LASTLOGIN_KEY, JSON.stringify(lastLogins)); }catch(e){}
  if(cloudOn()){
    try{ await cloudPut('meta/lastLogin/' + currentUser, lastLogins[currentUser]); }catch(e){}
  }
}
function lastLoginLabel(u){
  const ts = lastLogins[u];
  if(!ts) return t('neverLoggedIn');
  const days = Math.floor((Date.now() - ts) / 86400000);
  if(days <= 0) return t('today');
  if(days === 1) return t('yesterday');
  return t('daysAgo', days);
}
/* Mật khẩu xác nhận xoá tài khoản — chỉ lưu bản băm SHA-256 (không lưu chữ
   thô trong code) để đối chiếu bằng hashText() có sẵn của app. */
const DELETE_PW_SALT = 'sngu_del_2026';

/* Xoá vĩnh viễn một tài khoản: khỏi danh sách người dùng, mật khẩu, mốc đăng

async function deleteUserAccount(user){
  userList = userList.filter(u => u !== user);
  await saveUserList();
  await putAuth(user, null);
  delete lastLogins[user];
  try{ localStorage.setItem(LASTLOGIN_KEY, JSON.stringify(lastLogins)); }catch(e){}
  try{ localStorage.removeItem('soTu_v3_' + user); }catch(e){}
  try{ localStorage.removeItem('soTuSentences_v4_' + user); }catch(e){}
  try{ localStorage.removeItem('soTuGarden_' + user); }catch(e){}
  try{ localStorage.removeItem('soTuTasks_' + user); }catch(e){}
  try{ localStorage.removeItem('soTuFocusLog_' + user); }catch(e){}
  try{ localStorage.removeItem('soTuSacred_' + user); localStorage.removeItem('soTuQuizStreak_' + user); }catch(e){}
  if(cloudOn()){
    try{ await cloudDelete('users/' + user); }catch(e){}
    try{ await cloudDelete('meta/lastLogin/' + user); }catch(e){}
  }
}

/* Parser dùng chung khi nhập file note.
   Mỗi dòng: từ | loại từ | nghĩa | đặt câu | chú thích | đơn/cụm | nhóm
   Dòng tiêu đề dạng "# ── Tên nhóm ──" sẽ gán nhóm cho các dòng bên dưới */
function parseNoteText(text, existing){
  const entries = [];
  let skipped = 0, curGroup = '';
  const dupKey = w => (w.word + '¦' + w.meaning).toLowerCase();
  const seen = new Set((existing||[]).map(dupKey));
  text.split(/\r?\n/).forEach(line=>{
    line = line.trim();
    if(!line) return;
    if(line.startsWith('#')){
      const m = line.match(/^#\s*─*\s*(?:\d+[a-z]?\.\s*)?([^─(]+?)\s*(?:\(.*\))?\s*─*\s*$/);
      if(m && /─/.test(line)) curGroup = m[1].trim();   // chỉ nhận dòng tiêu đề có gạch ──
      return;
    }
    const parts = line.split('|').map(s=>s.trim());
    if(parts.length < 3 || !parts[0] || !parts[2]){ skipped++; return; }
    const [word, pos, meaning, sentence='', note='', kindRaw='', groupRaw=''] = parts;
    const kind = /cụm|cum|phrase/i.test(kindRaw) ? 'cụm'
               : /đơn|don|single/i.test(kindRaw) ? 'đơn'
               : (word.includes(' ') ? 'cụm' : 'đơn');
    const w = makeWord(word, pos, meaning, sentence, note, kind, false, groupRaw || curGroup);
    if(seen.has(dupKey(w))){ skipped++; return; }
    seen.add(dupKey(w));
    entries.push(w);
  });
  return { entries, skipped };
}

/* ── Băm mật khẩu (SHA-256, có fallback khi mở bằng file://) ── */
async function hashText(text, salt){
  const input = salt + '::' + text;
  try{
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(input));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let h1=0x811c9dc5, h2=0x9e3779b9;
    for(const ch of input){ const c=ch.codePointAt(0);
      h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
      h2 = (Math.imul(h2 ^ c, 0x85ebca6b) + 0x27d4eb2f) >>> 0; }
    return 'f' + h1.toString(16) + h2.toString(16);
  }
}
const newSalt = () => Math.random().toString(36).slice(2) + Date.now().toString(36);

/* ── Hồ sơ đăng nhập (mật khẩu + câu hỏi đặc biệt) ── */
function localAuth(){ try{ return JSON.parse(localStorage.getItem(AUTH_KEY) || '{}'); }catch(e){ return {}; } }
function setLocalAuth(user, rec){
  const a = localAuth();
  if(rec === null) delete a[user]; else a[user] = rec;
  try{ localStorage.setItem(AUTH_KEY, JSON.stringify(a)); }catch(e){}
}
async function getAuth(user){
  if(cloudOn()){
    try{
      const rec = await cloudGet('auth/' + user);
      if(rec && rec.pwHash){ setLocalAuth(user, rec); return rec; }
      return null;                       // trên mạng chưa có → coi như lần đầu
    }catch(e){ /* mất mạng → dùng bản trên máy */ }
  }
  const rec = localAuth()[user];
  return (rec && rec.pwHash) ? rec : null;
}
async function putAuth(user, rec){
  setLocalAuth(user, rec);
  if(cloudOn()){
    try{ await cloudPut('auth/' + user, rec); }
    catch(e){ toast(t('cloudAuthErr')); }
  }
}

/* ── Đám mây (Firebase Realtime Database, REST) ── */
const cloudOn = () => !!CLOUD_URL;
async function cloudGet(path){
  const r = await fetch(CLOUD_URL + '/' + path + '.json', { cache:'no-store' });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function cloudPut(path, data){
  const r = await fetch(CLOUD_URL + '/' + path + '.json', { method:'PUT', body: JSON.stringify(data) });
  if(!r.ok) throw new Error('HTTP ' + r.status);
}
async function cloudDelete(path){
  const r = await fetch(CLOUD_URL + '/' + path + '.json', { method:'DELETE' });
  if(!r.ok) throw new Error('HTTP ' + r.status);
}
let syncT = null, syncWarned = false;
function setSyncDot(state){
  const d = $('#syncDot');
  if(!d) return;
  d.className = 'sync-dot' + (cloudOn() && state ? ' ' + state : '');
}
function cloudSaveWords(immediate){
  if(!cloudOn() || !currentUser) return;
  clearTimeout(syncT);
  const doPut = async () => {
    try{ await cloudPut('users/' + currentUser + '/words', words); setSyncDot('ok'); syncWarned = false; }
    catch(e){
      setSyncDot('err');
      if(!syncWarned){ toast(t('cloudSaveErr')); syncWarned = true; }
    }
  };
  if(immediate) doPut(); else syncT = setTimeout(doPut, 1200);
}

/* ── Nạp / lưu sổ tay theo người dùng ── */
async function loadUser(){
  words = null; memoryOnly = false;
  if(cloudOn()){                                   // 1) ưu tiên bản trên mạng
    try{
      const cw = await cloudGet('users/' + currentUser + '/words');
      if(Array.isArray(cw) && cw.length){
        words = cw;
        try{ localStorage.setItem(lsKey(), JSON.stringify(words)); }catch(e){ memoryOnly = true; }
        setSyncDot('ok');
      }
    }catch(e){ setSyncDot('err'); }
  }
  if(!words){                                      // 2) bản trên máy
    try{
      const raw = localStorage.getItem(lsKey());
      if(raw) words = JSON.parse(raw);
    }catch(e){ memoryOnly = true; }
  }
  if(cloudOn()){                                   // vườn hoa trên mây
    try{
      const g = await cloudGet('users/' + currentUser + '/garden');
      if(g != null){
        try{ localStorage.setItem('soTuGarden_' + currentUser, JSON.stringify(g)); }catch(e){}
      }
    }catch(e){}
  }
  if(!words){                                      // 3) lần đầu tiên — sổ trống
    words = [];
    save();
  }
  for(const w of words) normalizeWord(w);
}

/* Firebase tự lược bỏ mảng/đối tượng rỗng khi lưu — vá lại đầy đủ
   các trường để không bao giờ gặp undefined ở giữa chừng */
function normalizeWord(w){
  if(typeof w.group !== 'string') w.group = '';
  if(typeof w.note  !== 'string') w.note  = '';
  if(typeof w.sentence !== 'string') w.sentence = '';
  if(typeof w.pos !== 'string') w.pos = '';
  w.saved = !!w.saved;
  if(!w.stats || typeof w.stats !== 'object') w.stats = newStats();
  else w.stats = Object.assign(newStats(), w.stats);
  if(!Array.isArray(w.stats.times)) w.stats.times = [];
  if(typeof w.ipa   !== 'string') w.ipa   = '';
  if(typeof w.audio !== 'string') w.audio = '';
  if(w.cefr && (typeof w.cefr !== 'object' || !(w.cefr.lv === '' || CEFR.includes(w.cefr.lv)))) delete w.cefr;
}

/* ── Phiên âm + phát âm: tự tra Free Dictionary API (không cần key) ──
   - Chỉ tra từ đơn; kết quả (IPA + link audio) lưu vào từ và đồng bộ mây
   - Tra "lười": chỉ khi từ xuất hiện trên flashcard hoặc khi bấm loa,
     tránh dội 107 request một lúc. Thất bại chỉ ghi nhớ trong phiên,
     mất mạng thì lần sau vẫn thử lại. */
const ipaFailed = new Set();
async function fetchPhonetics(w){
  if(w.kind !== 'đơn' || w.ipa || ipaFailed.has(w.id)) return !!w.ipa;
  try{
    const r = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'
      + encodeURIComponent(w.word.toLowerCase().trim()));
    if(!r.ok) throw 0;
    const data = await r.json();
    const phs = (Array.isArray(data) && data[0] && data[0].phonetics) || [];
    /* Ưu tiên tuyệt đối bản Anh-Mỹ (file audio có đuôi -us.mp3) */
    const us = phs.find(p => p.audio && /-us\.mp3/i.test(p.audio));
    w.audio = (us || phs.find(p => p.audio) || {}).audio || '';
    w.ipa   = (us && us.text)
           || (phs.find(p => p.text) || {}).text
           || (data[0] && data[0].phonetic) || '';
    if(w.ipa || w.audio){ save(); return true; }
    ipaFailed.add(w.id); return false;
  }catch(e){ ipaFailed.add(w.id); return false; }
}

/* Đọc to: ưu tiên audio từ điển; không có thì dùng giọng đọc trình duyệt.
   speakWord/playAudio/speakTTS đều trả về Promise — resolve khi ĐỌC XONG
   (hoặc lỗi / quá 8s) để nơi gọi có thể chờ. */
const audioCache = new Map();
const badAudio = new Set();            // link audio lỗi/treo trong phiên → bỏ qua, dùng TTS
let cancelSpeech = null;
function getAudio(url){
  let a = audioCache.get(url);
  if(!a){ a = new Audio(); a.preload = 'auto'; a.src = url; audioCache.set(url, a); }
  return a;
}
function preloadWordAudio(w){
  if(!w || w.kind !== 'đơn') return;
  if(w.audio){ if(!badAudio.has(w.audio)) getAudio(w.audio); return; }
  fetchPhonetics(w).then(() => { if(w.audio && !badAudio.has(w.audio)) getAudio(w.audio); });
}
function stopSpeech(){
  if(cancelSpeech){ const c = cancelSpeech; cancelSpeech = null; c(); }
  audioCache.forEach(a => { if(!a.paused) a.pause(); });
  try{
    if('speechSynthesis' in window && (speechSynthesis.speaking || speechSynthesis.pending)) speechSynthesis.cancel();
  }catch(e){}
}
function playAudio(url, fallbackText){
  return new Promise(resolve => {
    stopSpeech();
    const a = getAudio(url);
    let done = false, guard, startGuard;
    const end = next => {
      if(done) return; done = true;
      clearTimeout(guard); clearTimeout(startGuard);
      a.removeEventListener('ended', onEnd);
      a.removeEventListener('error', fallback);
      a.removeEventListener('playing', onPlaying);
      if(cancelSpeech === end) cancelSpeech = null;
      resolve(next);
    };
    const fallback = () => {
      if(done) return;
      badAudio.add(url);
      cancelSpeech = null;
      try{ a.pause(); }catch(e){}
      end(speakTTS(fallbackText));
    };
    const onPlaying = () => clearTimeout(startGuard);
    const onEnd = () => { (a.duration && a.duration < 0.25) ? fallback() : end(); };
    a.addEventListener('ended', onEnd);
    a.addEventListener('error', fallback);
    a.addEventListener('playing', onPlaying);
    cancelSpeech = end;
    guard = setTimeout(() => end(), 8000);
    startGuard = setTimeout(fallback, 1500);
    try{ a.currentTime = 0; }catch(e){}
    a.play().catch(() => { if(!done) fallback(); });
  });
}
function speakWord(w){
  if(w.kind !== 'đơn') return speakTTS(w.word);
  if(w.audio && !badAudio.has(w.audio)) return playAudio(w.audio, w.word);
  const p = speakTTS(w.word);
  if(!w.audio) fetchPhonetics(w).then(ok => {
    if(w.audio && !badAudio.has(w.audio)) getAudio(w.audio);
    if(ok){ if(fc && fc.w.id === w.id) updateFcIpa(); renderTable(); }
  });
  return p;
}
/* Tra sẵn phiên âm cho mọi từ đơn còn thiếu — chạy nền sau khi đăng nhập,
   cách nhau 300ms để lịch sự với API. IPA hiện ra ngay, không cần bấm loa. */
let ipaQueueRunning = false;
async function prefetchPhonetics(){
  if(ipaQueueRunning) return;
  ipaQueueRunning = true;
  const user = currentUser;
  const targets = words.filter(w => w.kind === 'đơn' && !w.ipa && !ipaFailed.has(w.id));
  let found = 0;
  for(const w of targets){
    if(currentUser !== user) break;          // đổi người dùng → dừng
    if(await fetchPhonetics(w)){
      found++;
      if(fc && fc.w.id === w.id) updateFcIpa();
    }
    await new Promise(r => setTimeout(r, 300));
  }
  if(found && currentUser === user) renderTable();
  ipaQueueRunning = false;
}

let enVoice = null;
function pickVoice(){
  if(enVoice) return enVoice;
  enVoice = speechSynthesis.getVoices().find(v => v.lang === 'en-US')
         || speechSynthesis.getVoices().find(v => v.lang.startsWith('en-US')) || null;
  return enVoice;
}
if('speechSynthesis' in window) speechSynthesis.addEventListener('voiceschanged', () => { enVoice = null; pickVoice(); });

function speakTTS(text){
  return new Promise(resolve => {
    try{
      if(!('speechSynthesis' in window)){ toast(t('speakUnsupported')); return resolve(); }
      stopSpeech();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = 0.92;
      const v = pickVoice(); if(v) u.voice = v;
      let done = false, guard;
      const end = () => {
        if(done) return; done = true;
        clearTimeout(guard);
        if(cancelSpeech === end) cancelSpeech = null;
        resolve();
      };
      u.onend = end; u.onerror = end;
      cancelSpeech = end;
      guard = setTimeout(end, 8000);
      speechSynthesis.speak(u);
    }catch(e){ resolve(); }
  });
}
function save(){
  if(!currentUser || !words) return;
  if(!memoryOnly){
    try{ localStorage.setItem(lsKey(), JSON.stringify(words)); }
    catch(e){ memoryOnly = true; }
  }
  cloudSaveWords();
}

/* ═══════════════════════════════════════════════════════════
   BỘ LẬP LỊCH ƯU TIÊN (tự ghi nhận tần suất + thời gian học)
   ═══════════════════════════════════════════════════════════ */
function accuracy(w){ return w.stats.seen ? w.stats.correct / w.stats.seen : 0; }

/* ── §5 Mức độ ghi nhớ (giai đoạn học) & câu ngữ cảnh cloze ──
   Hiển thị theo nguyên tắc đã được nghiên cứu:
   - retrieval practice: gợi nhớ chủ động qua ô trống/cloze
   - encoding theo ngữ cảnh: từ luôn đi kèm câu ví dụ
   - phản hồi tức thì + theo dõi tiến độ: huy hiệu giai đoạn  */
function masteryOf(w){
  if(!w.stats.seen)            return { label:t('lvNew'),    cls:'lv-new'    };
  const iv = w.stats.interval || 0;
  if(iv < 3)                   return { label:t('lvLearn'),  cls:'lv-learn'  };
  if(iv < 14)                  return { label:t('lvKnown'),  cls:'lv-known'  };
  return                              { label:t('lvMaster'), cls:'lv-master' };
}
const lvBadge = w => { const m = masteryOf(w);
  return `<span class="lv ${m.cls}" title="${t('priorityTitle', Math.round(priorityScore(w)))}">${m.label}</span>`; };

function clozeHtml(w){            // câu ví dụ với từ bị che — mặt trước thẻ
  if(!w.sentence) return '';
  const i = w.sentence.toLowerCase().indexOf(w.word.toLowerCase());
  if(i < 0) return '';
  return esc(w.sentence.slice(0, i))
       + '<span class="blank">·····</span>'
       + esc(w.sentence.slice(i + w.word.length));
}
function highlightHtml(w){        // câu ví dụ với từ được tô sáng — mặt sau thẻ
  if(!w.sentence) return '';
  const i = w.sentence.toLowerCase().indexOf(w.word.toLowerCase());
  if(i < 0) return esc(w.sentence);
  return esc(w.sentence.slice(0, i))
       + '<mark>' + esc(w.sentence.slice(i, i + w.word.length)) + '</mark>'
       + esc(w.sentence.slice(i + w.word.length));
}

function priorityScore(w){
  const s = w.stats;
  let p = 10;

  if(s.seen === 0) p += 32;                       // từ mới → ưu tiên gặp sớm
  if(w.saved) p += 24;                            // từ ⭐ đang học → ưu tiên

  const acc = accuracy(w);
  p += (1 - acc) * 30;                            // hay sai → tăng tần suất
  if(w.saved && acc >= 0.9 && s.seen >= 4) p -= 20; // lưu nhưng đúng hết → giảm bớt

  const overdue = (now() - s.due) / DAY;          // SRS: đến hạn / quá hạn
  if(overdue >= 0) p += Math.min(34, 8 + overdue * 6);
  else p += Math.max(-26, overdue * 9);           // chưa đến hạn → hạ xuống

  if(s.avgTime > 9000) p += 12;                   // trả lời chậm = chưa thuộc
  else if(s.avgTime > 5000) p += 6;
  else if(s.avgTime > 0 && s.avgTime < 2500) p -= 4;

  p += Math.min(12, s.lapses * 3);                // hay quên (leech) → kèm thêm
  p -= Math.min(14, s.streak * 2);                // chuỗi đúng dài → giãn ra
  return Math.max(1, p);
}

let lastShownId = null;
function pickWord(pool){
  if(!pool.length) return null;
  let cands = pool.filter(w => w.id !== lastShownId);
  if(!cands.length) cands = pool;
  const weights = cands.map(w => Math.pow(priorityScore(w), 1.6));
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random() * total;
  for(let i=0;i<cands.length;i++){ r -= weights[i]; if(r<=0) return cands[i]; }
  return cands[cands.length-1];
}

/* Hạn chế từ trong hôm nay: từ bị đánh dấu (w.limitDay = ngày hôm nay) gần như bị bỏ qua
   hoàn toàn — mỗi lần chọn từ chỉ "quay xổ số" với xác suất 4% (< 5%) mới cho một từ bị
   hạn chế xen vào, bất kể tỉ lệ đúng/sai (hên xui, không đếm theo tỉ lệ chính xác).
   Nếu chỉ còn toàn từ bị hạn chế thì vẫn cho học. Sang ngày mới limitDay không còn khớp
   → tự trở lại bình thường, không cần dọn dẹp. */
const todayKey = () => { const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const isLimitedToday = w => w.limitDay === todayKey();
const LIMIT_LOTTERY = 0.04, LIMIT_LS = 'soTuLimitRate_v1';
function resetLimitLog(){ try{ localStorage.removeItem(LIMIT_LS); }catch(e){} }   // dọn khoá cũ (bản đếm tỉ lệ)
function pickWordLimited(pool){
  const lim = pool.filter(isLimitedToday);
  if(!lim.length) return pickWord(pool);
  const norm = pool.filter(w => !isLimitedToday(w));
  if(!norm.length) return pickWord(lim);           // chỉ còn từ bị hạn chế → vẫn cho học
  return Math.random() < LIMIT_LOTTERY ? pickWord(lim) : pickWord(norm);
}

/* Nghĩa có thể gồm nhiều phần ngăn bởi ";" hoặc "/" — vd "một cách tập trung; dồn hết sự chú ý…".
   Khi hiển thị để đoán từ (Luyện gõ, Flashcard) chỉ lấy ngẫu nhiên MỘT phần. */
const meaningParts = m => { const ps = String(m || '').split(/[;\/]/).map(x => x.trim()).filter(Boolean);
  return ps.length ? ps : [String(m || '').trim()]; };
const pickMeaningPart = w => { const ps = meaningParts(w.meaning); return ps[Math.floor(Math.random() * ps.length)]; };

/* grade: 0 = quên/sai · 1 = mơ hồ · 2 = nhớ/đúng
   charCount (tuỳ chọn): số ký tự đã gõ trong Luyện gõ — dùng để chuẩn hoá
   tốc độ theo ms/ký tự thay vì thời gian gõ tuyệt đối, tránh thiên vị
   từ ngắn (vốn gõ nhanh hơn từ dài dù mức độ thuộc từ là như nhau) */
function applyGrade(w, grade, timeMs, charCount, hintLevel){
  if(!w.stats) w.stats = newStats();
  const s = w.stats;
  if(!Array.isArray(s.times)) s.times = [];
  s.seen++; s.lastSeen = now();
  if(timeMs){
    s.times.push(timeMs);
    if(s.times.length > 20) s.times.shift();
    s.avgTime = Math.round(s.times.reduce((a,b)=>a+b,0) / s.times.length);
  }
  if(grade === 0){
    s.wrong++; s.streak = 0; s.lapses++;
    s.ease = Math.max(1.3, s.ease - 0.2);
    s.interval = 0;
    s.due = now() + 10*60*1000;                   // gặp lại sau ~10 phút
  }else if(grade === 1 && hintLevel >= 2){
    s.correct++; s.streak = Math.floor(s.streak / 2);
    s.ease = Math.max(1.3, s.ease - 0.15);
    s.interval = Math.max(0.3, (s.interval || 0.3) * 0.6);
    s.due = now() + s.interval * DAY;
  }else if(grade === 1){
    s.correct++; s.streak++;
    s.ease = Math.max(1.3, s.ease - 0.05);
    s.interval = Math.max(0.5, (s.interval || 0.3) * 1.25);
    s.due = now() + s.interval * DAY;
  }else{
    s.correct++; s.streak++;
    const perChar = charCount ? timeMs / charCount : null;
    const isFast = perChar != null ? perChar < 180 : (timeMs && timeMs < 3000);
    if(isFast) s.ease = Math.min(2.9, s.ease + 0.08); // trả lời nhanh (chuẩn hoá theo độ dài nếu có)
    else s.ease = Math.min(2.8, s.ease + 0.03);
    s.interval = s.interval < 0.5 ? 1 : s.interval * s.ease;
    s.interval *= (0.95 + Math.random()*0.1);     // fuzz nhẹ chống dồn lịch
    s.interval = Math.min(s.interval, 180);
    s.due = now() + s.interval * DAY;
  }
  save(); renderStats();
}

/* ── Bảng từ ─────────────────────────────────────────────── */
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let sortBy = null, sortDir = 1;
let editingId = null;

/* ── Bộ lọc tick nhiều lựa chọn dùng chung (nút + menu checkbox "Tất cả" + từng mục) ── */
function makeCheckFilter(root, o){
  const st = { all:true, set:new Set() };
  root.classList.add('gsel');
  root.innerHTML = `<button type="button" class="gsel-btn" aria-haspopup="true" aria-expanded="false">
      <span class="gsel-text"></span><svg class="ic caret" viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6"/></svg>
    </button><div class="gsel-menu" hidden></div>`;
  const btn = root.querySelector('.gsel-btn'), txt = root.querySelector('.gsel-text'), menu = root.querySelector('.gsel-menu');
  let items = [];
  const label = () => {
    if(st.all) return t(o.allKey);
    const n = st.set.size;
    if(!n) return t(o.noneKey);
    if(n === 1){ const k = [...st.set][0], it = items.find(x => x.k === k); return it ? it.label : k; }
    return t(o.nKey, n);
  };
  function sync(){
    menu.querySelectorAll('input[type=checkbox]').forEach(cb => {
      cb.checked = cb.hasAttribute('data-all') ? st.all : (st.all || st.set.has(cb.dataset.k));
    });
    const allCb = menu.querySelector('input[data-all]');
    if(allCb) allCb.indeterminate = !st.all && st.set.size > 0;
    txt.textContent = txt.title = label();
  }
  function toggle(force){
    const open = force !== undefined ? force : menu.hidden;
    menu.hidden = !open; root.classList.toggle('open', open);
    btn.setAttribute('aria-expanded', String(open));
  }
  function fill(){
    items = o.items();
    const keys = items.map(x => x.k);
    if(!st.all) st.set = new Set([...st.set].filter(k => keys.includes(k)));
    const opt = (attr, lbl, n, cls) =>
      `<label class="gsel-opt ${cls}"><input type="checkbox" ${attr}><span>${esc(lbl)}</span><span class="n">${n}</span></label>`;
    menu.innerHTML = opt('data-all', t(o.allKey), o.total(), 'all')
      + items.map(x => opt(`data-k="${esc(x.k)}"`, x.label, x.n, '')).join('');
    sync();
  }
  btn.addEventListener('click', e => { e.stopPropagation(); toggle(); });
  document.addEventListener('click', e => { if(!root.contains(e.target)) toggle(false); });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') toggle(false); });
  menu.addEventListener('change', e => {
    const cb = e.target.closest('input[type=checkbox]'); if(!cb) return;
    const keys = items.map(x => x.k);
    if(cb.hasAttribute('data-all')){
      st.all = cb.checked; st.set = new Set();
    }else{
      if(st.all){ st.all = false; st.set = new Set(keys); }   // đang "tất cả" → bỏ tick 1 mục
      cb.checked ? st.set.add(cb.dataset.k) : st.set.delete(cb.dataset.k);
      if(keys.length && keys.every(k => st.set.has(k))){ st.all = true; st.set = new Set(); }
    }
    sync(); o.onChange();
  });
  return { ok: k => st.all || st.set.has(k), none: () => !st.all && !st.set.size, fill, close: () => toggle(false),
           reset(){ st.all = true; st.set = new Set(); } };
}

/* ── Chọn nhiều dòng để xoá hàng loạt (chỉ giữ các dòng đang hiển thị) ── */
function makeRowSelection(o){
  const sel = new Set();
  let shown = [], lastId = null;
  function sync(){
    const tb = $(o.tbody);
    tb.querySelectorAll('tr[data-id]').forEach(tr => {
      const on = sel.has(tr.dataset.id);
      tr.classList.toggle('sel', on);
      const cb = tr.querySelector('.row-cb'); if(cb) cb.checked = on;
    });
    const all = $(o.selAll), n = sel.size;
    all.checked = n > 0 && n === shown.length;
    all.indeterminate = n > 0 && n < shown.length;
    all.disabled = !shown.length;
    $(o.bar).hidden = !n;
    $(o.count).textContent = t('selCount', n);
  }
  function setShown(ids){
    shown = ids;
    const vis = new Set(ids);
    [...sel].forEach(id => { if(!vis.has(id)) sel.delete(id); });
  }
  $(o.tbody).addEventListener('click', e => {
    const cb = e.target.closest('.row-cb'); if(!cb) return;
    const id = cb.closest('tr').dataset.id;
    const i = shown.indexOf(id), j = shown.indexOf(lastId);
    if(e.shiftKey && lastId && i >= 0 && j >= 0){       // Shift+click: chọn cả đoạn
      const [a, b] = i < j ? [i, j] : [j, i];
      shown.slice(a, b + 1).forEach(x => cb.checked ? sel.add(x) : sel.delete(x));
    }else{
      cb.checked ? sel.add(id) : sel.delete(id);
    }
    lastId = id; sync();
  });
  $(o.selAll).addEventListener('change', e => {
    sel.clear();
    if(e.target.checked) shown.forEach(id => sel.add(id));
    sync();
  });
  $(o.clearBtn).addEventListener('click', () => { sel.clear(); sync(); });
  $(o.delBtn).addEventListener('click', () => { if(sel.size) o.onDelete(new Set(sel)); });
  return { sel, sync, setShown, cell: id => `<td class="sel-col"><input type="checkbox" class="row-cb" ${sel.has(id)?'checked':''}></td>` };
}

const lvRank = w => !w.stats.seen ? 0 : (w.stats.interval||0) < 3 ? 1 : (w.stats.interval||0) < 14 ? 2 : 3;
