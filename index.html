/* ═══════════════════════════════════════════════════════════
   TAB NHIỆM VỤ (Tasks) — chuỗi 5 nhiệm vụ mỗi ngày:
   Focus 30' → Phát âm → Nghe & viết → Điền ngữ cảnh → Viết đoạn văn
   - Trạng thái gắn với NGÀY địa phương (YYYY-MM-DD), lưu máy + mây
   - Nhiệm vụ Focus đọc nhật ký giây tập trung hợp lệ theo ngày (focusLog)
   - Xong đủ 5 → +2 hoa nhỏ trong Vườn (dùng chung với Tập trung), mỗi ngày 1 lần (garden.taskDays)
   ═══════════════════════════════════════════════════════════ */
const TASK_KEYS = ['focus','pron','listen','context','write'];
const TASK_META = {
  focus:   { icon:'flower',     color:'var(--lemon)' },
  pron:    { icon:'mic',        color:'var(--pink)'  },
  listen:  { icon:'headphones', color:'var(--sky)'   },
  context: { icon:'puzzle',     color:'var(--lav)'   },
  write:   { icon:'edit',       color:'var(--mint)'  },
};
/* Focus bắt buộc: 20 phút ở chế độ Nhanh, 30 phút ở Tiêu chuẩn/Chuyên sâu */
const focusGoalMin = () => tasks && tasks.mode === 'quick' ? 20 : 30;
const focusGoalSec = () => focusGoalMin() * 60;
const TASK_MODES = {                            // số lượng linh hoạt theo thời lượng
  quick:    { pron:6,  listen:5,  context:8,  write:1 },
  standard: { pron:20, listen:10, context:20, write:2 },
  deep:     { pron:35, listen:20, context:30, write:3 },
};
const TASK_MODE_KEYS = ['quick','standard','deep'];
const TASK_SEC_PER = { pron:36, listen:24, context:18, write:240 };   // ước lượng giây cho mỗi mục
const WRITE_WORDS = 5, WRITE_MIN_WORDS = 25;
const PRON_WORD_PASS = 80, PRON_SENT_PASS = 70, PRON_SKIP_AFTER = 3;

/* Firebase bỏ mảng rỗng và biến mảng thưa thành object — luôn đọc về mảng */
const asArr = v => Array.isArray(v) ? v
  : (v && typeof v === 'object') ? Object.keys(v).sort((a, b) => a - b).map(k => v[k]) : [];
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

/* ── Nhật ký Focus theo ngày ──────────────────────────────────
   Chỉ cộng 1 giây cho mỗi nhịp đồng hồ khi phiên Tập trung đang chạy VÀ
   cửa sổ ứng dụng đang được dùng (rời cửa sổ = không hợp lệ). Một phiên
   chỉ có một bộ đếm nên không bao giờ cộng trùng. */
let focusLog = {};
let focusLogSaveT = null, focusLogDirty = 0;
const focusLogKey = () => 'soTuFocusLog_' + currentUser;
const focusTodaySec = () => focusLog[todayKey()] || 0;
function cleanFocusLog(v){
  const out = {};
  if(v && typeof v === 'object')
    for(const [k, s] of Object.entries(v)) if(/^\d{4}-\d\d-\d\d$/.test(k) && +s > 0) out[k] = Math.floor(+s);
  return out;
}
function saveFocusLog(immediate){
  if(!currentUser) return;
  const keys = Object.keys(focusLog).sort();
  while(keys.length > 400) delete focusLog[keys.shift()];
  try{ localStorage.setItem(focusLogKey(), JSON.stringify(focusLog)); }catch(e){}
  if(!cloudOn()) return;
  const user = currentUser;
  const put = () => cloudPut('users/' + user + '/focusLog', focusLog).catch(() => {});
  if(immediate){ clearTimeout(focusLogSaveT); focusLogSaveT = null; put(); }
  else if(!focusLogSaveT) focusLogSaveT = setTimeout(() => { focusLogSaveT = null; if(currentUser === user) put(); }, 20000);
}
function focusLogTick(){
  if(!currentUser) return;
  const k = todayKey();
  focusLog[k] = (focusLog[k] || 0) + 1;
  if(++focusLogDirty >= 10){ focusLogDirty = 0; saveFocusLog(); }
  tasksOnFocusProgress();
}
window.addEventListener('pagehide', () => { if(currentUser){ saveFocusLog(true); if(tasks) saveTasks(true); if(sacred) saveSacred(true); } });

/* ── Trạng thái nhiệm vụ ─────────────────────────────────── */
let tasks = null;              // trạng thái của ngày hiện tại
let taskHist = {};             // { 'YYYY-MM-DD': { mode, doneAt, sum } } — lịch sử các ngày đã hoàn thành
let taskModePref = 'standard';
let writeLog = [];             // lịch sử các đoạn văn đã hoàn thành (mới nhất trước)
let tkView = 'overview';       // 'overview' | key nhiệm vụ | 'trans' | 'done'
let tkTrans = null;            // nhiệm vụ vừa xong (màn chuyển tiếp)
let tkAnimDone = false;        // chỉ phát hiệu ứng chúc mừng 1 lần
let tkLastFocusMin = -1;
let tasksSaveT = null;
const tasksKey = () => 'soTuTasks_' + currentUser;

function newTasks(mode){
  return { date: todayKey(), mode, modeSet: false, started: false, completedAt: 0, celebrated: false, updatedAt: now(), t: {} };
}
function normTasks(s){
  if(!s || typeof s !== 'object' || typeof s.date !== 'string') return null;
  if(!TASK_MODES[s.mode]) s.mode = 'standard';
  s.t = (s.t && typeof s.t === 'object') ? s.t : {};
  if(typeof s.modeSet !== 'boolean')               // dữ liệu cũ: đã bắt đầu làm = coi như đã chốt
    s.modeSet = !!(s.started || s.completedAt || TASK_KEYS.some(k => s.t[k] && (s.t[k].inited || s.t[k].done)));
  TASK_KEYS.forEach(k => {
    const x = s.t[k] = (s.t[k] && typeof s.t[k] === 'object') ? s.t[k] : {};
    x.done = !!x.done;
    if(k === 'pron') x.items = asArr(x.items).map(it => Object.assign(it, { wa: asArr(it.wa), sa: asArr(it.sa) }));
    if(k === 'listen') x.items = asArr(x.items);
    if(k === 'context'){
      x.items = asArr(x.items).map(it => Object.assign(it, { parts: asArr(it.parts) }));
      x.order = asArr(x.order); x.slots = asArr(x.slots); x.res = asArr(x.res);
    }
    if(k === 'write') x.paras = asArr(x.paras).map(p => Object.assign(p, {
      words: asArr(p.words), errors: asArr(p.errors), issues: asArr(p.issues), text: p.text || '' }));
  });
  return s;
}
function saveTasks(immediate){
  if(!currentUser || !tasks) return;
  tasks.updatedAt = now();
  const data = { mode: taskModePref, state: tasks, hist: taskHist, writeLog };
  const snap = JSON.stringify(data);
  try{ localStorage.setItem(tasksKey(), snap); }catch(e){}
  updateTasksBadge();
  if(!cloudOn()) return;
  clearTimeout(tasksSaveT);
  const user = currentUser;
  const put = () => cloudPut('users/' + user + '/tasks', JSON.parse(snap)).catch(() => {});
  if(immediate) put(); else tasksSaveT = setTimeout(put, 2500);
}
async function loadTasks(){
  tasks = null; taskHist = {}; taskModePref = 'standard'; writeLog = [];
  tkView = 'overview'; tkTrans = null; tkAnimDone = false; tkLastFocusMin = -1;
  let local = null, remote = null;
  try{ local = JSON.parse(localStorage.getItem(tasksKey()) || 'null'); }catch(e){}
  try{ focusLog = cleanFocusLog(JSON.parse(localStorage.getItem(focusLogKey()) || '{}')); }catch(e){ focusLog = {}; }
  if(cloudOn()){
    try{ remote = await cloudGet('users/' + currentUser + '/tasks'); }catch(e){}
    try{                                     // gộp nhật ký Focus: lấy giá trị lớn hơn của từng ngày
      const fl = cleanFocusLog(await cloudGet('users/' + currentUser + '/focusLog'));
      for(const [k, s] of Object.entries(fl)) focusLog[k] = Math.max(focusLog[k] || 0, s);
    }catch(e){}
  }
  const ts = d => (d && d.state && d.state.updatedAt) || 0;
  const pick = remote && local ? (ts(remote) > ts(local) ? remote : local) : (remote || local);
  if(pick && typeof pick === 'object'){
    if(TASK_MODES[pick.mode]) taskModePref = pick.mode;
    tasks = normTasks(pick.state);
  }
  for(const d of [local, remote]) if(d && d.hist && typeof d.hist === 'object')
    for(const [k, v] of Object.entries(d.hist)) if(v && typeof v === 'object') taskHist[k] = v;
  const logById = new Map();                     // gộp lịch sử viết của máy + mây theo id
  for(const d of [local, remote]) if(d) for(const e of asArr(d.writeLog))
    if(e && e.id && typeof e.text === 'string'){
      const prev = logById.get(e.id);
      if(prev && (prev.rewriteAt || 0) > (e.rewriteAt || 0)){ e.rewrite = prev.rewrite; e.rewriteAt = prev.rewriteAt; }
      logById.set(e.id, Object.assign(e, { words: asArr(e.words), issues: asArr(e.issues) }));
    }
  writeLog = [...logById.values()].sort((a, b) => (b.at || 0) - (a.at || 0)).slice(0, 500);
  updateHistBadge();
  try{ localStorage.setItem(focusLogKey(), JSON.stringify(focusLog)); }catch(e){}
  ensureToday();
}
/* Sang ngày mới → làm mới chuỗi nhiệm vụ (lịch sử + hoa trong Vườn giữ nguyên) */
function ensureToday(){
  if(!currentUser) return false;
  let changed = false;
  if(!tasks || tasks.date !== todayKey()){
    tasks = normTasks(newTasks(taskModePref));
    tkView = 'overview'; tkTrans = null; tkAnimDone = false;
    tkModePick = null;
    changed = true;
  }
  if(checkFocusTask()) changed = true;
  if(changed) saveTasks();
  else updateTasksBadge();
  return changed;
}
function checkFocusTask(){
  const f = tasks && tasks.t.focus;
  if(!f || f.done || focusTodaySec() < focusGoalSec()) return false;
  f.done = true; f.doneAt = now(); tasks.started = true;
  return true;
}
const tasksTabActive = () => { const p = $('#tab-tasks'); return !!p && p.classList.contains('active'); };
function tasksOnFocusProgress(){
  if(!tasks || !currentUser) return;
  if(tasks.date !== todayKey()){ ensureToday(); if(tasksTabActive()) renderTasks(); return; }
  if(checkFocusTask()){
    saveTasks(); saveFocusLog(true);
    toast(t('tkFocusDoneToast', focusGoalMin()));
    if(tasksTabActive() && (tkView === 'overview' || tkView === 'focus')) renderTasks();
    return;
  }
  const m = Math.floor(focusTodaySec() / 60);
  if(m !== tkLastFocusMin){
    tkLastFocusMin = m;
    if(tasksTabActive() && (tkView === 'overview' || tkView === 'focus')) renderTasks();
  }
}
setInterval(() => {                               // đổi ngày khi app vẫn đang mở
  if(currentUser && tasks && tasks.date !== todayKey()){
    recAbort();
    ensureToday();
    if(tasksTabActive()) renderTasks();
  }
}, 30000);

/* Làm theo thứ tự tuỳ ý: không nhiệm vụ nào bị khoá; chỉ hoàn thành khi đạt đúng điều kiện */
const taskStarted = k => k === 'focus' ? focusTodaySec() > 0 : !!tasks.t[k].inited;
const taskStatus = k => tasks.t[k].done ? 'done' : taskStarted(k) ? 'active' : 'todo';
const nextTaskKey = () => TASK_KEYS.find(k => !tasks.t[k].done) || null;
const tasksDoneCount = () => TASK_KEYS.filter(k => tasks.t[k].done).length;
const taskPlanned = k => tasks.t[k].inited ? tasks.t[k].target : TASK_MODES[tasks.mode][k];
function taskEstMin(k){
  if(k === 'focus') return Math.max(0, Math.ceil((focusGoalSec() - focusTodaySec()) / 60));
  return Math.max(1, Math.round(taskPlanned(k) * TASK_SEC_PER[k] / 60));
}
const modeEstMin = m => Math.round(['pron','listen','context','write'].reduce((s, k) => s + TASK_MODES[m][k] * TASK_SEC_PER[k], 0) / 60);
function taskFrac(k){                              // tiến độ 0..1 trong từng nhiệm vụ
  const x = tasks.t[k];
  if(x.done) return 1;
  if(k === 'focus') return Math.min(1, focusTodaySec() / focusGoalSec());
  if(!x.inited) return 0;
  if(k === 'pron' || k === 'listen') return x.items.filter(i => i.done).length / x.items.length;
  if(k === 'context') return x.res.filter(r => r === 1).length / x.items.length;
  if(k === 'write') return x.paras.filter(p => p.done).length / x.paras.length;
  return 0;
}
const tasksOverallPct = () => Math.round(TASK_KEYS.reduce((s, k) => s + taskFrac(k), 0) / TASK_KEYS.length * 100);
function updateTasksBadge(){
  const b = $('#tasksBadge'); if(!b) return;
  if(!tasks || !currentUser){ b.style.display = 'none'; return; }
  const n = tasksDoneCount();
  b.style.display = '';
  b.textContent = n === 5 ? '✓' : n + '/5';
  b.classList.toggle('done', n === 5);
}

/* ── Chọn từ vựng: ưu tiên các từ nằm CUỐI danh sách ưu tiên xuất hiện (priorityScore
   thấp nhất — ít khi được bốc ra ở Luyện gõ/Flashcard) thay vì từ mới, để nhiệm vụ
   hằng ngày ôn lại những từ dễ bị "bỏ quên". Không lặp lại cùng một từ. ── */
const PLACEHOLDER_RE = /^(sb|sth|smb|smth|st|someone|somebody|something|one's|someone's|somebody's|sb's|oneself|o\.s\.|\.\.\.|…)$/i;
const hasPlaceholder = w => w.word.toLowerCase().split(/[\s\/]+/).some(x => PLACEHOLDER_RE.test(x));
function wordSnap(w){
  return { id: w.id, word: w.word.trim(), meaning: w.meaning || '', pos: w.pos || '', kind: w.kind,
           sentence: (w.sentence || '').trim(), ipa: w.ipa || '' };
}
function pickVocab(n, valid, prefer, opts = {}){
  const seen = new Set(opts.exclude || []);
  const take = w => { const k = w.word.trim().toLowerCase(); if(!k || seen.has(k)) return false; seen.add(k); return true; };
  const pool = words.filter(w => w.word && w.word.trim() && valid(w));
  // điểm thấp = cuối danh sách ưu tiên → lấy trước; xáo nhẹ ±8% để mỗi ngày không y hệt,
  // tiêu chí phụ (prefer, vd. có câu ví dụ) chỉ kéo lên vài điểm chứ không lấn át thứ tự ưu tiên
  const key = new Map(pool.map(w => [w, priorityScore(w) * (0.92 + Math.random() * 0.16) - (prefer ? prefer(w) * 3 : 0)]));
  const ranked = pool.slice().sort((a, b) => key.get(a) - key.get(b));
  const out = [];
  for(const w of ranked){ if(out.length >= n) break; if(take(w)) out.push(w); }
  return { list: out, nNew: out.length, nFill: 0 };
}

/* ── Nhận diện từ mục tiêu kể cả dạng biến đổi hợp lệ (books, studied, went…) ── */
const IRREGULAR = {
  be:'am is are was were been being', have:'has had having', do:'does did done doing', go:'goes went gone going',
  make:'made', take:'took taken', give:'gave given', get:'got gotten', come:'came', see:'saw seen', know:'knew known',
  think:'thought', find:'found', tell:'told', become:'became', leave:'left', feel:'felt', bring:'brought',
  begin:'began begun', keep:'kept', hold:'held', write:'wrote written', stand:'stood', hear:'heard', mean:'meant',
  meet:'met', run:'ran', pay:'paid', sit:'sat', speak:'spoke spoken', lead:'led', read:'read', grow:'grew grown',
  lose:'lost', fall:'fell fallen', send:'sent', build:'built', understand:'understood', draw:'drew drawn',
  break:'broke broken', spend:'spent', rise:'rose risen', drive:'drove driven', buy:'bought', wear:'wore worn',
  choose:'chose chosen', seek:'sought', throw:'threw thrown', catch:'caught', deal:'dealt', win:'won',
  forget:'forgot forgotten', teach:'taught', sell:'sold', fight:'fought', overcome:'overcame', undergo:'underwent undergone',
  withdraw:'withdrew withdrawn', arise:'arose arisen', eat:'ate eaten', drink:'drank drunk', sleep:'slept',
  fly:'flew flown', forgive:'forgave forgiven', hide:'hid hidden', ride:'rode ridden', ring:'rang rung', shake:'shook shaken',
  sing:'sang sung', steal:'stole stolen', swim:'swam swum', tear:'tore torn', wake:'woke woken', bear:'bore borne born',
  bind:'bound', bite:'bit bitten', feed:'fed', flee:'fled', freeze:'froze frozen', lay:'laid', lend:'lent',
  light:'lit', shine:'shone', shoot:'shot', strike:'struck', swear:'swore sworn', sweep:'swept', weep:'wept',
  child:'children', person:'people', man:'men', woman:'women', mouse:'mice', foot:'feet', tooth:'teeth',
  good:'better best', bad:'worse worst', far:'further farther furthest farthest', analysis:'analyses', crisis:'crises',
  phenomenon:'phenomena', criterion:'criteria',
};
function wordForms(base){
  const b = base.toLowerCase();
  const f = new Set([b, b + 's', b + 'es', b + 'ed', b + 'd', b + 'ing', b + 'er', b + 'est', b + 'ly', b + "'s", b + '’s']);
  if(/e$/.test(b)){ f.add(b.slice(0, -1) + 'ing'); f.add(b.slice(0, -1) + 'ely'); }
  if(/ie$/.test(b)) f.add(b.slice(0, -2) + 'ying');
  if(/[^aeiou]y$/.test(b)){ const s = b.slice(0, -1); ['ies','ied','ier','iest','ily','iness'].forEach(x => f.add(s + x)); }
  if(/[^aeiou][aeiou][bdgklmnprt]$/.test(b)){ const c = b.slice(-1); ['ed','ing','er','est'].forEach(x => f.add(b + c + x)); }
  if(/(fe|f)$/.test(b)) f.add(b.replace(/(fe|f)$/, 'ves'));
  if(/le$/.test(b)) f.add(b.slice(0, -1) + 'y');
  if(/ic$/.test(b)) f.add(b + 'ally');
  if(IRREGULAR[b]) IRREGULAR[b].split(' ').forEach(x => f.add(x));
  return f;
}
const tgtReCache = new Map();
function targetRegex(word){
  if(tgtReCache.has(word)) return new RegExp(tgtReCache.get(word), 'gi');
  const toks = word.toLowerCase().replace(/\(.*?\)/g, ' ').split(/[\s\/]+/).filter(Boolean);
  let src = '', first = true, gap = false;
  for(const tk of toks){
    if(PLACEHOLDER_RE.test(tk)){ gap = true; continue; }
    const alt = [...wordForms(tk)].sort((a, b) => b.length - a.length).map(escRe).join('|');
    if(!first) src += gap ? "(?:[\\s,]+[\\w'’-]+){0,4}?[\\s,]+" : '[\\s-]+';
    src += '(?:' + alt + ')';
    first = false; gap = false;
  }
  if(!src) return null;
  src = "(?<![\\w'’-])" + src + "(?![\\w-])";
  tgtReCache.set(word, src);
  return new RegExp(src, 'gi');
}
function findTarget(text, word){
  const re = targetRegex(word);
  return re ? [...(text || '').matchAll(re)] : [];
}

/* ── Kiểm tra linh hoạt cho phần Viết: tách cụm từ dài thành các "cụm từ khoá" ──
   • Chỉ với cụm dài (≥ 5 từ): tách ở liên từ / động từ "to be" nằm GIỮA cụm (and, or,
     but, were, is…) khi mỗi bên có ≥ 2 từ và có từ mang nghĩa — các từ nối đó không bắt
     buộc. Cụm ngắn như "rock and roll" giữ nguyên.
   • Mạo từ (a/an/the) trong cụm là tuỳ chọn và đổi được (my, this, some…); mạo từ ở
     đầu/cuối cụm bị bỏ. Giới từ giữa các từ mang nghĩa (key TO regaining) được giữ
     vì bỏ đi sẽ đổi nghĩa.
   • Mỗi cụm khoá phải là các từ liên tiếp; các cụm phải đúng thứ tự, trong cùng một câu. */
const KC_SPLIT = new Set(['and','or','but','nor','yet','is','are','was','were','am','be','been','being','while','whereas','because','which','who','whom','whose']);
const KC_ART = new Set(['a','an','the']);
const KC_DET = 'a|an|the|my|your|his|her|its|our|their|this|that|these|those|some|any|one';
const KC_FUNC = new Set([...KC_SPLIT, ...KC_ART, 'to','of','in','on','at','for','with','by','from','as','into','onto','about','up','down','out','off','over',
  'so','than','then','that','this','it','its','not','do','does','did','has','have','had','will','would','can','could','should','may','might','must']);
const kcCache = new Map();
function keyChunks(word){
  if(kcCache.has(word)) return kcCache.get(word);
  const toks = word.toLowerCase().replace(/\(.*?\)/g, ' ').replace(/[,;:]+/g, ' , ').split(/[\s\/]+/).filter(Boolean);
  const content = tk => tk !== ',' && !KC_FUNC.has(tk) && !PLACEHOLDER_RE.test(tk);
  let chunks = [[]];
  toks.forEach((tk, i) => {
    const cur = chunks[chunks.length - 1];
    const isSplit = tk === ',' || (KC_SPLIT.has(tk) && i > 0 && i < toks.length - 1);
    const rest = toks.slice(i + 1).filter(x => x !== ',');
    if(isSplit && toks.length >= 5 && cur.length >= 2 && rest.length >= 2 && cur.some(content) && rest.some(content)){ chunks.push([]); return; }
    if(tk !== ',') cur.push(tk);
  });
  chunks = chunks.map(c => {
    while(c.length > 1 && (KC_ART.has(c[0]) || KC_SPLIT.has(c[0]))) c.shift();
    while(c.length > 1 && (KC_ART.has(c[c.length - 1]) || KC_SPLIT.has(c[c.length - 1]))) c.pop();
    return c;
  }).filter(c => c.length);
  if(!chunks.length) chunks = [toks.filter(tk => tk !== ',')];
  const out = chunks.map(c => {
    let src = '', gap = false, det = false;
    for(const tk of c){
      if(PLACEHOLDER_RE.test(tk)){ gap = true; continue; }
      if(KC_ART.has(tk) && src){ det = true; continue; }
      const alt = [...wordForms(tk)].sort((a, b) => b.length - a.length).map(escRe).join('|');
      if(src) src += gap ? "(?:[\\s,]+[\\w'’-]+){0,4}?[\\s,]+" : '[\\s-]+';
      if(det) src += '(?:(?:' + KC_DET + ')[\\s-]+)?';
      src += '(?:' + alt + ')';
      gap = false; det = false;
    }
    return { label: c.join(' '), src: src ? "(?<![\\w'’-])" + src + "(?![\\w-])" : '' };
  }).filter(c => c.src);
  kcCache.set(word, out);
  return out;
}
/* Trả về các "lần dùng" hợp lệ: { 0: đoạn khớp, index, parts: [[đầu, cuối]…] } */
function findUse(text, word){
  text = text || '';
  const ks = keyChunks(word);
  if(!ks.length) return [];
  const mk = (a, b, parts) => Object.assign([text.slice(a, b)], { index: a, parts });
  if(ks.length === 1)
    return [...text.matchAll(new RegExp(ks[0].src, 'gi'))].map(m => mk(m.index, m.index + m[0].length, [[m.index, m.index + m[0].length]]));
  const out = [];
  for(const sn of splitSentences(text)){
    let pos = sn.start;
    for(;;){
      const parts = [];
      let p2 = pos;
      for(const k of ks){
        const re = new RegExp(k.src, 'gi'); re.lastIndex = 0;
        const m = re.exec(text.slice(p2, sn.end));
        if(!m) break;
        parts.push([p2 + m.index, p2 + m.index + m[0].length]); p2 = p2 + m.index + m[0].length;
      }
      if(parts.length < ks.length) break;
      out.push(mk(parts[0][0], parts[parts.length - 1][1], parts));
      pos = p2;
    }
  }
  return out;
}
/* Trạng thái từng cụm khoá (có xuất hiện trong đoạn văn hay không) để hiển thị */
function chunkStatus(text, word){
  return keyChunks(word).map(k => ({ label: k.label, ok: new RegExp(k.src, 'i').test(text || '') }));
}

/* ── Khởi tạo nội dung từng nhiệm vụ (chỉ 1 lần; giữ nguyên khi đổi chế độ) ── */
async function fetchExample(word){              // câu ví dụ từ Free Dictionary nếu từ chưa có câu
  try{
    const r = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word.toLowerCase().trim()));
    if(!r.ok) return '';
    const data = await r.json();
    for(const e of (Array.isArray(data) ? data : []))
      for(const m of (e.meanings || []))
        for(const d of (m.definitions || []))
          if(d.example && findTarget(d.example, word).length && d.example.split(/\s+/).length >= 4) return d.example.trim();
  }catch(e){}
  return '';
}
function contextParts(sentence, word){         // tách câu quanh MỌI lần xuất hiện của từ
  const ms = findTarget(sentence, word);
  if(!ms.length) return null;
  const parts = []; let pos = 0;
  ms.forEach(m => { parts.push(sentence.slice(pos, m.index)); pos = m.index + m[0].length; });
  parts.push(sentence.slice(pos));
  let ans = ms[0][0];
  if(ms[0].index === 0 && word[0] === word[0].toLowerCase()) ans = ans[0].toLowerCase() + ans.slice(1);
  return { parts, ans };
}
function initTask(k){
  const x = tasks.t[k];
  if(x.inited || k === 'focus') return x;
  const n = TASK_MODES[tasks.mode][k];
  let r;
  if(k === 'pron'){
    r = pickVocab(n, w => !hasPlaceholder(w), w => (w.sentence && findTarget(w.sentence, w.word).length ? 2 : 0) + (w.kind === 'đơn' ? 1 : 0));
    x.items = r.list.map(w => {
      const s = wordSnap(w);
      if(!findTarget(s.sentence, s.word).length) s.sentence = '';
      return Object.assign(s, { stage: 'word', wa: [], sa: [], skipW: false, skipS: false, noSent: false, done: false });
    });
  }else if(k === 'listen'){
    r = pickVocab(n, w => !hasPlaceholder(w), w => w.kind === 'đơn' ? 1 : 0);
    x.items = r.list.map(w => Object.assign(wordSnap(w), { tries: 0, revealed: false, done: false }));
  }else if(k === 'context'){
    const sents = new Set();
    r = pickVocab(n, w => {
      if(!w.sentence || !contextParts(w.sentence, w.word)) return false;
      const key = w.sentence.trim().toLowerCase();
      return !sents.has(key) && (sents.add(key), true);
    });
    x.items = r.list.map(w => { const c = contextParts(w.sentence, w.word);
      return { id: w.id, word: w.word.trim(), meaning: w.meaning || '', parts: c.parts, ans: c.ans }; });
    let order = shuffle(x.items.map((_, i) => i));
    if(order.length > 1 && order.every((v, i) => v === i)) order = order.slice(1).concat(order[0]);   // tránh trùng thứ tự câu
    x.order = order;
    x.slots = x.items.map(() => -1);
    x.res = x.items.map(() => 0);       // 0 chưa kiểm · 1 đúng (khoá) · 2 sai (cần sửa)
    x.checks = 0;
  }else if(k === 'write'){
    const per = WRITE_WORDS, paras = n;
    x.paras = []; let used = [];
    for(let p = 0; p < paras; p++){
      const list = pickVocab(per, () => true, null, { anyWord: true, exclude: used }).list;
      if(list.length < per)                          // sổ ít từ — bù bằng từ đã dùng ở đoạn trước (không trùng trong cùng đoạn)
        list.push(...pickVocab(per - list.length, () => true, null,
          { anyWord: true, exclude: list.map(w => w.word.trim().toLowerCase()) }).list);
      used = used.concat(list.map(w => w.word.trim().toLowerCase()));
      x.paras.push({ words: list.map(wordSnap), text: '', errors: [], issues: [], checks: 0, done: false, checkedText: '' });
    }
    x.short = x.paras.some(p => p.words.length < per) ? 1 : 0;
    x.target = x.paras.length;
    x.inited = x.paras.length > 0 && x.paras.every(p => p.words.length > 0);
    x.idx = 0;
    if(!x.inited){ x.paras = []; return x; }
    tasks.started = true; saveTasks();
    return x;
  }
  x.want = n; x.nNew = r.nNew; x.nFill = r.nFill;
  x.target = x.items.length; x.idx = 0;
  x.inited = x.items.length > 0;
  if(!x.inited){ x.items = []; return x; }
  tasks.started = true; saveTasks();
  return x;
}

/* Hoàn thành một nhiệm vụ → mở khoá nhiệm vụ sau, hiện màn chuyển tiếp */
function completeTask(k){
  const x = tasks.t[k];
  if(x.done) return;
  x.done = true; x.doneAt = now();
  recAbort();
  if(TASK_KEYS.every(q => tasks.t[q].done)){ finishDay(); return; }
  saveTasks();
  tkTrans = k; tkView = 'trans';
  chime('done');
  renderTasks();
}
function finishDay(){
  if(tasks.completedAt) return;
  tasks.completedAt = now();
  taskHist[tasks.date] = { mode: tasks.mode, doneAt: tasks.completedAt, sum: taskSummaryData() };
  const merges = gardenAddTaskFlower(tasks.date), added = !!merges;
  tasks.flowerAdded = added ? 1 : 0;
  saveTasks(true);
  tkView = 'done'; tkAnimDone = !tasks.celebrated;
  tasks.celebrated = true; saveTasks(true);
  chime('done');
  if(added){
    toast(t('tkFlowerToast', TASK_FLOWERS));
    merges.forEach((key, i) => setTimeout(() => toast(t(key)), 2400 * (i + 1)));
  }
  renderTasks();
}
function taskSummaryData(){
  const T = tasks.t;
  const pr = T.pron.items || [], ls = T.listen.items || [];
  const prScores = pr.flatMap(i => i.wa.length ? [Math.max(...i.wa)] : []);
  return {
    focusMin: Math.floor(focusTodaySec() / 60),
    pron: pr.length, pronAvg: prScores.length ? Math.round(prScores.reduce((a, b) => a + b, 0) / prScores.length) : 0,
    pronSkip: pr.filter(i => i.skipW || i.skipS).length,
    listen: ls.length, listenFirst: ls.filter(i => i.firstTry).length,
    context: (T.context.items || []).length, contextChecks: T.context.checks || 0,
    write: (T.write.paras || []).length, writeChecks: (T.write.paras || []).reduce((s, p) => s + (p.checks || 0), 0),
  };
}
function taskSummaryLine(k){
  const s = taskSummaryData();
  if(k === 'focus') return t('tkSumFocus', s.focusMin);
  if(k === 'pron') return t('tkSumPron', s.pron, s.pronAvg, s.pronSkip);
  if(k === 'listen') return t('tkSumListen', s.listen, s.listenFirst);
  if(k === 'context') return t('tkSumContext', s.context, s.contextChecks);
  if(k === 'write') return t('tkSumWrite', s.write, s.writeChecks);
  return '';
}

/* ═════════════ GHI ÂM + NHẬN DIỆN GIỌNG NÓI ═════════════
   - MediaRecorder: lưu bản ghi để nghe lại
   - SpeechRecognition (Chrome/Edge/Safari): nhận diện điều người dùng nói;
     điểm = độ khớp giữa kết quả nhận diện và từ/câu mục tiêu. Không có kết
     quả nhận diện hợp lệ → KHÔNG chấm điểm. */
const SRClass = window.SpeechRecognition || window.webkitSpeechRecognition || null;
/* Mặc định Chrome gửi âm thanh lên máy chủ Google để nhận diện (cần Internet, kể cả
   khi app chạy local). Chrome mới hỗ trợ nhận diện NGAY TRÊN MÁY: dùng khi có sẵn,
   hoặc cho tải gói tiếng Anh 1 lần. */
let srLocal = 'unknown';          // 'available' | 'downloadable' | 'downloading' | 'unavailable'
let srUseLocal = false;
async function srCheckLocal(){
  if(!SRClass) return (srLocal = 'unavailable');
  try{
    if(typeof SRClass.available === 'function') srLocal = await SRClass.available({ langs: ['en-US'], processLocally: true });
    else if(typeof SRClass.availableOnDevice === 'function') srLocal = await SRClass.availableOnDevice('en-US');
    else srLocal = 'unavailable';
  }catch(e){ srLocal = 'unavailable'; }
  if(srLocal === 'available') srUseLocal = true;
  return srLocal;
}
async function srInstallLocal(){
  try{
    srLocal = 'downloading';
    let ok = false;
    if(typeof SRClass.install === 'function') ok = await SRClass.install({ langs: ['en-US'], processLocally: true });
    else if(typeof SRClass.installOnDevice === 'function') ok = await SRClass.installOnDevice('en-US');
    await srCheckLocal();
    return ok || srLocal === 'available';
  }catch(e){ srLocal = 'unavailable'; return false; }
}
srCheckLocal();
let recCur = null;
function recAbort(){
  const r = recCur; if(!r) return;
  recCur = null; r.aborted = true;
  clearTimeout(r.timer); clearTimeout(r.quietT);
  try{ if(r.sr) r.sr.abort(); }catch(e){}
  try{ if(r.mr && r.mr.state !== 'inactive') r.mr.stop(); }catch(e){}
  if(r.stream) r.stream.getTracks().forEach(tr => tr.stop());
}
async function recStart(opts, onFinish){
  recAbort();
  const r = { alts: [], segs: [], chunks: [], error: '', srDone: !SRClass, mrDone: false, aborted: false };
  recCur = r;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ recCur = null; onFinish({ error: 'nomic', alts: [] }); return; }
  try{ r.stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch(e){
    if(recCur === r) recCur = null;
    onFinish({ error: e && (e.name === 'NotAllowedError' || e.name === 'SecurityError') ? 'denied' : 'nomic', alts: [] });
    return;
  }
  if(r.aborted){ r.stream.getTracks().forEach(tr => tr.stop()); return; }
  r.finish = () => {
    if(r.aborted || r.finished || !r.srDone || !r.mrDone) return;
    r.finished = true;
    if(recCur === r) recCur = null;
    clearTimeout(r.timer); clearTimeout(r.quietT);
    r.stream.getTracks().forEach(tr => tr.stop());
    const url = r.chunks.length ? URL.createObjectURL(new Blob(r.chunks, { type: (r.mr && r.mr.mimeType) || 'audio/webm' })) : '';
    let alts = r.alts;
    if(opts.sentence && r.segs.length > 1) alts = [{ t: r.segs.map(s => s.t).join(' '), c: Math.min(...r.segs.map(s => s.c || 0)) }];
    onFinish({ alts, url, error: r.error });
  };
  if(window.MediaRecorder){
    try{
      r.mr = new MediaRecorder(r.stream);
      r.mr.ondataavailable = e => { if(e.data && e.data.size) r.chunks.push(e.data); };
      r.mr.onstop = () => { r.mrDone = true; r.finish(); };
      r.mr.start();
    }catch(e){ r.mr = null; r.mrDone = true; }
  }else r.mrDone = true;
  if(SRClass){
    const sr = r.sr = new SRClass();
    sr.lang = 'en-US'; sr.maxAlternatives = 5;
    if(srUseLocal){                              // nhận diện trên máy — không gửi âm thanh đi đâu
      try{ sr.processLocally = true; }catch(e){}
      try{ if('mode' in sr) sr.mode = 'ondevice-only'; }catch(e){}
    }
    sr.continuous = !!opts.sentence; sr.interimResults = !!opts.sentence;
    sr.onresult = e => {
      if(opts.sentence){                       // câu: ghép các đoạn cuối, tự dừng sau ~2s im lặng
        r.segs = [];
        for(let i = 0; i < e.results.length; i++){
          const res = e.results[i];
          if(res.isFinal) r.segs.push({ t: res[0].transcript, c: res[0].confidence || 0 });
        }
        if(r.segs.length === 1){
          const res = [...e.results].find(x => x.isFinal);
          r.alts = [...res].map(a => ({ t: a.transcript, c: a.confidence || 0 }));
        }else if(r.segs.length) r.alts = [{ t: r.segs.map(s => s.t).join(' '), c: 0 }];
        clearTimeout(r.quietT);
        r.quietT = setTimeout(recStop, 2200);
      }else{
        const res = e.results[e.results.length - 1];
        r.alts = [...res].map(a => ({ t: a.transcript, c: a.confidence || 0 }));
      }
    };
    sr.onerror = e => {
      if(e.error === 'aborted') return;
      r.error = ({ 'no-speech': 'nospeech', 'not-allowed': 'denied', 'service-not-allowed': 'service',
                   network: 'network', 'audio-capture': 'nomic', 'language-not-supported': 'service' })[e.error] || 'service';
      if(srUseLocal && r.error === 'service'){ srUseLocal = false; srLocal = 'unavailable'; }   // gói trên máy lỗi → quay về máy chủ
    };
    sr.onend = () => {
      r.srDone = true;
      try{ if(r.mr && r.mr.state !== 'inactive') r.mr.stop(); else r.mrDone = true; }catch(e){ r.mrDone = true; }
      r.finish();
    };
    try{ sr.start(); }catch(e){ r.srDone = true; r.error = 'service'; }
  }
  r.timer = setTimeout(recStop, (opts.sentence ? 16 : 6) * 1000);
}
function recStop(){
  const r = recCur; if(!r || !r.finish) return;
  if(r.sr && !r.srDone){ try{ r.sr.stop(); }catch(e){ r.srDone = true; } }
  if(!r.sr || r.srDone){
    try{ if(r.mr && r.mr.state !== 'inactive') r.mr.stop(); else r.mrDone = true; }catch(e){ r.mrDone = true; }
  }
  r.finish();
}

/* ── Chấm điểm từ kết quả nhận diện ── */
const normSpeech = s => (s || '').toLowerCase().replace(/[’‘`]/g, "'").replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim();
function lev(a, b){
  const m = a.length, n = b.length;
  if(!m) return n; if(!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for(let i = 1; i <= m; i++){
    const cur = [i];
    for(let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
const simStr = (a, b) => (!a && !b) ? 1 : 1 - lev(a, b) / Math.max(a.length, b.length);
const confFactor = c => c > 0 ? 0.75 + 0.25 * c : 1;      // trình duyệt không trả độ tin cậy → không phạt
function scoreWord(target, alts){
  const tg = normSpeech(target).replace(/ /g, ''), nTok = normSpeech(target).split(' ').length;
  let best = { score: 0, heard: '', match: '' };
  alts.forEach((a, i) => {
    const toks = normSpeech(a.t).split(' ').filter(Boolean);
    const cands = [toks.join(' ')];
    for(let k = 0; k + nTok <= toks.length; k++) cands.push(toks.slice(k, k + nTok).join(' '));
    for(const c of cands){
      const s = simStr(c.replace(/ /g, ''), tg) * confFactor(a.c) * (1 - 0.04 * i);
      if(s > best.score) best = { score: s, heard: a.t.trim(), match: c.replace(/ /g, '') };
    }
  });
  return { score: Math.round(best.score * 100), heard: best.heard, diff: letterDiff(tg, best.match) };
}
function letterDiff(target, heard){              // đánh dấu chữ cái của từ mục tiêu không khớp
  const m = target.length, n = heard.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for(let i = m - 1; i >= 0; i--) for(let j = n - 1; j >= 0; j--)
    dp[i][j] = target[i] === heard[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ok = new Array(m).fill(false);
  let i = 0, j = 0;
  while(i < m && j < n){
    if(target[i] === heard[j]){ ok[i] = true; i++; j++; }
    else if(dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return ok;
}
function scoreSentence(target, alts){
  const tt = normSpeech(target).split(' ').filter(Boolean);
  let best = { score: 0, heard: '', marks: tt.map(() => 0) };
  alts.forEach((a, ai) => {
    const ht = normSpeech(a.t).split(' ').filter(Boolean);
    const m = tt.length, n = ht.length;
    const w = (x, y) => x === y ? 1 : simStr(x, y) >= 0.7 ? 0.5 : 0;
    const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
    for(let i = m - 1; i >= 0; i--) for(let j = n - 1; j >= 0; j--){
      const ww = w(tt[i], ht[j]);
      dp[i][j] = Math.max(dp[i + 1][j], dp[i][j + 1], ww ? dp[i + 1][j + 1] + ww : 0);
    }
    const marks = tt.map(() => 0);
    let i = 0, j = 0;
    while(i < m && j < n){
      const ww = w(tt[i], ht[j]);
      if(ww && dp[i][j] === dp[i + 1][j + 1] + ww){ marks[i] = ww; i++; j++; }
      else if(dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
    }
    const extra = Math.max(0, n - m) / Math.max(m, 1);          // nói thừa nhiều → trừ nhẹ
    const s = dp[0][0] / Math.max(m, 1) * confFactor(a.c) * (1 - 0.04 * ai) * (1 - Math.min(0.2, extra * 0.3));
    if(s > best.score) best = { score: s, heard: a.t.trim(), marks };
  });
  return { score: Math.round(best.score * 100), heard: best.heard, marks: best.marks, toks: tt };
}

/* Thông báo phụ gom vào nút "!" — nhấn để xem */
let tkInfos = [];
function tkInfo(msgs, align){          // align: '' (mở sang trái) | 'left' | 'center'
  msgs = (msgs || []).filter(Boolean);
  if(!msgs.length) return '';
  return `<span class="tk-info-wrap ${align || ''}"><button class="tk-info" data-tk="info" aria-expanded="false" title="${esc(t('tkInfoLbl'))}" aria-label="${esc(t('tkInfoLbl'))}">!</button>
    <span class="tk-info-pop" hidden>${msgs.map(m => `<span class="tk-info-li">${I('bulb')}<span>${m}</span></span>`).join('')}</span></span>`;
}
/* Nút "!" đặt ở góc dưới bên phải của khu vực; nếu góc đó đã có phần tử khác thì
   chuyển lên góc trên bên phải; cả hai góc đều vướng thì xuống một hàng riêng. */
const infoCorner = (msgs) => { const h = tkInfo(msgs); return h ? `<div class="info-corner">${h}</div>` : ''; };
function infoCornerHits(corner){
  const cr = corner.getBoundingClientRect(), pad = 4;
  const meets = r => r.width > 0 && r.height > 0 && r.left < cr.right + pad && r.right > cr.left - pad && r.top < cr.bottom + pad && r.bottom > cr.top - pad;
  const covers = r => r.left <= cr.left && r.right >= cr.right && r.top <= cr.top && r.bottom >= cr.bottom;
  const hasBox = el => {
    const cs = getComputedStyle(el);
    return ['Top','Right','Bottom','Left'].some(k => parseFloat(cs['border' + k + 'Width']) > 0)
      || !/^(transparent|rgba\(0, 0, 0, 0\))$/.test(cs.backgroundColor) || cs.backgroundImage !== 'none';
  };
  const walk = node => {
    for(const ch of node.children){
      if(ch === corner || ch.matches('.tk-fdeco, [aria-hidden="true"], script, style, [hidden]')) continue;
      const r = ch.getBoundingClientRect();
      if(!meets(r)) continue;
      const texts = [...ch.childNodes].filter(n => n.nodeType === 3 && n.textContent.trim());
      if(!ch.children.length && !texts.length) return true;     // ô nhập, icon, khối trống có hình
      for(const n of texts){                                    // so đúng vùng chữ thật, không phải cả khối
        const rg = document.createRange(); rg.selectNodeContents(n);
        if([...rg.getClientRects()].some(meets)) return true;
      }
      if(!covers(r) && hasBox(ch)) return true;                 // khung có viền/nền lấn vào góc (bảng, nút…)
      if(walk(ch)) return true;
    }
    return false;
  };
  return walk(corner.parentElement);
}
function layoutInfoCorners(){
  $$('.info-corner').forEach(c => {
    if(!c.firstElementChild || !c.offsetParent) return;
    c.parentElement.classList.add('has-info');
    c.classList.remove('at-top', 'inflow');
    if(!infoCornerHits(c)) return;                               // góc dưới bên phải còn trống
    c.classList.add('at-top');
    if(!infoCornerHits(c)) return;                               // góc trên bên phải còn trống
    c.classList.remove('at-top'); c.classList.add('inflow');
  });
}
let infoLayoutQueued = false;
function queueInfoLayout(){
  if(infoLayoutQueued) return;
  infoLayoutQueued = true;
  requestAnimationFrame(() => { infoLayoutQueued = false; layoutInfoCorners(); });
}
new MutationObserver(queueInfoLayout).observe(document.body, { childList: true, subtree: true });
window.addEventListener('resize', queueInfoLayout);
function closeTkInfos(except){
  $$('.tk-info-pop').forEach(p => {

/* Đặt bảng thông tin cạnh nút "!" nhưng luôn nằm trọn trong màn hình */
function placeInfoPop(b, pop){
  /* đưa bảng ra <body> để không bị khung cuộn / hiệu ứng của khối cha cắt mất */
  if(pop.parentElement !== document.body){ pop._home = pop.parentElement; b._pop = pop; pop._btn = b; document.body.appendChild(pop); }
  const r = b.getBoundingClientRect(), pw = Math.min(340, innerWidth - 16);
  Object.assign(pop.style, { position: 'fixed', width: pw + 'px', right: 'auto', transform: 'none' });
  let left = r.right - pw;
  if(left < 8) left = r.left;
  left = Math.max(8, Math.min(left, innerWidth - pw - 8));
  pop.style.left = left + 'px';
  const ph = pop.offsetHeight;
  let top = r.bottom + 8;
  if(top + ph > innerHeight - 8) top = Math.max(8, r.top - ph - 8);
  pop.style.top = top + 'px';
  infoScrollY = scrollY;
}
let infoScrollY = 0;                     // chỉ đóng khi người dùng cuộn trang thật sự
window.addEventListener('scroll', () => { if(Math.abs(scrollY - infoScrollY) > 40) closeTkInfos(); }, { passive: true });
window.addEventListener('resize', () => closeTkInfos());
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeTkInfos(); });

/* ── Khung chung của một nhiệm vụ: thanh bước + tiến độ tổng ── */
function tkFrame(k, body){
  const pct = tasksOverallPct();
  const steps = TASK_KEYS.map((q, i) => {
    const st = taskStatus(q);
    return `<button class="tk-step s-${st} ${q === k ? 'here' : ''}" data-tk="open" data-k="${q}" title="${esc((i + 1) + '. ' + tkName(q))}">
      ${st === 'done' ? I('check') : I(TASK_META[q].icon)}</button>`;
  }).join('<span class="tk-step-line"></span>');
  return `
    <div class="tk-top">
      <button class="btn ghost sm" data-tk="overview">${I('back')}${t('tkBack')}</button>
      <div class="tk-steps">${steps}</div>
      <span class="tk-top-n mono">${tasksDoneCount()}/5</span>
    </div>
    <div class="tk-progress thin"><div class="tk-progress-fill" style="width:${pct}%"></div></div>
    <div class="tk-head">
      <span class="tk-ico big" style="background:${TASK_META[k].color}">${I(TASK_META[k].icon)}</span>
      <div><div class="tk-eyebrow">${t('tkStepOf', TASK_KEYS.indexOf(k) + 1)}</div>
      <h2 class="tk-title sm">${tkName(k)}</h2>
      <div class="tk-sub">${t('tkGoal_' + k, focusGoalMin())}</div></div>
    </div>
    ${body}`;
}
function tkPoolNote(x){                          // ghi chú nguồn dữ liệu → vào nút "!"
  if(!x.inited) return '';
  if(x.nFill > 0) tkInfos.push(t('tkPoolFill', x.nNew, x.nFill));
  if(x.target < x.want) tkInfos.push(t('tkPoolShort', x.target, x.want));
  return '';
}
function tkEmpty(msgKey){
  return `<div class="panel"><div class="empty">${I('leaf')}<br>${t(msgKey)}</div>
    <div class="tk-actions"><button class="btn sky" data-tk="goNotes">${I('note')}${t('tkGoNotes')}</button></div></div>`;
}
function tkItemBar(done, total, unitKey){
  return `<div class="tk-itembar"><span class="tk-itembar-lbl">${t(unitKey, done, total)}</span>
    <span class="tk-mini"><span style="width:${total ? done / total * 100 : 0}%"></span></span></div>`;
}
function renderTkTask(area, k){
  if(k !== 'focus' && !tasks.t[k].done) initTask(k);
  const x = tasks.t[k];
  tkInfos = [];
  let body;
  if(x.done && k !== 'focus') body = `<div class="panel tk-review">${I('check')}<div><b>${t('tkTaskDoneTitle')}</b><br>${esc(taskSummaryLine(k))}</div>
      <div class="tk-actions">${nextTaskKey() ? `<button class="btn primary" data-tk="start">${t('tkNextTask')}${I('next')}</button>` : ''}</div></div>`;
  else if(k === 'focus') body = tkFocusBody();
  else if(k === 'pron') body = x.inited ? tkPronBody(x) : tkEmpty('tkEmptyVocab');
  else if(k === 'listen') body = x.inited ? tkListenBody(x) : tkEmpty('tkEmptyVocab');
  else if(k === 'context') body = x.inited ? tkContextBody(x) : tkEmpty('tkEmptyContext');
  else if(k === 'write') body = x.inited ? tkWriteBody(x) : tkEmpty('tkEmptyVocab');
  area.innerHTML = tkFrame(k, body);
  const panels = area.querySelectorAll(':scope > .panel');      // "!" ở góc dưới bên phải của khung nhiệm vụ
  if(tkInfos.length) (panels.length ? panels[panels.length - 1] : area).insertAdjacentHTML('beforeend', infoCorner(tkInfos));
  if(x.done) return;
  if(k === 'listen' && x.inited) afterListenRender(x);
  if(k === 'context' && x.inited) afterContextRender(x);
  if(k === 'write' && x.inited) afterWriteRender(x);
}

/* ── 1. Focus ── */
function tkFocusBody(){
  const sec = focusTodaySec(), m = Math.floor(sec / 60), done = tasks.t.focus.done;
  const left = Math.max(0, Math.ceil((focusGoalSec() - sec) / 60));
  const running = !!(focus && focus.running);
  if(!tasks.t.focus.done) tkInfos.push(t('tkFocusNeed', focusGoalMin()));
  tkInfos.push(t('tkFocusRule'));
  return `<div class="panel tk-focus ${done ? 'is-done' : ''}">
      <svg class="ic tk-fdeco big" aria-hidden="true"><use href="#i-flower"/></svg>
      ${tkFocusRing(true)}
      ${tkFocusSegs()}
      ${done
        ? `<div class="tk-alert good">${I('check')}<span>${t('tkFocusDone', m)}</span></div>`
        : `<div class="tk-focus-stats"><span><b>${m}</b> ${t('tkFocusDoneMin')}</span><span><b>${left}</b> ${t('tkFocusLeftMin')}</span></div>

}

/* ── 2. Phát âm ── */
let pr = null;      // trạng thái tạm (không lưu): { phase, url, result, err }
const prFresh = () => ({ phase: 'idle', url: '', result: null, err: '', busy: false });
function tkPronBody(x){
  if(!pr) pr = prFresh();
  const doneN = x.items.filter(i => i.done).length;
  if(x.idx >= x.items.length || x.items[x.idx].done) x.idx = Math.max(0, x.items.findIndex(i => !i.done));
  const it = x.items[x.idx];
  const sent = it.stage === 'sent';
  const tries = sent ? it.sa : it.wa;
  const pass = sent ? PRON_SENT_PASS : PRON_WORD_PASS;
  const fails = tries.filter(s => s <= pass).length;
  const canSkip = fails >= PRON_SKIP_AFTER || ['unsupported','denied','nomic','service','network','installFail'].includes(pr.err) || !SRClass;
  let target;
  if(sent){
    const ms = findTarget(it.sentence, it.word);
    let html = '', pos = 0;
    ms.forEach(m => { html += esc(it.sentence.slice(pos, m.index)) + '<mark>' + esc(m[0]) + '</mark>'; pos = m.index + m[0].length; });
    html += esc(it.sentence.slice(pos));
    target = `<div class="tk-pr-sent">${html}</div>`;
  }else{
    target = `<div class="tk-pr-word">${esc(it.word)}</div>
      ${it.ipa ? `<div class="tk-pr-ipa mono">${esc(it.ipa)}</div>` : ''}
      <div class="tk-pr-mean">${esc(it.meaning)}${it.pos ? ` · <span class="pos-tag">${esc(it.pos)}</span>` : ''}</div>`;
  }
  const r = pr.result;
  let result = '';
  if(pr.phase === 'loadingSent') result = `<div class="tk-loading"><span class="tk-spin"></span>${t('tkPrFindingSent')}</div>`;
  else if(pr.phase === 'analyzing') result = `<div class="tk-loading"><span class="tk-spin"></span>${t('tkPrAnalyzing')}</div>`;
  else if(pr.phase === 'installing') result = `<div class="tk-loading"><span class="tk-spin"></span>${t('tkPrInstalling')}</div>`;
  else if(pr.err === 'switchedLocal') result = `<div class="tk-alert good">${I('check')}<span>${t('tkPrSwitchedLocal')}</span></div>`;
  else if(pr.err) result = `<div class="tk-alert ${pr.err === 'nospeech' ? 'warn' : 'bad'}">${I('x')}<span>${t('tkPrErr_' + pr.err)}${
      (pr.err === 'network' || pr.err === 'service') && navigator.brave ? ' ' + t('tkPrBrave') : ''}</span></div>
    ${(pr.err === 'network' || pr.err === 'service') && srLocal === 'downloadable'
      ? `<div class="tk-actions" style="margin-top:0"><button class="btn sky sm" data-tk="prInstall">${I('in')}${t('tkPrInstall')}</button></div>` : ''}`;
  else if(r){
    const ok = r.score > pass;
    let fbk = '';
    if(!sent && r.diff){
      const tg = normSpeech(it.word).replace(/ /g, '');
      const bad = r.diff.some(v => !v);
      fbk = bad ? `<div class="tk-pr-diff">${t('tkPrFocusOn')} <span class="mono">${[...tg].map((ch, i) => r.diff[i] ? esc(ch) : `<b>${esc(ch)}</b>`).join('')}</span></div>` : '';
    }else if(sent && r.marks){
      const miss = r.toks.filter((w, i) => r.marks[i] < 1);
      fbk = miss.length ? `<div class="tk-pr-diff">${t('tkPrWeakWords')} <span class="tk-pr-toks">${r.toks.map((w, i) =>
        `<span class="${r.marks[i] === 1 ? 'ok' : r.marks[i] ? 'part' : 'miss'}">${esc(w)}</span>`).join(' ')}</span></div>` : '';
    }
    result = `<div class="tk-score ${ok ? 'ok' : 'bad'}">
        <div class="tk-score-num" style="--p:${r.score}"><span>${r.score}</span></div>
        <div class="tk-score-txt"><b>${ok ? t('tkPrPass') : t('tkPrFail', pass)}</b>
          <div class="tk-heard">${t('tkPrHeard')} <span class="mono">“${esc(r.heard || '—')}”</span></div>
          ${fbk}${ok ? '' : `<div class="tk-tip">${t(sent ? 'tkPrTipSent' : 'tkPrTipWord')}</div>`}</div>
      </div>`;
  }
  const recOn = pr.phase === 'recording';
  return `
    ${tkItemBar(doneN, x.items.length, 'tkUnitProg_pron')}
    ${tkPoolNote(x)}${(tkInfos.push(t('tkPrEngine'), t(srUseLocal ? 'tkPrModeLocal' : 'tkPrModeCloud')), '')}
    ${!SRClass ? `<div class="tk-alert bad">${I('x')}<span>${t('tkPrErr_unsupported')}</span></div>` : ''}
    <div class="panel tk-pr">
      <div class="tk-pr-stage">
        <span class="tk-chip ${sent ? '' : 'on'}">1 · ${t('tkPrStageWord')}</span>
        <span class="tk-chip ${sent ? 'on' : ''}">2 · ${t('tkPrStageSent')}</span>
      </div>
      <div class="tk-pr-target">${target}</div>
      <div class="tk-pr-ctrl">
        <button class="tk-mic ${recOn ? 'rec' : ''}" data-tk="${recOn ? 'prStop' : 'prRec'}" ${pr.phase === 'analyzing' || pr.phase === 'loadingSent' || pr.busy ? 'disabled' : ''}
          aria-label="${recOn ? t('tkPrStop') : t('tkPrRecord')}">${recOn ? I('stop') : I('mic')}</button>
        <div class="tk-mic-lbl">${recOn ? t('tkPrListening') : t(sent ? 'tkPrHintSent' : 'tkPrHintWord')}</div>
      </div>
      <div class="tk-actions">
        <button class="btn sky sm" data-tk="prSample" ${recOn ? 'disabled' : ''}>${I('sound')}${t('tkPrSample')}</button>
        <button class="btn lav sm" data-tk="prPlay" ${pr.url ? '' : 'disabled'}>${I('play')}${t('tkPrPlayback')}</button>
        ${canSkip && pr.phase !== 'recording' ? `<button class="btn ghost sm" data-tk="prSkip">${I('skip')}${t('tkPrSkip')}</button>` : ''}
      </div>
      <div class="tk-pr-result">${result}</div>
      ${tries.length ? `<div class="tk-tries">${t('tkPrTries')} ${tries.map(s => `<span class="tk-try ${s > pass ? 'ok' : ''}">${s}</span>`).join('')}</div>` : ''}
    </div>`;
}
function pronItem(){ const x = tasks.t.pron; return x.items[x.idx]; }
function pronRecord(){
  const it = pronItem(); if(!it || pr.phase === 'recording') return;
  stopSpeech();
  if(pr.url){ URL.revokeObjectURL(pr.url); pr.url = ''; }
  pr.phase = 'recording'; pr.result = null; pr.err = '';
  renderTasks();
  const sent = it.stage === 'sent';
  recStart({ sentence: sent }, res => {
    if(tkView !== 'pron' || pronItem() !== it) return;
    pr.url = res.url || '';
    if(!SRClass){ pr.phase = 'idle'; pr.err = 'unsupported'; renderTasks(); return; }
    if(!res.alts || !res.alts.length){
      pr.phase = 'idle'; pr.err = res.error || 'nospeech';
      if(pr.err === 'network' || pr.err === 'service'){
        srCheckLocal().then(st => {
          if(tkView !== 'pron') return;
          if(st === 'available' && !srUseLocal){ srUseLocal = true; pr.err = 'switchedLocal'; }
          renderTasks();
        });
        return;
      }
      renderTasks(); return;
    }
    pr.phase = 'analyzing'; renderTasks();
    const r = sent ? scoreSentence(it.sentence, res.alts)
      : (/\s/.test(it.word.trim()) ? scoreSentence(it.word, res.alts) : scoreWord(it.word, res.alts));
    (sent ? it.sa : it.wa).push(r.score);
    saveTasks();
    pr.phase = 'idle'; pr.result = r; pr.err = '';
    const ok = r.score > (sent ? PRON_SENT_PASS : PRON_WORD_PASS);
    if(ok){ pr.busy = true; setTimeout(() => { if(pronItem() === it) pronAdvance(it, false); }, sent ? 1500 : 1200); }
    renderTasks();
  });
}
async function pronAdvance(it, skipped){
  const x = tasks.t.pron;
  pr = prFresh();
  if(it.stage === 'word'){
    if(skipped) it.skipW = true;
    if(!it.sentence && !it.noSent){                   // từ chưa có câu ví dụ → thử tra từ điển
      pr.phase = 'loadingSent'; renderTasks();
      const ex = await fetchExample(it.word);
      if(tkView !== 'pron' || pronItem() !== it) return;
      pr = prFresh();
      if(ex) it.sentence = ex; else it.noSent = true;
    }
    if(it.sentence){ it.stage = 'sent'; saveTasks(); renderTasks(); return; }
  }else if(skipped) it.skipS = true;
  it.done = true; it.stage = 'done';
  const next = x.items.findIndex(i => !i.done);
  saveTasks();
  if(next < 0){ completeTask('pron'); return; }
  x.idx = next; saveTasks();
  if(it.noSent) toast(t('tkPrNoSent', it.word));
  renderTasks();
}

/* ── 3. Nghe & viết lại ── */
let lsAutoplayed = '';
const normAns = s => (s || '').toLowerCase().replace(/[’‘`]/g, "'").replace(/\s+/g, ' ').trim().replace(/[.!?]+$/, '');
function tkListenBody(x){
  if(x.idx >= x.items.length || x.items[x.idx].done) x.idx = Math.max(0, x.items.findIndex(i => !i.done));
  const it = x.items[x.idx], doneN = x.items.filter(i => i.done).length, hint = it.hint || 0;
  tkPoolNote(x);
  tkInfos.push(t('tkLsInfo'));
  let hints = '';
  if(hint >= 1 && !it.revealed) hints += `<div class="tk-hint">${I('bulb')}<span>${/\s/.test(it.word.trim())
    ? t('qHintFirstWord', esc(it.word.trim().split(/\s+/)[0])) : t('qHintStart', esc(it.word.trim()[0]), it.word.replace(/ /g, '').length)}</span></div>`;
  if(hint >= 2 && !it.revealed){
    const full = it.word.trim();
    hints += `<div class="tk-hint">${I('bulb')}<span>${t('qHintHalf', esc(full.slice(0, Math.ceil(full.length / 2))), full.length)}</span></div>`;
  }
  const answer = it.revealed ? `<div class="tk-ls-answer">
      <div class="tk-eyebrow">${I('target')}${t('tkLsAnswerIs')}</div>
      <div class="tk-ls-ans-w mono">${esc(it.word)}</div>
      ${it.ipa ? `<div class="tk-pr-ipa mono">${esc(it.ipa)}</div>` : ''}
      <div class="tk-pr-mean">${esc(it.meaning)}</div>
    </div>` : '';
  return `
    ${tkItemBar(doneN, x.items.length, 'tkUnitProg_listen')}
    <div class="panel tk-ls">
      <button class="tk-play" data-tk="lsPlay" aria-label="${t('tkLsPlay')}" title="${t('tkLsReplay')}">${I('sound')}</button>
      <div class="tk-mic-lbl">${t(it.revealed ? 'tkLsTypeAgainLbl' : 'tkLsInstr')}</div>
      ${answer}
      <div class="tk-ls-form">
        <input id="lsInput" class="phrase-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(t(it.revealed ? 'tkLsTypeAgain' : 'tkLsPh'))}">
        <div class="tk-actions">
          <button class="btn primary" data-tk="lsCheck">${I('check')}${t('tkCheck')}</button>
          <button class="btn lemon" data-tk="lsHint" ${hint >= 2 || it.revealed ? 'disabled' : ''}>${I('bulb')}${t('qHintBtn')}${hint ? ` (${hint}/2)` : ''}</button>
          <button class="btn ghost" data-tk="lsDontKnow" ${it.revealed ? 'disabled' : ''}>${I('x')}${t('tkLsDontKnow')}</button>
        </div>
      </div>
      <div class="feedback" id="lsFb"></div>
      ${hints}
      ${it.tries ? `<div class="tk-tries">${t('tkLsWrongN', it.tries)}</div>` : ''}
    </div>`;
}
let lsDraft = '';
function afterListenRender(x){
  const it = x.items[x.idx];
  const inp = $('#lsInput');
  if(inp){
    inp.value = lsDraft; lsDraft = '';
    inp.focus();
    inp.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); listenCheck(); } });
  }
  const key = tasks.date + it.id + x.idx;
  if(lsAutoplayed !== key){ lsAutoplayed = key; setTimeout(() => { if(tkView === 'listen') tkSpeak(it); }, 350); }
}
function listenHint(){
  const x = tasks.t.listen, it = x.items[x.idx]; if(!it || it.done || it.revealed) return;
  it.hint = Math.min(2, (it.hint || 0) + 1); saveTasks();
  lsDraft = ($('#lsInput') || {}).value || '';
  renderTasks();
}
function listenDontKnow(){
  const x = tasks.t.listen, it = x.items[x.idx]; if(!it || it.done || it.revealed) return;
  it.revealed = true; saveTasks();
  lsDraft = '';
  renderTasks();
  tkSpeak(it);
}
function listenCheck(){
  const x = tasks.t.listen, it = x.items[x.idx], inp = $('#lsInput'), fb = $('#lsFb');
  if(!it || !inp || it.done) return;
  const v = normAns(inp.value);
  if(!v){ toast(t('tkLsEmpty')); inp.focus(); return; }
  if(v === normAns(it.word)){
    if(!it.tries && !it.revealed && !it.hint) it.firstTry = true;
    it.done = true; saveTasks();
    fb.className = 'feedback show good';
    fb.innerHTML = `${I('check')} ${t('tkLsCorrect')} <span class="ans">${esc(it.word)}</span> — ${esc(it.meaning)}`;
    inp.disabled = true;
    setTimeout(() => {
      if(tkView !== 'listen') return;
      const next = x.items.findIndex(i => !i.done);
      if(next < 0){ completeTask('listen'); return; }
      x.idx = next; saveTasks(); renderTasks();
    }, 1100);
  }else{
    it.tries++; saveTasks();
    lsDraft = inp.value;
    renderTasks();
    const fb2 = $('#lsFb'), inp2 = $('#lsInput');
    inp2.select();
    fb2.className = 'feedback show bad';
    fb2.innerHTML = `${I('x')} ${t('tkLsWrong')}`;
  }
}

/* ── 4. Điền từ vào câu: chạm chỗ trống để chọn từ hoặc gõ trực tiếp ── */
let ctxSel = -1;     // từ đang được chọn trong ngân hàng (chạm/nhấp)
let ctxPop = -1;     // chỗ trống đang mở bảng chọn/gõ
function tkContextBody(x){
  const n = x.items.length;
  const placed = new Set(x.slots.filter(v => v >= 0));
  const okN = x.res.filter(r => r === 1).length;
  const allFilled = x.slots.every(v => v >= 0), wrongPending = x.res.some(r => r === 2);
  if(ctxPop >= 0 && (ctxPop >= n || x.res[ctxPop] === 1)) ctxPop = -1;
  tkPoolNote(x);
  tkInfos.push(t('tkCtxInstr'), t('tkCtxPopHint'));
  const chip = (bi, where, slot) => {
    const locked = where === 'slot' && x.res[slot] === 1;
    return `<span class="tk-wchip ${ctxSel === bi && where === 'bank' ? 'sel' : ''} ${locked ? 'locked' : ''}"
      ${locked ? '' : `draggable="true" data-tk="ctxChip"`} data-b="${bi}" ${where === 'slot' ? `data-from="${slot}"` : ''}>${esc(x.items[bi].ans)}</span>`;
  };
  const bank = x.order.filter(bi => !placed.has(bi));
  const rows = x.items.map((it, i) => {
    const v = x.slots[i], r = x.res[i], open = ctxPop === i;
    const slot = `<span class="tk-slot ${v >= 0 ? 'filled' : ''} ${r === 1 ? 'ok' : r === 2 ? 'bad' : ''} ${ctxSel >= 0 && r !== 1 ? 'target' : ''} ${open ? 'open' : ''}"
      data-tk="ctxSlot" data-s="${i}" ${r === 1 ? '' : `title="${esc(t('tkCtxSlotTitle'))}"`}>${v >= 0 ? chip(v, 'slot', i) : `<span class="tk-slot-ph">${I('plus')}</span>`}</span>`;
    const body = it.parts.map((p, j) => esc(p) + (j < it.parts.length - 1 ? (j === 0 ? slot : '<span class="tk-ghost">····</span>') : '')).join('');
    const pop = open ? `<div class="tk-pop" data-s="${i}">
        <input class="tk-pop-in" id="ctxPopIn" placeholder="${esc(t('tkCtxPickPh'))}" autocomplete="off" autocapitalize="off" spellcheck="false">
        <div class="tk-pop-list">${bank.length ? bank.map(bi => `<button class="tk-pop-opt" data-tk="ctxPick" data-b="${bi}" data-s="${i}" data-w="${esc(x.items[bi].ans.toLowerCase())}">${esc(x.items[bi].ans)}</button>`).join('')
          : `<span class="tk-note" style="margin:0">${t('tkCtxBankEmpty')}</span>`}</div>

    const r = await fetch('https://api.languagetool.org/v2/check', { method: 'POST', signal: ac.signal,
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ text, language: 'en-US' }) });
    clearTimeout(tm);
    if(!r.ok) return [];
    return ((await r.json()).matches || []).slice(0, 40);
  }catch(e){ return []; }
}
/* Gom lỗi LanguageTool theo câu (bỏ lỗi đè lên từ mục tiêu): [{ off (trong câu), len, frag, sug, msg, type }] */
function aiLtBySentence(matches, text, sents, targets){
  const tr = [];
  targets.forEach(w => findUse(text, w).forEach(m => tr.push(...m.parts)));
  const starts = []; let from = 0;
  sents.forEach(sx => { const k = text.indexOf(sx, from); starts.push(k); from = k >= 0 ? k + sx.length : from; });
  const out = sents.map(() => []);
  for(const m of matches){
    const ty = ltType(m);
    if(!ty || tr.some(([a, b]) => a < m.offset + m.length && m.offset < b)) continue;
    const i = starts.findIndex((st, k) => st >= 0 && m.offset >= st && m.offset + m.length <= st + sents[k].length); if(i < 0) continue;
    out[i].push({ off: m.offset - starts[i], len: m.length, frag: text.substr(m.offset, m.length),
      sug: ((m.replacements || [])[0] || {}).value || '', msg: (m.message || '').slice(0, 90), spell: ty === 'spelling',
      type: ty === 'spelling' ? 'word_form' : ty === 'usage' ? 'word_choice' : 'grammar' });
  }
  return out;
}
const aiLtHintText = list => list.map(x => `"${x.frag}"${x.sug ? ' → "' + x.sug + '"' : ''} — ${x.msg.slice(0, 70)}`).join('; ');
/* Dự phòng không cần AI: áp gợi ý đầu tiên của LanguageTool vào câu */
function aiLtFix(sx, list){
  let out = sx;
  [...list].filter(x => x.sug).sort((a, b) => b.off - a.off).forEach(x => { out = out.slice(0, x.off) + x.sug + out.slice(x.off + x.len); });
  return { problems: list.map(x => ({ quote: x.frag, type: x.type, tip: x.msg })), better: out, alt: '' };
}
/* Đọc JSON kể cả khi bị cắt giữa chừng: giữ lại các câu đã trả lời trọn vẹn */
function aiParseItems(raw){
  const j = aiParseJson(raw);
  if(j && Array.isArray(j.items)) return j.items;
  const str = String(raw || '');
  let k = str.lastIndexOf('}'), n = 0;
  while(k > 0 && n++ < 300){
    try{ const j2 = JSON.parse(str.slice(0, k + 1) + ']}'); if(Array.isArray(j2.items)) return j2.items; }catch(e){}
    k = str.lastIndexOf('}', k - 1);
  }
  return [];
}
/* Một lượt hỏi AI cho danh sách câu [{ i, s, hint }] → Map(i → câu trả lời). Hết giờ tính theo
   lúc AI "im lặng" (45 giây không ra chữ), không tính tổng thời gian. */
async function aiJsonOnce(lv, list, targets, monitor, onCount, fresh){
  if(fresh) delete aiBases['json-' + lv];
  const schema = aiSchema(lv), ses = await aiSession('json-' + lv, monitor);
  const q = list.map((x, k) => (k + 1) + '. ' + aiMark(x.s, targets) + (x.hint ? '\n   checker: ' + x.hint : '')).join('\n');
  const ac = new AbortController();
  let timer = null, raw = '', err = null;
  const kick = () => { clearTimeout(timer); timer = setTimeout(() => ac.abort(), 45000); };
  try{
    if(ses.measureInputUsage && ses.inputQuota){
      const need = await ses.measureInputUsage(q, { responseConstraint: schema });
      if(need > ses.inputQuota - (ses.inputUsage || 0)){ const e = new Error('quota'); e.name = 'QuotaExceededError'; throw e; }
    }
    kick();
    if(ses.promptStreaming){
      for await (const ch of ses.promptStreaming(q, { responseConstraint: schema, signal: ac.signal })){
        kick();
        raw = raw && ch.startsWith(raw) ? ch : raw + ch;
        if(onCount) onCount((raw.match(/"better"\s*:/g) || []).length);
      }
    }else raw = await ses.prompt(q, { responseConstraint: schema, signal: ac.signal });
  }catch(e){ err = e; }
  finally{ clearTimeout(timer); try{ ses.destroy(); }catch(e){} }
  /* Ghép câu trả lời với đúng câu gốc theo độ giống nhau (AI hay lệch số thứ tự / gộp 2 câu) —
     câu trả lời nào gộp nhiều câu hoặc không giống câu gốc nào thì bỏ, để hỏi lại riêng câu đó. */
  const got = new Map(), taken = new Set();
  aiParseItems(raw).forEach((it, k) => {
    if(!it || typeof it !== 'object' || !aiClean(it.better)) return;
    const better = aiClean(it.better);
    const n0 = Number.isInteger(it.n) && it.n >= 1 && it.n <= list.length ? it.n - 1 : k;
    let best = -1, bs = 0;
    list.forEach((x, j) => { if(taken.has(j)) return;
      const sc = aiSim(x.s, better) + (j === n0 ? 0.05 : 0); if(sc > bs){ bs = sc; best = j; } });
    if(best < 0 || bs < 0.5) return;
    if(aiSentN(better) > aiSentN(list[best].s)) return;
    taken.add(best);
    it.problems = asArr(it.problems).filter(q => q && (!aiClean(q.quote) || list[best].s.toLowerCase().includes(aiClean(q.quote).toLowerCase())));
    got.set(list[best].i, it);
  });
  if(!got.size && err) throw err;
  if(!got.size) throw new Error('bad');
  return got;
}
async function aiStyleRun(text, targets, onProg, onPartial){
  const st = await aiStatus();
  if(!st) throw new Error('unsupported');
  const sents = splitSentences(text).map(x => x.text.trim()).filter(x => /[A-Za-z]/.test(x));
  if(!sents.length) throw new Error('bad');
  const monitor = m => m.addEventListener('downloadprogress', e => onProg && onProg(e.loaded));
  const ac = new AbortController();
  let timer = null;
  const arm = () => { timer = setTimeout(() => ac.abort(), 90000); };    // giới hạn phần trả lời (không tính lúc tải mô hình)
  const input = sents.map((x, i) => (i + 1) + '. ' + aiMark(x, targets)).join('\n');
  let raw = '';
  if(st.kind === 'lm'){
    /* Luôn cố trả lời: cả đoạn → thử lại với phiên mới → từng câu một → mức Bình thường (ngắn hơn)
       → câu nào AI vẫn bỏ dở thì dùng sửa lỗi của LanguageTool. */
    const lv = AI_LEVEL;
    const [, matches] = await Promise.all([aiBase('json-' + lv, monitor).catch(() => {}), aiLtMatches(text)]);
    const lt = aiLtBySentence(matches, text, sents, targets);
    /* Chính tả: sửa ngay bằng gợi ý của LanguageTool (không chờ AI), phần còn lại làm gợi ý cho AI */
    const spell = lt.map(list => list.filter(x => x.type === 'word_form' && x.sug && x.spell));
    const pre = sents.map((sx, i) => spell[i].length ? aiLtFix(sx, spell[i]).better : sx);
    const all = sents.map((sx, i) => ({ i, s: pre[i], hint: aiLtHintText(lt[i].filter(x => !spell[i].includes(x))) }));
    const got = new Map(), lvOf = new Map();
    let lastErr = null;
    const report = extra => onPartial && onPartial(Math.min(sents.length, got.size + (extra || 0)), sents.length);
    const t0 = performance.now(), BUDGET = 60000;        // tổng thời gian thử lại tối đa ~1 phút
    const run = async (level, list, fresh) => {
      if(got.size && performance.now() - t0 > BUDGET) return;
      try{
        const m = await aiJsonOnce(level, list, targets, monitor, c => report(Math.min(c, list.length)), fresh);
        m.forEach((v, k) => { if(!got.has(k)){ got.set(k, v); lvOf.set(k, level); } });
      }catch(e){ lastErr = e; }
      report();
    };
    const missing = () => all.filter(x => !got.has(x.i));
    await run(lv, all, false);
    if(missing().length === all.length && !(lastErr && lastErr.name === 'QuotaExceededError')) await run(lv, all, true);
    for(const x of missing()){ await run(lv, [x], false); if(!got.has(x.i)) await run(lv, [x], true); }
    const noAi = missing().map(x => x.i);
    noAi.forEach(i => { if(lt[i].length){ got.set(i, aiLtFix(sents[i], lt[i])); lvOf.set(i, 'lt'); } });
    /* gộp lỗi chính tả (đã sửa sẵn) vào danh sách lỗi của câu */
    got.forEach((it, i) => { if(lvOf.get(i) !== 'lt' && spell[i].length)
      it.problems = [...spell[i].map(x => ({ quote: x.frag, type: 'spelling', tip: '→ ' + x.sug })), ...asArr(it.problems)]; });
    if(!got.size) throw lastErr || new Error('bad');
    const items = sents.map((sx, i) => {
      const it = got.get(i) || {};
      let better = aiClean(it.better) || sx, kept = false;
      if(targets.some(w => findUse(sx, w).length && !findUse(better, w).length)){ kept = aiNorm(better) !== aiNorm(sx); better = sx; }
      const changed = aiNorm(better) !== aiNorm(sx);
      const issues = !changed ? [] : asArr(it.problems).filter(q2 => q2 && q2.tip).slice(0, 8).map(q2 => ({
        quote: aiClean(q2.quote), type: AI_ISSUE_TYPES.includes(q2.type) ? q2.type : 'grammar', tip: String(q2.tip).trim() }));
      const alt = '';
      return { s: sx, better, changed, kept, issues, alt, link: changed ? aiLinkOf(sx, better) : '',
        via: lvOf.get(i) === 'lt' ? 'lt' : !got.has(i) ? 'none' : '' };
    });
    return { kind: 'lm', level: lv, items, fixed: items.map(x => x.better).join(' '),
      noAi: items.filter(x => x.via).length };
  }
  try{
    {
      const rw = await Rewriter.create({ tone: 'as-is', length: 'as-is', format: 'plain-text', expectedInputLanguages: ['en'], outputLanguage: 'en',
        monitor, sharedContext: 'Numbered sentences of one paragraph by a Vietnamese learner. Rewrite each line as a fluent native speaker would, '
          + 'fixing all mistakes and literal phrasing and linking the ideas smoothly. Keep the numbering and the meaning. '
          + 'Text inside « » must be copied exactly, keeping the « » marks.' });
      arm();
      try{ raw = await rw.rewrite(input, { signal: ac.signal }); }
      finally{ try{ rw.destroy(); }catch(e){} }
    }
  }finally{ clearTimeout(timer); }
  const lines = aiParseLines(raw, sents.length);
  if(!lines){                                      // AI gộp/tách câu → chỉ hiện cả đoạn
    const whole = aiClean(String(raw).replace(/^\s*\d+[.)]\s*/gm, '').replace(/\n+/g, ' '));
    if(!whole) throw new Error('bad');
    const lost = targets.filter(w => findUse(text, w).length && !findUse(whole, w).length);
    return { kind: st.kind, items: [], fixed: whole, lost };
  }
  const items = sents.map((sx, i) => {
    let better = aiClean(lines[i]) || sx, kept = false;
    if(targets.some(w => findUse(sx, w).length && !findUse(better, w).length)){ better = sx; kept = aiNorm(lines[i]) !== aiNorm(sx); }
    const changed = aiNorm(better) !== aiNorm(sx);
    return { s: sx, better, changed, kept, issues: [], link: changed ? aiLinkOf(sx, better) : '' };
  });
  return { kind: st.kind, items, fixed: items.map(x => x.better).join(' '), explaining: st.kind === 'lm' && items.some(x => x.changed) };
}
/* Bước 2: giải thích lỗi cho các câu đã đổi (chạy sau, không chặn việc hiện bản sửa) */
const aiExplainSet = new WeakSet();
const aiExplainBusy = r => aiExplainSet.has(r);
async function aiExplain(r){
  aiExplainSet.add(r);
  try{ return await aiExplainRun(r); }finally{ aiExplainSet.delete(r); }
}
async function aiExplainRun(r){
  const ch = asArr(r.items).map((x, i) => [x, i]).filter(([x]) => x.changed);
  if(!ch.length){ r.explaining = false; return; }
  const ses = await aiSession('exp');
  const ac = new AbortController(), timer = setTimeout(() => ac.abort(), 90000);
  try{
    const raw = await ses.prompt(ch.map(([x], k) => `${k + 1}. ORIGINAL: ${x.s}\n   REWRITTEN: ${x.better}`).join('\n'),
      { responseConstraint: AI_EXP_SCHEMA, signal: ac.signal });
    const j = aiParseJson(raw), byN = new Map(asArr(j && j.items).filter(Boolean).map((y, k) => [Number.isInteger(y.n) ? y.n : k + 1, y]));
    ch.forEach(([x], k) => {
      x.issues = asArr((byN.get(k + 1) || {}).issues).filter(q => q && q.tip && (!aiClean(q.quote) || x.s.toLowerCase().includes(aiClean(q.quote).toLowerCase()))).slice(0, 3).map(q => ({
        quote: aiClean(q.quote), type: AI_ISSUE_TYPES.includes(q.type) ? q.type : 'grammar', tip: String(q.tip).trim() }));
    });
  }finally{ clearTimeout(timer); r.explaining = false; try{ ses.destroy(); }catch(e){} }
}
/* So sánh theo từ: phần thêm <ins>, phần bỏ <del> */
function aiDiffHtml(a, b){
  const A = a.split(/(\s+)/).filter(Boolean), B = b.split(/(\s+)/).filter(Boolean);
  if(A.length * B.length > 400000) return esc(b);
  const n = A.length, m = B.length, L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for(let i = n - 1; i >= 0; i--) for(let j = m - 1; j >= 0; j--)
    L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const ops = [];                               // [loại, chữ]: '=' giữ · '-' bỏ · '+' thêm
  let i = 0, j = 0;
  while(i < n || j < m){
    if(i < n && j < m && A[i] === B[j]){ ops.push(['=', B[j]]); i++; j++; }
    else if(j < m && (i >= n || L[i][j + 1] >= L[i + 1][j])) ops.push(['+', B[j++]]);
    else ops.push(['-', A[i++]]);
  }
  /* Gom các thay đổi liền nhau (kể cả khoảng trắng giữa chúng) thành một cụm bỏ + một cụm thêm */
  let html = '', del = '', ins = '', pend = '';
  const flush = () => {
    if(del.trim()) html += `<del>${esc(del.trim())}</del>` + (ins.trim() ? ' ' : '');
    if(ins.trim()) html += `<ins>${esc(ins.trim())}</ins>`;
    del = ins = '';
  };
  for(const [k, w] of ops){
    const sp = /^\s+$/.test(w);
    if(k === '=' && sp && (del || ins)){ pend += w; continue; }
    if(k === '='){ if((del.trim() || ins.trim()) && !pend) pend = ' '; flush(); html += esc(pend) + esc(w); pend = ''; continue; }
    if(sp) continue;
    if(pend){ del += del ? ' ' : ''; ins += ins ? ' ' : ''; pend = ''; }
    if(k === '-') del += (del && !del.endsWith(' ') ? ' ' : '') + w;
    else ins += (ins && !ins.endsWith(' ') ? ' ' : '') + w;
  }
  flush(); html += esc(pend);
  return html;
}
/* Sửa văn phong — AI sửa từng câu (chỉ rõ lỗi, câu đã sửa) và thêm từ liên kết khi cần;
   có thể áp cả đoạn đã sửa vào ô viết (Viết) hoặc bản viết lại (Lịch sử). */
/* Tô các đoạn bị lỗi trong câu, đánh số khớp với danh sách lỗi bên dưới */
function aiHlIssues(text, issues){
  const low = text.toLowerCase(), rs = [];
  issues.forEach((q, k) => {
    if(!q.quote) return;
    let from = 0, at = -1;
    while((at = low.indexOf(q.quote.toLowerCase(), from)) >= 0 && rs.some(r => at < r[1] && at + q.quote.length > r[0])) from = at + 1;
    if(at >= 0){ rs.push([at, at + q.quote.length, k]); q.found = true; } else q.found = false;
  });
  rs.sort((a, b) => a[0] - b[0]);
  let html = '', pos = 0;
  for(const [a, b, k] of rs){
    html += esc(text.slice(pos, a)) + `<mark class="ai-q t-${issues[k].type}">${esc(text.slice(a, b))}<sup>${k + 1}</sup></mark>`; pos = b;
  }
  return html + esc(text.slice(pos));
}
function aiIssuesHtml(x){
  const iss = asArr(x.issues);
  if(!iss.length) return x.hint ? `<div class="ai-s-hint">${I('bulb')}<span>${esc(x.hint)}</span></div>` : '';
  return `<ol class="ai-iss">${iss.map((q, k) => `<li class="ai-is">
      <span class="ai-is-n t-${q.type}">${k + 1}</span>
      <div><span class="ai-is-type t-${q.type}">${t('aiIssue_' + q.type)}</span>${q.quote ? `<span class="ai-is-q ${q.found === false ? 'nf' : ''}">“${esc(q.quote)}”</span>` : ''}
        <div class="ai-is-tip">${I('bulb')}<span>${esc(q.tip)}</span></div></div></li>`).join('')}</ol>`;
}
function aiItemHtml(x, i, r){
  const via = x.via === 'lt' ? `<div class="ai-via">${I('bulb')}${t('aiViaLt')}</div>` : x.via === 'none' ? `<div class="ai-via">${I('x')}${t('aiViaNone')}</div>` : '';

      <div class="ai-s-b"><div class="ai-s-t">${esc(x.s)}</div>${x.kept ? `<div class="tk-note" style="margin:4px 0 0">${t('aiKept')}</div>` : ''}${via}</div></li>`;

            : `<button class="btn sm primary" data-ai="one" data-i="${i}">${I('check')}${t('aiApplyOne')}</button>`}</div></div>

async function aiRun(host, text, targets, btn, ctx){

      ${un ? '' : `<small class="ai-err-why">${esc(t('aiErrWhy', aiErrReason(e)))}</small>`}</span>
      ${un || !ctx ? '' : `<button class="btn sm" data-ai-retry="${ctx}">${I('spark')}${t('aiRetry')}</button>`}</div>`;
    return null;
  }finally{ if(btn) btn.disabled = false; }
}
function aiErrReason(e){
  const n = (e && (e.name || '')) + ' ' + (e && e.message || '');
  if(/Quota/i.test(n)) return t('aiWhy_quota');
  if(/Abort|timeout/i.test(n)) return t('aiWhy_timeout');
  if(/NotReadable|unsafe|filter/i.test(n)) return t('aiWhy_filtered');
  if(/bad/.test(n)) return t('aiWhy_bad');
  if(/NotAllowed|activation|gesture/i.test(n)) return t('aiWhy_gesture');
  return (e && (e.name || e.message)) || '?';
}

/* Chạy bước giải thích rồi vẽ lại nếu khung vẫn đang hiện kết quả này */

  };

/* Áp riêng một câu đã sửa vào ô viết (Viết) hoặc bản viết lại (Lịch sử) */
function aiApplyOne(ctx, i){
  const write = ctx === 'write';
  const p = write ? tasks.t.write.paras[tasks.t.write.idx] : null, e = write ? null : writeLog.find(x => x.id === histView);
  const r = write ? p && p.ai : e && e.ai, x = r && asArr(r.items)[i];
  const el = write ? $('#wrBox') : $('#histRw');
  if(!x || !x.changed || !el) return;
  const base = write ? el.value : (el.value.trim() || e.text);
  const k = base.indexOf(x.s);
  if(k < 0){ toast(t('aiOneNotFound')); return; }
  el.value = base.slice(0, k) + x.better + base.slice(k + x.s.length);
  el.dispatchEvent(new Event('input', { bubbles: true }));
  x.applied = true;
  if(asArr(r.items).every(y => !y.changed || y.applied)) r.applied = true;
  if(write) r.src = el.value.trim(); else histRwFlush();
  saveTasks();
  const h = write ? $('#wrAi') : $('#histAi');
  if(h) h.innerHTML = aiResultHtml(r, write ? el.value.trim() : e.text, ctx);
}
/* Áp đoạn đã sửa: Viết → thay vào ô viết · Lịch sử → đưa vào "Bản viết lại hoàn chỉnh" */

async function writeCheck(){
  const x = tasks.t.write, p = x.paras[x.idx], box = $('#wrBox'), btn = $('#wrCheckBtn'), el = $('#wrResult');
  if(!p || !box) return;
  const text = box.value;
  p.text = text;
  if(wordCount(text) < WRITE_MIN_WORDS){ toast(t('tkWrTooShort', WRITE_MIN_WORDS)); return; }
  btn.disabled = true;
  el.innerHTML = `<div class="tk-loading"><span class="tk-spin"></span>${t('tkWrChecking')}</div>`;
  let data;
  try{
    const r = await fetch('https://api.languagetool.org/v2/check', {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ text, language: 'en-US' }),
    });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    data = await r.json();
  }catch(e){
    if(tkView !== 'write') return;
    btn.disabled = false;
    el.innerHTML = `<div class="tk-alert bad">${I('x')}<span>${t('tkWrServiceErr')}</span></div>`;
    return;
  }
  if(tkView !== 'write' || x.paras[x.idx] !== p) return;
  const vocab = new Set(words.map(w => w.word.trim().toLowerCase()));
  const tforms = new Set(p.words.flatMap(w => w.word.toLowerCase().split(/[\s\/]+/).filter(Boolean).flatMap(tk => [...wordForms(tk)])));
  const errs = [];
  for(const m of (data.matches || [])){
    const type = ltType(m); if(!type) continue;
    const frag = text.substr(m.offset, m.length);
    if(type === 'spelling' && (vocab.has(frag.toLowerCase()) || tforms.has(frag.toLowerCase()))) continue;
    const overlapsTarget = p.words.some(w => findUse(text, w.word).some(q => q.parts.some(([a, b]) => a < m.offset + m.length && m.offset < b)));
    errs.push({ type: type === 'grammar' && overlapsTarget ? 'usage' : type, text: frag, offset: m.offset, length: m.length,
      msg: m.message || '', sug: (m.replacements || []).slice(0, 3).map(r => r.value).join(' / ') });
  }
  errs.push(...localUsageErrors(text, p.words));
  p.checks = (p.checks || 0) + 1;
  p.checkedText = text;
  p.errors = errs;
  if(!Array.isArray(p.issues)) p.issues = [];
  const seenIssue = new Set(p.issues.map(e => e.type + '|' + e.text + '|' + e.msg));
  errs.forEach(e => {                           // gom mọi lỗi đã gặp để xem lại trong lịch sử
    const k = e.type + '|' + e.text + '|' + e.msg;
    if(!seenIssue.has(k)){ seenIssue.add(k); p.issues.push({ type: e.type, text: e.text, msg: e.msg, sug: e.sug, miss: e.offset < 0 ? 1 : 0 }); }
  });
  saveTasks();
  btn.disabled = false;
  if(errs.length){ renderWriteErrors(p, true); return; }
  p.done = true; p.errors = [];
  logWriting(p, x.idx);
  saveTasks();
  el.innerHTML = `<div class="tk-alert good">${I('check')}<span>${t('tkWrParaDone', x.idx + 1)}</span></div>`;
  btn.disabled = true; box.disabled = true;
  setTimeout(() => {
    if(tkView !== 'write') return;
    const next = x.paras.findIndex(q => !q.done);
    if(next < 0){ completeTask('write'); return; }
    x.idx = next; saveTasks(); renderTasks();
  }, 1400);
}

  for(const [a, b] of ranges){ if(a < pos) continue; html += esc(text.slice(pos, a)) + '<mark>' + esc(text.slice(a, b)) + '</mark>'; pos = b; }
  return html + esc(text.slice(pos));
}
