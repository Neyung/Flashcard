<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sổ Ngữ · Flashcard học từ vựng</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23FFE0C9'/%3E%3Cpath d='M6 5.5h8.5a3 3 0 0 1 3 3V19H8a2.5 2.5 0 0 1-2.5-2.5z' fill='%23fff' stroke='%2323284A' stroke-width='2'/%3E%3Cpath d='M9.5 9.5h5M9.5 13h5' stroke='%231E5EFF' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#23284A;            /* màu tối — chỉ dùng nhấn chi tiết */
  --bg:#FFFDF4;
  --paper:#FFFFFF;
  --mint:#C9F4DE;
  --peach:#FFE0C9;
  --lav:#E4DBFF;
  --sky:#CFE9FF;
  --lemon:#FFF1B3;
  --pink:#FFD9E8;
  --blue:#1E5EFF;
  --green:#13A35B;
  --red:#E5484D;
  --muted:#7A7F9E;
  --bd:2.5px solid var(--ink);
  --shadow:4px 4px 0 var(--ink);
  --shadow-sm:3px 3px 0 var(--ink);
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Manrope',sans-serif;color:var(--ink);background:var(--bg);
  background-image:radial-gradient(#23284A12 1.4px, transparent 1.4px);
  background-size:26px 26px;
  min-height:100vh;padding:22px 18px 60px;
}
.mono{font-family:'JetBrains Mono',monospace}
.wrap{max-width:1080px;margin:0 auto}

/* ── Header ─────────────────────────── */
header{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:20px}
.logo{display:flex;align-items:center;gap:12px}
.logo-badge{
  width:52px;height:52px;border:var(--bd);border-radius:14px;background:var(--lemon);
  box-shadow:var(--shadow-sm);display:grid;place-items:center;font-size:26px;
  transform:rotate(-4deg);
}
.logo h1{font-size:24px;font-weight:800;letter-spacing:-.5px}
.logo p{font-size:12.5px;color:var(--muted);font-weight:600}
.head-stats{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.chip{
  display:flex;align-items:center;gap:7px;padding:8px 13px;border:var(--bd);
  border-radius:999px;background:var(--paper);box-shadow:var(--shadow-sm);
  font-size:13px;font-weight:700;
}
.chip .num{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:14px}
.chip.c-mint{background:var(--mint)} .chip.c-peach{background:var(--peach)} .chip.c-sky{background:var(--sky)}

/* ── Tabs ───────────────────────────── */
.tabs{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.tab-btn{
  font-family:'Manrope',sans-serif;font-weight:800;font-size:14.5px;cursor:pointer;
  padding:11px 20px;border:var(--bd);border-radius:12px;background:var(--paper);
  box-shadow:var(--shadow-sm);transition:transform .12s, box-shadow .12s;color:var(--ink);
}
.tab-btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.tab-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.tab-btn.active{background:var(--ink);color:#fff}
.tab-btn .ico{margin-right:6px}
.tab-page{display:none}
.tab-page.active{display:block;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── Cards / panels ─────────────────── */
.panel{
  background:var(--paper);border:var(--bd);border-radius:var(--r);
  box-shadow:var(--shadow);padding:20px;
}
.panel + .panel{margin-top:18px}
.panel-title{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.panel-title .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink)}

/* ── Buttons ────────────────────────── */
.btn{
  font-family:'Manrope',sans-serif;font-weight:800;font-size:13.5px;cursor:pointer;
  padding:10px 16px;border:var(--bd);border-radius:11px;background:var(--paper);
  box-shadow:var(--shadow-sm);transition:transform .1s, box-shadow .1s;color:var(--ink);
  display:inline-flex;align-items:center;gap:7px;
}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--blue);color:#fff}
.btn.mint{background:var(--mint)} .btn.peach{background:var(--peach)}
.btn.lav{background:var(--lav)} .btn.sky{background:var(--sky)} .btn.lemon{background:var(--lemon)} .btn.pink{background:var(--pink)}
.btn.ghost{box-shadow:none;border-style:dashed}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.sm{padding:6px 11px;font-size:12.5px;border-width:2px}

/* ── Form ───────────────────────────── */
.form-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.fg input,.fg select,.fg textarea{
  font-family:'Manrope',sans-serif;font-size:14px;font-weight:600;color:var(--ink);
  padding:10px 12px;border:var(--bd);border-radius:10px;background:#FFFEFA;outline:none;
  transition:box-shadow .12s;
}
.fg input:focus,.fg select:focus,.fg textarea:focus{box-shadow:3px 3px 0 var(--blue);border-color:var(--blue)}
.col-3{grid-column:span 3}.col-4{grid-column:span 4}.col-6{grid-column:span 6}.col-8{grid-column:span 8}.col-9{grid-column:span 9}.col-12{grid-column:span 12}
.seg{display:flex;border:var(--bd);border-radius:10px;overflow:hidden;background:#FFFEFA}
.seg button{flex:1;border:none;background:transparent;font-family:'Manrope',sans-serif;font-weight:800;font-size:13px;padding:10px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}

/* ── Table ──────────────────────────── */
.table-wrap{overflow-x:auto;border:var(--bd);border-radius:12px;background:var(--paper)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:860px}
thead th{
  text-align:left;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;
  padding:11px 12px;background:var(--lemon);border-bottom:var(--bd);white-space:nowrap;
}
tbody td{padding:10px 12px;border-bottom:1.5px dashed #23284A33;vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#FFFBE8}
td .w{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:14px}
.pos-tag{
  display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;
  padding:2px 8px;border:2px solid var(--ink);border-radius:999px;background:var(--sky);
}
.kind-tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 9px;border:2px solid var(--ink);border-radius:999px}
.kind-don{background:var(--mint)} .kind-cum{background:var(--lav)}
.star-btn{cursor:pointer;background:none;border:none;padding:2px;color:var(--ink);opacity:.4;transition:.15s}
.star-btn .ic{width:18px;height:18px}
.star-btn:hover{opacity:.8}
.star-btn.on{opacity:1;transform:scale(1.12)}
.star-btn.on .ic{fill:#FFC83D}
.icon-btn{cursor:pointer;background:none;border:none;font-size:15px;opacity:.6}
.icon-btn:hover{opacity:1}
.acc-bar{width:64px;height:9px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;background:#fff;display:inline-block;vertical-align:middle}
.acc-fill{height:100%;background:var(--green)}
.muted{color:var(--muted);font-weight:600}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type=search]{
  flex:1;min-width:180px;font-family:'Manrope',sans-serif;font-weight:600;font-size:14px;
  padding:10px 14px;border:var(--bd);border-radius:999px;outline:none;background:var(--paper);
}
.toolbar input[type=search]:focus{box-shadow:3px 3px 0 var(--blue)}

/* ── Luyện gõ ───────────────────────── */
.quiz-stage{max-width:760px;margin:0 auto}
.q-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.q-prompt{
  border:var(--bd);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;
  background:var(--sky);margin-bottom:20px;position:relative;
}
.q-prompt .label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:#23284A99}
.q-prompt .meaning{font-size:22px;font-weight:800;margin-top:4px}
.q-prompt .hintline{margin-top:8px;font-size:13.5px;font-weight:600;color:#23284ACC}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 18px;min-height:58px}
.tile{
  width:48px;height:54px;border:var(--bd);border-radius:10px;background:var(--paper);
  box-shadow:var(--shadow-sm);display:grid;place-items:center;
  font-family:'JetBrains Mono',monospace;font-weight:800;font-size:22px;text-transform:lowercase;
  transition:background .12s, transform .12s;
}
.tile.filled{background:var(--lemon)}
.tile.cursor{outline:3px dashed var(--blue);outline-offset:2px}
.tile.space{border:none;box-shadow:none;background:transparent;width:18px}
.tile.ok{background:var(--mint);animation:bump .3s}
.tile.bad{background:var(--pink);animation:shake .35s}
@keyframes bump{50%{transform:scale(1.12)}}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-bottom:18px;min-height:50px}
.chip-w{
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;cursor:pointer;
  padding:9px 14px;border:var(--bd);border-radius:10px;background:var(--lav);
  box-shadow:var(--shadow-sm);transition:transform .1s;user-select:none;
}
.chip-w:hover{transform:translate(-1px,-1px)}
.chip-w:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.chip-w.used{opacity:.25;pointer-events:none}
.chip-w.letter{background:var(--peach);text-transform:lowercase}
.answer-line{
  min-height:56px;border:2.5px dashed var(--ink);border-radius:12px;background:#FFFEF6;
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px;margin-bottom:18px;
}
.answer-line .chip-w{background:var(--mint)}
.answer-line .placeholder{color:var(--muted);font-size:13px;font-weight:700;margin:0 auto}
.quiz-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.feedback{
  margin-top:16px;padding:14px 16px;border:var(--bd);border-radius:12px;font-weight:700;
  font-size:14.5px;display:none;
}
.feedback.show{display:block;animation:pop .25s}
.feedback.good{background:var(--mint)} .feedback.bad{background:var(--pink)}
.feedback .ans{font-family:'JetBrains Mono',monospace;font-weight:800}

/* ── Flashcard ──────────────────────── */
.fc-stage{max-width:620px;margin:0 auto;text-align:center}
.fc-scene{perspective:1400px;margin-bottom:20px}
.fc-card{
  position:relative;width:100%;min-height:330px;cursor:pointer;
  transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.7,.3,1.1);
}
.fc-card.flipped{transform:rotateY(180deg)}
.fc-face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:28px;
}
.fc-front{background:var(--peach)}
.fc-back{background:var(--mint);transform:rotateY(180deg)}
.fc-word{font-family:'JetBrains Mono',monospace;font-weight:800;letter-spacing:-1px;
  word-break:break-word;overflow-wrap:break-word;hyphens:auto;
  font-size:clamp(16px,5.5vw,44px);           /* co xuống tối thiểu 16px */
  line-height:1.25;max-width:100%;padding:0 6px}
.fc-word.len-med{font-size:clamp(16px,4.5vw,34px)}   /* 20–35 ký tự */
.fc-word.len-long{font-size:clamp(14px,3.5vw,26px)}  /* 36–55 ký tự */
.fc-word.len-xlong{font-size:clamp(13px,2.6vw,20px)} /* 56+ ký tự   */
.fc-meaning{font-size:24px;font-weight:800}
.fc-sentence{font-family:'JetBrains Mono',monospace;font-size:14.5px;font-weight:500;background:#FFFFFFB0;border:2px solid var(--ink);border-radius:10px;padding:8px 14px}
.fc-note{font-size:13px;font-weight:600;color:#23284ACC;max-width:90%}
.fc-tap{position:absolute;bottom:12px;left:0;right:0;font-size:11.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#23284A88}
.fc-corner{position:absolute;top:12px;left:16px;display:flex;gap:8px;align-items:center}
.fc-star{position:absolute;top:12px;right:12px;background:none;border:none;cursor:pointer;color:var(--ink);opacity:.4;transition:.15s;padding:4px}
.fc-star .ic{width:24px;height:24px}
.fc-star.on{opacity:1;transform:scale(1.15)}
.fc-star.on .ic{fill:#FFC83D}
.grade-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.grade-row .btn{font-size:14.5px;padding:12px 20px}
.fc-progress{margin-top:16px;font-size:13px;font-weight:700;color:var(--muted)}

/* ── Icon hệ thống (SVG tự thiết kế) ─ */
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex:none}
.btn .ic,.chip .ic{width:15px;height:15px}
.tab-btn .ic{margin-right:7px;vertical-align:-2.5px}
.logo-badge .ic{width:28px;height:28px;stroke-width:2.2}
.empty .ic{width:44px;height:44px;stroke-width:1.8;margin-bottom:8px;color:var(--muted)}

/* ── Trắc nghiệm flashcard ──────────── */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;text-align:left}
.opt{
  font-family:'Manrope',sans-serif;font-weight:700;font-size:14.5px;cursor:pointer;
  padding:13px 15px;border:var(--bd);border-radius:12px;background:var(--paper);
  box-shadow:var(--shadow-sm);transition:transform .1s, box-shadow .1s;color:var(--ink);
  display:flex;gap:11px;align-items:center;text-align:left;
}
.opt .key{
  font-family:'JetBrains Mono',monospace;font-weight:800;font-size:12px;flex:none;
  border:2px solid var(--ink);border-radius:7px;width:24px;height:24px;
  display:grid;place-items:center;background:var(--lemon);
}
.opt:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.opt:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.opt:disabled{cursor:default}
.opt.right{background:var(--mint)}
.opt.right .key{background:var(--green);color:#fff;border-color:var(--ink)}
.opt.wrong{background:var(--pink);animation:shake .35s}
.opt.dim{opacity:.45}
@media (max-width:560px){.opts{grid-template-columns:1fr}}

/* ── Toast / misc ───────────────────── */
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--ink);color:#fff;font-weight:700;font-size:14px;padding:12px 20px;
  border-radius:12px;box-shadow:4px 4px 0 #23284A55;transition:transform .3s;z-index:99;
}
#toast.show{transform:translateX(-50%) translateY(0)}
.empty{
  text-align:center;padding:40px 20px;color:var(--muted);font-weight:700;
}
.empty .big{font-size:40px;margin-bottom:8px}
.switch-row{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800}
.switch-row input{width:18px;height:18px;accent-color:var(--blue)}
@media (max-width:760px){
  .col-3,.col-4,.col-6,.col-8,.col-9{grid-column:span 12}
  .head-stats{margin-left:0}
  .tile{width:40px;height:46px;font-size:18px}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}

/* ── Đăng nhập ───────────────────────────────────────────── */
.login-overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  padding:20px;background:var(--bg);
  background-image:radial-gradient(var(--lav) 1.6px,transparent 1.6px);background-size:26px 26px}
.login-card{background:var(--paper);border:var(--bd);border-radius:18px;box-shadow:6px 6px 0 var(--ink);
  padding:26px 26px 24px;width:100%;max-width:440px}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.login-logo .logo-badge{width:44px;height:44px}
.login-logo h1{font-size:26px;margin:0}
.login-sub{color:var(--muted);font-weight:600;font-size:13.5px;margin:8px 0 0}
.login-note{color:var(--muted);font-weight:600;font-size:12px;margin:14px 0 0;text-align:center}
.user-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.user-card{position:relative;border:var(--bd);border-radius:14px;background:var(--paper);box-shadow:var(--shadow-sm);
  padding:16px 8px 13px;text-align:center;cursor:pointer;font-weight:800;font-family:inherit;font-size:15px;
  color:var(--ink);display:flex;flex-direction:column;gap:9px;align-items:center;transition:transform .08s}
.user-card:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.user-card:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.user-del{position:absolute;top:5px;right:5px;background:none;border:none;cursor:pointer;
  color:var(--ink);opacity:.35;padding:4px;transition:opacity .12s,color .12s}
.user-del .ic{width:14px;height:14px}
.user-del:hover{opacity:1;color:var(--red)}
.user-avatar{width:50px;height:50px;border:var(--bd);border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:20px;font-weight:800}
.user-last{font-size:10.5px;font-weight:700;color:var(--muted);margin-top:-3px}
.login-form{display:flex;flex-direction:column;gap:11px;margin-top:16px}
.login-form .fg label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}
.login-form input{width:100%;border:var(--bd);border-radius:10px;padding:10px 12px;font:600 14px/1.3 'Manrope',sans-serif;
  background:#fff;box-sizing:border-box}
.login-form input:focus{outline:none;box-shadow:3px 3px 0 var(--ink)}
.login-err{color:var(--red);font-size:12.5px;font-weight:700;min-height:16px;margin:0}
.login-actions{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:2px}
.login-link{background:none;border:none;color:var(--blue);font:700 13px 'Manrope',sans-serif;cursor:pointer;padding:4px 0;text-decoration:underline}
.login-back{background:none;border:none;color:var(--muted);font:700 13px 'Manrope',sans-serif;cursor:pointer;padding:4px 0}
.login-who{display:flex;align-items:center;gap:10px;margin-top:16px}
.login-who .user-avatar{width:40px;height:40px;font-size:16px}
.login-who b{font-size:16px}
.sync-dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--ink);display:none;margin-left:2px}
.sync-dot.ok{display:inline-block;background:var(--green)}
.sync-dot.err{display:inline-block;background:var(--red)}

/* ── Mức độ ghi nhớ (giai đoạn học) ──────────────────────── */
.lv{display:inline-block;padding:3px 9px;border:2px solid var(--ink);border-radius:999px;
  font-size:11px;font-weight:800;white-space:nowrap}
.lv-new{background:var(--lav)}
.lv-learn{background:var(--peach)}
.lv-known{background:var(--sky)}
.lv-master{background:var(--mint)}

/* ── Cloze & highlight trong flashcard ───────────────────── */
.fc-cloze{margin-top:14px;font:600 13.5px/1.6 'JetBrains Mono',monospace;color:var(--ink);
  background:#fff;border:2px dashed var(--ink);border-radius:10px;padding:9px 12px;max-width:92%}
.fc-cloze .blank{display:inline-block;min-width:54px;border-bottom:2.5px solid var(--blue);
  color:var(--blue);font-weight:800;text-align:center}
.fc-sentence mark{background:var(--lemon);border:1.5px solid var(--ink);border-radius:5px;
  padding:0 4px;font-weight:800}
.fc-lv{position:absolute;left:14px;bottom:12px}

/* ── Đăng nhập: thêm người dùng ──────────────────────────── */
.user-card.add .user-avatar{background:#fff;border-style:dashed}
.user-grid.many{grid-template-columns:repeat(3,1fr)}

/* ── Tab Tập trung ───────────────────────────────────────── */
.focus-stage{max-width:620px;margin:0 auto}
.focus-top{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.dur-chip{border:var(--bd);border-radius:999px;background:var(--paper);box-shadow:var(--shadow-sm);
  padding:9px 16px;font:800 14px 'Manrope',sans-serif;cursor:pointer;color:var(--ink)}
.dur-chip:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.dur-chip.on{background:var(--ink);color:#fff}
.dur-chip:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:var(--shadow-sm)}
.focus-panel{position:relative;background:var(--paper);border:var(--bd);border-radius:18px;
  box-shadow:var(--shadow);padding:22px 18px 18px;text-align:center;overflow:hidden}
.focus-time{font:800 44px/1 'JetBrains Mono',monospace;letter-spacing:1px;margin:4px 0 2px}
.focus-sub{color:var(--muted);font-weight:700;font-size:13px;min-height:18px}
.focus-bar{height:14px;border:var(--bd);border-radius:999px;background:#fff;overflow:hidden;
  margin:14px auto 4px;max-width:420px}
.focus-fill{height:100%;width:0%;background:var(--lemon);border-right:2.5px solid var(--ink);
  transition:width .9s linear}
.focus-actions{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.sf-wrap{margin:6px auto 0;width:min(250px,72vw)}
.sf{display:block;width:100%;height:auto}
#sfClipRect{transition:y .95s ease, height .95s ease}
#sfHeadG{transition:transform 1s cubic-bezier(.34,1.56,.64,1), opacity .6s ease;opacity:0;
  transform-origin:120px 84px;transform:scale(0)}
.sf.h1 #sfHeadG{opacity:1;transform:scale(.34)}
.sf.h2 #sfHeadG{opacity:1;transform:scale(.62)}
.sf.h3 #sfHeadG{opacity:1;transform:scale(1)}
#sfPetals{transform-origin:120px 84px;transition:transform 1.1s cubic-bezier(.34,1.56,.64,1);transform:scale(.25)}
.sf.h2 #sfPetals{transform:scale(.6)}
.sf.h3 #sfPetals{transform:scale(1)}
@keyframes sfSway{0%,100%{transform:rotate(-2.4deg)}50%{transform:rotate(2.4deg)}}
.sf.h3 #sfAll{transform-origin:120px 252px;animation:sfSway 4.5s ease-in-out infinite}

/* ── Tối ưu UI ───────────────────────────────────────────── */
.tab-badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;
  padding:0 5px;margin-left:7px;border:2px solid var(--ink);border-radius:999px;
  background:var(--pink);color:var(--ink);font-size:11px;font-weight:800;vertical-align:1px}
.tab-btn.active .tab-badge{background:var(--lemon)}
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
th.sortable:hover{text-decoration:underline}
th.sortable .arrow{font-size:10px;margin-left:3px}
.away-banner{display:none;align-items:center;gap:10px;justify-content:center;
  background:var(--pink);border:var(--bd);border-radius:12px;box-shadow:var(--shadow-sm);
  padding:10px 14px;margin:0 0 14px;font-weight:800;font-size:13.5px}
.away-banner.show{display:flex;animation:bannerPop .3s ease}
@keyframes bannerPop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.confetti{position:absolute;top:-12px;border:2px solid var(--ink);pointer-events:none;
  animation:confFall linear forwards}
@keyframes confFall{
  0%{transform:translateY(0) rotate(0);opacity:1}
  100%{transform:translateY(380px) rotate(540deg);opacity:0}}
@media (max-width:640px){
  .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab-btn{flex:0 0 auto}
}

/* ── Nhóm từ vựng ────────────────────────────────────────── */
.grp{display:inline-block;padding:3px 9px;border:2px solid var(--ink);border-radius:8px;
  background:var(--lav);font-size:11px;font-weight:800;white-space:nowrap;cursor:pointer}
.grp.none{background:#fff;border-style:dashed;color:var(--muted)}
select.themed{border:var(--bd);border-radius:10px;padding:8px 10px;background:#fff;
  font:700 13px 'Manrope',sans-serif;color:var(--ink);cursor:pointer;max-width:220px}
select.themed:focus{outline:none;box-shadow:3px 3px 0 var(--ink)}

/* ── Phản hồi tức thì trên flashcard ─────────────────────── */
.fc-verdict{display:flex;align-items:center;gap:8px;justify-content:center;
  border:2.5px solid var(--ink);border-radius:12px;padding:9px 16px;
  font-weight:800;font-size:15px;max-width:94%;
  animation:verdictPop .22s cubic-bezier(.34,1.56,.64,1)}
.fc-verdict.ok{background:var(--mint)}
.fc-verdict.bad{background:var(--pink)}
.fc-verdict .ic{width:19px;height:19px;flex:0 0 auto}
@keyframes verdictPop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}

/* ── Phiên âm & phát âm ──────────────────────────────────── */
.fc-ipa{display:flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;
  font-size:16px;font-weight:600;color:#23284AB8;margin-top:-4px}
.speak-btn{border:2.5px solid var(--ink);border-radius:50%;width:34px;height:34px;background:#fff;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  box-shadow:2px 2px 0 var(--ink);color:var(--ink)}
.speak-btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.speak-btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.speak-btn .ic{width:16px;height:16px}
.speak-btn.sm{width:26px;height:26px;box-shadow:none;border-width:2px}
.speak-btn.sm .ic{width:13px;height:13px}
.tb-ipa{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);font-weight:500}

/* ── Sửa từ trong bảng ───────────────────────────────────── */
.edit-row td{background:var(--lemon);padding:14px 12px}
.edit-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;align-items:end}
.edit-grid .fg{margin:0}
.edit-grid label{display:block;font-size:10.5px;font-weight:800;margin-bottom:3px}
.edit-grid input,.edit-grid select{width:100%;border:2px solid var(--ink);border-radius:8px;
  padding:7px 9px;font:600 12.5px 'Manrope',sans-serif;background:#fff;box-sizing:border-box}
.edit-grid .span2{grid-column:span 2}
.edit-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
@media (max-width:760px){.edit-grid{grid-template-columns:repeat(2,1fr)}.edit-grid .span2{grid-column:span 2}}
/* ── Luyện gõ: chế độ cho cụm ────────────────────────────── */
.mode-pills{display:flex;gap:8px;justify-content:center;margin:0 0 12px}
.mode-pill{border:2.5px solid var(--ink);border-radius:999px;background:#fff;
  padding:6px 14px;font:800 12.5px 'Manrope',sans-serif;cursor:pointer;color:var(--ink)}
.mode-pill.on{background:var(--ink);color:#fff}
.phrase-input{display:block;width:100%;max-width:560px;margin:0 auto 14px;border:var(--bd);
  border-radius:12px;padding:13px 15px;font:600 15px/1.4 'JetBrains Mono',monospace;
  background:#fff;box-sizing:border-box}
.phrase-input:focus{outline:none;box-shadow:4px 4px 0 var(--ink)}
.phrase-input:disabled{background:var(--bg);color:var(--muted)}

.edit-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}
.edit-grid label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:800}
.edit-grid input,.edit-grid select{border:2.5px solid var(--ink);border-radius:9px;padding:8px 10px;
  font:600 13px 'Manrope',sans-serif;background:#fff;width:100%;box-sizing:border-box}
.edit-grid input:focus{outline:none;box-shadow:3px 3px 0 var(--ink)}
.edit-actions{display:flex;gap:8px;align-items:center}
@media (max-width:900px){.edit-grid{grid-template-columns:repeat(2,1fr)}}

/* ── Chuyển ngôn ngữ (header) ────────────────────────────────── */
.head-seg{display:flex;border:var(--bd);border-radius:10px;overflow:hidden;background:var(--paper);box-shadow:var(--shadow-sm)}
.head-seg button{border:none;background:transparent;font-family:'Manrope',sans-serif;font-weight:800;
  font-size:12.5px;padding:9px 14px;cursor:pointer;color:var(--ink);white-space:nowrap}
.head-seg button.on{background:var(--ink);color:#fff}
header{align-items:center}

/* ── Chuyển chế độ (Học Từ / Luyện Viết) — canh phải trên hàng tab ── */
.tabs{align-items:center}
.mode-switch{display:flex;margin-left:auto;border:3px solid var(--ink);border-radius:12px;overflow:hidden;
  background:var(--lav);box-shadow:var(--shadow)}
.mode-switch button{border:none;background:transparent;font-family:'Manrope',sans-serif;font-weight:800;
  font-size:14px;padding:11px 18px;cursor:pointer;color:var(--ink);white-space:nowrap;transition:background .12s,color .12s}
.mode-switch button.on{background:var(--blue);color:#fff}
.mode-switch button:not(.on):hover{background:#ffffff80}
@media (max-width:640px){.mode-switch{margin-left:0;width:100%;order:99}}

/* ── Vườn hoa: luống hoa hiển thị trực quan + gộp bậc (Merge) ── */
.garden{margin-top:4px}
.g-bed{position:relative;width:100%;min-height:150px;border:var(--bd);border-radius:14px;
  background:var(--mint);background-image:radial-gradient(#23284A1f 1.6px, transparent 1.6px);
  background-size:22px 22px;overflow:hidden}
.g-sprout{position:absolute;transform-origin:center;filter:drop-shadow(1.5px 2px 0 #23284A40)}
.g-bed-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;color:var(--muted);font-weight:700;font-size:12.5px;text-align:center;padding:0 24px}
.g-bed-empty .ic{width:32px;height:32px;stroke-width:1.8}
.g-legend{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.g-legend-item{display:flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;
  padding:6px 12px;background:var(--paper);font:700 12px 'Manrope',sans-serif;box-shadow:2px 2px 0 var(--ink)}
.g-legend-item .ic{width:16px;height:16px}
.g-legend-item.special{background:var(--lemon)}

/* ── Luyện Viết: thẻ mẫu câu sinh động ────────────────────────── */
.w-card{border:var(--bd);border-radius:var(--r);box-shadow:var(--shadow);padding:24px;
  background:var(--paper);margin-bottom:20px;position:relative;overflow:hidden}
.w-card:before{content:"";position:absolute;top:-40px;right:-40px;width:120px;height:120px;
  border-radius:50%;background:var(--lemon);opacity:.55;z-index:0}
.w-card:after{content:"";position:absolute;bottom:-50px;left:-30px;width:100px;height:100px;
  border-radius:50%;background:var(--sky);opacity:.5;z-index:0}
.w-topic-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;position:relative;z-index:1}
.w-topic-badge{display:inline-flex;align-items:center;gap:8px;border:3px solid var(--ink);border-radius:12px;
  padding:10px 18px;font-weight:800;font-size:18px;box-shadow:var(--shadow-sm);transform:rotate(-1.6deg)}
.w-topic-badge .ic{width:19px;height:19px}
.w-chain{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  margin-bottom:18px;position:relative;z-index:1}
.w-chain-chip{display:inline-flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;
  font-weight:700;font-size:13px;border:2px solid var(--ink);border-radius:10px;
  padding:6px 13px 6px 6px;box-shadow:2px 2px 0 var(--ink)}
.w-chain-chip .num{display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:19px;height:19px;border-radius:50%;background:var(--ink);color:#fff;
  font-family:'Manrope',sans-serif;font-size:10.5px;font-weight:800}
.w-chain-arrow{color:var(--ink);opacity:.4;font-size:15px}
.w-sample{position:relative;z-index:1;background:var(--mint);border:2.5px dashed var(--ink);border-radius:12px;
  padding:18px 38px;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600;line-height:1.65}
.w-sample .w-quote{position:absolute;font-family:Georgia,serif;font-size:38px;font-weight:800;
  color:#23284A5c;line-height:1;pointer-events:none;user-select:none}
.w-sample .w-quote.open{top:6px;left:10px}
.w-sample .w-quote.close{bottom:-8px;right:10px}
@media (max-width:560px){.w-topic-badge{font-size:15px;padding:8px 14px}}

/* ── Luyện Viết: khung nhập + gạch lỗi chính tả ──────────────── */
.write-box{display:block;width:100%;min-height:170px;border:var(--bd);border-radius:12px;
  padding:16px;font:600 15px/1.6 'JetBrains Mono',monospace;background:#fff;box-sizing:border-box;
  outline:none;white-space:pre-wrap;word-break:break-word;margin-bottom:16px}
.write-box:focus{box-shadow:4px 4px 0 var(--ink)}
.write-box:empty:before{content:attr(data-placeholder);color:var(--muted);font-weight:500}
.sp-err{background:var(--pink);border:1.5px solid var(--red);border-radius:5px;padding:0 2px}
</style>
</head>

/* ═══════════════════════════════════════════════════════════

     §1  Cấu hình & người dùng        §6  Tab Ghi chú (bảng, nhập/xuất)

     §5  Mức độ ghi nhớ & cloze       §10 Đăng nhập & khởi động
   - Dữ liệu lưu localStorage (fallback bộ nhớ) + nhập/xuất file note
   - Bộ lập lịch ưu tiên: tần suất tự điều chỉnh theo
     (1) từ có ⭐ lưu hay không, (2) độ chính xác, (3) thời gian
     trả lời, (4) khoảng cách ôn tập giãn dần để nhớ lâu (SRS)
   ═══════════════════════════════════════════════════════════ */

/* ── Người dùng & đồng bộ đám mây ────────────────────────────
   Để sổ tay theo người dùng trên MỌI thiết bị:
   1. Vào console.firebase.google.com → tạo project (miễn phí)
   2. Build → Realtime Database → Create (chọn chế độ test mode)
   3. Copy URL database (dạng https://ten-project-default-rtdb...firebasedatabase.app)
      và dán vào CLOUD_URL bên dưới (bỏ dấu / ở cuối nếu có).
   Để trống '' = chỉ lưu trên trình duyệt của từng máy.            */
const CLOUD_URL = 'https://flashcard-53fb0-default-rtdb.firebaseio.com';
const APP_VERSION = 'v3.2 · 13-06-2026';

const DEFAULT_USERS = ['Ni','Tom','Dinh'];
const USERS_KEY = 'soTuUsers_v1';
const PALETTE = ['var(--mint)','var(--sky)','var(--peach)','var(--lav)','var(--lemon)','var(--pink)'];
let userList = [...DEFAULT_USERS];
const userColor = u => PALETTE[Math.max(0, userList.indexOf(u)) % PALETTE.length];

async function loadUserList(){
  let list = null;
  if(cloudOn()){
    try{ const cl = await cloudGet('meta/users'); if(Array.isArray(cl) && cl.length) list = cl; }
    catch(e){}
  }
  if(!list){
    try{ const raw = localStorage.getItem(USERS_KEY); if(raw) list = JSON.parse(raw); }catch(e){}
  }
  userList = (Array.isArray(list) && list.length) ? list : [...DEFAULT_USERS];
  for(const d of DEFAULT_USERS) if(!userList.includes(d)) userList.push(d);
}
async function saveUserList(){
  try{ localStorage.setItem(USERS_KEY, JSON.stringify(userList)); }catch(e){}
  if(cloudOn()){
    try{ await cloudPut('meta/users', userList); }
    catch(e){ toast(t('cloudUsersErr')); }
  }
}

/* ── Mốc đăng nhập gần nhất của từng người ── */
const LASTLOGIN_KEY = 'soTuLastLogin_v1';
let lastLogins = {};                       // { Tên: timestamp(ms) }
async function loadLastLogins(){
  let map = {};
  try{ map = JSON.parse(localStorage.getItem(LASTLOGIN_KEY) || '{}'); }catch(e){}
  if(cloudOn()){
    try{
      const cl = await cloudGet('meta/lastLogin');
      if(cl && typeof cl === 'object') map = { ...map, ...cl };
    }catch(e){}
  }
  lastLogins = map;          // gán một lần — tránh hai lần gọi chồng nhau xoá dữ liệu của nhau
}
async function markLogin(){
  lastLogins[currentUser] = Date.now();
  try{ localStorage.setItem(LASTLOGIN_KEY, JSON.stringify(lastLogins)); }catch(e){}
  if(cloudOn()){
    try{ await cloudPut('meta/lastLogin/' + currentUser, lastLogins[currentUser]); }catch(e){}
  }
}
function lastLoginLabel(u){
  const ts = lastLogins[u];
  if(!ts) return t('neverLoggedIn');
  const days = Math.floor((Date.now() - ts) / 86400000);
  if(days <= 0) return t('today');
  if(days === 1) return t('yesterday');
  return t('daysAgo', days);
}
/* Xoá vĩnh viễn một tài khoản: khỏi danh sách người dùng, mật khẩu, mốc đăng
   nhập, và toàn bộ dữ liệu (từ vựng, mẫu câu, vườn hoa) trên máy lẫn trên
   mây — 'users/<tên>' trên Firebase chứa cả words/sentences_v2/garden nên
   một lệnh xoá là đủ cho tất cả. */
async function deleteUserAccount(user){
  userList = userList.filter(u => u !== user);
  await saveUserList();
  await putAuth(user, null);
  delete lastLogins[user];
  try{ localStorage.setItem(LASTLOGIN_KEY, JSON.stringify(lastLogins)); }catch(e){}
  try{ localStorage.removeItem('soTu_v3_' + user); }catch(e){}
  try{ localStorage.removeItem('soTuSentences_v4_' + user); }catch(e){}
  try{ localStorage.removeItem('soTuGarden_' + user); }catch(e){}
  if(cloudOn()){
    try{ await cloudDelete('users/' + user); }catch(e){}
    try{ await cloudDelete('meta/lastLogin/' + user); }catch(e){}
  }
}
let currentUser = null;
const lsKey  = () => 'soTu_v3_' + currentUser;
const AUTH_KEY = 'soTuAuth_v1';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const now = () => Date.now();
const DAY = 86400000;
const I = n => `<svg class="ic"><use href="#i-${n}"/></svg>`;

   ═══════════════════════════════════════════════════════════ */

/* Parser dùng chung khi nhập file note.
   Mỗi dòng: từ | loại từ | nghĩa | đặt câu | chú thích | đơn/cụm | nhóm
   Dòng tiêu đề dạng "# ── Tên nhóm ──" sẽ gán nhóm cho các dòng bên dưới */
function parseNoteText(text, existing){
  const entries = [];
  let skipped = 0, curGroup = '';
  const dupKey = w => (w.word + '¦' + w.meaning).toLowerCase();
  const seen = new Set((existing||[]).map(dupKey));
  text.split(/\r?\n/).forEach(line=>{
    line = line.trim();
    if(!line) return;
    if(line.startsWith('#')){
      const m = line.match(/^#\s*─*\s*(?:\d+[a-z]?\.\s*)?([^─(]+?)\s*(?:\(.*\))?\s*─*\s*$/);
      if(m && /─/.test(line)) curGroup = m[1].trim();   // chỉ nhận dòng tiêu đề có gạch ──
      return;
    }
    const parts = line.split('|').map(s=>s.trim());
    if(parts.length < 3 || !parts[0] || !parts[2]){ skipped++; return; }
    const [word, pos, meaning, sentence='', note='', kindRaw='', groupRaw=''] = parts;
    const kind = /cụm|cum|phrase/i.test(kindRaw) ? 'cụm'
               : /đơn|don|single/i.test(kindRaw) ? 'đơn'
               : (word.includes(' ') ? 'cụm' : 'đơn');
    const w = makeWord(word, pos, meaning, sentence, note, kind, false, groupRaw || curGroup);
    if(seen.has(dupKey(w))){ skipped++; return; }
    seen.add(dupKey(w));
    entries.push(w);
  });
  return { entries, skipped };
}

/* ── Băm mật khẩu (SHA-256, có fallback khi mở bằng file://) ── */
async function hashText(text, salt){
  const input = salt + '::' + text;
  try{
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(input));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let h1=0x811c9dc5, h2=0x9e3779b9;
    for(const ch of input){ const c=ch.codePointAt(0);
      h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
      h2 = (Math.imul(h2 ^ c, 0x85ebca6b) + 0x27d4eb2f) >>> 0; }
    return 'f' + h1.toString(16) + h2.toString(16);
  }
}

function normalizeWord(w){
  if(typeof w.group !== 'string') w.group = '';
  if(typeof w.note  !== 'string') w.note  = '';
  if(typeof w.sentence !== 'string') w.sentence = '';
  if(typeof w.pos !== 'string') w.pos = '';
  w.saved = !!w.saved;
  if(!w.stats || typeof w.stats !== 'object') w.stats = newStats();
  else w.stats = Object.assign(newStats(), w.stats);
  if(!Array.isArray(w.stats.times)) w.stats.times = [];
  if(typeof w.ipa   !== 'string') w.ipa   = '';
  if(typeof w.audio !== 'string') w.audio = '';
}

/* ── Phiên âm + phát âm: tự tra Free Dictionary API (không cần key) ──
   - Chỉ tra từ đơn; kết quả (IPA + link audio) lưu vào từ và đồng bộ mây
   - Tra "lười": chỉ khi từ xuất hiện trên flashcard hoặc khi bấm loa,
     tránh dội 107 request một lúc. Thất bại chỉ ghi nhớ trong phiên,
     mất mạng thì lần sau vẫn thử lại. */
const ipaFailed = new Set();
async function fetchPhonetics(w){
  if(w.kind !== 'đơn' || w.ipa || ipaFailed.has(w.id)) return !!w.ipa;
  try{
    const r = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'
      + encodeURIComponent(w.word.toLowerCase().trim()));
    if(!r.ok) throw 0;
    const data = await r.json();
    const phs = (Array.isArray(data) && data[0] && data[0].phonetics) || [];
    /* Ưu tiên tuyệt đối bản Anh-Mỹ (file audio có đuôi -us.mp3) */
    const us = phs.find(p => p.audio && /-us\.mp3/i.test(p.audio));
    w.audio = (us || phs.find(p => p.audio) || {}).audio || '';
    w.ipa   = (us && us.text)
           || (phs.find(p => p.text) || {}).text
           || (data[0] && data[0].phonetic) || '';
    if(w.ipa || w.audio){ save(); return true; }
    ipaFailed.add(w.id); return false;
  }catch(e){ ipaFailed.add(w.id); return false; }
}

/* Đọc to: ưu tiên audio từ điển; không có thì dùng giọng đọc trình duyệt */
function speakWord(w){
  if(w.kind !== 'đơn'){ speakTTS(w.word); return; }   // cụm: giọng trình duyệt en-US
  if(w.audio){
    new Audio(w.audio).play().catch(() => speakTTS(w.word));
    return;
  }
  fetchPhonetics(w).then(ok => {
    if(w.audio){ new Audio(w.audio).play().catch(() => speakTTS(w.word)); }
    else speakTTS(w.word);
    if(ok && fc && fc.w.id === w.id) updateFcIpa();
  });
}
/* Tra sẵn phiên âm cho mọi từ đơn còn thiếu — chạy nền sau khi đăng nhập,
   cách nhau 300ms để lịch sự với API. IPA hiện ra ngay, không cần bấm loa. */
let ipaQueueRunning = false;
async function prefetchPhonetics(){
  if(ipaQueueRunning) return;
  ipaQueueRunning = true;
  const user = currentUser;
  const targets = words.filter(w => w.kind === 'đơn' && !w.ipa && !ipaFailed.has(w.id));
  let found = 0;
  for(const w of targets){
    if(currentUser !== user) break;          // đổi người dùng → dừng
    if(await fetchPhonetics(w)){
      found++;
      if(fc && fc.w.id === w.id) updateFcIpa();
    }
    await new Promise(r => setTimeout(r, 300));
  }
  if(found && currentUser === user) renderTable();
  ipaQueueRunning = false;
}

function speakTTS(text){
  try{
    if(!('speechSynthesis' in window)) { toast(t('speakUnsupported')); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.92;
    const v = speechSynthesis.getVoices().find(v => v.lang === 'en-US')
           || speechSynthesis.getVoices().find(v => v.lang.startsWith('en-US'));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}
function save(){
  if(!currentUser || !words) return;
  if(!memoryOnly){
    try{ localStorage.setItem(lsKey(), JSON.stringify(words)); }
    catch(e){ memoryOnly = true; }
  }
  cloudSaveWords();
}

/* ═══════════════════════════════════════════════════════════
   BỘ LẬP LỊCH ƯU TIÊN (tự ghi nhận tần suất + thời gian học)
   ═══════════════════════════════════════════════════════════ */
function accuracy(w){ return w.stats.seen ? w.stats.correct / w.stats.seen : 0; }

/* ── §5 Mức độ ghi nhớ (giai đoạn học) & câu ngữ cảnh cloze ──
   Hiển thị theo nguyên tắc đã được nghiên cứu:
   - retrieval practice: gợi nhớ chủ động qua ô trống/cloze
   - encoding theo ngữ cảnh: từ luôn đi kèm câu ví dụ
   - phản hồi tức thì + theo dõi tiến độ: huy hiệu giai đoạn  */
function masteryOf(w){
  if(!w.stats.seen)            return { label:t('lvNew'),    cls:'lv-new'    };
  const iv = w.stats.interval || 0;
  if(iv < 3)                   return { label:t('lvLearn'),  cls:'lv-learn'  };
  if(iv < 14)                  return { label:t('lvKnown'),  cls:'lv-known'  };
  return                              { label:t('lvMaster'), cls:'lv-master' };
}
const lvBadge = w => { const m = masteryOf(w);
  return `<span class="lv ${m.cls}" title="${t('priorityTitle', Math.round(priorityScore(w)))}">${m.label}</span>`; };

function clozeHtml(w){            // câu ví dụ với từ bị che — mặt trước thẻ
  if(!w.sentence) return '';
  const i = w.sentence.toLowerCase().indexOf(w.word.toLowerCase());
  if(i < 0) return '';
  return esc(w.sentence.slice(0, i))
       + '<span class="blank">·····</span>'
       + esc(w.sentence.slice(i + w.word.length));
}
function highlightHtml(w){        // câu ví dụ với từ được tô sáng — mặt sau thẻ
  if(!w.sentence) return '';
  const i = w.sentence.toLowerCase().indexOf(w.word.toLowerCase());
  if(i < 0) return esc(w.sentence);
  return esc(w.sentence.slice(0, i))
       + '<mark>' + esc(w.sentence.slice(i, i + w.word.length)) + '</mark>'
       + esc(w.sentence.slice(i + w.word.length));
}

function priorityScore(w){
  const s = w.stats;
  let p = 10;

  if(s.seen === 0) p += 32;                       // từ mới → ưu tiên gặp sớm
  if(w.saved) p += 24;                            // từ ⭐ đang học → ưu tiên

  const acc = accuracy(w);
  p += (1 - acc) * 30;                            // hay sai → tăng tần suất
  if(w.saved && acc >= 0.9 && s.seen >= 4) p -= 20; // lưu nhưng đúng hết → giảm bớt

  const overdue = (now() - s.due) / DAY;          // SRS: đến hạn / quá hạn
  if(overdue >= 0) p += Math.min(34, 8 + overdue * 6);
  else p += Math.max(-26, overdue * 9);           // chưa đến hạn → hạ xuống

  if(s.avgTime > 9000) p += 12;                   // trả lời chậm = chưa thuộc
  else if(s.avgTime > 5000) p += 6;
  else if(s.avgTime > 0 && s.avgTime < 2500) p -= 4;

  p += Math.min(12, s.lapses * 3);                // hay quên (leech) → kèm thêm
  p -= Math.min(14, s.streak * 2);                // chuỗi đúng dài → giãn ra
  return Math.max(1, p);
}

let lastShownId = null;
function pickWord(pool){
  if(!pool.length) return null;
  let cands = pool.filter(w => w.id !== lastShownId);
  if(!cands.length) cands = pool;
  const weights = cands.map(w => Math.pow(priorityScore(w), 1.6));
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random() * total;
  for(let i=0;i<cands.length;i++){ r -= weights[i]; if(r<=0) return cands[i]; }
  return cands[cands.length-1];
}

/* grade: 0 = quên/sai · 1 = mơ hồ · 2 = nhớ/đúng
   charCount (tuỳ chọn): số ký tự đã gõ trong Luyện gõ — dùng để chuẩn hoá
   tốc độ theo ms/ký tự thay vì thời gian gõ tuyệt đối, tránh thiên vị
   từ ngắn (vốn gõ nhanh hơn từ dài dù mức độ thuộc từ là như nhau) */
function applyGrade(w, grade, timeMs, charCount){
  if(!w.stats) w.stats = newStats();
  const s = w.stats;
  if(!Array.isArray(s.times)) s.times = [];
  s.seen++; s.lastSeen = now();
  if(timeMs){
    s.times.push(timeMs);
    if(s.times.length > 20) s.times.shift();
    s.avgTime = Math.round(s.times.reduce((a,b)=>a+b,0) / s.times.length);
  }
  if(grade === 0){
    s.wrong++; s.streak = 0; s.lapses++;
    s.ease = Math.max(1.3, s.ease - 0.2);
    s.interval = 0;
    s.due = now() + 10*60*1000;                   // gặp lại sau ~10 phút
  }else if(grade === 1){
    s.correct++; s.streak++;
    s.ease = Math.max(1.3, s.ease - 0.05);
    s.interval = Math.max(0.5, (s.interval || 0.3) * 1.25);
    s.due = now() + s.interval * DAY;
  }else{
    s.correct++; s.streak++;
    const perChar = charCount ? timeMs / charCount : null;
    const isFast = perChar != null ? perChar < 180 : (timeMs && timeMs < 3000);
    if(isFast) s.ease = Math.min(2.9, s.ease + 0.08); // trả lời nhanh (chuẩn hoá theo độ dài nếu có)
    else s.ease = Math.min(2.8, s.ease + 0.03);
    s.interval = s.interval < 0.5 ? 1 : s.interval * s.ease;
    s.interval *= (0.95 + Math.random()*0.1);     // fuzz nhẹ chống dồn lịch
    s.interval = Math.min(s.interval, 180);
    s.due = now() + s.interval * DAY;
  }
  save(); renderStats();
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let sortBy = null, sortDir = 1;
let editingId = null;

function saveEdit(w){
  const word = $('#eWord').value.trim(), meaning = $('#eMeaning').value.trim();
  if(!word || !meaning){ toast(t('toastWordMeaningEmpty')); return; }

  w.group = $('#eGroup').value.trim();
  if(wordChanged || w.kind === 'cụm'){ w.ipa = ''; w.audio = ''; ipaFailed.delete(w.id); }
  save(); editingId = null; renderTable(); renderStats();
  toast(t('toastUpdated', w.word));
  if(w.kind === 'đơn' && !w.ipa) fetchPhonetics(w).then(ok => { if(ok) renderTable(); });
}
const lvRank = w => !w.stats.seen ? 0 : (w.stats.interval||0) < 3 ? 1 : (w.stats.interval||0) < 14 ? 2 : 3;

function renderTable(){
  const q = ($('#search').value||'').toLowerCase();
  const tb = $('#wordTbody');
  const gf = $('#groupFilter').value;
  let list = words.filter(w =>
    (!q || w.word.toLowerCase().includes(q) || w.meaning.toLowerCase().includes(q)
        || (w.note||'').toLowerCase().includes(q))
    && (gf === '' || (gf === '∅' ? !w.group : w.group === gf)));
  if(sortBy){
    const key = {
      word: w => w.word.toLowerCase(),
      kind: w => w.kind,
      acc:  w => w.stats.seen ? accuracy(w) : -1,
      lv:   w => lvRank(w),
    }[sortBy];
    list = [...list].sort((a,b) => {
      const ka = key(a), kb = key(b);
      return (ka < kb ? -1 : ka > kb ? 1 : 0) * sortDir;
    });
  }
  const gSel = $('#groupFilter'), keep = gSel.value;
  gSel.innerHTML = `<option value="">${t('nAllGroups')}</option>`
    + groupsOf().map(g => `<option value="${esc(g)}">${esc(g)}</option>`).join('')
    + `<option value="∅">${t('optNoGroup')}</option>`;
  gSel.value = [...gSel.options].some(o => o.value === keep) ? keep : '';
  $('#groupList').innerHTML = groupsOf().map(g => `<option value="${esc(g)}">`).join('');
  $$('th.sortable').forEach(th => {
    th.querySelector('.arrow').textContent =
      th.dataset.sort === sortBy ? (sortDir > 0 ? '▲' : '▼') : '';
  });
  if(!list.length){
    tb.innerHTML = `<tr><td colspan="10"><div class="empty">${I('leaf')}<br>${t('emptyWords')}</div></td></tr>`;
    return;
  }
  tb.innerHTML = list.map(w=>{
    const acc = w.stats.seen ? Math.round(accuracy(w)*100) : null;
    if(w.id === editingId){
      return `<tr class="edit-row"><td colspan="10">
        <div class="edit-grid">
          <label>${t('editWordLbl')}<input id="eWord" value="${esc(w.word)}"></label>
          <label>${t('nPosLbl')}<input id="ePos" value="${esc(w.pos)}"></label>
          <label>${t('nMeaningLbl')}<input id="eMeaning" value="${esc(w.meaning)}"></label>
          <label>${t('nSentenceLbl')}<input id="eSentence" value="${esc(w.sentence)}"></label>
          <label>${t('nNoteLbl')}<input id="eNote" value="${esc(w.note)}"></label>
          <label>${t('thKind')}<select id="eKind" class="themed">
            <option value="đơn" ${w.kind==='đơn'?'selected':''}>đơn</option>
            <option value="cụm" ${w.kind==='cụm'?'selected':''}>cụm</option></select></label>
          <label>${t('nGroupLbl')}<input id="eGroup" value="${esc(w.group)}" list="groupList"></label>
          <span class="edit-actions">
            <button class="btn mint sm" data-act="saveEdit" data-id="${w.id}">${I('check')}${t('save')}</button>
            <button class="btn ghost sm" data-act="cancelEdit" data-id="${w.id}">${t('cancel')}</button>
          </span>
        </div>
        <p class="muted" style="font-size:11.5px;margin:8px 0 0">${t('editHelp')}</p>
      </td></tr>`;
    }
    return `<tr>
      <td><button class="star-btn ${w.saved?'on':''}" data-act="star" data-id="${w.id}" title="${t('saveToLearning')}">${I('star')}</button></td>
      <td><div style="display:flex;align-items:center;gap:7px">
        <button class="speak-btn sm" data-act="say" data-id="${w.id}" title="${t('listenTitle')}">${I('sound')}</button>
        <div><span class="w">${esc(w.word)}</span>
          ${w.kind === 'đơn' && w.ipa ? `<br><span class="tb-ipa">${esc(w.ipa)}</span>` : ''}</div>
      </div></td>
      <td>${w.pos?`<span class="pos-tag">${esc(w.pos)}</span>`:''}</td>
      <td>${esc(w.meaning)}</td>
      <td class="mono" style="font-size:12.5px">${esc(w.sentence)}</td>
      <td class="muted" style="font-size:12.5px">${esc(w.note)}</td>
      <td><span class="kind-tag ${w.kind==='đơn'?'kind-don':'kind-cum'}">${w.kind}</span></td>
      <td>${acc===null
            ? '<span class="muted">—</span>'
            : `<span class="acc-bar"><span class="acc-fill" style="width:${acc}%"></span></span> <span class="mono" style="font-size:11.5px">${acc}%</span>`}
      </td>
      <td>${lvBadge(w)}</td>
      <td style="white-space:nowrap">
        <button class="icon-btn" data-act="edit" data-id="${w.id}" title="${t('edit')}">${I('edit')}</button>
        <button class="icon-btn" data-act="del" data-id="${w.id}" title="${t('delete')}">${I('trash')}</button></td>
    </tr>`;
  }).join('');
}

  toast(t('sentAdded', topic));
});
['sTopic','sChain','sSentence'].forEach(id =>
  $('#' + id).addEventListener('keydown', e => {

function clearSentForm(){

}
$('#btnSentClear').addEventListener('click', clearSentForm);

let sentEditingId = null;

$('#sentSearch').addEventListener('input', renderSentTable);
$('#topicFilter').addEventListener('change', renderSentTable);
$('#sentTbody').addEventListener('keydown', e=>{
  if(!e.target.closest('.edit-row')) return;
  if(e.key === 'Enter'){
    e.preventDefault();
    const s = sentences.find(x=>x.id===sentEditingId);

function saveSentEdit(s){
  const topic = $('#esTopic').value.trim(), sentence = $('#esSentence').value.trim();
  if(!topic || !sentence){ toast(t('sentNeedFields')); return; }
  s.topic = topic; s.chain = $('#esChain').value.trim(); s.sentence = sentence;
  saveSentences(); sentEditingId = null; renderSentTable();
  toast(t('sentUpdated'));
}
$('#sentTbody').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  const s = sentences.find(x=>x.id===b.dataset.id); if(!s) return;
  if(b.dataset.act==='edit'){

    sentEditingId = null; renderSentTable();
  }else if(b.dataset.act==='saveEdit'){
    saveSentEdit(s);

$('#btnSentImport').addEventListener('click', ()=>$('#sentFileInput').click());
$('#sentFileInput').addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{

$('#btnSentExport').addEventListener('click', ()=>{

/* ═══════════════════════════════════════════════════════════
   TAB LUYỆN VIẾT — viết câu tự do + kiểm tra chính tả (LanguageTool)
   ═══════════════════════════════════════════════════════════ */
let writeState = null;
let lastWriteId = null;

function startWrite(){
  const area = $('#writeArea');
  if(!sentences.length){
    area.innerHTML = `<div class="panel"><div class="empty">${I('leaf')}<br>${t('writeEmpty')}</div></div>`;
    writeState = null; return;
  }
  let cands = sentences.filter(s => s.id !== lastWriteId);
  if(!cands.length) cands = sentences;
  const s = cands[Math.floor(Math.random() * cands.length)];
  lastWriteId = s.id;
  writeState = { s };
  renderWrite();
}

function topicColor(topic){
  let h = 0;
  for(const ch of (topic || '?')) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return PALETTE[h % PALETTE.length];
}
function renderWrite(){
  const { s } = writeState;
  const chainChips = (s.chain || '').split(',').map(x => x.trim()).filter(Boolean);
  $('#writeArea').innerHTML = `
    <div class="w-card">
      <div class="w-topic-row">
        <span class="w-topic-badge" style="background:${topicColor(s.topic)}">${I('pin')}${esc(s.topic || t('writeNoTopic'))}</span>
      </div>
      ${chainChips.length ? `<div class="w-chain">${chainChips.map((c,i) =>
        (i ? '<span class="w-chain-arrow">→</span>' : '')
        + `<span class="w-chain-chip" style="background:${PALETTE[i % PALETTE.length]}">`
        + `<span class="num">${i+1}</span>${esc(c)}</span>`).join('')}</div>` : ''}
      <div class="w-sample"><span class="w-quote open">“</span>${esc(s.sentence)}<span class="w-quote close">”</span></div>
    </div>
    <div class="write-box" id="writeBox" contenteditable="true" data-placeholder="${esc(t('writePlaceholder'))}"></div>
    <div class="quiz-actions">
      <button class="btn primary" id="btnWriteCheck">${I('check')}${t('writeCheckBtn')}</button>
      <button class="btn ghost" id="btnWriteNext">${t('writeNextBtn')} ${I('next')}</button>
    </div>
    <div class="feedback" id="writeFb"></div>`;
  const box = $('#writeBox');
  box.addEventListener('keydown', e=>{
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); checkWrite(); }
  });
  $('#btnWriteCheck').addEventListener('click', checkWrite);
  $('#btnWriteNext').addEventListener('click', startWrite);
  box.focus();
}

async function checkWrite(){
  const box = $('#writeBox');
  const text = (box.innerText || '').trim();
  const fb = $('#writeFb');
  if(!text){ toast(t('writeEmptyInput')); return; }
  fb.className = 'feedback show'; fb.textContent = t('writeChecking');
  try{
    const params = new URLSearchParams({ text, language: 'en-US' });
    const r = await fetch('https://api.languagetool.org/v2/check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: params,
    });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const matches = (data.matches || []).filter(m => m.rule && m.rule.issueType === 'misspelling');
    renderWriteResult(text, matches);
  }catch(e){
    fb.className = 'feedback show bad';
    fb.textContent = t('writeCheckFailed');
  }
}

function renderWriteResult(text, matches){
  const box = $('#writeBox');
  matches = matches.slice().sort((a,b) => a.offset - b.offset);
  let html = '', pos = 0;
  for(const m of matches){
    if(m.offset < pos) continue;
    html += esc(text.slice(pos, m.offset));
    html += '<span class="sp-err">' + esc(text.slice(m.offset, m.offset + m.length)) + '</span>';
    pos = m.offset + m.length;
  }
  html += esc(text.slice(pos));
  box.innerHTML = html || esc(text);
  try{
    const range = document.createRange(), sel = window.getSelection();
    range.selectNodeContents(box); range.collapse(false);
    sel.removeAllRanges(); sel.addRange(range);
  }catch(e){}
  const fb = $('#writeFb');
  fb.className = 'feedback show ' + (matches.length ? 'bad' : 'good');
  fb.innerHTML = matches.length
    ? `${I('x')} ${t('writeErrorsFound', matches.length)}`
    : `${I('check')} ${t('writeNoErrors')}`;
}

/* ═══════════════════════════════════════════════════════════
   TAB LUYỆN GÕ
   ═══════════════════════════════════════════════════════════ */
let quiz = null;          // {w, mode, startAt, hintUsed, typed[], pickedIdx[]}
let quizStreak = 0;

function fillGroupSelect(sel){
  const keep = sel.value;
  sel.innerHTML = `<option value="">${t('nAllGroups')}</option>`
    + groupsOf().map(g => `<option value="${esc(g)}">${esc(g)}</option>`).join('');
  sel.value = [...sel.options].some(o => o.value === keep) ? keep : '';
}
function quizPool(){
  const savedOnly = $('#quizSavedOnly').checked;
  const g = $('#quizGroup').value;
  return words.filter(w => (!savedOnly || w.saved) && (!g || w.group === g));
}

function startQuiz(){
  const pool = quizPool();
  const area = $('#quizArea');
  if(!pool.length){
    area.innerHTML = `<div class="panel"><div class="empty">${I('leaf')}<br>
      ${t('emptyQuiz', $('#quizSavedOnly').checked ? t('qExtraSaved') : '')}</div></div>`;
    quiz = null; return;
  }
  const w = pickWord(pool);
  lastShownId = w.id;
  quiz = { w, mode: w.kind, startAt: now(), hintUsed:false, typed:[], pickedIdx:[],
           phraseMode: localStorage.getItem('soTuPhraseMode_v1') === 'type' ? 'type' : 'chips',
           typedPhrase: '' };
  if(w.kind === 'đơn'){
    const letters = w.word.toLowerCase().split('');
    quiz.shuffled = shuffle(letters.map((ch,i)=>({ch,i})).filter(x=>x.ch!==' '));
  }else{
    const ws = w.word.split(/\s+/);
    quiz.shuffled = shuffle(ws.map((t,i)=>({t,i})));
  }
  renderQuiz();
}

function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

const normPhrase = t => t.toLowerCase().replace(/[.,!?;:"""'’]/g, ' ').replace(/\s+/g, ' ').trim();

function renderQuiz(){
  const {w} = quiz;
  const hint = quiz.hintUsed
    ? `<div class="hintline">${I('bulb')} ${w.kind==='đơn'
        ? t('qHintStart', esc(w.word[0]), w.word.replace(/ /g,'').length)
        : t('qHintFirstWord', esc(w.word.split(/\s+/)[0]))}
        ${w.note?` · ${esc(w.note)}`:''}</div>`
    : '';
  const promptHtml = `
    <div class="q-prompt">
      <div class="label">${w.kind==='đơn'?t('qLabelSingle'):t('qLabelPhrase')}</div>
      <div class="meaning">${esc(w.meaning)} ${w.pos?`<span class="pos-tag">${esc(w.pos)}</span>`:''} ${w.saved?`<svg class="ic" style="fill:#FFC83D;width:18px;height:18px"><use href="#i-star"/></svg>`:''}</div>
      ${w.kind==='cụm' && w.sentence && w.sentence.toLowerCase()!==w.word.toLowerCase()
        ? `<div class="hintline">${t('qExample')} <span class="mono">${esc(w.sentence)}</span></div>` : ''}
      ${hint}
    </div>`;

  let bodyHtml = '';
  if(w.kind === 'đơn'){
    bodyHtml = `
      <div class="tiles" id="tiles">${tilesHtml()}</div>
      <div class="chips" id="chips">${quiz.shuffled.map((o,idx)=>
        `<span class="chip-w letter ${quiz.pickedIdx.includes(idx)?'used':''}" data-idx="${idx}">${esc(o.ch)}</span>`).join('')}
      </div>
      <p class="muted" style="text-align:center;font-size:12px;margin-bottom:14px">${t('qTilesHelp')}</p>`;
  }else{
    const pills = `
      <div class="mode-pills">
        <button class="mode-pill ${quiz.phraseMode==='chips'?'on':''}" data-pm="chips">${t('qModeChips')}</button>
        <button class="mode-pill ${quiz.phraseMode==='type'?'on':''}" data-pm="type">${t('qModeType')}</button>
      </div>`;
    if(quiz.phraseMode === 'type'){
      bodyHtml = pills + `
        <input class="phrase-input" id="phraseInput" autocomplete="off" spellcheck="false"
          placeholder="${esc(t('qPhrasePh'))}"
          value="${esc(quiz.typedPhrase)}">`;
    }else{
      bodyHtml = pills + `
        <div class="answer-line" id="ansLine">${quiz.pickedIdx.length
          ? quiz.pickedIdx.map((idx,k)=>`<span class="chip-w" data-k="${k}">${esc(quiz.shuffled[idx].t)}</span>`).join('')
          : `<span class="placeholder">${t('qAnsPlaceholder')}</span>`}
        </div>
        <div class="chips" id="chips">${quiz.shuffled.map((o,idx)=>
          `<span class="chip-w ${quiz.pickedIdx.includes(idx)?'used':''}" data-idx="${idx}">${esc(o.t)}</span>`).join('')}
        </div>`;
    }
  }

  $('#quizArea').innerHTML = `
    ${promptHtml}
    ${bodyHtml}
    <div class="quiz-actions">
      <button class="btn lemon" id="btnHint" ${quiz.hintUsed?'disabled':''}>${I('bulb')}${t('qHintBtn')}</button>
      <button class="btn primary" id="btnCheck">${I('check')}${t('qCheckBtn')}</button>
      <button class="btn ghost" id="btnSkip">${t('qSkipBtn')} ${I('next')}</button>
    </div>
    <div class="feedback" id="quizFb"></div>`;

  $('#btnCheck').addEventListener('click', checkQuiz);
  $('#btnSkip').addEventListener('click', ()=>{ applyGrade(quiz.w, 0); startQuiz(); });
  $('#btnHint').addEventListener('click', ()=>{ quiz.hintUsed = true; renderQuiz(); });
  $$('#quizArea .mode-pill').forEach(p => p.addEventListener('click', () => {
    if(quiz.graded || quiz.phraseMode === p.dataset.pm) return;
    quiz.phraseMode = p.dataset.pm;
    try{ localStorage.setItem('soTuPhraseMode_v1', quiz.phraseMode); }catch(e){}
    quiz.pickedIdx = []; quiz.typedPhrase = '';        // đổi chế độ → làm lại từ đầu, giữ đồng hồ
    renderQuiz();
  }));
  const pIn = $('#phraseInput');
  if(pIn){
    pIn.addEventListener('input', () => {
      quiz.typedPhrase = pIn.value;
      const a = normPhrase(pIn.value), b = normPhrase(quiz.w.word);
      if(a === b || a.length >= b.length) { autoCheck(true); }
    });
    pIn.addEventListener('keydown', e => {
      if(e.key === 'Enter'){ e.preventDefault(); if(!quiz.graded) checkQuiz(); }
    });
    if(!quiz.graded) pIn.focus();
  }
  const chipsEl = $('#chips');
  if(chipsEl) chipsEl.addEventListener('click', e=>{
    if(quiz.graded) return;
    const c = e.target.closest('.chip-w'); if(!c || c.classList.contains('used')) return;
    quiz.pickedIdx.push(+c.dataset.idx);
    if(quiz.mode==='đơn') quiz.typed.push(quiz.shuffled[+c.dataset.idx].ch);
    renderQuiz();
    autoCheck();
  });
  const ans = $('#ansLine');
  if(ans) ans.addEventListener('click', e=>{
    if(quiz.graded) return;
    const c = e.target.closest('.chip-w'); if(!c) return;
    quiz.pickedIdx.splice(+c.dataset.k, 1);
    renderQuiz();
  });
}

/* Tự động kiểm tra khi hoàn tất chữ cái / từ cuối cùng */
function autoCheck(fromTyping){
  if(!quiz || quiz.graded) return;
  if(quiz.mode === 'đơn'){
    const maxLen = quiz.w.word.replace(/ /g,'').length;
    if(quiz.typed.length >= maxLen) checkQuiz();
  }else if(quiz.phraseMode === 'type'){
    if(fromTyping) checkQuiz();
  }else{
    if(quiz.pickedIdx.length >= quiz.shuffled.length) checkQuiz();
  }
}

function tilesHtml(){
  const target = quiz.w.word.toLowerCase();
  let typedPos = 0, html = '', cursorSet = false;
  for(const ch of target){
    if(ch === ' '){ html += '<span class="tile space"></span>'; continue; }
    const t = quiz.typed[typedPos];
    const isCursor = !cursorSet && t === undefined;
    if(isCursor) cursorSet = true;
    html += `<span class="tile ${t?'filled':''} ${isCursor?'cursor':''}">${t?esc(t):''}</span>`;
    typedPos++;
  }
  return html;
}

document.addEventListener('keydown', e=>{
  if(!quiz) return;
  if(!$('#tab-quiz').classList.contains('active')) return;
  if(e.target.matches('input,textarea,select')) return;
  if(quiz.graded){ if(e.key === 'Enter') startQuiz(); return; }
  if(quiz.mode !== 'đơn') return;
  if(e.key === 'Enter'){ checkQuiz(); return; }
  if(e.key === 'Backspace'){
    quiz.typed.pop(); quiz.pickedIdx.pop(); renderQuiz(); return;
  }
  if(/^[a-zA-ZÀ-ỹ'’-]$/.test(e.key)){
    const maxLen = quiz.w.word.replace(/ /g,'').length;
    if(quiz.typed.length >= maxLen) return;
    quiz.typed.push(e.key.toLowerCase());
    // đánh dấu chip tương ứng nếu có
    const free = quiz.shuffled.findIndex((o,idx)=>!quiz.pickedIdx.includes(idx) && o.ch===e.key.toLowerCase());
    quiz.pickedIdx.push(free); // -1 nếu chữ không có trong chip — vẫn cho gõ
    renderQuiz();
    autoCheck();
  }
});

function checkQuiz(){
  if(!quiz || quiz.graded) return;
  quiz.graded = true;
  const {w} = quiz;
  const timeMs = now() - quiz.startAt;
  let userAns, correct;
  if(w.kind === 'đơn'){
    userAns = quiz.typed.join('');
    correct = userAns === w.word.toLowerCase().replace(/ /g,'');
  }else if(quiz.phraseMode === 'type'){
    const pIn = $('#phraseInput');
    userAns = pIn ? pIn.value : quiz.typedPhrase;
    correct = normPhrase(userAns) === normPhrase(w.word);
    if(pIn){ pIn.disabled = true; pIn.blur(); }       // nhả Enter cho "từ tiếp theo"
  }else{
    userAns = quiz.pickedIdx.map(i=>quiz.shuffled[i].t).join(' ');
    correct = userAns.toLowerCase() === w.word.toLowerCase();
  }
  const charCount = w.kind === 'đơn'
    ? w.word.replace(/ /g,'').length
    : normPhrase(w.word).replace(/\s/g,'').length;
  const fb = $('#quizFb');
  if(correct){
    quizStreak++;
    applyGrade(w, quiz.hintUsed ? 1 : 2, timeMs, charCount);
    const wpm = charCount ? Math.round((charCount/5) / (timeMs/60000)) : null;
    fb.className = 'feedback show good';
    fb.innerHTML = `${I('check')} ${t('qCorrect')} <span class="ans">${esc(w.word)}</span>
      ${w.sentence?` — <span class="mono">${esc(w.sentence)}</span>`:''}
      <span class="muted">(${(timeMs/1000).toFixed(1)}s${wpm?` · ~${wpm} WPM`:''}${quiz.hintUsed?' '+t('qHintUsedSuffix'):''})</span>`;
    $$('#tiles .tile:not(.space)').forEach(t=>t.classList.add('ok'));
    setTimeout(startQuiz, 1400);
  }else{
    quizStreak = 0;
    applyGrade(w, 0, timeMs, charCount);
    fb.className = 'feedback show bad';
    fb.innerHTML = `${I('x')} ${t('qWrong')} <span class="ans">${esc(w.word)}</span>
      ${w.note?`<br>${I('pin')} ${esc(w.note)}`:''}<br>
      <button class="btn sm mint" style="margin-top:8px" onclick="startQuiz()">${t('qNextWord')} ${I('next')}</button>`;
    $$('#tiles .tile:not(.space)').forEach(t=>t.classList.add('bad'));
  }
  $('#quizStreak').textContent = quizStreak;
}
$('#quizSavedOnly').addEventListener('change', startQuiz);
$('#quizGroup').addEventListener('change', startQuiz);

/* ═══════════════════════════════════════════════════════════
   TAB FLASHCARD — trắc nghiệm chọn nghĩa đúng
   ═══════════════════════════════════════════════════════════ */
let fc = null; // {w, opts, correctIdx, startAt, answered, picked, flipped}

function fcPool(){
  const savedOnly = $('#fcSavedOnly').checked;
  const g = $('#fcGroup').value;
  return words.filter(w => (!savedOnly || w.saved) && (!g || w.group === g));
}

/* Tạo 4 phương án: 1 nghĩa đúng + 3 nghĩa nhiễu
   (ưu tiên cùng nhóm > cùng loại đơn/cụm — nhiễu càng "gần" càng khó đoán mò) */
function buildOptions(w){
  const seen = new Set([w.meaning.toLowerCase()]);
  const rank = x => (x.group && x.group === w.group ? 2 : 0) + (x.kind === w.kind ? 1 : 0);
  const cands = shuffle(words.filter(x => x.id !== w.id && x.meaning))
                  .sort((a,b) => rank(b) - rank(a));
  const distract = [];
  for(const x of cands){
    const m = x.meaning.trim();
    if(!m || seen.has(m.toLowerCase())) continue;
    seen.add(m.toLowerCase());
    distract.push(m);
    if(distract.length === 3) break;
  }
  const opts = shuffle([w.meaning, ...distract]);
  return { opts, correctIdx: opts.indexOf(w.meaning) };
}

function startFc(){
  const pool = fcPool();
  const area = $('#fcArea');
  if(!pool.length){
    area.innerHTML = `<div class="panel"><div class="empty">${I('leaf')}<br>
      ${t('emptyFc', $('#fcSavedOnly').checked ? t('qExtraSaved') : '')}</div></div>`;
    fc = null; return;
  }
  const w = pickWord(pool);
  lastShownId = w.id;
  const { opts, correctIdx } = buildOptions(w);
  fc = { w, opts, correctIdx, startAt: now(), answered:false, picked:-1, flipped:false };
  renderFc();
}

          </div>
          ${answered ? (fc.picked === fc.correctIdx

      · ${w.stats.interval ? t('fcReviewIn', `<b class="mono">${w.stats.interval<1?t('fcToday'):t('fcDays', Math.round(w.stats.interval))}</b>`) : t('fcNewCard')}
