/* ═════════════ DỊCH NHANH (Google Dịch) ═════════════
   Tự nhận diện Anh ↔ Việt (dấu tiếng Việt / ngôn ngữ Google trả về), hiện nghĩa
   khác theo từ loại, nghe phát âm, sao chép và thêm thẳng vào sổ từ vựng. */
const tr = { dir: 'auto', from: 'en', to: 'vi', q: '', res: null, pick: '', reqId: 0, timer: null };
const VI_RE = /[ăâđêôơưàảãáạằẳẵắặầẩẫấậèẻẽéẹềểễếệìỉĩíịòỏõóọồổỗốộờởỡớợùủũúụừửữứựỳỷỹýỵ]/i;
const TR_POS = { verb:'v', 'động từ':'v', noun:'n', 'danh từ':'n', adjective:'adj', 'tính từ':'adj', adverb:'adv', 'trạng từ':'adv',
  preposition:'prep', 'giới từ':'prep', pronoun:'pron', 'đại từ':'pron', conjunction:'conj', 'liên từ':'conj', phrase:'phrase', 'cụm từ':'phrase' };
async function trFetch(q, sl, tl){
  try{
    const u = 'https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&dt=bd&sl=' + sl + '&tl=' + tl
      + '&hl=' + (LANG === 'vi' ? 'vi' : 'en') + '&q=' + encodeURIComponent(q);
    const r = await fetch(u);
    if(!r.ok) throw 0;
    const d = await r.json();
    return {
      text: (d[0] || []).map(x => x && x[0] || '').join('').trim(),
      src: d[2] || sl,
      /* d[1]: [từ loại, [nghĩa…], [[nghĩa, [dịch ngược…], _, điểm tần suất?], …]] — Google xếp nghĩa
         phổ biến lên trước và chỉ gắn điểm cho những nghĩa dùng nhiều */
      alts: (d[1] || []).map(g => ({ pos: g[0] || '', terms: (g[2] || (g[1] || []).map(x => [x])).slice(0, 8).map((e, i) => ({
        w: e[0], back: (e[1] || []).slice(0, 4), common: i === 0 || typeof e[3] === 'number' })) })).filter(g => g.terms.length),
    };
  }catch(e){                                     // dự phòng: MyMemory
    const from = sl === 'auto' ? (VI_RE.test(q) ? 'vi' : 'en') : sl;
    const r = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(q) + '&langpair=' + from + '|' + tl);
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    const text = d && d.responseData && d.responseData.translatedText;
    if(!text) throw new Error('empty');
    return { text, src: from, alts: [] };
  }
}
async function trRun(force){
  const q = $('#trIn').value.trim();
  if(!q){ tr.q = ''; tr.res = null; trRender(); return; }
  if(q === tr.q && tr.res && !force) return;
  const id = ++tr.reqId;
  tr.q = q; tr.res = { loading: true }; tr.pick = ''; trRender();
  try{
    let from, to, res;
    if(tr.dir === 'auto'){
      from = VI_RE.test(q) ? 'vi' : 'en'; to = from === 'vi' ? 'en' : 'vi';
      res = await trFetch(q, 'auto', to);
      if(id !== tr.reqId) return;
      if(res.src === to){ from = to; to = from === 'vi' ? 'en' : 'vi'; res = await trFetch(q, from, to); }   // đoán sai chiều → dịch lại
      else from = res.src === 'vi' ? 'vi' : 'en';
    }else{
      [from, to] = tr.dir.split('-');
      res = await trFetch(q, from, to);
    }
    if(id !== tr.reqId) return;
    tr.from = from; tr.to = to; tr.res = res;
  }catch(e){
    if(id !== tr.reqId) return;
    tr.res = { error: true };
  }
  trRender();
}
function trRender(){
  $('#trFrom').textContent = tr.from.toUpperCase();
  $('#trTo').textContent = tr.to.toUpperCase();
  $('#trDir').title = t('trSwap') + ' · ' + (tr.dir === 'auto' ? t('trAuto') : t('trManual'));
  $('#trDir').classList.toggle('auto', tr.dir === 'auto');
  const out = $('#trOut'), r = tr.res;
  const q = $('#trIn').value.trim();
  $('#trGoogle').href = 'https://translate.google.com/?sl=' + (tr.dir === 'auto' ? 'auto' : tr.from) + '&tl=' + tr.to + '&op=translate&text=' + encodeURIComponent(q);
  const ready = r && !r.loading && !r.error && r.text;

/* ═════════════ TRA DẠNG TỪ & ĐỒNG / TRÁI NGHĨA ═════════════
   Hai mục tìm kiếm riêng, mỗi mục có ô nhập và kết quả của nó:
   - Dạng từ: họ từ cùng gốc (decide → decision, decisive, indecisive…) chia theo từ loại, cộng

const lx = { tab: 'forms', forms: { q: '', res: null, reqId: 0 }, syn: { q: '', res: null, reqId: 0 } };
const LX_DER = new Set(('ss ly ily ion ions tion sion ation ations ition ive ives ative itive sive tive ness iness ment ments able ible '
  + 'ably ibly abilities ability ibility ility ilities al als ally ial ially ity ities ality ize ise izes ises ization isation ful fully '
  + 'less lessly lessness ous ously ious iously ence ences ency ance ances ancy ent ents ant ants ently antly ic ics ical ically ism '
  + 'isms ist ists ure ures age ery ory ee or ors ship hood ward wards wise ate ates ator ators ary ish sis tic tical tically ify '
  + 'ifies ification nation nations').split(' '));
const LX_INF = new Set('s es d ed ing ings r er ers st est ies ied'.split(' '));
const LX_WREM = new Set(['', 'e', 'y', 'de', 'te', 'se', 'ce', 've', 'le', 're', 'ze', 'ate', 'in']);   // đuôi của từ gốc có thể rụng

  + 'take took taken|see saw seen|come came|give gave given|find found|tell told|become became|leave left|feel felt|bring brought|'
  + 'begin began begun|keep kept|hold held|write wrote written|stand stood|hear heard|let|mean meant|set|meet met|run ran|pay paid|'
  + 'sit sat|speak spoke spoken|lie lay lain|lead led|read|grow grew grown|lose lost|fall fell fallen|send sent|build built|'
  + 'understand understood|draw drew drawn|break broke broken|spend spent|cut|rise rose risen|drive drove driven|buy bought|wear wore worn|'
  + 'choose chose chosen|seek sought|throw threw thrown|catch caught|deal dealt|win won|forget forgot forgotten|lend lent|teach taught|'
  + 'eat ate eaten|drink drank drunk|sing sang sung|swim swam swum|fly flew flown|hide hid hidden|ride rode ridden|shake shook shaken|'
  + 'steal stole stolen|wake woke woken|fight fought|feed fed|sleep slept|sell sold|shoot shot|shine shone|bite bit bitten|'
  + 'blow blew blown|freeze froze frozen|forgive forgave forgiven|hang hung|hurt|put|quit|shut|spread|strike struck|swear swore sworn|'
  + 'tear tore torn|bear bore borne|beat beaten|bend bent|bind bound|bleed bled|breed bred|burn burnt|dig dug|dream dreamt|'
  + 'flee fled|forbid forbade forbidden|grind ground|kneel knelt|lay laid|lean leant|leap leapt|light lit|mistake mistook mistaken|'
  + 'overcome overcame|ring rang rung|seek sought|sew sewn|shrink shrank shrunk|sink sank sunk|slide slid|spin spun|split|'
  + 'spring sprang sprung|stick stuck|sting stung|stink stank stunk|strive strove striven|sweep swept|swing swung|tread trod trodden|'
  + 'undergo underwent undergone|undertake undertook undertaken|withdraw withdrew withdrawn|good better best|bad worse worst|'
  + 'far farther further farthest furthest|little less least|many more most|much more most').split('|').map(g => g.split(' '));
const lxLcp = (a, b) => { let i = 0; while(i < a.length && i < b.length && a[i] === b[i]) i++; return i; };
const lxDecoMemo = new Map();
function lxDeco(r, afterInf){             // r có tách được thành chuỗi hậu tố hợp lệ không
  if(!r) return true;
  if(afterInf) return r === 'ly' || r === 'ness';   // sau hậu tố biến thể chỉ còn -ly / -ness (decidedly)
  if(lxDecoMemo.has(r)) return lxDecoMemo.get(r);
  let ok = false;
  for(const x of LX_DER) if(r.startsWith(x) && lxDeco(r.slice(x.length))){ ok = true; break; }
  if(!ok) for(const x of LX_INF) if(r.startsWith(x) && lxDeco(r.slice(x.length), true)){ ok = true; break; }
  lxDecoMemo.set(r, ok);
  return ok;
}
function lxRelated(w, c){
  if(c === w) return true;
  for(const p of ['', ...LX_NEG]){
    if(p && !c.startsWith(p)) continue;
    const cc = c.slice(p.length), i = lxLcp(w, cc);
    if(i < 3 || i < w.length - 2) continue;
    const wr = w.slice(i), cr = cc.slice(i);
    if(wr[0] === 'y' && cr[0] === 'i' && lxDeco(cr.slice(1))) return true;          // happy → happiness
    if(!(LX_WREM.has(wr) || lxDeco(wr))) continue;
    if(cr.startsWith('ss') && !wr) continue;                                        // care ≠ caress
    if(lxDeco(cr) || (LX_CW.has(cr) && wr && lxDeco(wr))) return true;
  }

}
function lxBases(w){                      // từ gốc + các dạng đã bỏ một hậu tố (decision → decis, deci)
  const bs = [w];
  for(let k = 4; k < w.length; k++){ const r = w.slice(k);
    if(LX_DER.has(r) || ['s', 'es', 'ed', 'ing', 'ies', 'ied'].includes(r)) bs.push(w.slice(0, k)); }
  return bs;
}
function lxIsInfl(b, c){                  // c là biến thể ngữ pháp của b (-s, -ed, -ing, -er, -est)
  if(c === b) return false;
  const i = lxLcp(b, c), wr = b.slice(i), cr = c.slice(i);
  if(!wr){
    if(['s', 'es', 'ed', 'ing', 'er', 'est'].includes(cr)) return true;
    if(b.endsWith('e') && ['d', 'r', 's', 'st'].includes(cr)) return true;
    if(cr.length >= 3 && cr[0] === b[b.length - 1] && ['ed', 'ing', 'er', 'est'].includes(cr.slice(1))) return true;   // stop → stopped
  }
  if(wr === 'e' && ['ed', 'ing', 'er', 'est'].includes(cr)) return true;
  if(wr === 'y' && ['ies', 'ied', 'ier', 'iest'].includes(cr)) return true;
  return false;
}
async function lxDm(params){
  const r = await fetch('https://api.datamuse.com/words?' + params);
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
const lxFreq = x => { const f = (x.tags || []).find(s => s.startsWith('f:')); return f ? parseFloat(f.slice(2)) || 0 : 0; };
const lxPosOf = x => (x.tags || []).map(s => s.toLowerCase()).find(s => ['n', 'v', 'adj', 'adv'].includes(s)) || 'other';
async function lxForms(q){
  const n = q.length, bs = lxBases(q), root = bs.reduce((a, b) => b.length < a.length ? b : a);
  let P = n <= 3 ? q : q.slice(0, Math.max(Math.min(4, n - 1), Math.min(5, n - 2)));
  if(lxLcp(P, root) >= 3) P = P.slice(0, lxLcp(P, root));
  const lists = await Promise.all([lxDm('sp=' + P + '*&md=pf&max=1000'), lxDm('sp=*' + P + '*&md=pf&max=1000'), lxDm('sp=' + q + '&md=pf&max=1')]);
  const seen = new Map();
  lists.flat().forEach(x => { if(!seen.has(x.word)) seen.set(x.word, x); });
  const by = { n: [], v: [], adj: [], adv: [], infl: [], other: [] }, irr = LX_IRR.find(g => g.includes(q) || bs.some(b => g[0] === b));
  for(const x of seen.values()){
    const c = x.word;
    if(!/^[a-z]+$/.test(c) || (x.tags || []).includes('prop')) continue;
    if(c !== q && lxFreq(x) < 0.3) continue;
    if(!bs.some(b => lxRelated(b, c))) continue;
    const g = c !== q && bs.some(b => lxIsInfl(b, c)) ? 'infl' : lxPosOf(x);
    by[g].push({ w: c, f: lxFreq(x) });
  }
  if(irr) irr.forEach(f => { if(f !== q && !by.infl.some(x => x.w === f)) by.infl.push({ w: f, f: 1e6 }); });
  if(!Object.values(by).some(l => l.some(x => x.w === q))) by.other.unshift({ w: q, f: 1e9 });
  return ['n', 'v', 'adj', 'adv', 'infl', 'other'].map(k => ({ lbl: k === 'infl' ? 'lxInfl' : 'lxPos_' + k,
    items: by[k].sort((a, b) => b.f - a.f).slice(0, 18).map(x => x.w) })).filter(g => g.items.length);
}
async function lxSyns(q){
  const enc = encodeURIComponent(q);
  const [syn, ant, self, dict] = await Promise.all([lxDm('rel_syn=' + enc + '&md=p&max=40'), lxDm('rel_ant=' + enc + '&md=p&max=20'),
    lxDm('sp=' + enc + '&md=p&max=1'),
    fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + enc).then(r => r.ok ? r.json() : []).catch(() => [])]);
  const S = {}, A = {};
  const add = (M, pos, w) => { w = String(w || '').trim(); if(!w || w.toLowerCase() === q) return;
    const l = M[pos] || (M[pos] = []); if(!l.some(x => x.toLowerCase() === w.toLowerCase())) l.push(w); };
  (Array.isArray(dict) ? dict : []).forEach(e => (e.meanings || []).forEach(m => {
    const pos = LX_POS[m.partOfSpeech] || 'other';
    (m.synonyms || []).forEach(w => add(S, pos, w)); (m.antonyms || []).forEach(w => add(A, pos, w));
    (m.definitions || []).forEach(d => { (d.synonyms || []).forEach(w => add(S, pos, w)); (d.antonyms || []).forEach(w => add(A, pos, w)); });
  }));
  /* Datamuse gắn từ loại của chính từ đồng/trái nghĩa (content → danh từ) → quy về từ loại của từ đang tra */
  const own = (((self[0] || {}).word === q && self[0].tags) || []).map(x => x.toLowerCase()).filter(x => ['n', 'v', 'adj', 'adv'].includes(x));
  Object.keys(S).concat(Object.keys(A)).forEach(p => { if(p !== 'other' && !own.includes(p)) own.push(p); });
  const posFor = x => { const ts = (x.tags || []).map(s => s.toLowerCase()); return own.find(p => ts.includes(p)) || own[0] || lxPosOf(x); };
  syn.forEach(x => add(S, posFor(x), x.word));
  ant.forEach(x => add(A, posFor(x), x.word));
  const order = ['n', 'v', 'adj', 'adv', 'other'];
  const groups = [];
  order.forEach(p => { if(S[p]) groups.push({ lbl: 'lxSyn', pos: p, items: S[p].slice(0, 18) }); });
  if(!groups.length){
    const near = (await lxDm('ml=' + enc + '&md=p&max=30')).filter(x => !/\s/.test(x.word) || q.includes(' '));
    const N = {}; near.forEach(x => add(N, lxPosOf(x), x.word));
    groups.push({ note: 'lxNoSyn' });
    order.forEach(p => { if(N[p]) groups.push({ lbl: 'lxNear', pos: p, items: N[p].slice(0, 12) }); });
  }
  const ants = order.filter(p => A[p]).map(p => ({ lbl: 'lxAnt', pos: p, items: A[p].slice(0, 18) }));
  return groups.concat(ants.length ? ants : [{ note: 'lxNoAnt' }]);
}
const lxIn = kind => $(kind === 'forms' ? '#lxInForms' : '#lxInSyn');
async function lxRun(kind, force){
  const st = lx[kind];

  if(!q){ st.q = ''; st.res = null; lxRender(kind); return; }
  if(q === st.q && st.res && !force) return;
  const id = ++st.reqId;
  st.q = q;
  if(VI_RE.test(q)){ st.res = { msg: 'lxEnOnly' }; lxRender(kind); return; }
  if(kind === 'forms' && !/^[a-z][a-z'-]*$/.test(q)){ st.res = { msg: 'lxOneWord' }; lxRender(kind); return; }
  st.res = { loading: true }; lxRender(kind);
  try{
    const groups = await (kind === 'forms' ? lxForms(q) : lxSyns(q));
    if(id !== st.reqId) return;
    st.res = groups.some(g => g.items && g.items.length) ? { groups } : { msg: 'lxNone' };
  }catch(e){

}

    <span class="tk-daybadge-d"><b>${d.getDate()}</b><small>${esc(mon)}</small></span></span>`;
}

/* ── Sự kiện (uỷ quyền trên khung tab) ── */
$('#tasksArea').addEventListener('click', e => {
  const el = e.target.closest('[data-tk]');
  if(ctxPop >= 0 && tkView === 'context' && !e.target.closest('.tk-pop') && !(el && /^ctx(Slot|Chip|Pick|Remove)$/.test(el.dataset.tk))){
    ctxPop = -1; if(!el){ renderTasks(); return; }        // nhấn ra ngoài → đóng bảng chọn từ
  }
  if(!el) return;
  const a = el.dataset.tk;
  if(a === 'info') return;                 // nút "!" xử lý chung ở document
  if(a === 'open') tkOpen(el.dataset.k);
  else if(a === 'result'){ tkView = 'done'; renderTasks(); }
  else if(a === 'start') tkOpen('start');
  else if(a === 'overview'){ recAbort(); stopSpeech(); tkView = 'overview'; renderTasks(); }
  else if(a === 'mode'){
    const m = el.dataset.m; if(!TASK_MODES[m] || tasks.modeSet) return;
    tkModePick = m; renderTasks();
  }
  else if(a === 'modeLock'){
    const m = tkModePick; if(!TASK_MODES[m] || tasks.modeSet) return;
    tasks.mode = m; tasks.modeSet = true; tasks.modeAt = now(); taskModePref = m; tkModePick = null;
    toast(t('tkModeLockedToast', t('tkMode_' + m)));
    if(checkFocusTask()) toast(t('tkFocusDoneToast', focusGoalMin()));
    saveTasks(true); renderTasks();
  }
  else if(a === 'goFocus' || a === 'goGarden') activateTab($('.tab-btn[data-tab="focus"]'));
  else if(a === 'goNotes') activateTab($('.tab-btn[data-tab="notes"]'));
  else if(a === 'prRec') pronRecord();
  else if(a === 'prStop') recStop();
  else if(a === 'prSample'){ const it = pronItem(); if(it) (it.stage === 'sent' ? speakTTS(it.sentence) : tkSpeak(it)); }
  else if(a === 'prPlay'){ if(pr && pr.url){ stopSpeech(); new Audio(pr.url).play().catch(() => {}); } }
  else if(a === 'prInstall'){
    pr.phase = 'installing'; pr.err = ''; renderTasks();
    srInstallLocal().then(ok => {
      if(tkView !== 'pron') return;
      pr.phase = 'idle';
      if(ok){ srUseLocal = true; pr.err = 'switchedLocal'; } else pr.err = 'installFail';
      renderTasks();
    });
  }
  else if(a === 'prSkip'){ const it = pronItem(); if(it){ recAbort(); pronAdvance(it, true); } }
  else if(a === 'lsPlay'){ const x = tasks.t.listen; tkSpeak(x.items[x.idx]); const i = $('#lsInput'); if(i) i.focus(); }
  else if(a === 'lsCheck') listenCheck();
  else if(a === 'lsHint') listenHint();
  else if(a === 'lsDontKnow') listenDontKnow();
  else if(a === 'ctxChip'){
    const from = el.dataset.from;
    if(from !== undefined){                       // chạm chữ trong ô → thay bằng từ đang chọn / mở bảng chọn
      if(ctxSel >= 0) ctxPlace(ctxSel, +from); else { ctxPop = ctxPop === +from ? -1 : +from; renderTasks(); }
      return;
    }
    const bi = +el.dataset.b; ctxSel = ctxSel === bi ? -1 : bi; renderTasks();
  }
  else if(a === 'ctxSlot'){
    const s = +el.dataset.s;
    if(ctxSel >= 0) ctxPlace(ctxSel, s);
    else if(tasks.t.context.res[s] !== 1){ ctxPop = ctxPop === s ? -1 : s; renderTasks(); }
  }
  else if(a === 'ctxPick') ctxPlace(+el.dataset.b, +el.dataset.s);
  else if(a === 'ctxRemove') ctxUnplace(+el.dataset.s);
  else if(a === 'ctxCheck') ctxCheck();
  else if(a === 'wrCheck') writeCheck();
  else if(a === 'wrAi') writeAi();
  else if(a === 'wrJump'){
    const box = $('#wrBox'); if(!box) return;
    const o = +el.dataset.o, l = +el.dataset.l;
    box.focus(); box.setSelectionRange(o, Math.min(box.value.length, o + l));
  }
});

/* ── Bộ lọc nhóm nhiều lựa chọn (tick từng nhóm + "Tất cả") ── */
const NO_GROUP = '__none__';
let quizGroupAll = true;                 // true = tất cả nhóm
let quizGroupSet = new Set();            // khi quizGroupAll=false: các nhóm đã tick
let groupDebounce = null;
const wordGroupKey = w => w.group || NO_GROUP;
function quizGroupKeys(){
  const keys = groupsOf();
  if(keys.length && words.some(w => !w.group)) keys.push(NO_GROUP);
  return keys;
}
const quizGroupOk = w => quizGroupAll || quizGroupSet.has(wordGroupKey(w));
function quizGroupLabel(){
  if(quizGroupAll) return t('qAllGroups');
  const n = quizGroupSet.size;
  if(n === 0) return t('qGroupsNone');
  if(n === 1){ const k = [...quizGroupSet][0]; return k === NO_GROUP ? t('optNoGroup') : k; }
  return t('qGroupsN', n);
}
function syncGroupMenu(){
  $$('#quizGroupMenu input[type=checkbox]').forEach(cb => {
    cb.checked = cb.hasAttribute('data-all') ? quizGroupAll : (quizGroupAll || quizGroupSet.has(cb.dataset.k));
  });
  const allCb = $('#quizGroupMenu input[data-all]');
  if(allCb) allCb.indeterminate = !quizGroupAll && quizGroupSet.size > 0;
  $('#quizGroupText').textContent = quizGroupLabel();
  $('#quizGroupText').title = quizGroupLabel();
}
function fillQuizGroups(){
  toggleGroupMenu(false);
  const keys = quizGroupKeys();
  if(!quizGroupAll) quizGroupSet = new Set([...quizGroupSet].filter(k => keys.includes(k)));
  const cnt = {}; words.forEach(w => { const k = wordGroupKey(w); cnt[k] = (cnt[k] || 0) + 1; });
  const opt = (attr, label, n, cls) =>
    `<label class="gsel-opt ${cls}"><input type="checkbox" ${attr}><span>${esc(label)}</span><span class="n">${n}</span></label>`;
  $('#quizGroupMenu').innerHTML = opt('data-all', t('qAllGroups'), words.length, 'all')
    + keys.map(k => opt(`data-k="${esc(k)}"`, k === NO_GROUP ? t('optNoGroup') : k, cnt[k] || 0, '')).join('');
  syncGroupMenu();
}
function toggleGroupMenu(force){
  const menu = $('#quizGroupMenu'), sel = $('#quizGroupSel'); if(!menu || !sel) return;
  const open = force !== undefined ? force : menu.hidden;
  menu.hidden = !open; sel.classList.toggle('open', open);
  $('#quizGroupBtn').setAttribute('aria-expanded', String(open));
}
$('#quizGroupBtn').addEventListener('click', e => { e.stopPropagation(); toggleGroupMenu(); });
document.addEventListener('click', e => { if(!e.target.closest('#quizGroupSel')) toggleGroupMenu(false); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') toggleGroupMenu(false); });
$('#quizGroupMenu').addEventListener('change', e => {
  const cb = e.target.closest('input[type=checkbox]'); if(!cb) return;
  const keys = quizGroupKeys();
  if(cb.hasAttribute('data-all')){
    quizGroupAll = cb.checked; quizGroupSet = new Set();
  }else{
    if(quizGroupAll){ quizGroupAll = false; quizGroupSet = new Set(keys); }   // đang "tất cả" → bỏ tick 1 nhóm
    cb.checked ? quizGroupSet.add(cb.dataset.k) : quizGroupSet.delete(cb.dataset.k);
    if(keys.length && keys.every(k => quizGroupSet.has(k))){ quizGroupAll = true; quizGroupSet = new Set(); }
  }
  syncGroupMenu();
  clearTimeout(groupDebounce); groupDebounce = setTimeout(startQuiz, 300);   // tick liên tiếp chỉ làm lại 1 lần
});

/* Chế độ trả lời nhớ riêng cho từ đơn (Alphabet/Type) và cụm (Arrange words/Type) */
const modeKey = kind => kind === 'đơn' ? 'soTuSingleMode_v1' : 'soTuPhraseMode_v1';
const quizSpeakerOn = () => true;

/* Streak: cấp độ hiệu ứng tăng dần theo số câu đúng liên tiếp */
const streakTier = n => n >= 200 ? 11 : n >= 150 ? 10 : n >= 125 ? 9 : n >= 100 ? 8 : n >= 75 ? 7 : n >= 50 ? 6 : n >= 20 ? 5 : n >= 10 ? 4 : n >= 6 ? 3 : n >= 3 ? 2 : n >= 1 ? 1 : 0;
/* Lớp canvas phủ toàn màn hình cho hiệu ứng streak (không bị khung chứa cắt mất) */
function fxCanvas(){
  const W = innerWidth, H = innerHeight, dpr = Math.min(2, devicePixelRatio || 1);
  const cv = document.createElement('canvas'); cv.className = 'flare-cv';
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  document.body.appendChild(cv);
  return { cv, ctx, W, H };
}
/* Thổi lửa vào ngọn lửa streak: canvas phủ màn hình (không bị khung cắt). Luồng lửa ngắn phụt từ một điểm
   cạnh chip (phía còn chỗ trống, hơi cao hơn) THẲNG VÀO ngọn lửa, thu hẹp dần như bị hút vào; ngọn lửa co lại
   giật giật trong lúc "ăn" lửa, rồi bùng lên với chớp sáng + tia lửa, sau đó giữ cỡ to hơn (CSS theo tier). */
const FLARE_PAL = {
  red:  [[255,255,235],[255,230,120],[255,150,40],[235,60,25]],
  blue: [[245,255,255],[160,240,255],[56,198,244],[59,91,255]],
};
function streakFlare(chip, kind){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const ic = chip.querySelector('.ic') || chip, r = ic.getBoundingClientRect();
  const { cv, ctx, W, H } = fxCanvas();
  const tx = r.left + r.width / 2, ty = r.top + r.height / 2;            // đích: ngọn lửa của chip
  const dir = tx > W / 2 ? -1 : 1, D = 120;
  const sx = tx + dir * D, sy = ty - 38;                                   // nguồn: cạnh chip, chếch lên
  const pal = FLARE_PAL[kind] || FLARE_PAL.red, ps = [], sparks = [];
  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const colAt = t => { const x = Math.min(.999, t) * (pal.length - 1), i = Math.floor(x); return mix(pal[i], pal[i + 1], x - i); };
  const blob = (x, y, R, c, al) => {
    const g = ctx.createRadialGradient(x, y, 0, x, y, R);
    g.addColorStop(0, `rgba(${c},${al})`); g.addColorStop(.5, `rgba(${c},${al * .5})`); g.addColorStop(1, `rgba(${c},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.fill();
  };
  const FEED = 950, t0 = performance.now(); let last = t0, ignited = 0;
  chip.classList.remove('ignite'); chip.classList.add('feeding');
  function frame(now){
    const el = now - t0, dt = Math.min(2.5, (now - last) / 16.7); last = now;
    if(el < FEED){
      const n = Math.round(4 * dt * (0.7 + 0.3 * Math.sin(el / 40))) + 1;
      for(let i = 0; i < n; i++){
        const ang = Math.atan2(ty - sy, tx - sx) + (Math.random() - .5) * 0.5;
        const sp = 5.2 + Math.random() * 1.6;
        ps.push({ x: sx + (Math.random() - .5) * 6, y: sy + (Math.random() - .5) * 6,
                  vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, d0: Math.hypot(tx - sx, ty - sy), sz: 5 + Math.random() * 5 });
      }
    }else if(!ignited){                                                    // ngọn lửa đã "no" → bùng lên
      ignited = now;
      chip.classList.remove('feeding'); void chip.offsetWidth; chip.classList.add('ignite');
      for(let i = 0; i < 22; i++){
        const a = -Math.PI / 2 + (Math.random() - .5) * 2.4, sp = 3 + Math.random() * 4;
        sparks.push({ x: tx, y: ty, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, max: 26 + Math.random() * 18 });
      }
    }
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for(let i = ps.length - 1; i >= 0; i--){                               // luồng lửa bị hút vào đích
      const p = ps[i], dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
      if(d < 7){ ps.splice(i, 1); continue; }
      const k = 0.18 * dt;                                                 // bẻ hướng dần về đích (hội tụ)
      p.vx += (dx / d * 7 - p.vx) * k; p.vy += (dy / d * 7 - p.vy) * k;
      p.x += p.vx * dt; p.y += p.vy * dt;
      const prog = 1 - Math.min(1, d / p.d0);                              // 0 ở nguồn → 1 ở đích
      const R = p.sz * (1 + Math.sin(prog * Math.PI) * 1.4) * (1 - prog * .55);
      blob(p.x, p.y, R, colAt(.95 - prog * .7), .45);                   // đỏ cam ở miệng phun → vàng trắng khi vào lửa
    }
    if(el < FEED) blob(sx, sy, 14 + 3 * Math.sin(el / 30), pal[2], .55);   // đốm lửa ở miệng phun
    if(el < FEED + 80) blob(tx, ty, 18 + 22 * Math.min(1, el / FEED), pal[2], .55);   // đích nóng dần
    if(ignited){
      const k = (now - ignited) / 520;
      if(k < 1){                                                           // chớp sáng + vòng sóng
        blob(tx, ty, 30 + k * 70, pal[0], (1 - k) * .9);
        ctx.strokeStyle = `rgba(${pal[2]},${(1 - k) * .8})`; ctx.lineWidth = 4 * (1 - k) + 1;
        ctx.beginPath(); ctx.arc(tx, ty, 20 + k * 80, 0, 7); ctx.stroke();
      }
      for(let i = sparks.length - 1; i >= 0; i--){
        const s = sparks[i]; s.life += dt;
        if(s.life >= s.max){ sparks.splice(i, 1); continue; }
        s.vx *= Math.pow(.95, dt); s.vy = s.vy * Math.pow(.95, dt) + 0.08 * dt;
        s.x += s.vx * dt; s.y += s.vy * dt;
        blob(s.x, s.y, 5, colAt(s.life / s.max * .9), 1 - s.life / s.max);
      }
    }
    if(!ignited || ps.length || sparks.length || now - ignited < 520) requestAnimationFrame(frame);
    else cv.remove();
  }
  requestAnimationFrame(frame);
  setTimeout(() => chip.classList.remove('ignite'), FEED + 900);
}
/* Gãy chuỗi dài — mỗi mốc một kiểu, gói gọn quanh thanh streak:
   ≥50 băng vỡ tung · ≥100 sét đánh · ≥150 bóng tối vỡ tan · ≥200 ánh sáng xua màn đêm */
function streakBreak(chip, prev){
  const kind = prev >= 200 ? 'light' : prev >= 150 ? 'shadow' : prev >= 100 ? 'bolt' : 'ice';
  const { cv, ctx, W, H } = fxCanvas();
  const r = chip.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const cw = r.width + 10, ch = r.height + 10, rnd = (a, b) => a + Math.random() * (b - a);
  const LR = 130;                                       // bán kính vùng hiệu ứng quanh chip — chỉ gói gọn quanh streak
  const rr = (x, y, w, h, rad) => { ctx.beginPath(); ctx.moveTo(x + rad, y); ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad); ctx.arcTo(x, y + h, x, y, rad); ctx.arcTo(x, y, x + w, y, rad); ctx.closePath(); };
  const glow = (x, y, R, c, a) => { const g = ctx.createRadialGradient(x, y, 0, x, y, R);
    g.addColorStop(0, `rgba(${c},${a})`); g.addColorStop(1, `rgba(${c},0)`); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.fill(); };
  const ease = k => 1 - Math.pow(1 - Math.min(1, Math.max(0, k)), 3);
  const cls = (c, ms) => { chip.classList.add(c); setTimeout(() => chip.classList.remove(c), ms); };
  let draw, dur;

  // Cắt thanh streak thành các mảnh tam giác (lưới lệch ngẫu nhiên) — dùng cho băng vỡ & bóng tối vỡ
  const x0 = cx - cw / 2, y0 = cy - ch / 2;
  const makeShards = (cols, rows, speed) => {
    const P = [];
    for(let j = 0; j <= rows; j++) for(let i = 0; i <= cols; i++){
      const edge = i === 0 || j === 0 || i === cols || j === rows;
      P.push([x0 + cw * i / cols + (edge && i % cols === 0 ? 0 : rnd(-.3, .3) * cw / cols),
              y0 + ch * j / rows + (edge && j % rows === 0 ? 0 : rnd(-.3, .3) * ch / rows)]);
    }
    const at = (i, j) => P[j * (cols + 1) + i], out = [];
    for(let j = 0; j < rows; j++) for(let i = 0; i < cols; i++){
      const q = [at(i, j), at(i + 1, j), at(i + 1, j + 1), at(i, j + 1)];
      (Math.random() < .5 ? [[q[0], q[1], q[2]], [q[0], q[2], q[3]]] : [[q[0], q[1], q[3]], [q[1], q[2], q[3]]]).forEach(tri => {
        const gx = (tri[0][0] + tri[1][0] + tri[2][0]) / 3, gy = (tri[0][1] + tri[1][1] + tri[2][1]) / 3;
        const a = Math.atan2(gy - cy, (gx - cx) * .6) , v = speed * rnd(.6, 1.3);
        out.push({ gx, gy, pts: tri.map(([x, y]) => [x - gx, y - gy]), x: 0, y: 0, rot: 0,
                   vx: Math.cos(a) * v, vy: Math.sin(a) * v - rnd(.5, 2), vr: rnd(-.25, .25) });
      });
    }
    return out;
  };
  const drawShard = (sd, fill, stroke, alpha) => {
    ctx.save(); ctx.translate(sd.gx + sd.x, sd.gy + sd.y); ctx.rotate(sd.rot);
    rr(x0 - sd.gx, y0 - sd.gy, cw, ch, ch / 2); ctx.clip();          // giữ mép bo tròn của thanh streak
    ctx.beginPath(); sd.pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath();
    ctx.globalAlpha = alpha; ctx.fillStyle = fill; ctx.fill();
    ctx.strokeStyle = stroke; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.restore();
  };
  const stepShards = (shards, g) => shards.forEach(sd => { sd.vy += g; sd.x += sd.vx; sd.y += sd.vy; sd.rot += sd.vr; });
  const crackLines = (shards, k, color) => {                          // vết nứt = mép các mảnh, hiện dần từ điểm va chạm
    ctx.strokeStyle = color; ctx.lineWidth = 1.3; ctx.beginPath();
    shards.forEach(sd => { if(Math.hypot(sd.gx - cx, (sd.gy - cy) * 2) > k * cw * .6) return;
      sd.pts.forEach(([x, y], i) => i ? ctx.lineTo(sd.gx + x, sd.gy + y) : ctx.moveTo(sd.gx + x, sd.gy + y)); ctx.closePath(); });
    ctx.stroke();
  };

  if(kind === 'ice'){                     // ── Băng vỡ: chip đóng băng, nứt toác rồi vỡ tung toé thành mảnh băng + bụi tuyết
    dur = 1800; cls('frozen', 700);
    const BREAK = 620, shards = makeShards(6, 2, 4.2), dust = [];
    draw = e => {
      if(e < BREAK){
        const form = ease(e / 200);
        rr(x0, y0, cw, ch, ch / 2);
        const g = ctx.createLinearGradient(0, y0, 0, y0 + ch);
        g.addColorStop(0, `rgba(235,250,255,${.85 * form})`); g.addColorStop(1, `rgba(140,205,245,${.8 * form})`);
        ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = `rgba(90,169,214,${form})`; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = `rgba(255,255,255,${.6 * form})`; ctx.fillRect(x0 + 14, y0 + 5, cw * .35, 3);
        const c = ease((e - 230) / 360);
        if(c > 0) crackLines(shards, c, `rgba(255,255,255,${.95})`);
        if(e > 230) glow(cx, cy, 14 + 10 * c, '255,255,255', .5 * c);
      }else{
        const t = e - BREAK, f = 1 - ease(t / 1100);
        if(!dust.length) for(let i = 0; i < 34; i++){ const a = rnd(0, Math.PI * 2), v = rnd(1.5, 5.5);
          dust.push({ x: cx + rnd(-cw / 3, cw / 3), y: cy + rnd(-6, 6), vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.5, s: rnd(1.2, 3) }); }
        if(t < 220) glow(cx, cy, 30 + t * .4, '220,245,255', .9 * (1 - t / 220));      // chớp lạnh lúc vỡ
        stepShards(shards, .2);
        shards.forEach(sd => drawShard(sd, 'rgba(190,232,255,.85)', 'rgba(255,255,255,.95)', f));
        dust.forEach(d => { d.vy += .12; d.x += d.vx; d.y += d.vy;
          ctx.fillStyle = `rgba(235,250,255,${f})`; ctx.beginPath(); ctx.arc(d.x, d.y, d.s, 0, 7); ctx.fill(); });
      }
    };
    setTimeout(() => { chip.classList.remove('lost'); void chip.offsetWidth; cls('lost', 400); }, BREAK);
  }else if(kind === 'bolt'){              // ── Sét đánh: trời tối sầm, tia sét giật 3 lần xuống chip, cháy xém + khói
    dur = 1900;
    const bolt = (x1, y1, x2, y2, spread, out) => {     // tia sét gấp khúc (chia đôi đoạn + lệch ngẫu nhiên)
      if(spread < 4){ out.push([x1, y1, x2, y2]); return out; }
      const mx = (x1 + x2) / 2 + rnd(-spread, spread), my = (y1 + y2) / 2 + rnd(-spread * .3, spread * .3);
      bolt(x1, y1, mx, my, spread / 2, out); bolt(mx, my, x2, y2, spread / 2, out);
      if(Math.random() < .15 && spread > 10) bolt(mx, my, mx + rnd(-30, 30), my + rnd(15, 40), spread / 2.5, out);   // nhánh phụ
      return out;
    };
    const bolts = [0, 1, 2].map(() => bolt(cx + rnd(-45, 45), cy - 120, cx + rnd(-8, 8), cy, 30, []));
    const strikes = [[90, 200], [260, 330], [400, 470]], sparks = [], smoke = [];
    let hit = false;
    draw = e => {
      glow(cx, cy, LR, '12,14,40', .6 * Math.min(1, e / 90) * (1 - ease((e - 700) / 600)));
      strikes.forEach(([a, b], i) => {
        if(e < a || e > b) return;
        const k = 1 - (e - a) / (b - a);
        glow(cx, cy, LR * .9, '230,240,255', .55 * k);                                 // chớp trắng quanh chip
        ctx.lineCap = 'round';
        [[10, `rgba(120,190,255,${.45 * k})`], [4, `rgba(200,230,255,${.9 * k})`], [1.6, `rgba(255,255,255,${k})`]].forEach(([lw, c]) => {
          ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.beginPath();
          bolts[i].forEach(([x1, y1, x2, y2]) => { ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); }); ctx.stroke();
        });
        glow(cx, cy, 70, '200,230,255', .8 * k);
      });
      if(e >= 90 && !hit){
        hit = true; cls('zapped', 1300);
        for(let i = 0; i < 26; i++){ const a = rnd(0, Math.PI * 2), v = rnd(1.5, 4);
          sparks.push({ x: cx + rnd(-cw / 3, cw / 3), y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, l: 0, m: rnd(22, 40) }); }
      }
      if(e > 420 && e < 1500 && Math.random() < .5)
        smoke.push({ x: cx + rnd(-cw / 2.5, cw / 2.5), y: cy - 6, r: rnd(6, 10), l: 0, m: rnd(45, 70) });
      ctx.globalCompositeOperation = 'lighter';
      for(let i = sparks.length - 1; i >= 0; i--){
        const p = sparks[i]; p.l++; if(p.l > p.m){ sparks.splice(i, 1); continue; }
        p.vy += .22; p.x += p.vx; p.y += p.vy;
        ctx.strokeStyle = `rgba(255,${200 + 55 * (1 - p.l / p.m) | 0},120,${1 - p.l / p.m})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 2, p.y - p.vy * 2); ctx.stroke();
      }
      ctx.globalCompositeOperation = 'source-over';
      for(let i = smoke.length - 1; i >= 0; i--){
        const p = smoke[i]; p.l++; if(p.l > p.m){ smoke.splice(i, 1); continue; }
        const k = p.l / p.m; p.y -= .9; p.x += Math.sin(p.l / 8) * .4;
        glow(p.x, p.y, p.r + k * 16, '70,70,80', .35 * (1 - k));
      }
    };
  }else if(kind === 'shadow'){            // ── Bóng tối vỡ tan: thanh streak tối dần, nứt sáng tím rồi vỡ vụn thành mảnh đen
    dur = 2000;
    const BREAK = 1000, shards = makeShards(7, 2, 3.2), wisps = [];
    draw = e => {
      if(e < BREAK){
        const k = ease(e / 650);
        ctx.save(); rr(x0, y0, cw, ch, ch / 2); ctx.clip();
        ctx.fillStyle = `rgba(14,8,30,${.95 * k})`; ctx.fillRect(x0, y0, cw, ch);
        for(let i = 0; i < 4; i++)                                   // khói tím cuộn bên trong thanh
          glow(x0 + cw * (.2 + .2 * i) + Math.sin(e / 200 + i) * 10, cy + Math.cos(e / 260 + i) * 5, 22, '90,40,150', .55 * k);
        ctx.restore();
        rr(x0, y0, cw, ch, ch / 2); ctx.strokeStyle = `rgba(120,70,190,${k})`; ctx.lineWidth = 2; ctx.stroke();
        if(Math.random() < .5 * k) wisps.push({ x: rnd(x0 + 10, x0 + cw - 10), y: y0, l: 0 });
        const c = ease((e - 650) / 330);
        if(c > 0){ ctx.shadowColor = '#C77DFF'; ctx.shadowBlur = 8; crackLines(shards, c, 'rgba(215,170,255,.95)'); ctx.shadowBlur = 0; }
      }else{
        const t = e - BREAK, f = 1 - ease(t / 950);
        if(t < 240) glow(cx, cy, 30 + t * .45, '225,190,255', .85 * (1 - t / 240));
        stepShards(shards, .14);
        shards.forEach(sd => drawShard(sd, 'rgba(14,8,30,.95)', 'rgba(199,125,255,.95)', f));
      }
      for(let i = wisps.length - 1; i >= 0; i--){                    // làn khói đen bốc lên khỏi thanh
        const w = wisps[i]; w.l++; if(w.l > 40){ wisps.splice(i, 1); continue; }
        w.y -= .7; glow(w.x + Math.sin(w.l / 6) * 3, w.y, 7 + w.l * .2, '20,10,40', .4 * (1 - w.l / 40));
      }
    };
    setTimeout(() => { chip.classList.remove('lost'); void chip.offsetWidth; cls('lost', 400); }, BREAK);
  }else{                                  // ── Ánh sáng xua màn đêm: thanh streak chìm vào đêm sao, một dải sáng vàng quét qua
    dur = 2000;                           //    xua tan bóng tối, rồi vầng hào quang + sao lấp lánh quanh thanh
    const stars = [...Array(14)].map(() => [rnd(x0 + 8, x0 + cw - 8), rnd(y0 + 5, y0 + ch - 5), rnd(.7, 1.6), rnd(0, 6)]);
    const twinkles = [...Array(9)].map((_, i) => { const a = i / 9 * Math.PI * 2 + rnd(-.3, .3);
      return [cx + Math.cos(a) * (cw / 2 + rnd(10, 24)), cy + Math.sin(a) * (ch / 2 + rnd(8, 18)), rnd(7, 12), rnd(0, 300)]; });
    const S0 = 420, S1 = 1150, sparks = [];
    const star4 = (x, y, R, a) => { ctx.fillStyle = `rgba(255,236,160,${a})`; ctx.beginPath();
      for(let i = 0; i < 8; i++){ const rr2 = i % 2 ? R * .25 : R, an = i * Math.PI / 4 - Math.PI / 2;
        ctx.lineTo(x + Math.cos(an) * rr2, y + Math.sin(an) * rr2); } ctx.closePath(); ctx.fill(); };
    draw = e => {
      const night = ease(e / 300), sx = x0 - 20 + (cw + 40) * ease((e - S0) / (S1 - S0));   // vị trí dải sáng
      ctx.save(); rr(x0, y0, cw, ch, ch / 2); ctx.clip();
      if(e < S1 + 50){                                               // màn đêm trên thanh — phần đã bị quét thì biến mất
        ctx.save(); ctx.beginPath(); ctx.rect(e < S0 ? x0 - 30 : sx, y0 - 5, cw + 60, ch + 10); ctx.clip();
        const g = ctx.createLinearGradient(0, y0, 0, y0 + ch);
        g.addColorStop(0, `rgba(10,14,48,${.95 * night})`); g.addColorStop(1, `rgba(28,20,70,${.95 * night})`);
        ctx.fillStyle = g; ctx.fillRect(x0, y0, cw, ch);
        stars.forEach(([x, y, r2, ph]) => { ctx.fillStyle = `rgba(255,255,235,${night * (.55 + .45 * Math.sin(e / 120 + ph))})`;
          ctx.beginPath(); ctx.arc(x, y, r2, 0, 7); ctx.fill(); });
        ctx.restore();
      }
      const sweeping = e > S0 && e < S1 + 80;
      if(sweeping){                                                  // dải sáng chéo vàng rực
        const g = ctx.createLinearGradient(sx - 46, 0, sx + 14, 0);
        g.addColorStop(0, 'rgba(255,200,60,0)'); g.addColorStop(.55, 'rgba(255,214,90,.9)'); g.addColorStop(.85, 'rgba(255,255,235,1)'); g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(sx - 52, y0 + ch); ctx.lineTo(sx - 30, y0); ctx.lineTo(sx + 18, y0); ctx.lineTo(sx - 4, y0 + ch); ctx.closePath(); ctx.fill();
        for(let i = 0; i < 2; i++) sparks.push({ x: sx + rnd(-8, 8), y: rnd(y0, y0 + ch), vx: rnd(-2, 1), vy: rnd(-2.4, .6), l: 0 });
      }
      ctx.restore();
      if(sweeping){ ctx.globalCompositeOperation = 'lighter'; glow(sx - 8, cy, 34, '255,210,90', .55); ctx.globalCompositeOperation = 'source-over'; }
      ctx.globalCompositeOperation = 'lighter';
      for(let i = sparks.length - 1; i >= 0; i--){
        const p = sparks[i]; p.l++; if(p.l > 28){ sparks.splice(i, 1); continue; }
        p.x += p.vx; p.y += p.vy; p.vy += .03; glow(p.x, p.y, 4, '255,215,110', 1 - p.l / 28);
      }
      const h = e - S1;
      if(h > 0){                                                     // hào quang bo theo thanh nở ra + sao 4 cánh
        const k = ease(h / 650), a = 1 - ease(h / 850);
        rr(x0 - 4 - 14 * k, y0 - 4 - 14 * k, cw + 8 + 28 * k, ch + 8 + 28 * k, ch / 2 + 14 * k);
        ctx.strokeStyle = `rgba(255,214,90,${a})`; ctx.lineWidth = 5 * a + .5; ctx.shadowColor = '#FFC107'; ctx.shadowBlur = 18;
        ctx.stroke(); ctx.shadowBlur = 0;
        if(h < 40) for(let i = 0; i < 16; i++){ const an = i / 16 * Math.PI * 2, v = rnd(2.2, 3.6);   // chùm tia vàng bung ra
          sparks.push({ x: cx + Math.cos(an) * cw * .45, y: cy + Math.sin(an) * ch * .5, vx: Math.cos(an) * v, vy: Math.sin(an) * v * .6, l: 0 }); }
        glow(cx, cy, cw * .55, '255,225,140', .35 * a);
        twinkles.forEach(([x, y, R, d]) => { const q = (h - d) / 450; if(q > 0 && q < 1) star4(x, y, R * Math.sin(q * Math.PI), Math.sin(q * Math.PI)); });
      }
      ctx.globalCompositeOperation = 'source-over';
    };
    cls('blessed', 1900);
  }

  const t0 = performance.now();
  (function frame(now){
    const e = now - t0;
    ctx.clearRect(0, 0, W, H);
    if(e >= dur){ cv.remove(); return; }
    ctx.save(); ctx.beginPath(); ctx.ellipse(cx, cy, cw / 2 + LR, LR + 10, 0, 0, 7); ctx.clip();
    draw(e);
    ctx.restore();
    requestAnimationFrame(frame);
  })(t0);
}
function updateStreakUI(prev, shielded){
  const chip = $('#streakChip'), num = $('#quizStreak'); if(!chip || !num) return;
  const n = quizStreak, oldTier = parseInt(chip.dataset.tier || '0', 10), tier = streakTier(n);
  const retrigger = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
  num.textContent = n;
  chip.dataset.tier = tier;
  if(currentUser) try{ localStorage.setItem(streakKey(), String(n)); }catch(e){}   // giữ chuỗi khi tải lại trang
  if(shielded){                                    // khiên vừa chịu đòn: vỡ 1 lớp (lớp cuối → thiên thần ôm chuỗi)
    const last = shieldsLeft() === 0;
    renderShieldAura(chip, shieldsLeft() + 1);
    (last ? fxNightDevour : fxShieldCrack)(chip, () => renderShieldAura(chip, shieldsLeft()));
    toast(t(last ? 'shieldLast' : 'shieldSaved'));
    return;
  }
  renderShieldAura(chip, shieldsLeft());
  if(n > (prev || 0)){
    retrigger(num, 'pop');
    if(tier > oldTier && tier >= 2){
      retrigger(chip, 'tier-up');
      clearTimeout(chip._tu); chip._tu = setTimeout(() => chip.classList.remove('tier-up'), 750);
      if(tier >= 6) toast(t('qStreakMilestone', n));             // mốc 50 / 75 / 100 / 125 / 150 / 200
      if(tier === 8 || tier === 11) streakFlare(chip, tier === 11 ? 'blue' : 'red');
    }
  }else if(n === 0 && (prev || 0) >= 3){
    if(prev >= 50 && !matchMedia('(prefers-reduced-motion: reduce)').matches) streakBreak(chip, prev);   // gãy chuỗi dài → hiệu ứng riêng
    else { retrigger(chip, 'lost'); setTimeout(() => chip.classList.remove('lost'), 400); }
  }
}

function startQuiz(){
  stopSpeech();                                    // sang từ mới → ngắt giọng đọc đang chạy (nếu có)
  const pool = quizPool();
  const area = $('#quizArea');
  if(!pool.length){
    const none = !quizGroupAll && quizGroupSet.size === 0;
    area.innerHTML = `<div class="panel"><div class="empty">${I('leaf')}<br>
      ${none ? t('qNoGroupPicked') : t('emptyQuiz', $('#quizSavedOnly').checked ? t('qExtraSaved') : '')}</div></div>`;
    quiz = null; return;
  }
  const w = pickWordLimited(pool);
  lastShownId = w.id;
  preloadWordAudio(w);
  quiz = { w, mode: w.kind, meaning: pickMeaningPart(w), startAt: now(), hintLevel:0, typed:[], pickedIdx:[],
           phraseMode: localStorage.getItem(modeKey(w.kind)) === 'type' ? 'type' : 'chips',
           typedPhrase: '' };           
  if(w.kind === 'đơn'){
    const letters = w.word.toLowerCase().split('');
    quiz.shuffled = shuffle(letters.map((ch,i)=>({ch,i})).filter(x=>x.ch!==' '));
  }else{
    const ws = w.word.split(/\s+/);
    quiz.shuffled = shuffle(ws.map((t,i)=>({t,i})));
  }
  renderQuiz();
}

function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

const normPhrase = t => t.toLowerCase().replace(/[.,!?;:"""'’]/g, ' ').replace(/\s+/g, ' ').trim();

function renderQuiz(){
  const {w} = quiz;
  let hint = '';
  if(quiz.hintLevel >= 1){
    hint = `<div class="hintline">${I('bulb')} ${w.kind==='đơn'
        ? t('qHintStart', esc(w.word[0]), w.word.replace(/ /g,'').length)
        : t('qHintFirstWord', esc(w.word.split(/\s+/)[0]))}
        ${w.note?` · ${esc(w.note)}`:''}</div>`;
  }
  if(quiz.hintLevel >= 2){
    const full = w.word.trim();
    hint += `<div class="hintline">${I('bulb')} ${t('qHintHalf', esc(full.slice(0, Math.ceil(full.length/2))), full.length)}</div>`;
  }
  const typeMode = quiz.phraseMode === 'type';
  const spk = quizSpeakerOn();
  const promptHtml = `
    <div class="q-prompt ${spk?'has-speak':''}">
      ${spk ? `<button class="speak-btn q-speak" id="qSpeak" title="${t('listenTitle')}">${I('sound')}</button>` : ''}
      <div class="label">${t(w.kind==='đơn' ? (typeMode?'qLabelSingleType':'qLabelSingle') : (typeMode?'qLabelPhraseType':'qLabelPhrase'))}</div>
      <div class="meaning">${esc(quiz.meaning)} ${w.pos?`<span class="pos-tag">${esc(w.pos)}</span>`:''} ${w.saved?`<svg class="ic" style="fill:#FFC83D;width:18px;height:18px"><use href="#i-star"/></svg>`:''}</div>
      ${w.kind==='cụm' && w.sentence && w.sentence.toLowerCase()!==w.word.toLowerCase()
        ? `<div class="hintline">${t('qExample')} <span class="mono">${esc(w.sentence)}</span></div>` : ''}
      ${hint}
    </div>`;

  let bodyHtml = '';
  const pills = `
      <div class="mode-pills">
        <button class="mode-pill ${quiz.phraseMode==='chips'?'on':''}" data-pm="chips">${w.kind==='đơn'?t('qModeAlpha'):t('qModeChips')}</button>
        <button class="mode-pill ${quiz.phraseMode==='type'?'on':''}" data-pm="type">${t('qModeType')}</button>
      </div>`;
  if(typeMode){
    bodyHtml = pills + `
        <input class="phrase-input" id="phraseInput" autocomplete="off" spellcheck="false"
          placeholder="${esc(t(w.kind==='đơn'?'qWordPh':'qPhrasePh'))}"
          value="${esc(quiz.typedPhrase)}">`;
  }else if(w.kind === 'đơn'){
    bodyHtml = pills + `
      <div class="tiles" id="tiles">${tilesHtml()}</div>
      <div class="chips" id="chips">${quiz.shuffled.map((o,idx)=>
        `<span class="chip-w letter ${quiz.pickedIdx.includes(idx)?'used':''}" data-idx="${idx}">${esc(o.ch)}</span>`).join('')}
      </div>`;
  }else{
    bodyHtml = pills + `
        <div class="answer-line" id="ansLine">${quiz.pickedIdx.length
          ? quiz.pickedIdx.map((idx,k)=>`<span class="chip-w" data-k="${k}">${esc(quiz.shuffled[idx].t)}</span>`).join('')
          : `<span class="placeholder">${t('qAnsPlaceholder')}</span>`}
        </div>
        <div class="chips" id="chips">${quiz.shuffled.map((o,idx)=>
          `<span class="chip-w ${quiz.pickedIdx.includes(idx)?'used':''}" data-idx="${idx}">${esc(o.t)}</span>`).join('')}
        </div>`;
  }

  $('#quizArea').innerHTML = `
    ${promptHtml}
    ${bodyHtml}
    <div class="quiz-actions">
      <button class="btn lemon" id="btnHint" ${quiz.hintLevel>=2?'disabled':''}>${I('bulb')}${t('qHintBtn')}${quiz.hintLevel?` (${quiz.hintLevel}/2)`:''}</button>
      <button class="btn primary" id="btnCheck">${I('check')}${t('qCheckBtn')}</button>
      <button class="btn ghost" id="btnSkip">${t('qSkipBtn')} ${I('next')}</button>
      <button class="btn sky ${isLimitedToday(w)?'limit-on':''}" id="btnLimit" title="${esc(t('qLimitTitle'))}" aria-pressed="${isLimitedToday(w)}">${I('clock')}${t(isLimitedToday(w)?'qLimitedBtn':'qLimitBtn')}</button>
    </div>
    <div class="feedback" id="quizFb"></div>`;

  const refocus = () => { const pi = $('#phraseInput'); if(pi && !quiz.graded) pi.focus(); };
  const spBtn = $('#qSpeak');
  if(spBtn) spBtn.addEventListener('click', e => { speakWord(quiz.w); e.currentTarget.blur(); refocus(); });
  $('#btnLimit').addEventListener('click', e => {
    const lw = quiz.w;
    if(isLimitedToday(lw)){ delete lw.limitDay; toast(t('qLimitOff', lw.word)); }
    else { lw.limitDay = todayKey(); toast(t('qLimitOn', lw.word)); }

    const on = isLimitedToday(lw), b = e.currentTarget;
    b.classList.toggle('limit-on', on); b.setAttribute('aria-pressed', String(on));

    b.blur(); refocus();
  });

  $('#btnCheck').addEventListener('click', checkQuiz);
  $('#btnSkip').addEventListener('click', ()=>{ applyGrade(quiz.w, 0); startQuiz(); });
  $('#btnHint').addEventListener('click', ()=>{ if(quiz.hintLevel < 2){ quiz.hintLevel++; renderQuiz(); } });
  $$('#quizArea .mode-pill').forEach(p => p.addEventListener('click', () => {
    if(quiz.graded || quiz.phraseMode === p.dataset.pm) return;
    quiz.phraseMode = p.dataset.pm;
    try{ localStorage.setItem(modeKey(quiz.w.kind), quiz.phraseMode); }catch(e){}
    quiz.pickedIdx = []; quiz.typed = []; quiz.typedPhrase = '';        // đổi chế độ → làm lại từ đầu, giữ đồng hồ
    renderQuiz();
  }));
  const pIn = $('#phraseInput');
  if(pIn){
    pIn.addEventListener('input', () => {
      quiz.typedPhrase = pIn.value;
      const a = normPhrase(pIn.value), b = normPhrase(quiz.w.word);
      if(a === b || a.length >= b.length) { autoCheck(true); }
    });
    pIn.addEventListener('keydown', e => {
      if(e.key === 'Enter'){ e.preventDefault(); if(!quiz.graded) checkQuiz(); }
    });
    if(!quiz.graded && !document.querySelector('.gsel.open')) pIn.focus();
  }
  const chipsEl = $('#chips');
  if(chipsEl) chipsEl.addEventListener('click', e=>{
    if(quiz.graded) return;
    const c = e.target.closest('.chip-w'); if(!c || c.classList.contains('used')) return;
    quiz.pickedIdx.push(+c.dataset.idx);
    if(quiz.mode==='đơn') quiz.typed.push(quiz.shuffled[+c.dataset.idx].ch);
    renderQuiz();
    autoCheck();
  });
  const ans = $('#ansLine');
  if(ans) ans.addEventListener('click', e=>{
    if(quiz.graded) return;
    const c = e.target.closest('.chip-w'); if(!c) return;
    quiz.pickedIdx.splice(+c.dataset.k, 1);
    renderQuiz();
  });
}

/* Tự động kiểm tra khi hoàn tất chữ cái / từ cuối cùng */
function autoCheck(fromTyping){
  if(!quiz || quiz.graded) return;
  if(quiz.phraseMode === 'type'){
    if(fromTyping) checkQuiz();
  }else if(quiz.mode === 'đơn'){
    const maxLen = quiz.w.word.replace(/ /g,'').length;
    if(quiz.typed.length >= maxLen) checkQuiz();
  }else{
    if(quiz.pickedIdx.length >= quiz.shuffled.length) checkQuiz();
  }
}

function tilesHtml(){
  const target = quiz.w.word.toLowerCase();
  let typedPos = 0, html = '', cursorSet = false;
  for(const ch of target){
    if(ch === ' '){ html += '<span class="tile space"></span>'; continue; }
    const t = quiz.typed[typedPos];
    const isCursor = !cursorSet && t === undefined;
    if(isCursor) cursorSet = true;
    html += `<span class="tile ${t?'filled':''} ${isCursor?'cursor':''}">${t?esc(t):''}</span>`;
    typedPos++;
  }
  return html;
}

document.addEventListener('keydown', e=>{
  if(!quiz) return;
  if(!$('#tab-quiz').classList.contains('active')) return;
  if(e.target.matches('textarea,select,input:not([type=checkbox])') || e.target.closest('.gsel') || document.body.classList.contains('sc-open')) return;
  if(quiz.graded){
    // Enter: sang từ kế ngay lập tức, ngắt giọng đọc đang chạy (không đợi đọc xong)
    if(e.key === 'Enter' && !e.repeat){ e.preventDefault(); stopSpeech(); startQuiz(); }
    return;
  }
  if(quiz.mode !== 'đơn' || quiz.phraseMode === 'type') return;
  if(e.key === 'Enter'){ checkQuiz(); return; }
  if(e.key === 'Backspace'){
    quiz.typed.pop(); quiz.pickedIdx.pop(); renderQuiz(); return;
  }
  if(/^[a-zA-ZÀ-ỹ'’-]$/.test(e.key)){
    const maxLen = quiz.w.word.replace(/ /g,'').length;
    if(quiz.typed.length >= maxLen) return;
    quiz.typed.push(e.key.toLowerCase());
    // đánh dấu chip tương ứng nếu có
    const free = quiz.shuffled.findIndex((o,idx)=>!quiz.pickedIdx.includes(idx) && o.ch===e.key.toLowerCase());
    quiz.pickedIdx.push(free); // -1 nếu chữ không có trong chip — vẫn cho gõ
    renderQuiz();
    autoCheck();
  }
});

function checkQuiz(){
  if(!quiz || quiz.graded) return;
  quiz.graded = true;
  const {w} = quiz;
  const timeMs = now() - quiz.startAt;
  let userAns, correct;
  if(w.kind === 'đơn' && quiz.phraseMode !== 'type'){
    userAns = quiz.typed.join('');
    correct = userAns === w.word.toLowerCase().replace(/ /g,'');
  }else if(quiz.phraseMode === 'type'){
    const pIn = $('#phraseInput');
    userAns = pIn ? pIn.value : quiz.typedPhrase;
    correct = normPhrase(userAns) === normPhrase(w.word);
    if(pIn){ pIn.disabled = true; pIn.blur(); }       // nhả Enter cho "từ tiếp theo"
  }else{
    userAns = quiz.pickedIdx.map(i=>quiz.shuffled[i].t).join(' ');
    correct = userAns.toLowerCase() === w.word.toLowerCase();
  }
  const charCount = w.kind === 'đơn'
    ? w.word.replace(/ /g,'').length
    : normPhrase(w.word).replace(/\s/g,'').length;
  const fb = $('#quizFb');
  const prevStreak = quizStreak;
  let shielded = false;
  if(correct){
    quizStreak++;
    applyGrade(w, quiz.hintLevel ? 1 : 2, timeMs, charCount, quiz.hintLevel);    
    const wpm = charCount ? Math.round((charCount/5) / (timeMs/60000)) : null;
    fb.className = 'feedback show good';
    fb.innerHTML = `${I('check')} ${t('qCorrect')} <span class="ans">${esc(w.word)}</span>
      ${w.sentence?` — <span class="mono">${esc(w.sentence)}</span>`:''}
      <span class="muted">(${(timeMs/1000).toFixed(1)}s${wpm?` · ~${wpm} WPM`:''}${quiz.hintLevel?' '+t('qHintUsedSuffix')+(quiz.hintLevel>1?' ×2':''):''})</span>`;
      $$('#tiles .tile:not(.space)').forEach(t=>t.classList.add('ok'));
    quiz.speaking = true;
    const cur = quiz;
    Promise.all([speakWord(w), new Promise(r => setTimeout(r, 1400))]).then(() => {
      if(quiz === cur) startQuiz();
    });
  }else{
    shielded = prevStreak >= SHIELD_MIN && sacredConsume('quiz_' + w.id + '_' + quiz.startAt);
    if(!shielded) quizStreak = 0;        // còn khiên → khiên chịu thay, chuỗi giữ nguyên
    applyGrade(w, 0, timeMs, charCount);
    fb.className = 'feedback show bad';
    fb.innerHTML = `${I('x')} ${t('qWrong')} <span class="ans">${esc(w.word)}</span>
      ${w.note?`<br>${I('pin')} ${esc(w.note)}`:''}${shielded?`<br>${I('shield')} ${t('qShielded')}`:''}<br>
      <button class="btn sm mint" style="margin-top:8px" onclick="startQuiz()">${t('qNextWord')} ${I('next')}</button>`;
    $$('#tiles .tile:not(.space)').forEach(t=>t.classList.add('bad'));
  }
  updateStreakUI(prevStreak, shielded);
}
$('#quizSavedOnly').addEventListener('change', startQuiz);

/* ═══════════════════════════════════════════════════════════
   TAB FLASHCARD — trắc nghiệm chọn nghĩa đúng
   ═══════════════════════════════════════════════════════════ */
let fc = null; // {w, opts, correctIdx, startAt, answered, picked, flipped}

/* Bộ lọc nhóm giống hệt Luyện gõ: tick nhiều nhóm + "Tất cả nhóm" + "Không nhóm" */
let fcGroupDebounce = null;
const fcGroupFilter = makeCheckFilter($('#fcGroupSel'), {
  allKey:'qAllGroups', noneKey:'qGroupsNone', nKey:'qGroupsN',
  total: () => words.length,
  items: () => {

    return quizGroupKeys().map(k => ({ k, label: k === NO_GROUP ? t('optNoGroup') : k, n: cnt[k] || 0 }));
  },
  onChange: () => { clearTimeout(fcGroupDebounce); fcGroupDebounce = setTimeout(startFc, 300); },   // tick liên tiếp chỉ làm lại 1 lần
});
function fcPool(){
  const savedOnly = $('#fcSavedOnly').checked;
  return words.filter(w => (!savedOnly || w.saved) && fcGroupFilter.ok(wordGroupKey(w)));
}

/* Tạo 4 phương án: 1 nghĩa đúng + 3 nghĩa nhiễu
   (ưu tiên cùng nhóm > cùng loại đơn/cụm — nhiễu càng "gần" càng khó đoán mò) */
function buildOptions(w){
  const right = pickMeaningPart(w);
  const seen = new Set(meaningParts(w.meaning).map(m => m.toLowerCase()));
  const rank = x => (x.group && x.group === w.group ? 2 : 0) + (x.kind === w.kind ? 1 : 0);
  const cands = shuffle(words.filter(x => x.id !== w.id && x.meaning))
                  .sort((a,b) => rank(b) - rank(a));
  const distract = [];
  for(const x of cands){
    const m = pickMeaningPart(x);
    if(!m || seen.has(m.toLowerCase())) continue;
    meaningParts(x.meaning).forEach(p => seen.add(p.toLowerCase()));
    distract.push(m);
    if(distract.length === 3) break;
  }
  const opts = shuffle([right, ...distract]);
  return { opts, correctIdx: opts.indexOf(right) };
}

function startFc(){
  const pool = fcPool();
  const area = $('#fcArea');
  if(!pool.length){
    area.innerHTML = `<div class="panel"><div class="empty">${I('leaf')}<br>
      ${fcGroupFilter.none() ? t('qNoGroupPicked') : t('emptyFc', $('#fcSavedOnly').checked ? t('qExtraSaved') : '')}</div></div>`;
    fc = null; return;
  }
  const w = pickWordLimited(pool);
  lastShownId = w.id;
  preloadWordAudio(w);
  const { opts, correctIdx } = buildOptions(w);
  fc = { w, opts, correctIdx, startAt: now(), answered:false, picked:-1, flipped:false };
  renderFc();
}

function answerFc(i){
