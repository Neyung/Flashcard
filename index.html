/* ── Chọn từ vựng: ưu tiên "Mới" (New Word); thiếu thì bù bằng các từ đang
   học yếu nhất và báo rõ cho người dùng. Không lặp lại cùng một từ. ── */
const isNewWord = w => !w.stats.seen;
const PLACEHOLDER_RE = /^(sb|sth|smb|smth|st|someone|somebody|something|one's|someone's|somebody's|sb's|oneself|o\.s\.|\.\.\.|…)$/i;
const hasPlaceholder = w => w.word.toLowerCase().split(/[\s\/]+/).some(x => PLACEHOLDER_RE.test(x));
function wordSnap(w){
  return { id: w.id, word: w.word.trim(), meaning: w.meaning || '', pos: w.pos || '', kind: w.kind,
           sentence: (w.sentence || '').trim(), ipa: w.ipa || '' };
}
function pickVocab(n, valid, prefer, opts = {}){
  const seen = new Set(opts.exclude || []);
  const take = w => { const k = w.word.trim().toLowerCase(); if(!k || seen.has(k)) return false; seen.add(k); return true; };
  const pool = words.filter(w => w.word && w.word.trim() && valid(w));
  const rank = arr => prefer ? arr.sort((a, b) => prefer(b) - prefer(a)) : arr;   // sort ổn định: giữ thứ tự xáo trong cùng hạng
  const fresh = rank(shuffle(opts.anyWord ? pool : pool.filter(isNewWord)));
  const rest = opts.anyWord ? [] : rank(shuffle(pool.filter(w => !isNewWord(w)))
    .sort((a, b) => (a.stats.interval || 0) - (b.stats.interval || 0)));
  const out = []; let nNew = 0;
  for(const w of fresh){ if(out.length >= n) break; if(take(w)){ out.push(w); nNew++; } }
  for(const w of rest){ if(out.length >= n) break; if(take(w)) out.push(w); }
  return { list: out, nNew, nFill: out.length - nNew };
}

/* ── Nhận diện từ mục tiêu kể cả dạng biến đổi hợp lệ (books, studied, went…) ── */
const IRREGULAR = {
  be:'am is are was were been being', have:'has had having', do:'does did done doing', go:'goes went gone going',
  make:'made', take:'took taken', give:'gave given', get:'got gotten', come:'came', see:'saw seen', know:'knew known',
  think:'thought', find:'found', tell:'told', become:'became', leave:'left', feel:'felt', bring:'brought',
  begin:'began begun', keep:'kept', hold:'held', write:'wrote written', stand:'stood', hear:'heard', mean:'meant',
  meet:'met', run:'ran', pay:'paid', sit:'sat', speak:'spoke spoken', lead:'led', read:'read', grow:'grew grown',
  lose:'lost', fall:'fell fallen', send:'sent', build:'built', understand:'understood', draw:'drew drawn',
  break:'broke broken', spend:'spent', rise:'rose risen', drive:'drove driven', buy:'bought', wear:'wore worn',
  choose:'chose chosen', seek:'sought', throw:'threw thrown', catch:'caught', deal:'dealt', win:'won',
  forget:'forgot forgotten', teach:'taught', sell:'sold', fight:'fought', overcome:'overcame', undergo:'underwent undergone',
  withdraw:'withdrew withdrawn', arise:'arose arisen', eat:'ate eaten', drink:'drank drunk', sleep:'slept',
  fly:'flew flown', forgive:'forgave forgiven', hide:'hid hidden', ride:'rode ridden', ring:'rang rung', shake:'shook shaken',
  sing:'sang sung', steal:'stole stolen', swim:'swam swum', tear:'tore torn', wake:'woke woken', bear:'bore borne born',
  bind:'bound', bite:'bit bitten', feed:'fed', flee:'fled', freeze:'froze frozen', lay:'laid', lend:'lent',
  light:'lit', shine:'shone', shoot:'shot', strike:'struck', swear:'swore sworn', sweep:'swept', weep:'wept',
  child:'children', person:'people', man:'men', woman:'women', mouse:'mice', foot:'feet', tooth:'teeth',
  good:'better best', bad:'worse worst', far:'further farther furthest farthest', analysis:'analyses', crisis:'crises',
  phenomenon:'phenomena', criterion:'criteria',
};
function wordForms(base){
  const b = base.toLowerCase();
  const f = new Set([b, b + 's', b + 'es', b + 'ed', b + 'd', b + 'ing', b + 'er', b + 'est', b + 'ly', b + "'s", b + '’s']);
  if(/e$/.test(b)){ f.add(b.slice(0, -1) + 'ing'); f.add(b.slice(0, -1) + 'ely'); }
  if(/ie$/.test(b)) f.add(b.slice(0, -2) + 'ying');
  if(/[^aeiou]y$/.test(b)){ const s = b.slice(0, -1); ['ies','ied','ier','iest','ily','iness'].forEach(x => f.add(s + x)); }
  if(/[^aeiou][aeiou][bdgklmnprt]$/.test(b)){ const c = b.slice(-1); ['ed','ing','er','est'].forEach(x => f.add(b + c + x)); }
  if(/(fe|f)$/.test(b)) f.add(b.replace(/(fe|f)$/, 'ves'));
  if(/le$/.test(b)) f.add(b.slice(0, -1) + 'y');
  if(/ic$/.test(b)) f.add(b + 'ally');
  if(IRREGULAR[b]) IRREGULAR[b].split(' ').forEach(x => f.add(x));
  return f;
}
const tgtReCache = new Map();
function targetRegex(word){
  if(tgtReCache.has(word)) return new RegExp(tgtReCache.get(word), 'gi');
  const toks = word.toLowerCase().replace(/\(.*?\)/g, ' ').split(/[\s\/]+/).filter(Boolean);
  let src = '', first = true, gap = false;
  for(const tk of toks){
    if(PLACEHOLDER_RE.test(tk)){ gap = true; continue; }
    const alt = [...wordForms(tk)].sort((a, b) => b.length - a.length).map(escRe).join('|');
    if(!first) src += gap ? "(?:[\\s,]+[\\w'’-]+){0,4}?[\\s,]+" : '[\\s-]+';
    src += '(?:' + alt + ')';
    first = false; gap = false;
  }
  if(!src) return null;
  src = "(?<![\\w'’-])" + src + "(?![\\w-])";
  tgtReCache.set(word, src);
  return new RegExp(src, 'gi');
}
function findTarget(text, word){
  const re = targetRegex(word);
  return re ? [...(text || '').matchAll(re)] : [];
}

/* ── Khởi tạo nội dung từng nhiệm vụ (chỉ 1 lần; giữ nguyên khi đổi chế độ) ── */
async function fetchExample(word){              // câu ví dụ từ Free Dictionary nếu từ chưa có câu
  try{
    const r = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word.toLowerCase().trim()));
    if(!r.ok) return '';
    const data = await r.json();
    for(const e of (Array.isArray(data) ? data : []))
      for(const m of (e.meanings || []))
        for(const d of (m.definitions || []))
          if(d.example && findTarget(d.example, word).length && d.example.split(/\s+/).length >= 4) return d.example.trim();
  }catch(e){}
  return '';
}
function contextParts(sentence, word){         // tách câu quanh MỌI lần xuất hiện của từ
  const ms = findTarget(sentence, word);
  if(!ms.length) return null;
  const parts = []; let pos = 0;
  ms.forEach(m => { parts.push(sentence.slice(pos, m.index)); pos = m.index + m[0].length; });
  parts.push(sentence.slice(pos));
  let ans = ms[0][0];
  if(ms[0].index === 0 && word[0] === word[0].toLowerCase()) ans = ans[0].toLowerCase() + ans.slice(1);
  return { parts, ans };
}
function initTask(k){
  const x = tasks.t[k];
  if(x.inited || k === 'focus') return x;
  const n = TASK_MODES[tasks.mode][k];
  let r;
  if(k === 'pron'){
    r = pickVocab(n, w => !hasPlaceholder(w), w => (w.sentence && findTarget(w.sentence, w.word).length ? 2 : 0) + (w.kind === 'đơn' ? 1 : 0));
    x.items = r.list.map(w => {
      const s = wordSnap(w);
      if(!findTarget(s.sentence, s.word).length) s.sentence = '';
      return Object.assign(s, { stage: 'word', wa: [], sa: [], skipW: false, skipS: false, noSent: false, done: false });
    });
  }else if(k === 'listen'){
    r = pickVocab(n, w => !hasPlaceholder(w), w => w.kind === 'đơn' ? 1 : 0);
    x.items = r.list.map(w => Object.assign(wordSnap(w), { tries: 0, revealed: false, done: false }));
  }else if(k === 'context'){
    const sents = new Set();
    r = pickVocab(n, w => {
      if(!w.sentence || !contextParts(w.sentence, w.word)) return false;
      const key = w.sentence.trim().toLowerCase();
      return !sents.has(key) && (sents.add(key), true);
    });
    x.items = r.list.map(w => { const c = contextParts(w.sentence, w.word);
      return { id: w.id, word: w.word.trim(), meaning: w.meaning || '', parts: c.parts, ans: c.ans }; });
    let order = shuffle(x.items.map((_, i) => i));
    if(order.length > 1 && order.every((v, i) => v === i)) order = order.slice(1).concat(order[0]);   // tránh trùng thứ tự câu
    x.order = order;
    x.slots = x.items.map(() => -1);
    x.res = x.items.map(() => 0);       // 0 chưa kiểm · 1 đúng (khoá) · 2 sai (cần sửa)
    x.checks = 0;
  }else if(k === 'write'){
    const per = WRITE_WORDS, paras = n;
    x.paras = []; let used = [];
    for(let p = 0; p < paras; p++){
      const list = pickVocab(per, () => true, null, { anyWord: true, exclude: used }).list;
      if(list.length < per)                          // sổ ít từ — bù bằng từ đã dùng ở đoạn trước (không trùng trong cùng đoạn)
        list.push(...pickVocab(per - list.length, () => true, null,
          { anyWord: true, exclude: list.map(w => w.word.trim().toLowerCase()) }).list);
      used = used.concat(list.map(w => w.word.trim().toLowerCase()));
      x.paras.push({ words: list.map(wordSnap), text: '', errors: [], issues: [], checks: 0, done: false, checkedText: '' });
    }
    x.short = x.paras.some(p => p.words.length < per) ? 1 : 0;
    x.target = x.paras.length;
    x.inited = x.paras.length > 0 && x.paras.every(p => p.words.length > 0);
    x.idx = 0;
    if(!x.inited){ x.paras = []; return x; }
    tasks.started = true; saveTasks();
    return x;
  }
  x.want = n; x.nNew = r.nNew; x.nFill = r.nFill;
  x.target = x.items.length; x.idx = 0;
  x.inited = x.items.length > 0;
  if(!x.inited){ x.items = []; return x; }
  tasks.started = true; saveTasks();
  return x;
}

/* Hoàn thành một nhiệm vụ → mở khoá nhiệm vụ sau, hiện màn chuyển tiếp */
function completeTask(k){
  const x = tasks.t[k];
  if(x.done) return;
  x.done = true; x.doneAt = now();

}
function finishDay(){

  taskHist[tasks.date] = { mode: tasks.mode, doneAt: tasks.completedAt, sum: taskSummaryData() };
  const merges = gardenAddTaskFlower(tasks.date), added = !!merges;
  tasks.flowerAdded = added ? 1 : 0;
  saveTasks(true);
  tkView = 'done'; tkAnimDone = !tasks.celebrated;
  tasks.celebrated = true; saveTasks(true);

}
function taskSummaryData(){
  const T = tasks.t;
  const pr = T.pron.items || [], ls = T.listen.items || [];
  const prScores = pr.flatMap(i => i.wa.length ? [Math.max(...i.wa)] : []);
  return {
    focusMin: Math.floor(focusTodaySec() / 60),
    pron: pr.length, pronAvg: prScores.length ? Math.round(prScores.reduce((a, b) => a + b, 0) / prScores.length) : 0,
    pronSkip: pr.filter(i => i.skipW || i.skipS).length,
    listen: ls.length, listenFirst: ls.filter(i => i.firstTry).length,
    context: (T.context.items || []).length, contextChecks: T.context.checks || 0,
    write: (T.write.paras || []).length, writeChecks: (T.write.paras || []).reduce((s, p) => s + (p.checks || 0), 0),
  };
}
function taskSummaryLine(k){
  const s = taskSummaryData();
  if(k === 'focus') return t('tkSumFocus', s.focusMin);
  if(k === 'pron') return t('tkSumPron', s.pron, s.pronAvg, s.pronSkip);
  if(k === 'listen') return t('tkSumListen', s.listen, s.listenFirst);
  if(k === 'context') return t('tkSumContext', s.context, s.contextChecks);
  if(k === 'write') return t('tkSumWrite', s.write, s.writeChecks);
  return '';
}

/* ═════════════ GHI ÂM + NHẬN DIỆN GIỌNG NÓI ═════════════
   - MediaRecorder: lưu bản ghi để nghe lại
   - SpeechRecognition (Chrome/Edge/Safari): nhận diện điều người dùng nói;
     điểm = độ khớp giữa kết quả nhận diện và từ/câu mục tiêu. Không có kết
     quả nhận diện hợp lệ → KHÔNG chấm điểm. */
const SRClass = window.SpeechRecognition || window.webkitSpeechRecognition || null;
/* Mặc định Chrome gửi âm thanh lên máy chủ Google để nhận diện (cần Internet, kể cả
   khi app chạy local). Chrome mới hỗ trợ nhận diện NGAY TRÊN MÁY: dùng khi có sẵn,
   hoặc cho tải gói tiếng Anh 1 lần. */
let srLocal = 'unknown';          // 'available' | 'downloadable' | 'downloading' | 'unavailable'
let srUseLocal = false;
async function srCheckLocal(){
  if(!SRClass) return (srLocal = 'unavailable');
  try{
    if(typeof SRClass.available === 'function') srLocal = await SRClass.available({ langs: ['en-US'], processLocally: true });
    else if(typeof SRClass.availableOnDevice === 'function') srLocal = await SRClass.availableOnDevice('en-US');
    else srLocal = 'unavailable';
  }catch(e){ srLocal = 'unavailable'; }
  if(srLocal === 'available') srUseLocal = true;
  return srLocal;
}
async function srInstallLocal(){
  try{
    srLocal = 'downloading';
    let ok = false;
    if(typeof SRClass.install === 'function') ok = await SRClass.install({ langs: ['en-US'], processLocally: true });
    else if(typeof SRClass.installOnDevice === 'function') ok = await SRClass.installOnDevice('en-US');
    await srCheckLocal();
    return ok || srLocal === 'available';
  }catch(e){ srLocal = 'unavailable'; return false; }
}
srCheckLocal();
let recCur = null;
function recAbort(){
  const r = recCur; if(!r) return;
  recCur = null; r.aborted = true;
  clearTimeout(r.timer); clearTimeout(r.quietT);
  try{ if(r.sr) r.sr.abort(); }catch(e){}
  try{ if(r.mr && r.mr.state !== 'inactive') r.mr.stop(); }catch(e){}
  if(r.stream) r.stream.getTracks().forEach(tr => tr.stop());
}
async function recStart(opts, onFinish){
  recAbort();
  const r = { alts: [], segs: [], chunks: [], error: '', srDone: !SRClass, mrDone: false, aborted: false };
  recCur = r;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ recCur = null; onFinish({ error: 'nomic', alts: [] }); return; }
  try{ r.stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch(e){
    if(recCur === r) recCur = null;
    onFinish({ error: e && (e.name === 'NotAllowedError' || e.name === 'SecurityError') ? 'denied' : 'nomic', alts: [] });
    return;
  }
  if(r.aborted){ r.stream.getTracks().forEach(tr => tr.stop()); return; }
  r.finish = () => {
    if(r.aborted || r.finished || !r.srDone || !r.mrDone) return;
    r.finished = true;
    if(recCur === r) recCur = null;
    clearTimeout(r.timer); clearTimeout(r.quietT);
    r.stream.getTracks().forEach(tr => tr.stop());
    const url = r.chunks.length ? URL.createObjectURL(new Blob(r.chunks, { type: (r.mr && r.mr.mimeType) || 'audio/webm' })) : '';
    let alts = r.alts;
    if(opts.sentence && r.segs.length > 1) alts = [{ t: r.segs.map(s => s.t).join(' '), c: Math.min(...r.segs.map(s => s.c || 0)) }];
    onFinish({ alts, url, error: r.error });
  };
  if(window.MediaRecorder){
    try{
      r.mr = new MediaRecorder(r.stream);
      r.mr.ondataavailable = e => { if(e.data && e.data.size) r.chunks.push(e.data); };
      r.mr.onstop = () => { r.mrDone = true; r.finish(); };
      r.mr.start();
    }catch(e){ r.mr = null; r.mrDone = true; }
  }else r.mrDone = true;
  if(SRClass){
    const sr = r.sr = new SRClass();
    sr.lang = 'en-US'; sr.maxAlternatives = 5;
    if(srUseLocal){                              // nhận diện trên máy — không gửi âm thanh đi đâu
      try{ sr.processLocally = true; }catch(e){}
      try{ if('mode' in sr) sr.mode = 'ondevice-only'; }catch(e){}
    }
    sr.continuous = !!opts.sentence; sr.interimResults = !!opts.sentence;
    sr.onresult = e => {
      if(opts.sentence){                       // câu: ghép các đoạn cuối, tự dừng sau ~2s im lặng
        r.segs = [];
        for(let i = 0; i < e.results.length; i++){
          const res = e.results[i];
          if(res.isFinal) r.segs.push({ t: res[0].transcript, c: res[0].confidence || 0 });
        }
        if(r.segs.length === 1){
          const res = [...e.results].find(x => x.isFinal);
          r.alts = [...res].map(a => ({ t: a.transcript, c: a.confidence || 0 }));
        }else if(r.segs.length) r.alts = [{ t: r.segs.map(s => s.t).join(' '), c: 0 }];
        clearTimeout(r.quietT);
        r.quietT = setTimeout(recStop, 2200);
      }else{
        const res = e.results[e.results.length - 1];
        r.alts = [...res].map(a => ({ t: a.transcript, c: a.confidence || 0 }));
      }
    };
    sr.onerror = e => {
      if(e.error === 'aborted') return;
      r.error = ({ 'no-speech': 'nospeech', 'not-allowed': 'denied', 'service-not-allowed': 'service',
                   network: 'network', 'audio-capture': 'nomic', 'language-not-supported': 'service' })[e.error] || 'service';
      if(srUseLocal && r.error === 'service'){ srUseLocal = false; srLocal = 'unavailable'; }   // gói trên máy lỗi → quay về máy chủ
    };
    sr.onend = () => {
      r.srDone = true;
      try{ if(r.mr && r.mr.state !== 'inactive') r.mr.stop(); else r.mrDone = true; }catch(e){ r.mrDone = true; }
      r.finish();
    };
    try{ sr.start(); }catch(e){ r.srDone = true; r.error = 'service'; }
  }
  r.timer = setTimeout(recStop, (opts.sentence ? 16 : 6) * 1000);
}
function recStop(){
  const r = recCur; if(!r || !r.finish) return;
  if(r.sr && !r.srDone){ try{ r.sr.stop(); }catch(e){ r.srDone = true; } }
  if(!r.sr || r.srDone){
    try{ if(r.mr && r.mr.state !== 'inactive') r.mr.stop(); else r.mrDone = true; }catch(e){ r.mrDone = true; }
  }
  r.finish();
}

/* ── Chấm điểm từ kết quả nhận diện ── */
const normSpeech = s => (s || '').toLowerCase().replace(/[’‘`]/g, "'").replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim();
function lev(a, b){
  const m = a.length, n = b.length;
  if(!m) return n; if(!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for(let i = 1; i <= m; i++){
    const cur = [i];
    for(let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
const simStr = (a, b) => (!a && !b) ? 1 : 1 - lev(a, b) / Math.max(a.length, b.length);
const confFactor = c => c > 0 ? 0.75 + 0.25 * c : 1;      // trình duyệt không trả độ tin cậy → không phạt
function scoreWord(target, alts){
  const tg = normSpeech(target).replace(/ /g, ''), nTok = normSpeech(target).split(' ').length;
  let best = { score: 0, heard: '', match: '' };
  alts.forEach((a, i) => {
    const toks = normSpeech(a.t).split(' ').filter(Boolean);
    const cands = [toks.join(' ')];
    for(let k = 0; k + nTok <= toks.length; k++) cands.push(toks.slice(k, k + nTok).join(' '));
    for(const c of cands){
      const s = simStr(c.replace(/ /g, ''), tg) * confFactor(a.c) * (1 - 0.04 * i);
      if(s > best.score) best = { score: s, heard: a.t.trim(), match: c.replace(/ /g, '') };
    }
  });
  return { score: Math.round(best.score * 100), heard: best.heard, diff: letterDiff(tg, best.match) };
}
function letterDiff(target, heard){              // đánh dấu chữ cái của từ mục tiêu không khớp
  const m = target.length, n = heard.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for(let i = m - 1; i >= 0; i--) for(let j = n - 1; j >= 0; j--)
    dp[i][j] = target[i] === heard[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ok = new Array(m).fill(false);
  let i = 0, j = 0;
  while(i < m && j < n){
    if(target[i] === heard[j]){ ok[i] = true; i++; j++; }
    else if(dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return ok;
}
function scoreSentence(target, alts){
  const tt = normSpeech(target).split(' ').filter(Boolean);
  let best = { score: 0, heard: '', marks: tt.map(() => 0) };
  alts.forEach((a, ai) => {
    const ht = normSpeech(a.t).split(' ').filter(Boolean);
    const m = tt.length, n = ht.length;
    const w = (x, y) => x === y ? 1 : simStr(x, y) >= 0.7 ? 0.5 : 0;
    const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
    for(let i = m - 1; i >= 0; i--) for(let j = n - 1; j >= 0; j--){
      const ww = w(tt[i], ht[j]);
      dp[i][j] = Math.max(dp[i + 1][j], dp[i][j + 1], ww ? dp[i + 1][j + 1] + ww : 0);
    }
    const marks = tt.map(() => 0);
    let i = 0, j = 0;
    while(i < m && j < n){
      const ww = w(tt[i], ht[j]);
      if(ww && dp[i][j] === dp[i + 1][j + 1] + ww){ marks[i] = ww; i++; j++; }
      else if(dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
    }
    const extra = Math.max(0, n - m) / Math.max(m, 1);          // nói thừa nhiều → trừ nhẹ
    const s = dp[0][0] / Math.max(m, 1) * confFactor(a.c) * (1 - 0.04 * ai) * (1 - Math.min(0.2, extra * 0.3));
    if(s > best.score) best = { score: s, heard: a.t.trim(), marks };
  });
  return { score: Math.round(best.score * 100), heard: best.heard, marks: best.marks, toks: tt };
}

let tkInfos = [];
function tkInfo(msgs, align){          // align: '' (mở sang trái) | 'left' | 'center'

/* Nút "!" đặt ở góc dưới bên phải của khu vực; nếu góc đó đã có phần tử khác thì
   chuyển lên góc trên bên phải; cả hai góc đều vướng thì xuống một hàng riêng. */
const infoCorner = (msgs) => { const h = tkInfo(msgs); return h ? `<div class="info-corner">${h}</div>` : ''; };
function infoCornerHits(corner){
  const cr = corner.getBoundingClientRect(), pad = 4;
  const meets = r => r.width > 0 && r.height > 0 && r.left < cr.right + pad && r.right > cr.left - pad && r.top < cr.bottom + pad && r.bottom > cr.top - pad;
  const covers = r => r.left <= cr.left && r.right >= cr.right && r.top <= cr.top && r.bottom >= cr.bottom;
  const hasBox = el => {
    const cs = getComputedStyle(el);
    return ['Top','Right','Bottom','Left'].some(k => parseFloat(cs['border' + k + 'Width']) > 0)
      || !/^(transparent|rgba\(0, 0, 0, 0\))$/.test(cs.backgroundColor) || cs.backgroundImage !== 'none';
  };
  const walk = node => {
    for(const ch of node.children){
      if(ch === corner || ch.matches('.tk-fdeco, [aria-hidden="true"], script, style, [hidden]')) continue;
      const r = ch.getBoundingClientRect();
      if(!meets(r)) continue;
      const texts = [...ch.childNodes].filter(n => n.nodeType === 3 && n.textContent.trim());
      if(!ch.children.length && !texts.length) return true;     // ô nhập, icon, khối trống có hình
      for(const n of texts){                                    // so đúng vùng chữ thật, không phải cả khối
        const rg = document.createRange(); rg.selectNodeContents(n);
        if([...rg.getClientRects()].some(meets)) return true;
      }
      if(!covers(r) && hasBox(ch)) return true;                 // khung có viền/nền lấn vào góc (bảng, nút…)
      if(walk(ch)) return true;
    }
    return false;
  };
  return walk(corner.parentElement);
}
function layoutInfoCorners(){
  $$('.info-corner').forEach(c => {
    if(!c.firstElementChild || !c.offsetParent) return;
    c.parentElement.classList.add('has-info');
    c.classList.remove('at-top', 'inflow');
    if(!infoCornerHits(c)) return;                               // góc dưới bên phải còn trống
    c.classList.add('at-top');
    if(!infoCornerHits(c)) return;                               // góc trên bên phải còn trống
    c.classList.remove('at-top'); c.classList.add('inflow');
  });
}

  if(pop.parentElement !== document.body){ pop._home = pop.parentElement; b._pop = pop; pop._btn = b; document.body.appendChild(pop); }
  const r = b.getBoundingClientRect(), pw = Math.min(340, innerWidth - 16);
  Object.assign(pop.style, { position: 'fixed', width: pw + 'px', right: 'auto', transform: 'none' });
  let left = r.right - pw;
  if(left < 8) left = r.left;
  left = Math.max(8, Math.min(left, innerWidth - pw - 8));
  pop.style.left = left + 'px';
  const ph = pop.offsetHeight;
  let top = r.bottom + 8;

  pop.style.top = top + 'px';
  infoScrollY = scrollY;
}

/* ── 2. Phát âm ── */
let pr = null;      // trạng thái tạm (không lưu): { phase, url, result, err }
const prFresh = () => ({ phase: 'idle', url: '', result: null, err: '', busy: false });
function tkPronBody(x){
  if(!pr) pr = prFresh();
  const doneN = x.items.filter(i => i.done).length;
  if(x.idx >= x.items.length || x.items[x.idx].done) x.idx = Math.max(0, x.items.findIndex(i => !i.done));
  const it = x.items[x.idx];
  const sent = it.stage === 'sent';
  const tries = sent ? it.sa : it.wa;
  const pass = sent ? PRON_SENT_PASS : PRON_WORD_PASS;
  const fails = tries.filter(s => s <= pass).length;
  const canSkip = fails >= PRON_SKIP_AFTER || ['unsupported','denied','nomic','service','network','installFail'].includes(pr.err) || !SRClass;
  let target;
  if(sent){
    const ms = findTarget(it.sentence, it.word);
    let html = '', pos = 0;
    ms.forEach(m => { html += esc(it.sentence.slice(pos, m.index)) + '<mark>' + esc(m[0]) + '</mark>'; pos = m.index + m[0].length; });
    html += esc(it.sentence.slice(pos));
    target = `<div class="tk-pr-sent">${html}</div>`;
  }else{
    target = `<div class="tk-pr-word">${esc(it.word)}</div>
      ${it.ipa ? `<div class="tk-pr-ipa mono">${esc(it.ipa)}</div>` : ''}
      <div class="tk-pr-mean">${esc(it.meaning)}${it.pos ? ` · <span class="pos-tag">${esc(it.pos)}</span>` : ''}</div>`;
  }
  const r = pr.result;
  let result = '';
  if(pr.phase === 'loadingSent') result = `<div class="tk-loading"><span class="tk-spin"></span>${t('tkPrFindingSent')}</div>`;
  else if(pr.phase === 'analyzing') result = `<div class="tk-loading"><span class="tk-spin"></span>${t('tkPrAnalyzing')}</div>`;
  else if(pr.phase === 'installing') result = `<div class="tk-loading"><span class="tk-spin"></span>${t('tkPrInstalling')}</div>`;
  else if(pr.err === 'switchedLocal') result = `<div class="tk-alert good">${I('check')}<span>${t('tkPrSwitchedLocal')}</span></div>`;
  else if(pr.err) result = `<div class="tk-alert ${pr.err === 'nospeech' ? 'warn' : 'bad'}">${I('x')}<span>${t('tkPrErr_' + pr.err)}${
      (pr.err === 'network' || pr.err === 'service') && navigator.brave ? ' ' + t('tkPrBrave') : ''}</span></div>
    ${(pr.err === 'network' || pr.err === 'service') && srLocal === 'downloadable'
      ? `<div class="tk-actions" style="margin-top:0"><button class="btn sky sm" data-tk="prInstall">${I('in')}${t('tkPrInstall')}</button></div>` : ''}`;
  else if(r){
    const ok = r.score > pass;
    let fbk = '';
    if(!sent && r.diff){

async function pronAdvance(it, skipped){

const LT_USAGE_CATS = ['CONFUSED_WORDS','COLLOCATIONS','SEMANTICS','NONSTANDARD_PHRASES','FALSE_FRIENDS'];
const LT_GRAMMAR_CATS = ['GRAMMAR','CASING','MISC'];
function ltType(m){
  const cat = (m.rule && m.rule.category && m.rule.category.id) || '';
  const it = m.rule && m.rule.issueType;
  if(it === 'misspelling' || cat === 'TYPOS') return 'spelling';
  if(LT_USAGE_CATS.includes(cat)) return 'usage';
  if(LT_GRAMMAR_CATS.includes(cat) || it === 'grammar') return 'grammar';
  return '';                                     // văn phong / dấu câu / kiểu chữ: ngoài phạm vi kiểm tra
}
function splitSentences(text){
  const out = []; const re = /[^.!?\n]+[.!?]*/g; let m;
  while((m = re.exec(text))) if(m[0].trim()) out.push({ start: m.index, end: m.index + m[0].length, text: m[0] });
  return out;
}
const wordCount = s => ((s || '').match(/[A-Za-z][A-Za-z'’-]*/g) || []).length;
function usageProblem(tw, m, sent, targets, text){
  const n = wordCount(sent.text);
  if(n < 5) return 'short';
  const hits = targets.filter(x => findTarget(sent.text, x.word).length).length;
  if(hits >= 3 && n < hits * 3) return 'list';
  const before = text.slice(sent.start, m.index).toLowerCase();
  if(/["“'‘«]\s*$/.test(before) || /\b(word|term|phrase|vocabulary|expression)\s*$/.test(before)) return 'mention';
  const form = m[0].toLowerCase(), base = tw.word.toLowerCase(), pos = (tw.pos || '').toLowerCase();
  if(!/\s/.test(base) && form !== base){
    if(/^(n|noun|danh)/.test(pos) && /ed$/.test(form) && !/ed$/.test(base)) return 'pos';
    if(/^(adj|tính)/.test(pos) && /(s|ed|ing)$/.test(form) && !/(s|ed|ing)$/.test(base) && !/(er|est|ly|ily)$/.test(form)) return 'pos';
  }
  return '';
}
function localUsageErrors(text, targets){
  const errs = [], sents = splitSentences(text);
  targets.forEach(tw => {
    const ms = findTarget(text, tw.word);
    if(!ms.length){
      errs.push({ type: 'usage', text: tw.word, offset: -1, length: 0, msg: t('tkWrMissing', tw.word), sug: t('tkWrMissingSug') });
      return;
    }
    let bad = null;
    for(const m of ms){
      const s = sents.find(q => m.index >= q.start && m.index < q.end) || { start: 0, end: text.length, text };
      const why = usageProblem(tw, m, s, targets, text);
      if(!why){ bad = null; break; }
      if(!bad) bad = { m, why };
    }
    if(bad) errs.push({ type: 'usage', text: bad.m[0], offset: bad.m.index, length: bad.m[0].length,
      msg: t('tkWrUse_' + bad.why, bad.m[0], tw.pos), sug: t('tkWrUseSug') });
  });
  return errs;
}

function renderWriteErrors(p, fresh){
  const el = $('#wrResult'); if(!el) return;
  const text = p.checkedText || '';
  const list = p.errors;
  if(!list.length){ el.innerHTML = ''; return; }
  const marks = list.filter(e => e.offset >= 0).sort((a, b) => a.offset - b.offset);
  let html = '', pos = 0;
  marks.forEach(e => {
    if(e.offset < pos) return;
    html += esc(text.slice(pos, e.offset)) + `<mark class="tk-err t-${e.type}" data-tk="wrJump" data-o="${e.offset}" data-l="${e.length}">${esc(text.slice(e.offset, e.offset + e.length))}</mark>`;
    pos = e.offset + e.length;
  });
  html += esc(text.slice(pos));
  const stale = (p.text || '') !== text;
  el.innerHTML = `
    <div class="tk-alert bad">${I('x')}<span>${t('tkWrErrCount', list.length)}${stale ? ' ' + t('tkWrStale') : ''}</span></div>
    ${marks.length ? `<div class="tk-wr-preview">${html}</div>` : ''}
    <ul class="tk-errs">${list.map(e => `
      <li class="tk-errli" ${e.offset >= 0 ? `data-tk="wrJump" data-o="${e.offset}" data-l="${e.length}"` : ''}>

        <div><div class="tk-ewrong ${e.offset < 0 ? 'missing' : ''}"><span class="mono">${esc(e.text)}</span></div>
        <div class="tk-emsg">${esc(e.msg)}</div>
        ${e.sug ? `<div class="tk-esug">${I('bulb')}${esc(e.sug)}</div>` : ''}</div>
      </li>`).join('')}</ul>`;
  if(fresh) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
async function writeCheck(){
  const x = tasks.t.write, p = x.paras[x.idx], box = $('#wrBox'), btn = $('#wrCheckBtn'), el = $('#wrResult');
  if(!p || !box) return;
  const text = box.value;
  p.text = text;
  if(wordCount(text) < WRITE_MIN_WORDS){ toast(t('tkWrTooShort', WRITE_MIN_WORDS)); return; }
  btn.disabled = true;
  el.innerHTML = `<div class="tk-loading"><span class="tk-spin"></span>${t('tkWrChecking')}</div>`;
  let data;
  try{
    const r = await fetch('https://api.languagetool.org/v2/check', {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ text, language: 'en-US' }),
    });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    data = await r.json();
  }catch(e){
    if(tkView !== 'write') return;
    btn.disabled = false;
    el.innerHTML = `<div class="tk-alert bad">${I('x')}<span>${t('tkWrServiceErr')}</span></div>`;
    return;
  }
  if(tkView !== 'write' || x.paras[x.idx] !== p) return;
  const vocab = new Set(words.map(w => w.word.trim().toLowerCase()));
  const tforms = new Set(p.words.flatMap(w => [...wordForms(w.word)]));
  const errs = [];
  for(const m of (data.matches || [])){
    const type = ltType(m); if(!type) continue;
    const frag = text.substr(m.offset, m.length);
    if(type === 'spelling' && (vocab.has(frag.toLowerCase()) || tforms.has(frag.toLowerCase()))) continue;
    const overlapsTarget = p.words.some(w => findTarget(text, w.word).some(q => q.index < m.offset + m.length && m.offset < q.index + q[0].length));
    errs.push({ type: type === 'grammar' && overlapsTarget ? 'usage' : type, text: frag, offset: m.offset, length: m.length,
      msg: m.message || '', sug: (m.replacements || []).slice(0, 3).map(r => r.value).join(' / ') });
  }
  errs.push(...localUsageErrors(text, p.words));
  p.checks = (p.checks || 0) + 1;
  p.checkedText = text;
  p.errors = errs;
  if(!Array.isArray(p.issues)) p.issues = [];
  const seenIssue = new Set(p.issues.map(e => e.type + '|' + e.text + '|' + e.msg));
  errs.forEach(e => {                           // gom mọi lỗi đã gặp để xem lại trong lịch sử
    const k = e.type + '|' + e.text + '|' + e.msg;
    if(!seenIssue.has(k)){ seenIssue.add(k); p.issues.push({ type: e.type, text: e.text, msg: e.msg, sug: e.sug, miss: e.offset < 0 ? 1 : 0 }); }
  });
  saveTasks();
  btn.disabled = false;
  if(errs.length){ renderWriteErrors(p, true); return; }
  p.done = true; p.errors = [];
  logWriting(p, x.idx);
  saveTasks();
  el.innerHTML = `<div class="tk-alert good">${I('check')}<span>${t('tkWrParaDone', x.idx + 1)}</span></div>`;
  btn.disabled = true; box.disabled = true;
  setTimeout(() => {
    if(tkView !== 'write') return;
    const next = x.paras.findIndex(q => !q.done);
    if(next < 0){ completeTask('write'); return; }
    x.idx = next; saveTasks(); renderTasks();
  }, 1400);
}

/* ═════════════ DỊCH NHANH (Google Dịch) ═════════════
   Tự nhận diện Anh ↔ Việt (dấu tiếng Việt / ngôn ngữ Google trả về), hiện nghĩa
   khác theo từ loại, nghe phát âm, sao chép và thêm thẳng vào sổ từ vựng. */
const tr = { dir: 'auto', from: 'en', to: 'vi', q: '', res: null, pick: '', reqId: 0, timer: null };
const VI_RE = /[ăâđêôơưàảãáạằẳẵắặầẩẫấậèẻẽéẹềểễếệìỉĩíịòỏõóọồổỗốộờởỡớợùủũúụừửữứựỳỷỹýỵ]/i;
const TR_POS = { verb:'v', 'động từ':'v', noun:'n', 'danh từ':'n', adjective:'adj', 'tính từ':'adj', adverb:'adv', 'trạng từ':'adv',
  preposition:'prep', 'giới từ':'prep', pronoun:'pron', 'đại từ':'pron', conjunction:'conj', 'liên từ':'conj', phrase:'phrase', 'cụm từ':'phrase' };
async function trFetch(q, sl, tl){
  try{
    const u = 'https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&dt=bd&sl=' + sl + '&tl=' + tl
      + '&hl=' + (LANG === 'vi' ? 'vi' : 'en') + '&q=' + encodeURIComponent(q);
    const r = await fetch(u);
    if(!r.ok) throw 0;
    const d = await r.json();
    return {
      text: (d[0] || []).map(x => x && x[0] || '').join('').trim(),
      src: d[2] || sl,
      /* d[1]: [từ loại, [nghĩa…], [[nghĩa, [dịch ngược…], _, điểm tần suất?], …]] — Google xếp nghĩa
         phổ biến lên trước và chỉ gắn điểm cho những nghĩa dùng nhiều */
      alts: (d[1] || []).map(g => ({ pos: g[0] || '', terms: (g[2] || (g[1] || []).map(x => [x])).slice(0, 8).map((e, i) => ({
        w: e[0], back: (e[1] || []).slice(0, 4), common: i === 0 || typeof e[3] === 'number' })) })).filter(g => g.terms.length),
    };
  }catch(e){                                     // dự phòng: MyMemory
    const from = sl === 'auto' ? (VI_RE.test(q) ? 'vi' : 'en') : sl;
    const r = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(q) + '&langpair=' + from + '|' + tl);
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    const text = d && d.responseData && d.responseData.translatedText;
    if(!text) throw new Error('empty');
    return { text, src: from, alts: [] };
  }
}
async function trRun(force){
  const q = $('#trIn').value.trim();
  if(!q){ tr.q = ''; tr.res = null; trRender(); return; }
  if(q === tr.q && tr.res && !force) return;
  const id = ++tr.reqId;
  tr.q = q; tr.res = { loading: true }; tr.pick = ''; trRender();
  try{
    let from, to, res;
    if(tr.dir === 'auto'){
      from = VI_RE.test(q) ? 'vi' : 'en'; to = from === 'vi' ? 'en' : 'vi';
      res = await trFetch(q, 'auto', to);
      if(id !== tr.reqId) return;
      if(res.src === to){ from = to; to = from === 'vi' ? 'en' : 'vi'; res = await trFetch(q, from, to); }   // đoán sai chiều → dịch lại
      else from = res.src === 'vi' ? 'vi' : 'en';
    }else{
      [from, to] = tr.dir.split('-');
      res = await trFetch(q, from, to);
    }
    if(id !== tr.reqId) return;
    tr.from = from; tr.to = to; tr.res = res;
  }catch(e){
    if(id !== tr.reqId) return;
    tr.res = { error: true };
  }
  trRender();
}
function trRender(){
  $('#trFrom').textContent = tr.from.toUpperCase();
  $('#trTo').textContent = tr.to.toUpperCase();
  $('#trDir').title = t('trSwap') + ' · ' + (tr.dir === 'auto' ? t('trAuto') : t('trManual'));

  const ready = r && !r.loading && !r.error && r.text;

  if(!r){ out.innerHTML = `<div class="tr-empty">${t('trEmpty')}</div>`; return; }

  if(r.error){ out.innerHTML = `<div class="tr-empty" style="color:var(--red)">${t('trErr')}</div>`; return; }
  const mainLc = r.text.toLowerCase();

  out.innerHTML = `<div class="tr-main-box ${tr.pick === r.text ? 'on' : ''}">
      <div class="tr-lbl">${I('star')}${t('trMain')}${mainPos ? ` · <span>${esc(mainPos)}</span>` : ''}</div>
      <button class="tr-main" data-alt="${esc(r.text)}" data-pos="${esc(mainPos)}">${esc(r.text)}</button>
    </div>`
    + (r.alts.length ? `<div class="tr-alts"><div class="tr-lbl">${t('trMore')}<span class="tr-legend"><i></i>${t('trCommon')}</span></div>
      ${r.alts.map(g => `<div><div class="tr-pos">${esc(g.pos)}</div><div class="tr-alt-row">${g.terms.map(x =>
        `<button class="tr-alt ${x.common ? 'common' : ''} ${tr.pick === x.w ? 'on' : ''}" data-alt="${esc(x.w)}" data-pos="${esc(g.pos)}"
          title="${esc(x.back.join(', '))}">${esc(x.w)}</button>`).join('')}</div></div>`).join('')}</div>` : '');
}

/* ── Sự kiện (uỷ quyền trên khung tab) ── */
$('#tasksArea').addEventListener('click', e => {
  const el = e.target.closest('[data-tk]');
  if(ctxPop >= 0 && tkView === 'context' && !e.target.closest('.tk-pop') && !(el && /^ctx(Slot|Chip|Pick|Remove)$/.test(el.dataset.tk))){
    ctxPop = -1; if(!el){ renderTasks(); return; }        // nhấn ra ngoài → đóng bảng chọn từ
  }
  if(!el) return;
  const a = el.dataset.tk;
  if(a === 'info') return;                 // nút "!" xử lý chung ở document
  if(a === 'open') tkOpen(el.dataset.k);
  else if(a === 'result'){ tkView = 'done'; renderTasks(); }
  else if(a === 'start') tkOpen('start');
  else if(a === 'overview'){ recAbort(); stopSpeech(); tkView = 'overview'; renderTasks(); }
  else if(a === 'mode'){
    const m = el.dataset.m; if(!TASK_MODES[m] || tasks.mode === m) return;
    tasks.mode = m; taskModePref = m;
    if(checkFocusTask()) toast(t('tkFocusDoneToast', focusGoalMin()));
    saveTasks(); renderTasks();
  }
  else if(a === 'goFocus' || a === 'goGarden') activateTab($('.tab-btn[data-tab="focus"]'));
  else if(a === 'goNotes') activateTab($('.tab-btn[data-tab="notes"]'));
  else if(a === 'prRec') pronRecord();
  else if(a === 'prStop') recStop();
  else if(a === 'prSample'){ const it = pronItem(); if(it) (it.stage === 'sent' ? speakTTS(it.sentence) : tkSpeak(it)); }
  else if(a === 'prPlay'){ if(pr && pr.url){ stopSpeech(); new Audio(pr.url).play().catch(() => {}); } }
  else if(a === 'prInstall'){
    pr.phase = 'installing'; pr.err = ''; renderTasks();
    srInstallLocal().then(ok => {
      if(tkView !== 'pron') return;
      pr.phase = 'idle';
      if(ok){ srUseLocal = true; pr.err = 'switchedLocal'; } else pr.err = 'installFail';
      renderTasks();
    });
  }
  else if(a === 'prSkip'){ const it = pronItem(); if(it){ recAbort(); pronAdvance(it, true); } }
  else if(a === 'lsPlay'){ const x = tasks.t.listen; tkSpeak(x.items[x.idx]); const i = $('#lsInput'); if(i) i.focus(); }
  else if(a === 'lsCheck') listenCheck();
  else if(a === 'lsHint') listenHint();
  else if(a === 'lsDontKnow') listenDontKnow();
  else if(a === 'ctxChip'){
    const from = el.dataset.from;
    if(from !== undefined){                       // chạm chữ trong ô → thay bằng từ đang chọn / mở bảng chọn
      if(ctxSel >= 0) ctxPlace(ctxSel, +from); else { ctxPop = ctxPop === +from ? -1 : +from; renderTasks(); }
      return;
    }
    const bi = +el.dataset.b; ctxSel = ctxSel === bi ? -1 : bi; renderTasks();
  }
  else if(a === 'ctxSlot'){
    const s = +el.dataset.s;
    if(ctxSel >= 0) ctxPlace(ctxSel, s);
    else if(tasks.t.context.res[s] !== 1){ ctxPop = ctxPop === s ? -1 : s; renderTasks(); }
  }
  else if(a === 'ctxPick') ctxPlace(+el.dataset.b, +el.dataset.s);
  else if(a === 'ctxRemove') ctxUnplace(+el.dataset.s);
  else if(a === 'ctxCheck') ctxCheck();
  else if(a === 'wrCheck') writeCheck();
  else if(a === 'wrJump'){
    const box = $('#wrBox'); if(!box) return;
    const o = +el.dataset.o, l = +el.dataset.l;
    box.focus(); box.setSelectionRange(o, Math.min(box.value.length, o + l));
  }
});
/* Kéo thả (chuột/bút); trên cảm ứng dùng chạm-để-chọn ở trên */
$('#tasksArea').addEventListener('dragstart', e => {

/* ═══════════════════════════════════════════════════════════
   TAB LUYỆN GÕ
   ═══════════════════════════════════════════════════════════ */
let quiz = null;          // {w, mode, startAt, hintLevel(0-2), typed[], pickedIdx[]}
let quizStreak = 0;

function fillGroupSelect(sel){
  const keep = sel.value;
  sel.innerHTML = `<option value="">${t('nAllGroups')}</option>`
    + groupsOf().map(g => `<option value="${esc(g)}">${esc(g)}</option>`).join('');
  sel.value = [...sel.options].some(o => o.value === keep) ? keep : '';
}
/* ── Bộ lọc nhóm nhiều lựa chọn (tick từng nhóm + "Tất cả") ── */
const NO_GROUP = '__none__';
let quizGroupAll = true;                 // true = tất cả nhóm
let quizGroupSet = new Set();            // khi quizGroupAll=false: các nhóm đã tick
let groupDebounce = null;
const wordGroupKey = w => w.group || NO_GROUP;
function quizGroupKeys(){
  const keys = groupsOf();
  if(keys.length && words.some(w => !w.group)) keys.push(NO_GROUP);
  return keys;
}
const quizGroupOk = w => quizGroupAll || quizGroupSet.has(wordGroupKey(w));
function quizGroupLabel(){
  if(quizGroupAll) return t('qAllGroups');
  const n = quizGroupSet.size;
  if(n === 0) return t('qGroupsNone');
  if(n === 1){ const k = [...quizGroupSet][0]; return k === NO_GROUP ? t('optNoGroup') : k; }
  return t('qGroupsN', n);
}
function syncGroupMenu(){
  $$('#quizGroupMenu input[type=checkbox]').forEach(cb => {
    cb.checked = cb.hasAttribute('data-all') ? quizGroupAll : (quizGroupAll || quizGroupSet.has(cb.dataset.k));
  });
  const allCb = $('#quizGroupMenu input[data-all]');
  if(allCb) allCb.indeterminate = !quizGroupAll && quizGroupSet.size > 0;
  $('#quizGroupText').textContent = quizGroupLabel();
  $('#quizGroupText').title = quizGroupLabel();
}
function fillQuizGroups(){
  toggleGroupMenu(false);
  const keys = quizGroupKeys();
  if(!quizGroupAll) quizGroupSet = new Set([...quizGroupSet].filter(k => keys.includes(k)));
  const cnt = {}; words.forEach(w => { const k = wordGroupKey(w); cnt[k] = (cnt[k] || 0) + 1; });
  const opt = (attr, label, n, cls) =>
    `<label class="gsel-opt ${cls}"><input type="checkbox" ${attr}><span>${esc(label)}</span><span class="n">${n}</span></label>`;
  $('#quizGroupMenu').innerHTML = opt('data-all', t('qAllGroups'), words.length, 'all')
    + keys.map(k => opt(`data-k="${esc(k)}"`, k === NO_GROUP ? t('optNoGroup') : k, cnt[k] || 0, '')).join('');
  syncGroupMenu();
}
function toggleGroupMenu(force){
  const menu = $('#quizGroupMenu'), sel = $('#quizGroupSel'); if(!menu || !sel) return;
  const open = force !== undefined ? force : menu.hidden;
  menu.hidden = !open; sel.classList.toggle('open', open);
  $('#quizGroupBtn').setAttribute('aria-expanded', String(open));
}
$('#quizGroupBtn').addEventListener('click', e => { e.stopPropagation(); toggleGroupMenu(); });
document.addEventListener('click', e => { if(!e.target.closest('#quizGroupSel')) toggleGroupMenu(false); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') toggleGroupMenu(false); });
$('#quizGroupMenu').addEventListener('change', e => {
  const cb = e.target.closest('input[type=checkbox]'); if(!cb) return;
  const keys = quizGroupKeys();
  if(cb.hasAttribute('data-all')){
    quizGroupAll = cb.checked; quizGroupSet = new Set();
  }else{
    if(quizGroupAll){ quizGroupAll = false; quizGroupSet = new Set(keys); }   // đang "tất cả" → bỏ tick 1 nhóm
    cb.checked ? quizGroupSet.add(cb.dataset.k) : quizGroupSet.delete(cb.dataset.k);
    if(keys.length && keys.every(k => quizGroupSet.has(k))){ quizGroupAll = true; quizGroupSet = new Set(); }
  }
  syncGroupMenu();
  clearTimeout(groupDebounce); groupDebounce = setTimeout(startQuiz, 300);   // tick liên tiếp chỉ làm lại 1 lần
});

function quizPool(){
  const savedOnly = $('#quizSavedOnly').checked;
  return words.filter(w => (!savedOnly || w.saved) && quizGroupOk(w));
}

/* Chế độ trả lời nhớ riêng cho từ đơn (Alphabet/Type) và cụm (Arrange words/Type) */
const modeKey = kind => kind === 'đơn' ? 'soTuSingleMode_v1' : 'soTuPhraseMode_v1';
const quizSpeakerOn = () => true;

/* Streak: cấp độ hiệu ứng tăng dần theo số câu đúng liên tiếp */
const streakTier = n => n >= 20 ? 5 : n >= 10 ? 4 : n >= 6 ? 3 : n >= 3 ? 2 : n >= 1 ? 1 : 0;
function updateStreakUI(prev){
  const chip = $('#streakChip'), num = $('#quizStreak'); if(!chip || !num) return;
  const n = quizStreak, oldTier = parseInt(chip.dataset.tier || '0', 10), tier = streakTier(n);
  const retrigger = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
  num.textContent = n;
  chip.dataset.tier = tier;
  if(n > (prev || 0)){
    retrigger(num, 'pop');
    if(tier > oldTier && tier >= 2) retrigger(chip, 'tier-up');
  }else if(n === 0 && (prev || 0) >= 3){
    retrigger(chip, 'lost'); setTimeout(() => chip.classList.remove('lost'), 400);
  }
}

function startQuiz(){
  stopSpeech();                                    // sang từ mới → ngắt giọng đọc đang chạy (nếu có)
  const pool = quizPool();
  const area = $('#quizArea');
  if(!pool.length){
    const none = !quizGroupAll && quizGroupSet.size === 0;
    area.innerHTML = `<div class="panel"><div class="empty">${I('leaf')}<br>
      ${none ? t('qNoGroupPicked') : t('emptyQuiz', $('#quizSavedOnly').checked ? t('qExtraSaved') : '')}</div></div>`;
    quiz = null; return;
  }
  const w = pickWordLimited(pool);
  lastShownId = w.id;
  preloadWordAudio(w);
  quiz = { w, mode: w.kind, startAt: now(), hintLevel:0, typed:[], pickedIdx:[],
           phraseMode: localStorage.getItem(modeKey(w.kind)) === 'type' ? 'type' : 'chips',
           typedPhrase: '' };           
  if(w.kind === 'đơn'){
    const letters = w.word.toLowerCase().split('');
    quiz.shuffled = shuffle(letters.map((ch,i)=>({ch,i})).filter(x=>x.ch!==' '));
  }else{
    const ws = w.word.split(/\s+/);
    quiz.shuffled = shuffle(ws.map((t,i)=>({t,i})));
  }
  renderQuiz();
}

function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

const normPhrase = t => t.toLowerCase().replace(/[.,!?;:"""'’]/g, ' ').replace(/\s+/g, ' ').trim();

function renderQuiz(){
  const {w} = quiz;
  let hint = '';
  if(quiz.hintLevel >= 1){
    hint = `<div class="hintline">${I('bulb')} ${w.kind==='đơn'
        ? t('qHintStart', esc(w.word[0]), w.word.replace(/ /g,'').length)
        : t('qHintFirstWord', esc(w.word.split(/\s+/)[0]))}
        ${w.note?` · ${esc(w.note)}`:''}</div>`;
  }
  if(quiz.hintLevel >= 2){
    const full = w.word.trim();
    hint += `<div class="hintline">${I('bulb')} ${t('qHintHalf', esc(full.slice(0, Math.ceil(full.length/2))), full.length)}</div>`;
  }
  const typeMode = quiz.phraseMode === 'type';
  const spk = quizSpeakerOn();
  const promptHtml = `
    <div class="q-prompt ${spk?'has-speak':''}">
      ${spk ? `<button class="speak-btn q-speak" id="qSpeak" title="${t('listenTitle')}">${I('sound')}</button>` : ''}
      <div class="label">${t(w.kind==='đơn' ? (typeMode?'qLabelSingleType':'qLabelSingle') : (typeMode?'qLabelPhraseType':'qLabelPhrase'))}</div>
      <div class="meaning">${esc(w.meaning)} ${w.pos?`<span class="pos-tag">${esc(w.pos)}</span>`:''} ${w.saved?`<svg class="ic" style="fill:#FFC83D;width:18px;height:18px"><use href="#i-star"/></svg>`:''}</div>
      ${w.kind==='cụm' && w.sentence && w.sentence.toLowerCase()!==w.word.toLowerCase()
        ? `<div class="hintline">${t('qExample')} <span class="mono">${esc(w.sentence)}</span></div>` : ''}
      ${hint}
    </div>`;

  let bodyHtml = '';
  const pills = `
      <div class="mode-pills">
        <button class="mode-pill ${quiz.phraseMode==='chips'?'on':''}" data-pm="chips">${w.kind==='đơn'?t('qModeAlpha'):t('qModeChips')}</button>
        <button class="mode-pill ${quiz.phraseMode==='type'?'on':''}" data-pm="type">${t('qModeType')}</button>
      </div>`;
  if(typeMode){
    bodyHtml = pills + `
        <input class="phrase-input" id="phraseInput" autocomplete="off" spellcheck="false"
          placeholder="${esc(t(w.kind==='đơn'?'qWordPh':'qPhrasePh'))}"
          value="${esc(quiz.typedPhrase)}">`;
  }else if(w.kind === 'đơn'){
    bodyHtml = pills + `
      <div class="tiles" id="tiles">${tilesHtml()}</div>
      <div class="chips" id="chips">${quiz.shuffled.map((o,idx)=>
        `<span class="chip-w letter ${quiz.pickedIdx.includes(idx)?'used':''}" data-idx="${idx}">${esc(o.ch)}</span>`).join('')}
      </div>`;
  }else{
    bodyHtml = pills + `
        <div class="answer-line" id="ansLine">${quiz.pickedIdx.length
          ? quiz.pickedIdx.map((idx,k)=>`<span class="chip-w" data-k="${k}">${esc(quiz.shuffled[idx].t)}</span>`).join('')
          : `<span class="placeholder">${t('qAnsPlaceholder')}</span>`}
        </div>
        <div class="chips" id="chips">${quiz.shuffled.map((o,idx)=>
          `<span class="chip-w ${quiz.pickedIdx.includes(idx)?'used':''}" data-idx="${idx}">${esc(o.t)}</span>`).join('')}
        </div>`;
  }

  $('#quizArea').innerHTML = `
    ${promptHtml}
    ${bodyHtml}
    <div class="quiz-actions">
      <button class="btn lemon" id="btnHint" ${quiz.hintLevel>=2?'disabled':''}>${I('bulb')}${t('qHintBtn')}${quiz.hintLevel?` (${quiz.hintLevel}/2)`:''}</button>
      <button class="btn primary" id="btnCheck">${I('check')}${t('qCheckBtn')}</button>
      <button class="btn ghost" id="btnSkip">${t('qSkipBtn')} ${I('next')}</button>
      <button class="btn sky ${isLimitedToday(w)?'limit-on':''}" id="btnLimit" title="${esc(t('qLimitTitle'))}" aria-pressed="${isLimitedToday(w)}">${I('clock')}${t(isLimitedToday(w)?'qLimitedBtn':'qLimitBtn')}</button>
    </div>
    <div class="feedback" id="quizFb"></div>`;

  const refocus = () => { const pi = $('#phraseInput'); if(pi && !quiz.graded) pi.focus(); };
  const spBtn = $('#qSpeak');
  if(spBtn) spBtn.addEventListener('click', e => { speakWord(quiz.w); e.currentTarget.blur(); refocus(); });
  $('#btnLimit').addEventListener('click', e => {
    const lw = quiz.w;
    if(isLimitedToday(lw)){ delete lw.limitDay; toast(t('qLimitOff', lw.word)); }
    else { lw.limitDay = todayKey(); toast(t('qLimitOn', lw.word)); }
    save();
    const on = isLimitedToday(lw), b = e.currentTarget;
    b.classList.toggle('limit-on', on); b.setAttribute('aria-pressed', String(on));
    b.lastChild.textContent = t(on ? 'qLimitedBtn' : 'qLimitBtn');
    b.blur(); refocus();
  });

  $('#btnCheck').addEventListener('click', checkQuiz);
  $('#btnSkip').addEventListener('click', ()=>{ applyGrade(quiz.w, 0); startQuiz(); });
  $('#btnHint').addEventListener('click', ()=>{ if(quiz.hintLevel < 2){ quiz.hintLevel++; renderQuiz(); } });
  $$('#quizArea .mode-pill').forEach(p => p.addEventListener('click', () => {
    if(quiz.graded || quiz.phraseMode === p.dataset.pm) return;
    quiz.phraseMode = p.dataset.pm;
    try{ localStorage.setItem(modeKey(quiz.w.kind), quiz.phraseMode); }catch(e){}
    quiz.pickedIdx = []; quiz.typed = []; quiz.typedPhrase = '';        // đổi chế độ → làm lại từ đầu, giữ đồng hồ
    renderQuiz();
  }));
  const pIn = $('#phraseInput');
  if(pIn){
    pIn.addEventListener('input', () => {
      quiz.typedPhrase = pIn.value;
      const a = normPhrase(pIn.value), b = normPhrase(quiz.w.word);
      if(a === b || a.length >= b.length) { autoCheck(true); }
    });
    pIn.addEventListener('keydown', e => {
      if(e.key === 'Enter'){ e.preventDefault(); if(!quiz.graded) checkQuiz(); }
    });
    if(!quiz.graded && !document.querySelector('.gsel.open')) pIn.focus();
  }
  const chipsEl = $('#chips');
  if(chipsEl) chipsEl.addEventListener('click', e=>{
    if(quiz.graded) return;
    const c = e.target.closest('.chip-w'); if(!c || c.classList.contains('used')) return;
    quiz.pickedIdx.push(+c.dataset.idx);
    if(quiz.mode==='đơn') quiz.typed.push(quiz.shuffled[+c.dataset.idx].ch);
    renderQuiz();
    autoCheck();
  });
  const ans = $('#ansLine');
  if(ans) ans.addEventListener('click', e=>{
    if(quiz.graded) return;
    const c = e.target.closest('.chip-w'); if(!c) return;
    quiz.pickedIdx.splice(+c.dataset.k, 1);
    renderQuiz();
  });
}

/* Tự động kiểm tra khi hoàn tất chữ cái / từ cuối cùng */
function autoCheck(fromTyping){
  if(!quiz || quiz.graded) return;
  if(quiz.phraseMode === 'type'){
    if(fromTyping) checkQuiz();
  }else if(quiz.mode === 'đơn'){
    const maxLen = quiz.w.word.replace(/ /g,'').length;
    if(quiz.typed.length >= maxLen) checkQuiz();
  }else{
    if(quiz.pickedIdx.length >= quiz.shuffled.length) checkQuiz();
  }
}

function tilesHtml(){
  const target = quiz.w.word.toLowerCase();
  let typedPos = 0, html = '', cursorSet = false;
  for(const ch of target){
    if(ch === ' '){ html += '<span class="tile space"></span>'; continue; }
    const t = quiz.typed[typedPos];
    const isCursor = !cursorSet && t === undefined;
    if(isCursor) cursorSet = true;
    html += `<span class="tile ${t?'filled':''} ${isCursor?'cursor':''}">${t?esc(t):''}</span>`;
    typedPos++;
  }
  return html;
}

document.addEventListener('keydown', e=>{
  if(!quiz) return;
  if(!$('#tab-quiz').classList.contains('active')) return;
  if(e.target.matches('textarea,select,input:not([type=checkbox])') || e.target.closest('.gsel')) return;
  if(quiz.graded){
    // Enter: sang từ kế ngay lập tức, ngắt giọng đọc đang chạy (không đợi đọc xong)
    if(e.key === 'Enter' && !e.repeat){ e.preventDefault(); stopSpeech(); startQuiz(); }
    return;
  }
  if(quiz.mode !== 'đơn' || quiz.phraseMode === 'type') return;
  if(e.key === 'Enter'){ checkQuiz(); return; }
  if(e.key === 'Backspace'){
    quiz.typed.pop(); quiz.pickedIdx.pop(); renderQuiz(); return;
  }
  if(/^[a-zA-ZÀ-ỹ'’-]$/.test(e.key)){
    const maxLen = quiz.w.word.replace(/ /g,'').length;
    if(quiz.typed.length >= maxLen) return;
    quiz.typed.push(e.key.toLowerCase());
    // đánh dấu chip tương ứng nếu có
    const free = quiz.shuffled.findIndex((o,idx)=>!quiz.pickedIdx.includes(idx) && o.ch===e.key.toLowerCase());
    quiz.pickedIdx.push(free); // -1 nếu chữ không có trong chip — vẫn cho gõ
    renderQuiz();
    autoCheck();
  }
});

function checkQuiz(){
  if(!quiz || quiz.graded) return;
  quiz.graded = true;
  const {w} = quiz;
  const timeMs = now() - quiz.startAt;
  let userAns, correct;
  if(w.kind === 'đơn' && quiz.phraseMode !== 'type'){
    userAns = quiz.typed.join('');
    correct = userAns === w.word.toLowerCase().replace(/ /g,'');
  }else if(quiz.phraseMode === 'type'){
    const pIn = $('#phraseInput');
    userAns = pIn ? pIn.value : quiz.typedPhrase;
    correct = normPhrase(userAns) === normPhrase(w.word);
    if(pIn){ pIn.disabled = true; pIn.blur(); }       // nhả Enter cho "từ tiếp theo"
  }else{
    userAns = quiz.pickedIdx.map(i=>quiz.shuffled[i].t).join(' ');
    correct = userAns.toLowerCase() === w.word.toLowerCase();
  }
  const charCount = w.kind === 'đơn'
    ? w.word.replace(/ /g,'').length
    : normPhrase(w.word).replace(/\s/g,'').length;
  const fb = $('#quizFb');
  const prevStreak = quizStreak;
  if(correct){
    quizStreak++;
    applyGrade(w, quiz.hintLevel ? 1 : 2, timeMs, charCount, quiz.hintLevel);    
    const wpm = charCount ? Math.round((charCount/5) / (timeMs/60000)) : null;
    fb.className = 'feedback show good';
    fb.innerHTML = `${I('check')} ${t('qCorrect')} <span class="ans">${esc(w.word)}</span>
      ${w.sentence?` — <span class="mono">${esc(w.sentence)}</span>`:''}
      <span class="muted">(${(timeMs/1000).toFixed(1)}s${wpm?` · ~${wpm} WPM`:''}${quiz.hintLevel?' '+t('qHintUsedSuffix')+(quiz.hintLevel>1?' ×2':''):''})</span>`;
      $$('#tiles .tile:not(.space)').forEach(t=>t.classList.add('ok'));
    quiz.speaking = true;
    const cur = quiz;
    Promise.all([speakWord(w), new Promise(r => setTimeout(r, 1400))]).then(() => {
      if(quiz === cur) startQuiz();
    });
  }else{
    quizStreak = 0;
    applyGrade(w, 0, timeMs, charCount);
    fb.className = 'feedback show bad';
    fb.innerHTML = `${I('x')} ${t('qWrong')} <span class="ans">${esc(w.word)}</span>
      ${w.note?`<br>${I('pin')} ${esc(w.note)}`:''}<br>
      <button class="btn sm mint" style="margin-top:8px" onclick="startQuiz()">${t('qNextWord')} ${I('next')}</button>`;
    $$('#tiles .tile:not(.space)').forEach(t=>t.classList.add('bad'));
  }
  updateStreakUI(prevStreak);
}

/* ═══════════════════════════════════════════════════════════
   TAB FLASHCARD — trắc nghiệm chọn nghĩa đúng
   ═══════════════════════════════════════════════════════════ */
let fc = null; // {w, opts, correctIdx, startAt, answered, picked, flipped}

function fcPool(){
  const savedOnly = $('#fcSavedOnly').checked;
  const g = $('#fcGroup').value;
  return words.filter(w => (!savedOnly || w.saved) && (!g || w.group === g));
}

/* Tạo 4 phương án: 1 nghĩa đúng + 3 nghĩa nhiễu
   (ưu tiên cùng nhóm > cùng loại đơn/cụm — nhiễu càng "gần" càng khó đoán mò) */
function buildOptions(w){
  const seen = new Set([w.meaning.toLowerCase()]);
  const rank = x => (x.group && x.group === w.group ? 2 : 0) + (x.kind === w.kind ? 1 : 0);
  const cands = shuffle(words.filter(x => x.id !== w.id && x.meaning))
                  .sort((a,b) => rank(b) - rank(a));
  const distract = [];
  for(const x of cands){
    const m = x.meaning.trim();
    if(!m || seen.has(m.toLowerCase())) continue;
    seen.add(m.toLowerCase());
    distract.push(m);
    if(distract.length === 3) break;
  }
  const opts = shuffle([w.meaning, ...distract]);
  return { opts, correctIdx: opts.indexOf(w.meaning) };
}

function startFc(){
  const pool = fcPool();
  const area = $('#fcArea');
  if(!pool.length){
    area.innerHTML = `<div class="panel"><div class="empty">${I('leaf')}<br>
      ${t('emptyFc', $('#fcSavedOnly').checked ? t('qExtraSaved') : '')}</div></div>`;
    fc = null; return;
  }
  const w = pickWordLimited(pool);
  lastShownId = w.id;
  preloadWordAudio(w);
  const { opts, correctIdx } = buildOptions(w);
  fc = { w, opts, correctIdx, startAt: now(), answered:false, picked:-1, flipped:false };
  renderFc();
}

function answerFc(i){
  if(!fc || fc.answered) return;

/* ═══════════════════════════════════════════════════════════
   §9 TẬP TRUNG — hẹn giờ, chuông nhắc khi rời cửa sổ, hoa nở
   ═══════════════════════════════════════════════════════════ */
let focus = null;          // {target(s), elapsed(s), running, tick}
let focusMin = 20;
let audioCtx = null;
let lastChime = 0;

/* Vườn hoa: hoa nhỏ là số phiên tập trung đã hoàn thành — CHỈ TĂNG, không bao
   giờ bị trừ/biến mất. Hoa lớn / cỏ may mắn / cây là huy hiệu thưởng THÊM,
   tính (không lưu riêng) từ tổng hoa nhỏ theo mốc mỗi 5: cứ mỗi 5 hoa nhỏ có
   thêm 1 hoa lớn, mỗi 5 hoa lớn có thêm 1 cỏ may mắn, mỗi 5 cỏ may mắn có
   thêm 1 cây — tất cả cộng dồn song song, không bậc nào tiêu hao bậc dưới. */
function gardenKey(){ return 'soTuGarden_' + currentUser; }
let garden = { small:0, taskDays:[], taskV:2 };
const TASK_FLOWERS = 2;           // hoàn thành đủ 5 nhiệm vụ trong ngày = 2 hoa nhỏ
function gardenDerived(small){
  const big = Math.floor(small / 5);
  const luck = Math.floor(big / 5);
  const diamond = Math.floor(luck / 5);
  return { big, luck, diamond };
}
function loadGarden(){
  garden = { small:0, taskDays:[], taskV:2 };
  let migrated = false;
  try{
    const raw = localStorage.getItem(gardenKey());
    if(raw){
      const v = JSON.parse(raw);
      if(typeof v === 'number'){
        garden.small = v;                                            // bản rất cũ: số nguyên đơn
      }else if(v && typeof v === 'object'){
        // quy đổi mọi định dạng cũ (kể cả bản gộp-trừ trước đây) về tổng hoa
        // nhỏ tương đương, để không ai bị mất tiến độ khi đổi sang cách tính mới
        garden.small = (v.small||0) + 5*(v.big||0) + 25*(v.luck||0) + 125*(v.diamond||0);
        garden.taskDays = [...new Set(asArr(v.taskDays).filter(d => typeof d === 'string'))];
        if(v.taskV !== 2 && garden.taskDays.length){       // bản trước: hoa nhiệm vụ đếm riêng → đổi sang hoa nhỏ
          garden.small += TASK_FLOWERS * garden.taskDays.length; migrated = true;
        }
      }
    }
  }catch(e){}
  if(migrated) saveGarden();
}
function saveGarden(){
  try{ localStorage.setItem(gardenKey(), JSON.stringify(garden)); }catch(e){}
  if(cloudOn() && currentUser){
    cloudPut('users/' + currentUser + '/garden', garden).catch(()=>{});
  }
}
function gardenAddFlower(n = 1){
  const before = gardenDerived(garden.small);
  garden.small += n;
  const after = gardenDerived(garden.small);
  const merges = [];
  if(after.big > before.big) merges.push('mergeMsgBig');
  if(after.luck > before.luck) merges.push('mergeMsgLuck');
  if(after.diamond > before.diamond) merges.push('mergeMsgDiamond');
  saveGarden();
  return merges;
}
/* Hoàn thành đủ 5 nhiệm vụ → thêm TASK_FLOWERS hoa nhỏ vào cùng luống hoa với
   Tập trung. taskDays chỉ để khoá theo ngày (không cộng trùng khi tải lại/làm lại).
   Trả về danh sách thông báo ghép bậc, hoặc null nếu hôm nay đã được cộng. */
function gardenAddTaskFlower(day){
  if(!Array.isArray(garden.taskDays)) garden.taskDays = [];
  if(garden.taskDays.includes(day)) return null;
  garden.taskDays.push(day);
  return gardenAddFlower(TASK_FLOWERS);
}
/* Số giả-ngẫu-nhiên ổn định theo seed chuỗi — dùng để xáo trộn ô lưới và
   rung nhẹ (jitter) vị trí từng bông hoa, không đổi qua các lần render */
function seededRand(seed){
  let h = 0;
  for(const ch of String(seed)) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  h = (h ^ (h >>> 15)) >>> 0;
  return (h % 10000) / 10000;
}
function seededShuffle(arr, seedBase){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(seededRand(seedBase + '_' + i) * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
/* Luống chia thành lưới ô cố định — mỗi bông hoa chiếm 1 ô riêng (rung nhẹ vị
   trí trong ô) nên không bao giờ chồng lên nhau; thứ tự ô được xáo trộn theo
   người dùng để trông tự nhiên/ngẫu nhiên chứ không xếp hàng thẳng tắp */
const G_COLS = 4, G_ROWS = 3;   // 12 ô = tối đa 4 nhỏ + 4 lớn + 4 may mắn cùng lúc
function renderGarden(){
  const g = $('#garden'); if(!g) return;
  const { big, luck, diamond } = gardenDerived(garden.small);
  /* Hiện ĐỦ toàn bộ số hoa thật (không cắt bớt, không gộp "+N"). Luống chỉ
     có 12 ô cố định để rải đều — hoa thứ 13 trở đi sẽ quay lại dùng ô đã có
     hoa khác (chồng lên nhau là chấp nhận được) thay vì bị giấu bớt đi. */
  const specs = [
    ['small','i-flower', garden.small, '#C98A12', 21],
    ['big','i-flower-big', big, '#E5484D', 28],
    ['luck','i-clover', luck, '#13A35B', 25],
  ];
  const sprouts = [];
  specs.forEach(([key, icon, count, color, size]) => {
    for(let i = 0; i < count; i++) sprouts.push({ seed: currentUser + '_' + key + i, icon, color, size });
  });
  const cellOrder = seededShuffle(
    Array.from({ length: G_COLS * G_ROWS }, (_, i) => i), (currentUser || '') + '_gcells');
  const cellW = 92 / G_COLS, cellH = 76 / G_ROWS;
  let bedHtml = '';
  sprouts.forEach((sp, idx) => {
    const cell = cellOrder[idx % cellOrder.length];
    const col = cell % G_COLS, row = Math.floor(cell / G_COLS);
    const jx = 0.15 + seededRand(sp.seed + 'x') * 0.7;   // rung trong ô; khi ô bị dùng lại (>12 hoa)
    const jy = 0.15 + seededRand(sp.seed + 'y') * 0.7;   // độ rung khác nhau giúp các hoa không trùng khít
    const rot = (seededRand(sp.seed + 'r') * 30 - 15).toFixed(1);
    const left = (4 + col * cellW + cellW * jx).toFixed(1);
    const top = (10 + row * cellH + cellH * jy).toFixed(1);
    bedHtml += `<span class="g-sprout" style="left:${left}%;top:${top}%;transform:rotate(${rot}deg);color:${sp.color}">
      <svg class="ic" style="width:${sp.size}px;height:${sp.size}px"><use href="#${sp.icon}"/></svg></span>`;
  });
  const bed = sprouts.length
    ? `<div class="g-bed">${bedHtml}</div>`
    : `<div class="g-bed"><div class="g-bed-empty">${I('leaf')}<br>${t('gardenEmptyBed')}</div></div>`;
  const legend = `
    <div class="g-legend">
      <span class="g-legend-item"><svg class="ic" style="color:#C98A12"><use href="#i-flower"/></svg>${garden.small} ${t('gTier_small')}</span>
      <span class="g-legend-item"><svg class="ic" style="color:#E5484D"><use href="#i-flower-big"/></svg>${big} ${t('gTier_big')}</span>
      <span class="g-legend-item"><svg class="ic" style="color:#13A35B"><use href="#i-clover"/></svg>${luck} ${t('gTier_luck')}</span>
      <span class="g-legend-item special"><svg class="ic" style="color:#1E5EFF"><use href="#i-tree"/></svg>${diamond} ${t('gTier_diamond')}</span>
    </div>`;
  g.innerHTML = bed + legend;
}

/* Chuông nhỏ bằng Web Audio — không cần file âm thanh */
function chime(kind){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime;
    const notes = kind === 'done' ? [[660,0],[880,.16],[1100,.32]] : [[880,0],[660,.18]];
    for(const [f, dt] of notes){
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t0 + dt);
      g.gain.linearRampToValueAtTime(0.055, t0 + dt + .02);   // nhỏ nhẹ thôi
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + .4);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0 + dt); o.stop(t0 + dt + .45);
    }
  }catch(e){}
}

function confettiBurst(){
  const panel = document.querySelector('.focus-panel');

    panel.appendChild(c);
